<meta charset="utf-8">
<title>Tonnage</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#131110">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tonnage">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});}</script>
<style>
  :root{
    --bg:#131110; --surface:#1d1a17; --surface2:#26221e; --border:#332e28;
    --ink:#f2ede6; --ink-soft:#b8afa2; --ink-mute:#7d7568;
    --accent:#e8a33d; --accent-deep:#c97f1e; --accent-ink:#1a1408;
    --good:#6fbf8b; --bad:#e06c5a;
    --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:16px; line-height:1.45;
    min-height:100dvh;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
  }
  #app{max-width:560px; margin:0 auto; padding:calc(16px + env(safe-area-inset-top)) 16px 150px;}
  h1,h2,h3{margin:0; text-wrap:balance;}
  button{font-family:inherit; font-size:16px; border:none; cursor:pointer; color:inherit; background:none; padding:0;}
  input,select,textarea{font-family:inherit; font-size:16px; color:var(--ink); background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:10px 12px; outline:none; width:100%;}
  input:focus,select:focus,textarea:focus{border-color:var(--accent-deep);}
  input[type=number]{font-variant-numeric:tabular-nums;}
  ::placeholder{color:var(--ink-mute);}

  .wordmark{font-weight:800; letter-spacing:.14em; font-size:15px; text-transform:uppercase;}
  .wordmark b{color:var(--accent);}
  .topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:4px;}
  .date-line{color:var(--ink-mute); font-size:13px; margin-bottom:18px; text-transform:capitalize;}

  .label{font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-mute);}
  .section-t{font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-mute); margin:26px 0 10px;}

  .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px;}
  .stack{display:flex; flex-direction:column; gap:10px;}
  .row{display:flex; align-items:center; gap:10px;}
  .grow{flex:1; min-width:0;}

  .btn{display:flex; align-items:center; justify-content:center; gap:8px; font-weight:700; border-radius:12px; padding:13px 16px; background:var(--surface2); border:1px solid var(--border);}
  .btn:active{transform:scale(.98);}
  .btn-accent{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
  .btn-ghost{background:none; border:1px dashed var(--border); color:var(--ink-soft); font-weight:600;}
  .btn-danger{color:var(--bad);}
  .btn-sm{padding:8px 12px; font-size:14px; border-radius:10px;}
  .icon-btn{width:38px; height:38px; display:flex; align-items:center; justify-content:center; border-radius:10px; background:var(--surface2); border:1px solid var(--border); flex:none; font-size:15px;}

  .pill{font-size:12px; font-weight:600; color:var(--ink-soft); background:var(--surface2); border-radius:99px; padding:3px 9px; white-space:nowrap;}
  .hint-box{display:flex; gap:10px; align-items:flex-start; background:rgba(232,163,61,.10); border:1px solid rgba(232,163,61,.32);
    border-radius:11px; padding:10px 12px; margin-bottom:11px; font-size:12.5px; line-height:1.55; color:var(--ink-soft);}
  .hint-box b{color:var(--ink);}
  .hint-box button{flex:none; font-size:11.5px; font-weight:800; color:var(--accent); padding:2px 4px; align-self:center;}
  .ob-steps{display:flex; gap:5px; margin-bottom:10px;}
  .ob-steps i{flex:1; height:4px; border-radius:2px; background:var(--surface2); transition:background .3s;}
  .ob-steps i.on{background:var(--accent);}
  .start-card{border-color:var(--accent-deep) !important;}
  .start-step{display:flex; gap:10px; align-items:flex-start; margin-bottom:9px; font-size:13.5px; color:var(--ink-soft);}
  .start-step b{color:var(--ink);}
  .start-step .num{flex:none; width:21px; height:21px; border-radius:50%; background:var(--surface2); color:var(--ink-mute);
    font-size:11px; font-weight:800; display:flex; align-items:center; justify-content:center; margin-top:1px;}
  .start-step.done .num{background:var(--good); color:#0d1a12;}
  .start-step.done b{color:var(--ink-mute); text-decoration:line-through;}
  .slider{-webkit-appearance:none; appearance:none; width:100%; height:6px; border-radius:99px; padding:0; border:none;
    background:linear-gradient(90deg, var(--accent-deep), var(--accent)); outline:none;}
  .slider::-webkit-slider-thumb{-webkit-appearance:none; width:26px; height:26px; border-radius:50%; background:var(--accent);
    border:3px solid var(--surface); box-shadow:0 2px 8px rgba(0,0,0,.5); cursor:pointer;}
  .slider::-moz-range-thumb{width:22px; height:22px; border-radius:50%; background:var(--accent); border:3px solid var(--surface); cursor:pointer;}
  .inline-edit{font:inherit; color:inherit; text-align:left; display:inline-flex; align-items:center; gap:6px; border-radius:8px; padding:1px 5px; margin-left:-5px;}
  .inline-edit .pen{font-size:.62em; color:var(--accent); opacity:.75;}
  .inline-edit:active{background:var(--surface2);}
  .tb-save{position:relative; color:var(--ink-soft);}
  .tb-save svg{width:19px; height:19px;}
  .tb-save .tb-dot{position:absolute; top:-2px; right:-2px; width:9px; height:9px; border-radius:50%; background:var(--accent); border:2px solid var(--bg);}

  /* stat tiles */
  .tiles{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
  .tile{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:12px 10px; text-align:left;}
  .tile .v{font-size:22px; font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:-.01em; line-height:1.1;}
  .tile .u{font-size:12px; color:var(--ink-mute); margin-top:2px;}

  /* tab bar */
  .tabbar{position:fixed; left:0; right:0; bottom:0; z-index:40; background:rgba(19,17,16,.92); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); border-top:1px solid var(--border); padding-bottom:env(safe-area-inset-bottom);}
  .tabbar-in{max-width:560px; margin:0 auto; display:flex;}
  .tab{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:9px 0 7px; color:var(--ink-mute); font-size:10.5px; font-weight:600; letter-spacing:.02em;}
  .tab svg{width:22px; height:22px;}
  .tab.on{color:var(--accent);}

  /* rest timer */
  .restbar{position:fixed; left:12px; right:12px; bottom:calc(64px + env(safe-area-inset-bottom)); z-index:45; max-width:536px; margin:0 auto;
    background:var(--accent); color:var(--accent-ink); border-radius:16px; padding:10px 14px;
    display:none; align-items:center; gap:10px; box-shadow:0 8px 30px rgba(0,0,0,.5);}
  .restbar.show{display:flex;}
  .restbar .t{font-size:26px; font-weight:800; font-variant-numeric:tabular-nums; min-width:86px;}
  .restbar .lbl{font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; opacity:.75;}
  .restbar button{background:rgba(26,20,8,.14); border-radius:10px; padding:8px 12px; font-weight:800; font-size:14px; color:var(--accent-ink);}
  .restbar .bar{position:absolute; left:14px; right:14px; bottom:5px; height:3px; border-radius:2px; background:rgba(26,20,8,.18); overflow:hidden;}
  .restbar .bar i{display:block; height:100%; background:var(--accent-ink); border-radius:2px;}
  @keyframes flashEnd{0%,100%{background:var(--accent);}50%{background:#fff;}}
  .restbar.ending{animation:flashEnd .5s 3;}
  .restbar.paused{background:var(--surface2); color:var(--ink);}
  .restbar.paused button{background:var(--surface); color:var(--ink);}
  .restbar.paused .bar{display:none;}

  /* workout */
  .chrono{font-variant-numeric:tabular-nums; font-weight:800; font-size:15px; color:var(--accent);}
  .ex-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px;}
  .ex-head{display:flex; align-items:baseline; gap:8px; margin-bottom:2px;}
  .ex-name{font-size:17px; font-weight:700;}
  .hint{font-size:12.5px; color:var(--ink-mute); margin-bottom:10px;}
  .set-row{display:grid; grid-template-columns:26px 1fr 1fr 44px; gap:8px; align-items:center; margin-bottom:8px;}
  .set-row .n{font-size:13px; font-weight:700; color:var(--ink-mute); font-variant-numeric:tabular-nums;}
  .set-row input{text-align:center; padding:9px 6px;}
  .set-row .ck{width:44px; height:42px; border-radius:10px; border:1px solid var(--border); background:var(--surface2); display:flex; align-items:center; justify-content:center; font-size:17px; color:var(--ink-mute);}
  .set-row.done input{background:var(--surface); color:var(--ink-soft); border-color:transparent;}
  .set-row.warm .n{font-size:10px; letter-spacing:.02em; color:var(--accent); font-weight:800;}
  .set-row.warm input{border-style:dashed;}
  .inj-note{background:rgba(224,108,90,.12); border:1px solid rgba(224,108,90,.35); border-radius:10px; padding:9px 11px; margin-bottom:10px; font-size:12.5px; line-height:1.5; color:var(--ink-soft);}
  .inj-note b{color:var(--bad);}
  .inj-swap{color:var(--accent); font-weight:700; text-decoration:underline; font-size:12.5px;}
  .set-row.done .ck{background:var(--good); border-color:var(--good); color:#0d1a12;}
  .rir-ask{background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:10px 12px; margin:2px 0 10px;}
  .rir-ask .q{font-size:13.5px; font-weight:600; margin-bottom:8px; color:var(--ink-soft);}
  .rir-ask .q.ok{margin:0; color:var(--accent);}
  .rir-ask .row button{flex:1; background:var(--surface); border:1px solid var(--border); border-radius:9px; padding:9px 0; font-weight:700; font-size:14px;}
  .set-cols{display:grid; grid-template-columns:26px 1fr 1fr 44px; gap:8px; margin-bottom:6px;}
  .set-cols span{font-size:10.5px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-mute); text-align:center;}

  /* list rows */
  .lrow{display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:13px 14px;}
  .lrow .t1{font-weight:700;}
  .lrow .t2{font-size:12.5px; color:var(--ink-mute);}

  /* chips */
  .chips{display:flex; gap:6px; flex-wrap:wrap;}
  .chip{padding:7px 13px; border-radius:99px; font-size:13.5px; font-weight:600; background:var(--surface); border:1px solid var(--border); color:var(--ink-soft);}
  .chip.on{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}

  /* chart */
  .chart-wrap{position:relative; margin-top:6px;}
  .chart-tip{position:absolute; pointer-events:none; background:var(--surface2); border:1px solid var(--border); border-radius:9px; padding:6px 9px; font-size:12.5px; display:none; white-space:nowrap; box-shadow:0 4px 16px rgba(0,0,0,.4); z-index:5;}
  .chart-tip b{font-variant-numeric:tabular-nums;}

  /* modal */
  .overlay{position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:60; display:none; align-items:flex-end; justify-content:center;}
  .overlay.show{display:flex;}
  .sheet{background:var(--surface); border-radius:20px 20px 0 0; width:100%; max-width:560px; max-height:88dvh; overflow-y:auto; padding:18px 16px calc(24px + env(safe-area-inset-bottom)); border-top:1px solid var(--border);}
  .sheet h3{font-size:18px; margin-bottom:14px;}
  .grab{width:38px; height:4px; border-radius:2px; background:var(--border); margin:0 auto 14px;}

  .hb-row{display:flex; align-items:center; gap:10px; background:var(--surface2); border:1px solid var(--border); border-radius:11px; padding:11px 12px; font-weight:600; font-size:14.5px;}
  .hb-row .hb-ck{width:24px; height:24px; flex:none; border-radius:8px; border:1.5px solid var(--border); background:var(--surface); display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:800;}
  .hb-row.on{border-color:var(--accent-deep);}
  .hb-row.on .hb-ck{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
  .hb-row.on .hb-lbl{color:var(--ink-soft); text-decoration:line-through; text-decoration-color:var(--ink-mute);}
  .hb-row{width:100%;}
  .hb-lbl{font:inherit; font-weight:600; padding:2px 0;}
  .hb-caret{flex:none; width:26px; color:var(--ink-mute); font-size:13px;}
  .hb-sub{padding:9px 4px 4px 12px; display:flex; flex-direction:column; gap:9px;}
  .chip-sm{padding:6px 10px; font-size:12.5px;}
  .chip-sm i{font-style:normal; font-size:10.5px; color:var(--ink-mute); margin-left:4px; font-weight:700;}
  .chip-sm.on i{color:var(--accent-ink); opacity:.7;}
  .pr-plot{position:relative; display:flex; gap:4px; align-items:flex-end; height:110px;}
  .pr-target{position:absolute; left:0; right:0; border-top:1.5px dashed var(--ink-mute); opacity:.7; z-index:2;}
  .pr-target i{position:absolute; right:0; top:-13px; font-style:normal; font-size:9.5px; font-weight:700; color:var(--ink-mute); background:var(--surface); padding:0 3px;}
  .pr-col{flex:1; display:flex; flex-direction:column; justify-content:flex-end; height:100%; padding:0; background:none; border:none; min-width:0;}
  .pr-col .pr-val{height:15px; line-height:15px; font-size:8.5px; font-weight:800; font-variant-numeric:tabular-nums; text-align:center;}
  .pr-col .pr-barwrap{flex:1; display:flex; align-items:flex-end; width:100%;}
  .pr-col .pr-b{width:100%; border-radius:4px 4px 2px 2px; display:block;}
  .pr-col:active .pr-b{opacity:.6;}
  .pr-labels{display:flex; gap:4px; margin-top:4px;}
  .pr-labels span{flex:1; text-align:center; font-size:9px; font-weight:700; color:var(--ink-mute);}
  .week-dots{display:flex; gap:8px; margin:12px 0 14px;}
  .wd{flex:1; text-align:center;}
  .wd i{display:block; height:26px; border-radius:9px; background:var(--surface2); border:1px solid var(--border); margin-bottom:4px;}
  .wd.on i{background:var(--accent); border-color:var(--accent);}
  .wd.today i{border-color:var(--accent-deep); border-width:2px;}
  .wd span{font-size:10px; font-weight:700; color:var(--ink-mute); letter-spacing:.05em;}
  .wd.today span{color:var(--accent);}
  .wk-stats{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; border-top:1px solid var(--border); padding-top:12px;}
  .wk-stats .v{font-weight:800; font-size:15.5px; font-variant-numeric:tabular-nums;}
  .wk-stats .u{font-size:11px; color:var(--ink-mute);}
  .hscroll{display:flex; gap:10px; overflow-x:auto; scroll-snap-type:x mandatory; margin:0 -16px; padding:0 16px 6px; scrollbar-width:none;}
  .hscroll::-webkit-scrollbar{display:none;}
  .sess-card{flex:0 0 76%; max-width:260px; scroll-snap-align:start; background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:14px;}
  .sugg-badge{display:inline-block; font-size:10.5px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--accent-ink); background:var(--accent); border-radius:99px; padding:3px 9px; margin-bottom:8px;}
  .mp-row{margin-bottom:13px;}
  .mp-head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:4px; gap:8px;}
  .mp-name{font-weight:700; font-size:15px;}
  .mp-tag{font-size:12.5px; font-weight:600; white-space:nowrap;}
  .mp-bar{height:22px; border-radius:7px; background:var(--surface2); overflow:hidden;}
  .mp-fill{height:100%; border-radius:7px; display:flex; align-items:center; justify-content:flex-end; padding-right:8px; font-size:12.5px; font-weight:800; color:rgba(0,0,0,.6); min-width:34px;}
  .mp-nodata{font-size:12px; color:var(--ink-mute); padding:0 9px; line-height:22px;}
  .mp-bodies{display:flex; justify-content:center; gap:14px; margin:10px 0 16px;}
  .mp-fig{position:relative; width:46%; max-width:160px;}
  .mp-fig img{width:100%; display:block;}
  .mp-fig svg{position:absolute; inset:0; width:100%; height:100%;}
  .toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(78px + env(safe-area-inset-bottom)); z-index:80;
    background:var(--good); color:#0d1a12; font-weight:700; font-size:14px; padding:11px 18px; border-radius:12px;
    box-shadow:0 8px 26px rgba(0,0,0,.5); transition:opacity .4s; max-width:88%; text-align:center;}
  .empty{text-align:center; color:var(--ink-mute); padding:34px 18px; font-size:14.5px;}
  .empty .big{font-size:34px; margin-bottom:8px;}

  .hist-detail{margin-top:10px; border-top:1px solid var(--border); padding-top:10px; display:none;}
  .hist-detail.show{display:block;}
  .hist-ex{margin-bottom:8px;}
  .hist-ex .n{font-weight:700; font-size:14px;}
  .hist-ex .s{font-size:13px; color:var(--ink-soft); font-variant-numeric:tabular-nums;}

  .muscle-h{font-size:11px; font-weight:700; letter-spacing:.11em; text-transform:uppercase; color:var(--accent); margin:14px 0 6px;}
  .pick-row{display:flex; align-items:center; gap:11px; padding:8px 4px; border-bottom:1px solid var(--border); font-weight:600;}
  .pick-row:active{background:var(--surface2);}
  .pick-row .eq{font-size:12px; color:var(--ink-mute); font-weight:500;}
  .ex-ico{width:46px; height:46px; flex:none; border-radius:11px; background:var(--surface2); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; color:var(--ink-soft);}
  .ex-ico svg{width:36px; height:36px; display:block;}
  .ex-ico.sm{width:38px; height:38px; border-radius:9px;}
  .ex-ico.sm svg{width:30px; height:30px;}

  .tpl-item{background:var(--surface2); border:1px solid var(--border); border-radius:12px; padding:11px 12px; margin-bottom:8px;}
  .tpl-item .cfg{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-top:9px;}
  .tpl-item .cfg label{display:block;}
  .tpl-item .cfg .label{margin-bottom:4px; display:block;}
  .tpl-item input{padding:8px 8px; text-align:center;}

  @media (prefers-reduced-motion:reduce){
    .restbar.ending{animation:none;}
    .btn:active{transform:none;}
  }
</style>

<div id="app"></div>

<div class="restbar" id="restbar">
  <div style="cursor:pointer;">
    <div class="lbl" id="rest-lbl">Repos</div>
    <div class="t"><span id="rest-t">1:30</span> <span id="rest-picon" style="font-size:15px; opacity:.65;">⏸</span></div>
  </div>
  <div class="grow"></div>
  <button id="rest-minus">−15</button>
  <button id="rest-plus">+15</button>
  <button id="rest-skip">Passer</button>
  <div class="bar"><i id="rest-bar" style="width:100%"></i></div>
</div>

<div class="tabbar">
  <div class="tabbar-in" id="tabs"></div>
</div>

<div class="overlay" id="overlay">
  <div class="sheet" id="sheet"></div>
</div>

function altsFor(exId){
  const ex = getEx(exId);
  const names = ALTS[ex.name] || [];
  const out = [];
  names.forEach(n=>{ const e = allEx().find(x=>x.name===n); if(e) out.push(e); });
  allEx().forEach(e=>{ if(e.muscle===ex.muscle && e.id!==exId && !out.some(o=>o.id===e.id)) out.push(e); });
  return out;
}

function injuryNote(exName){
  const list = (db.profile && db.profile.injuries) || [];
  for(const id of list){
    const rule = INJURY_RULES[id] && INJURY_RULES[id][exName];
    if(rule){
      const lab = (INJURIES.find(x=>x.id===id)||{}).label || id;
      return {injury:lab, tip:rule.tip, alts:rule.alts};
    }
  }
  return null;
}

function aimWarning(aimId, weight, goalWeight){
  if(!(weight>0) || !(goalWeight>0)) return null;
  const d = Math.round((goalWeight - weight)*10)/10;
  const a = aimOf(aimId);
  if((aimId==="recomp" || aimId==="entretien") && Math.abs(d) >= 2){
    return `Tu vises ${fmtKg(Math.abs(d))} kg ${d<0?"de moins":"de plus"}, mais en « ${a.label} » le poids reste stable — tes calories sont calculées à la maintenance. Pour ${d<0?"perdre":"prendre"} ces kilos, choisis plutôt « ${d<0?"Perte de poids":"Prise de muscle"} ».`;
  }
  if(aimId==="masse" && d <= -2){
    return `Tu as choisi « Prise de muscle » mais ton objectif est ${fmtKg(-d)} kg en dessous de ton poids actuel. Ces deux choses s'opposent : passe en « Perte de poids », ou relève ton objectif.`;
  }
  if(aimId==="seche" && d >= 2){
    return `Tu as choisi « Perte de poids » mais ton objectif est ${fmtKg(d)} kg au-dessus de ton poids actuel. Passe en « Prise de muscle », ou abaisse ton objectif.`;
  }
  return null;
}

const PACES = [["progressif","Progressif"],["modere","Modéré"],["rapide","Rapide"]];
/* surplus / déficit en % de la dépense estimée : s'adapte à la corpulence de chacun */
const PACE_PCT = {
  masse:     {progressif:0.08,  modere:0.12,  rapide:0.16},
  seche:     {progressif:-0.12, modere:-0.18, rapide:-0.24},
  recomp:    {progressif:0,     modere:0,     rapide:0},
  force:     {progressif:0.04,  modere:0.07,  rapide:0.10},
  entretien: {progressif:0,     modere:0,     rapide:0}
};
const PACE_RATE = {masse:1, seche:1, force:1};   /* objectifs où un rythme se calcule */
function aimOf(id){ return AIMS.find(a=>a.id===id) || AIMS[0]; }
function planFor(p){
  if(!p || !(p.weight>0) || !(p.height>0) || !(p.age>0) || !(p.goalWeight>0)) return null;
  const bmr = 10*p.weight + 6.25*p.height - 5*p.age + (p.sex==="f" ? -161 : 5);
  const tdee = bmr * (ACTIVITY[p.days]||1.55) * (METAB_ADJ[p.metab]||1);
  const diff = p.goalWeight - p.weight;
  const aimId = p.aim || (diff > 1 ? "masse" : (diff < -1 ? "seche" : "recomp"));
  const aim = aimOf(aimId);
  const pace = p.pace || "modere";
  let delta = tdee * (((PACE_PCT[aim.id]||{})[pace]) || 0);
  /* garde-fous : jamais plus de 20 % de surplus ni 25 % de déficit, jamais sous 1,2 × le métabolisme de base */
  delta = Math.max(-tdee*0.25, Math.min(tdee*0.20, delta));
  const kcal = Math.max(tdee + delta, bmr*1.2);
  const deltaReel = kcal - tdee;
  const plafonne = (kcal > tdee + delta + 1);   /* le plancher de sécurité a joué */
  const perKg = p.protPerKg || aim.prot;
  const prot = p.weight * perKg;
  /* rythme déduit de l'écart calorique : ~6500 kcal par kilo pris, ~7700 par kilo perdu */
  const rate = PACE_RATE[aim.id] ? Math.abs(deltaReel)*7/(deltaReel>0 ? 6500 : 7700) : 0;
  const rateAff = Math.round(rate*20)/20;
  const semaines = (rate>0.02 && Math.abs(diff)>=1) ? Math.max(2, Math.round(Math.abs(diff)/rate)) : null;
  const rythme = rate>0.02 ? `${deltaReel<0?"−":"+"}${rateAff.toLocaleString("fr-FR")} kg par semaine` : "poids stable";
  return {
    bmr: Math.round(bmr), tdee: Math.round(tdee),
    kcal: Math.round(kcal/10)*10, prot: Math.round(prot), perKg,
    aim: aim.id, aimLabel: aim.label, pace, rythme, semaines,
    diff: Math.round(diff*10)/10, delta: Math.round(deltaReel), plafonne,
    program: aim.prog, seances: Math.min(5, Math.max(2, p.days))
  };
}

function planAdvice(pl, p){
  const kg = p.weight, cible = p.goalWeight;
  const perKg = pl.perKg.toLocaleString("fr-FR");
  if(pl.plafonne){

  }
  if(pl.aim==="masse"){
    const vite = pl.pace==="rapide";
    return `Pour atteindre ${fmtKg(cible)} kg${pl.semaines? ` d'ici environ ${pl.semaines} semaines`:""}, vise <b>${pl.kcal} kcal</b> et <b>${pl.prot} g de protéines</b> par jour, soit ${perKg} g par kilo de poids de corps.${vite? " Attention : à ce rythme, une part plus importante de la prise sera du gras — si le tour de taille grimpe vite, repasse en modéré." : " C'est le rythme qui maximise le muscle en limitant le gras."}`;
  }

    const vite = pl.pace==="rapide";
    return `Pour descendre à ${fmtKg(cible)} kg${pl.semaines? ` d'ici environ ${pl.semaines} semaines`:""}, vise <b>${pl.kcal} kcal</b> et <b>${pl.prot} g de protéines</b> par jour, soit ${perKg} g par kilo — les protéines sont ta protection contre la fonte musculaire.${vite? " Ce rythme est agressif : si tu perds de la force sur tes séances, ralentis." : ""}`;
  }
  if(pl.aim==="recomp"){
    return `Mange à ta maintenance, <b>${pl.kcal} kcal</b> par jour, avec <b>${pl.prot} g de protéines</b> (${perKg} g par kilo). Le poids bougera peu : juge tes progrès à la glace et aux charges soulevées, pas à la balance.`;
  }
  if(pl.aim==="force"){
    return `Vise <b>${pl.kcal} kcal</b> et <b>${pl.prot} g de protéines</b> par jour (${perKg} g par kilo). Un léger surplus soutient la récupération nerveuse et articulaire, indispensable quand on pousse lourd.`;
  }
  return `Mange à ta maintenance, <b>${pl.kcal} kcal</b> par jour, avec <b>${pl.prot} g de protéines</b> (${perKg} g par kilo) pour conserver ta masse musculaire.`;

function openOnboarding(first, brouillon, depart){
  const base = brouillon || db.profile || {};
  const d = {
    name: base.name || db.settings.name || "",
    sex: base.sex || "h",
    age: base.age || "",
    height: base.height || "",
    weight: base.weight || currentWeight() || "",
    goalWeight: base.goalWeight || (db.settings.goal>0 ? db.settings.goal : ""),
    aim: base.aim || "masse",
    pace: base.pace || "modere",
    protPerKg: base.protPerKg || null,      /* null = suit la valeur conseillée */
    metab: base.metab || "normal",
    days: base.days || 3,
    injuries: (base.injuries||[]).slice(),
    avance: !!brouillon && !!base.avance
  };
  const perKg = ()=> d.protPerKg || aimOf(d.aim).prot;
  let step = depart || 1;
  const TOTAL = 3;

  const lire = ()=>{
    const v = id => { const el=document.getElementById(id); return el? el.value : null; };

    if(v("ob-sex")!==null) d.sex = v("ob-sex");
    if(v("ob-age")!==null) d.age = parseFloat(v("ob-age"));
    if(v("ob-height")!==null) d.height = parseFloat(v("ob-height"));
    if(v("ob-weight")!==null) d.weight = parseFloat(v("ob-weight"));

  };

  function draw(){
    const barre = `<div class="ob-steps">${[1,2,3].map(n=>`<i class="${n<=step?'on':''}"></i>`).join("")}</div>
      <div class="label" style="margin-bottom:10px;">Étape ${step} sur ${TOTAL}</div>`;
    let corps = "", titre = "";

    if(step===1){
      titre = first? "Bienvenue sur Tonnage 👋" : "Qui es-tu ?";
      corps = `
        ${first? `<p style="margin:0 0 14px; font-size:13.5px; color:var(--ink-soft); line-height:1.55;">Trois questions rapides et je te prépare un plan sur mesure : calories, protéines et programme d'entraînement.</p>`:""}
        <div class="stack">
          <div><span class="label" style="display:block; margin-bottom:5px;">Prénom</span>
          <input id="ob-name" value="${esc(d.name)}" placeholder="Ton prénom" maxlength="20"></div>
          <div class="row">
            <div class="grow"><span class="label" style="display:block; margin-bottom:5px;">Sexe</span>
            <select id="ob-sex"><option value="h" ${d.sex!=="f"?"selected":""}>Homme</option><option value="f" ${d.sex==="f"?"selected":""}>Femme</option></select></div>
            <div class="grow"><span class="label" style="display:block; margin-bottom:5px;">Âge</span>
            <input type="number" inputmode="numeric" id="ob-age" value="${d.age||""}" placeholder="28"></div>
          </div>
          <div class="row">
            <div class="grow"><span class="label" style="display:block; margin-bottom:5px;">Taille (cm)</span>
            <input type="number" inputmode="numeric" id="ob-height" value="${d.height||""}" placeholder="175"></div>
            <div class="grow"><span class="label" style="display:block; margin-bottom:5px;">Poids (kg)</span>
            <input type="number" inputmode="decimal" step="0.1" id="ob-weight" value="${d.weight||""}" placeholder="70"></div>
          </div>
          <div style="font-size:12px; color:var(--ink-mute); line-height:1.5;">Ces informations servent uniquement à calculer tes besoins. Elles restent dans ton téléphone.</div>
        </div>`;
    }

    if(step===2){
      titre = "Ton objectif";
      const warn = aimWarning(d.aim, d.weight, d.goalWeight);
      corps = `<div class="stack">
        <div class="chips" id="ob-aim">
          ${AIMS.map(a=>`<button class="chip ${d.aim===a.id?"on":""}" data-aim="${a.id}">${a.label}</button>`).join("")}
        </div>
        <div style="font-size:13px; color:var(--ink-soft); line-height:1.5;">${esc(aimOf(d.aim).desc)}</div>
        <button class="chip" id="ob-aiminfo" style="align-self:flex-start; padding:5px 12px; font-size:12px;">ⓘ Tout savoir sur cet objectif</button>
        <div><span class="label" style="display:block; margin-bottom:5px;">Poids que tu vises (kg)</span>
        <input type="number" inputmode="decimal" step="0.5" id="ob-goal" value="${d.goalWeight||""}" placeholder="${d.weight||70}"></div>
        ${warn? `<div class="inj-note" style="margin:0;">⚠️ ${esc(warn)}</div>`:""}
      </div>`;
    }

    if(step===3){
      titre = "Ton entraînement";
      corps = `<div class="stack">
        <div><span class="label" style="display:block; margin-bottom:6px;">Séances de sport par semaine</span>
          <div class="chips" id="ob-days">
            ${[2,3,4,5,6].map(n=>`<button class="chip ${d.days===n?"on":""}" data-dy="${n}">${n}</button>`).join("")}
          </div>
          <div style="font-size:12px; color:var(--ink-mute); margin-top:6px;">Sois réaliste : mieux vaut 3 séances tenues que 5 abandonnées.</div></div>
        ${d.avance ? `
          <div><span class="label" style="display:block; margin-bottom:6px;">Ton métabolisme</span>
            <div class="chips" id="ob-metab">
              ${[["rapide","Rapide — je peine à prendre du poids"],["normal","Normal"],["lent","Lent — je prends facilement"]].map(([v,l])=>
                `<button class="chip ${d.metab===v?"on":""}" data-mt="${v}">${l}</button>`).join("")}
            </div></div>
          ${PACE_RATE[d.aim] ? `<div><span class="label" style="display:block; margin-bottom:6px;">Rythme de progression</span>

    /* --- câblage --- */
    document.querySelectorAll("[data-aim]").forEach(b=>b.onclick=()=>{
      lire();
      const ancienne = aimOf(d.aim).prot;
      d.aim = b.dataset.aim;

    document.querySelectorAll("[data-pace]").forEach(b=>b.onclick=()=>{ d.pace=b.dataset.pace; draw(); });
    document.querySelectorAll("[data-inj]").forEach(b=>b.onclick=()=>{
      const id=b.dataset.inj;

      b.classList.toggle("on", d.injuries.includes(id));
    });
    const plus = document.getElementById("ob-plus");
    if(plus) plus.onclick = ()=>{ d.avance = true; draw(); };

    const slider = document.getElementById("ob-prot");
    if(slider){
      const majProt = ()=>{

        const val = perKg();
        slider.value = val;
        const reco = aimOf(d.aim).prot;
        document.getElementById("ob-protval").textContent = `${val.toLocaleString("fr-FR")} g/kg · ${Math.round(kg*val)} g par jour`;
        let hint;
        if(val < reco-0.15) hint = `En dessous des ${reco.toLocaleString("fr-FR")} g/kg conseillés pour cet objectif — tu risques de laisser du muscle sur la table.`;
        else if(val > reco+0.3) hint = `Au-delà de ${reco.toLocaleString("fr-FR")} g/kg, le bénéfice supplémentaire est minime : ce n'est ni dangereux ni utile, mais ça remplit vite l'estomac.`;
        else hint = `C'est la zone conseillée pour « ${aimOf(d.aim).label.toLowerCase()} ». Répartis-les sur 3 à 4 prises dans la journée.`;
        document.getElementById("ob-prothint").textContent = hint;
      };
      slider.oninput = ()=>{ d.protPerKg = Math.round(parseFloat(slider.value)*10)/10; majProt(); };
      document.getElementById("ob-protreset").onclick = ()=>{ d.protPerKg = null; majProt(); };
      majProt();
    }

    const skip = document.getElementById("ob-skip");
    if(skip) skip.onclick = ()=>{ db.profile = {skipped:true}; save(); closeSheet(); render(); };
    const prev = document.getElementById("ob-prev");
    if(prev) prev.onclick = ()=>{ lire(); step--; draw(); };

    document.getElementById("ob-next").onclick = ()=>{
      lire();
      if(step===1){
        if(!(d.age>0) || !(d.height>0) || !(d.weight>0)){ toast("Remplis âge, taille et poids"); return; }
        step=2; draw(); return;
      }
      if(step===2){
        if(!(d.goalWeight>0)){ toast("Indique le poids que tu vises"); return; }
        step=3; draw(); return;
      }
      /* validation finale */
      db.profile = {
        name: d.name || "Champion", sex: d.sex, age: d.age, height: d.height,
        weight: d.weight, goalWeight: d.goalWeight, aim: d.aim, pace: d.pace,
        protPerKg: perKg(), metab: d.metab, days: d.days, injuries: d.injuries, avance: d.avance
      };
      db.settings.name = db.profile.name;
      db.settings.goal = d.goalWeight;
      const today = dayKey();
      db.weights = db.weights.filter(w=>dayKey(w.date)!==today);
      db.weights.push({date:new Date().toISOString(), kg:d.weight});
      coachGoal = null;
      save(); showPlan(true);
    };
  }
  draw();
}

function addCoachProgram(goal){
  COACH_PROGRAMS[goal].templates.forEach(t=>{
    if(db.templates.some(x=>x.name===t.name)) return;
    db.templates.push({id:uid(), name:t.name, items:t.items.map(it=>({exId:libId(it[0]), sets:it[1], reps:it[2], rest:it[3]})).filter(it=>it.exId)});
  });
  save();
}
function currentWeight(){
  const ws = db.weights.slice().sort((a,b)=>new Date(a.date)-new Date(b.date));
  return ws.length? ws[ws.length-1].kg : null;
}
function coachDesc(goal){
  const cur = currentWeight(), obj = db.settings.goal;
  const delta = (cur!==null && obj>0)? Math.round((obj-cur)*10)/10 : null;
  if(goal==="masse"){
    let p = "3 séances axées charges lourdes (6-10 reps) et repos longs, 3 à 4 fois par semaine en alternant. Côté assiette : ~300-500 kcal au-dessus de tes besoins et 1,6-2 g de protéines par kilo.";
    if(delta!==null && delta>0) p = `Objectif +${fmtKg(delta)} kg (${fmtKg(cur)} → ${fmtKg(obj)} kg), soit environ ${Math.max(2,Math.round(delta/0.375))} semaines à un rythme propre. `+p;
    return p;
  }
  if(goal==="seche"){
    let p = "2 séances full body (12-15 reps, repos courts) pour garder le muscle + 2-3 sorties cardio par semaine (à enregistrer dans l'onglet Séance). Côté assiette : ~400-500 kcal sous tes besoins.";
    if(delta!==null && delta<0) p = `Objectif −${fmtKg(-delta)} kg (${fmtKg(cur)} → ${fmtKg(obj)} kg), soit environ ${Math.max(1,Math.round(-delta/0.5))} semaines à −0,5 kg/semaine, un rythme sain. `+p;
    return p;
  }
  if(goal==="force"){
    return "3 séances organisées autour du squat, du développé couché et du soulevé de terre : peu de répétitions (3 à 6), charges lourdes et repos très longs (3 à 4 min) pour récupérer entre les séries. Progresse en ajoutant du poids, pas des répétitions.";
  }
  if(goal==="entretien"){
    return "2 séances full body par semaine suffisent largement à conserver muscle et force. Séries de 8 à 12 répétitions, intensité modérée, sans chercher la performance — l'objectif est la régularité sur le long terme.";
  }
  return "3 séances (haut / bas / full body) à intensité moyenne-haute pour construire du muscle tout en perdant du gras. Côté assiette : mange à ta maintenance avec beaucoup de protéines (2 g/kg), et le corps fait l'échange gras → muscle.";
}

/* --- stockage de secours : IndexedDB (survit quand localStorage est éphémère) --- */
function idbOpen(){
  return new Promise(res=>{
    try{
      const r = indexedDB.open("tonnage_db", 1);
      r.onupgradeneeded = ()=>{ try{ r.result.createObjectStore("kv"); }catch(e){} };
      r.onsuccess = ()=>res(r.result);
      r.onerror = ()=>res(null);
      r.onblocked = ()=>res(null);
    }catch(e){ res(null); }
  });
}
async function idbPut(key, val){
  const d = await idbOpen(); if(!d) return;
  try{ d.transaction("kv","readwrite").objectStore("kv").put(val, key); }catch(e){}
}
async function idbTake(key){
  const d = await idbOpen(); if(!d) return null;
  return new Promise(res=>{
    try{
      const r = d.transaction("kv","readonly").objectStore("kv").get(key);
      r.onsuccess = ()=>res(r.result||null);
      r.onerror = ()=>res(null);
    }catch(e){ res(null); }
  });
}
async function idbDel(key){
  const d = await idbOpen(); if(!d) return;
  try{ d.transaction("kv","readwrite").objectStore("kv").delete(key); }catch(e){}
}
function idbSet(json){ return idbPut(KEY, json); }
function idbGet(){ return idbTake(KEY); }

/* --- sauvegarde automatique dans un fichier choisi une fois (Android Chrome, PC) --- */
const AUTOFILE = "tonnage_autofile";
let autoFile = {handle:null, ok:false, to:null, name:""};
function fileApiOk(){ return typeof window.showSaveFilePicker === "function"; }
async function autoFileWrite(){
  if(!autoFile.ok || !autoFile.handle) return;
  try{
    const w = await autoFile.handle.createWritable();
    await w.write(JSON.stringify(db));
    await w.close();
    db.lastBackup = Date.now();
  }catch(e){ autoFile.ok = false; }
}
function autoFileSchedule(){
  if(!autoFile.ok) return;
  if(autoFile.to) clearTimeout(autoFile.to);
  autoFile.to = setTimeout(autoFileWrite, 2000);
}
async function autoFilePick(){
  try{
    const handle = await window.showSaveFilePicker({
      suggestedName: "tonnage-donnees.json",
      types: [{description:"Sauvegarde Tonnage", accept:{"application/json":[".json"]}}]
    });
    autoFile.handle = handle; autoFile.ok = true; autoFile.name = handle.name || "";
    await idbPut(AUTOFILE, handle);
    await autoFileWrite();
    save();
    toast("Sauvegarde automatique activée ✓");
    openSettings();
  }catch(e){
    if(e && e.name === "AbortError") return;
    toast("Ce navigateur ne permet pas la sauvegarde automatique");
  }
}
async function autoFileResume(){
  if(!autoFile.handle){ autoFilePick(); return; }
  try{
    const p = await autoFile.handle.requestPermission({mode:"readwrite"});

/* ================= HELPERS ================= */
const fmtKg = v => (Math.round(v*10)/10).toLocaleString("fr-FR");
/* clé d'une journée en heure LOCALE (toISOString donnerait l'heure universelle,
   et ferait basculer le jour avec plusieurs heures d'avance ou de retard) */
function dayKey(d){
  const x = d? new Date(d) : new Date();
  return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}-${String(x.getDate()).padStart(2,"0")}`;
}
function fmtDate(iso){ return new Date(iso).toLocaleDateString("fr-FR",{weekday:"long", day:"numeric", month:"long"}); }
function fmtDateShort(iso){ return new Date(iso).toLocaleDateString("fr-FR",{day:"numeric", month:"short"}); }
function fmtDur(ms){ const m=Math.round(ms/60000); return m<60? m+" min" : Math.floor(m/60)+" h "+String(m%60).padStart(2,"0"); }
function mmss(s){ s=Math.max(0,Math.round(s)); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }
function sessionVolume(sess){ let v=0; sess.entries.forEach(en=>en.sets.forEach(st=>{ if(st.done && !st.warm) v += (st.w||0)*(st.r||0); })); return v; }
function lastPerf(exId){
  for(let i=db.history.length-1;i>=0;i--){
    const en = db.history[i].entries.find(e=>e.exId===exId);
    if(en){
      const sets = en.sets.filter(s=>s.done && !s.warm);
      if(sets.length) return {date:db.history[i].date, sets};
    }
  }
  return null;
}
function workSets(en){ return en.sets.filter(s=>!s.warm); }
function e1rm(w,r){ return r>1 ? w*(1+r/30) : w; }
/* kcal d'une séance de muscu : ~6 MET pendant la durée, ajusté par le volume soulevé */
function liftKcal(durMs, volume){
  const kg = currentWeight() || (db.profile && db.profile.weight) || 75;
  const min = Math.max(0, durMs/60000);
  const base = 6 * 3.5 * kg / 200 * min;       /* dépense liée à la durée */
  const travail = volume * 0.0012;             /* dépense liée au tonnage soulevé */
  return Math.round(base + travail);
}
function parseReps(reps){
  const m = String(reps||"").match(/(\d+)(?:\D+(\d+))?/);
  if(!m) return null;
  const lo = parseInt(m[1]), hi = m[2]? parseInt(m[2]) : parseInt(m[1]);
  return {lo, hi:Math.max(lo,hi)};
}
function suggestFor(exId, target){
  const last = lastPerf(exId);
  if(!last || !last.sets.length) return null;
  const rng = parseReps(target && target.reps);
  if(!rng) return null;
  const maxW = Math.max(...last.sets.map(s=>s.w||0));
  const inc = maxW>=20? 2.5 : 1;
  const rirs = last.sets.map(s=>s.rir).filter(r=>r!==undefined && r!==null);
  const avgRir = rirs.length? rirs.reduce((a,b)=>a+b,0)/rirs.length : null;
  const allTop = last.sets.every(s=>(s.r||0)>=rng.hi);
  const anyBelow = last.sets.some(s=>(s.r||0)<rng.lo);
  if(allTop || (avgRir!==null && avgRir>=3 && !anyBelow))
    return {mode:"up", w:maxW+inc, text: allTop
      ? `Toutes les séries à ${rng.hi} reps ou plus la dernière fois — passe à ${fmtKg(maxW+inc)} kg.`
      : `Trop facile la dernière fois (3+ reps en réserve) — passe à ${fmtKg(maxW+inc)} kg.`};
  if(anyBelow && avgRir!==null && avgRir<0.5)
    return {mode:"down", w:Math.max(0,maxW-inc), text:`Trop lourd la dernière fois — repars à ${fmtKg(Math.max(0,maxW-inc))} kg pour tenir ${rng.lo} reps.`};
  if(anyBelow)
    return {mode:"hold", w:maxW, text:`Reste à ${fmtKg(maxW)} kg jusqu'à faire ${rng.lo} reps sur toutes les séries.`};
  return {mode:"beat", w:maxW, text:`Garde ${fmtKg(maxW)} kg et essaie de gratter une rep de plus.`};
}

let rest = {end:0, total:0, int:null, paused:false, remaining:0, hideTo:null};
let audioCtx = null;
function ensureAudio(){ try{ if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==="suspended") audioCtx.resume(); }catch(e){} }
function beep(){
  if(!audioCtx) return;
  try{
    [0,.25,.5].forEach((t,i)=>{
      const o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.type="sine"; o.frequency.value = i===2? 1320: 880;
      g.gain.setValueAtTime(.001, audioCtx.currentTime+t);
      g.gain.exponentialRampToValueAtTime(.4, audioCtx.currentTime+t+.02);
      g.gain.exponentialRampToValueAtTime(.001, audioCtx.currentTime+t+.2);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(audioCtx.currentTime+t); o.stop(audioCtx.currentTime+t+.22);
    });
  }catch(e){}
}
const restbar = document.getElementById("restbar");
function startRest(sec){
  if(!sec || sec<=0) return;
  /* remise à zéro complète : rien de la minuterie précédente ne doit survivre */
  if(rest.int) clearInterval(rest.int);
  if(rest.hideTo) clearTimeout(rest.hideTo);
  rest.hideTo = null;
  rest.paused = false;
  rest.remaining = 0;
  rest.total = sec;
  rest.end = Date.now() + sec*1000;
  restbar.classList.add("show");
  restbar.classList.remove("ending", "paused");
  document.getElementById("rest-lbl").textContent = "Repos";
  document.getElementById("rest-picon").textContent = "⏸";
  rest.int = setInterval(tickRest, 250);
  tickRest();
  if(!dejaVu("repos")){
    marquerVu("repos");
    setTimeout(()=>toast("Repos lancé — touche la barre pour la mettre en pause"), 500);
  }
}
function togglePauseRest(){
  if(!restbar.classList.contains("show")) return;
  if(rest.paused){
    rest.end = Date.now() + rest.remaining;
    rest.paused = false;
    restbar.classList.remove("paused");
    document.getElementById("rest-lbl").textContent = "Repos";
    document.getElementById("rest-picon").textContent = "⏸";
    if(rest.int) clearInterval(rest.int);
    rest.int = setInterval(tickRest, 250);
    tickRest();
  } else {
    rest.remaining = Math.max(0, rest.end - Date.now());
    rest.paused = true;
    restbar.classList.add("paused");
    document.getElementById("rest-lbl").textContent = "En pause";
    document.getElementById("rest-picon").textContent = "▶";
    if(rest.int) clearInterval(rest.int);
    rest.int = null;
  }
}
function tickRest(){
  const left = (rest.end - Date.now())/1000;
  if(left<=0){
    clearInterval(rest.int); rest.int=null;
    document.getElementById("rest-t").textContent="0:00";
    document.getElementById("rest-bar").style.width="0%";
    restbar.classList.add("ending");
    beep();
    if(navigator.vibrate) navigator.vibrate([200,100,200]);
    if(rest.hideTo) clearTimeout(rest.hideTo);
    rest.hideTo = setTimeout(()=>{ restbar.classList.remove("show","ending"); rest.hideTo=null; }, 1600);
    return;
  }
  document.getElementById("rest-t").textContent = mmss(left);
  document.getElementById("rest-bar").style.width = (left/rest.total*100)+"%";
}
document.getElementById("rest-skip").onclick=()=>{ if(rest.int) clearInterval(rest.int); rest.int=null; rest.paused=false; restbar.classList.remove("show","paused"); };
document.getElementById("rest-plus").onclick=()=>{ if(rest.paused){ rest.remaining+=15000; rest.total+=15; document.getElementById("rest-t").textContent=mmss(rest.remaining/1000); } else { rest.end+=15000; rest.total+=15; tickRest(); } };
document.getElementById("rest-minus").onclick=()=>{ if(rest.paused){ rest.remaining=Math.max(0,rest.remaining-15000); document.getElementById("rest-t").textContent=mmss(rest.remaining/1000); } else { rest.end-=15000; tickRest(); } };

function cardioKcal(km, min, pente, kg){
  if(!km || !min || !kg) return 0;
  const vkmh = km/(min/60);
  const v = vkmh*1000/60;               /* m/min */
  const g = Math.max(0,(pente||0))/100;
  const run = vkmh >= 7;
  const vo2 = run ? 0.2*v + 0.9*v*g + 3.5 : 0.1*v + 1.8*v*g + 3.5;  /* ACSM, ml/kg/min */
  return vo2 * kg / 1000 * 5 * min;
}
function cardioType(km, min){ return (km/(min/60)) >= 7 ? "couru" : "marché"; }
function weekStartDate(){
  const d = new Date(); d.setHours(0,0,0,0);
  d.setDate(d.getDate() - ((d.getDay()+6)%7));
  return d;
}
function cardioWeekStats(){
  const w0 = weekStartDate();
  const kg = currentWeight() || 75;
  const wk = db.cardio.filter(c=>new Date(c.date)>=w0);
  const km = wk.reduce((a,c)=>a+c.km,0);
  const kcal = wk.reduce((a,c)=>a+cardioKcal(c.km,c.min,c.pente,kg),0);
  const ran = wk.some(c=>cardioType(c.km,c.min)==="couru");
  const walked = wk.some(c=>cardioType(c.km,c.min)==="marché");
  const verb = ran && walked ? "marché / couru" : (ran ? "couru" : "marché");
  return {n:wk.length, km:Math.round(km*10)/10, kcal:Math.round(kcal), verb};
}
function motivPhrase(km){
  if(km<=0) return "Aucune sortie cette semaine — même 20 minutes de marche comptent. On enfile les baskets ? 👟";
  if(km<5)  return "C'est parti, chaque kilomètre compte ! 👏";
  if(km<15) return "Belle régularité, continue sur cette lancée 🔥";
  if(km<30) return "Grosse semaine — tes jambes te disent merci 💪";
  return "Machine ! Pense aussi à bien récupérer 😴";
}
function kcalEquiv(kcal){
  if(kcal<150) return "";
  const n = Math.round(kcal/270);
  return n>=1 ? ` — l'équivalent de ${n} pain${n>1?"s":""} au chocolat 🥐` : "";
}

function weightVerdict(){
  if(!(db.settings.goal>0)) return {txt:"Renseigne ton profil pour recevoir des conseils adaptés à ton objectif.", tone:"mute"};
  const ws = db.weights.slice().sort((a,b)=>new Date(a.date)-new Date(b.date));
  if(ws.length<2) return {txt:"Note ton poids une fois par semaine — c'est la balance qui dira si tu manges assez.", tone:"mute"};
  const last = ws[ws.length-1];
  let refIdx = -1, refGap = Infinity;
  for(let i=ws.length-2;i>=0;i--){
    const days = (new Date(last.date)-new Date(ws[i].date))/864e5;
    if(days>=5 && Math.abs(days-7)<refGap){ refGap=Math.abs(days-7); refIdx=i; }
  }
  if(refIdx<0) return {txt:"Encore une pesée espacée d'une semaine et je pourrai juger ta progression.", tone:"mute"};
  const ref = ws[refIdx];
  const days = (new Date(last.date)-new Date(ref.date))/864e5;
  const rate = (last.kg-ref.kg)/days*7;
  const bulk = db.settings.goal >= last.kg;
  const r = Math.round(rate*100)/100;
  const rTxt = (r>0?"+":"")+r.toLocaleString("fr-FR")+" kg/sem";
  if(bulk){
    if(rate>=0.35) return {txt:`${rTxt} — ça monte vite, une partie sera du gras. Lève un peu le pied sur les extras.`, tone:"warn"};
    if(rate>=0.05) return {txt:`${rTxt} — c'est exactement le bon rythme, continue comme ça 💪`, tone:"good"};
    if(rate>-0.05) return {txt:`Poids stable — ajoute une collation ou un shake chaque jour cette semaine.`, tone:"warn"};
    return {txt:`${rTxt} — tu perds du poids, il faut manger nettement plus. Coche toutes les cases !`, tone:"bad"};
  }
  if(rate<=-0.05 && rate>-0.8) return {txt:`${rTxt} — bon rythme de perte, continue.`, tone:"good"};
  if(rate<=-0.8) return {txt:`${rTxt} — trop rapide, tu vas perdre du muscle. Mange un peu plus.`, tone:"warn"};
  return {txt:`Poids stable — pour perdre, réduis un peu les portions ou ajoute du cardio.`, tone:"warn"};
}
/* ===== Bilan hebdomadaire : analyse + conseils priorisés ===== */
function computeBilan(){
  const now = Date.now(), d7 = now-7*864e5, d14 = now-14*864e5, d28 = now-28*864e5;
  const cur = db.history.filter(s=>new Date(s.date).getTime()>=d7);
  const prev = db.history.filter(s=>{const t=new Date(s.date).getTime(); return t>=d14 && t<d7;});
  const volCur = cur.reduce((a,s)=>a+sessionVolume(s),0);
  const volPrev = prev.reduce((a,s)=>a+sessionVolume(s),0);
  /* force : meilleur 1RM estimé sur 7 j vs les 21 j précédents, par exercice */
  const ups=[], downs=[];
  const curBest={};
  cur.forEach(s=>s.entries.forEach(en=>{
    const sets = workSets(en);
    if(!sets.length) return;
    const b = Math.max(...sets.map(st=>e1rm(st.w||0,st.r||0)));
    if(b>(curBest[en.exId]||0)) curBest[en.exId]=b;
  }));
  Object.keys(curBest).forEach(exId=>{
    let pb=0;
    db.history.forEach(s=>{
      const t=new Date(s.date).getTime();
      if(t<d28||t>=d7) return;
      const en=s.entries.find(e=>e.exId===exId);
      if(en && workSets(en).length) pb=Math.max(pb, ...workSets(en).map(st=>e1rm(st.w||0,st.r||0)));
    });
    if(pb>0){
      const pct=(curBest[exId]-pb)/pb*100;
      if(pct>=2) ups.push(getEx(exId).name);
      else if(pct<=-3) downs.push(getEx(exId).name);
    }
  });
  const wv = weightVerdict();
  const kg = currentWeight()||74;
  const kmCur = db.cardio.filter(c=>new Date(c.date).getTime()>=d7).reduce((a,c)=>a+c.km,0);
  /* habitudes & protéines sur 7 j */
  let hbChecked=0, protDays=0, protSum=0;
  for(let i=0;i<7;i++){
    const k=dayKey(now-i*864e5);
    hbChecked += (db.habitLog[k]||[]).length;
    if(db.habitSel[k]){ protDays++; protSum += dayProt(k); }
  }
  const hbPct = db.habits.length? Math.round(hbChecked/(7*db.habits.length)*100) : 0;
  const protAvg = protDays? Math.round(protSum/protDays) : null;
  const protTarget = Math.round(kg*1.9);
  const bulk = db.settings.goal >= kg;

  const prios=[], wins=[];
  if(wv.tone==="bad") prios.push(["Mange plus, c'est LA priorité", wv.txt+" Ajoute un shake (whey + lait + avoine + banane ≈ 600 kcal) chaque jour, sans exception."]);
  else if(wv.tone==="warn") prios.push([wv.txt.includes("vite")?"Lève un peu le pied sur les extras":(bulk?"Augmente un peu les apports":"Ajuste les apports"), wv.txt]);
  else if(wv.tone==="good") wins.push("Poids : "+wv.txt);
  if(cur.length<3) prios.push(["Remets de la régularité", `${cur.length} séance${cur.length>1?"s":""} de muscu sur 7 jours — vise 3 à 4. C'est le volume d'entraînement qui déclenche la prise de muscle.`]);
  else wins.push(`${cur.length} séances cette semaine — la régularité est là.`);
  if(downs.length>=2) prios.push(["Charges en baisse : récupère", `Tu as baissé sur ${downs.slice(0,3).join(", ")}. Souvent un signe de fatigue : vérifie ton sommeil, respecte les repos longs, et si ça persiste une semaine de charges légères relance la machine.`]);
  else if(downs.length===1) prios.push(["Un exercice en baisse", `${downs[0]} a reculé — regarde si c'est la fatigue ou la technique.`]);
  if(ups.length) wins.push(`Tu as progressé sur ${ups.slice(0,3).join(", ")}${ups.length>3?"…":""} 💪`);
  if(hbPct<60 && db.habits.length) prios.push(["Coche tes repas", `${hbPct} % des cases repas cochées cette semaine. Même sans compter les calories, la checklist te tient — remplis-la chaque jour.`]);
  else if(hbPct>=80) wins.push(`Alimentation suivie à ${hbPct} % — solide.`);
  if(protAvg!==null && protAvg < protTarget*0.7) prios.push(["Monte les protéines", `≈ ${protAvg} g/jour en moyenne, l'objectif est ${protTarget} g. Le plus simple : whey + lait à la collation, et une vraie portion de viande/poisson à chaque repas.`]);
  else if(protAvg!==null && protAvg>=protTarget*0.9) wins.push(`Protéines ≈ ${protAvg} g/j en moyenne — dans la cible.`);
  if(bulk && kmCur>25) prios.push(["Cardio généreux pour une prise de masse", `${fmtKg(kmCur)} km cette semaine : c'est très bien pour le cœur, mais ça creuse ton déficit. Compense par une collation de plus les jours de sortie.`]);
  else if(kmCur>0) wins.push(`${fmtKg(kmCur)} km de cardio — le cœur suit.`);
  if(volCur && volPrev) {
    const dv = Math.round((volCur-volPrev)/volPrev*100);
    if(dv<=-20) prios.push(["Volume en baisse", `${Math.abs(dv)} % de tonnage en moins que la semaine passée (${fmtKg(volCur)} vs ${fmtKg(volPrev)} kg).`]);
    else if(dv>=10) wins.push(`Tonnage en hausse de ${dv} % (${fmtKg(volCur)} kg soulevés).`);
  }
  if(!prios.length) prios.push(["Continue exactement comme ça", "Aucun point faible détecté cette semaine. Le seul conseil : ne change rien, la constance fait le reste."]);
  return {cur:cur.length, volCur, volPrev, kmCur, wv, prios:prios.slice(0,3), wins:wins.slice(0,4)};
}

  document.querySelectorAll("[data-hbopen]").forEach(b=>b.onclick=()=>{

  document.querySelectorAll("[data-opt]").forEach(b=>b.onclick=()=>{

    db.habitSel[todayKey][i] = arr.includes(label)? arr.filter(x=>x!==label) : arr.concat(label);
    if(db.dayFix[todayKey]) delete db.dayFix[todayKey];   /* la saisie manuelle reprend la main */
    save(); renderSurPlace();
  });
  document.querySelectorAll("[data-other]").forEach(b=>b.onclick=()=>{
    const i = parseInt(b.dataset.other);
    openSheet(`<h3>Autre aliment</h3>
      <div class="stack">
        <div><span class="label" style="display:block; margin-bottom:5px;">Aliment</span>
        <select id="ot-food">${FOOD_100G.map(([grp,items])=>
          `<optgroup label="${grp}">${items.map(([n,p])=>`<option value="${p}">${n}</option>`).join("")}</optgroup>`).join("")}
          <option value="manuel">Autre — je saisis les protéines</option>
        </select></div>
        <div id="ot-gwrap"><span class="label" style="display:block; margin-bottom:5px;">Quantité mangée (g)</span>
        <input type="number" inputmode="decimal" step="10" min="0" id="ot-g" placeholder="150"></div>
        <div id="ot-mwrap" style="display:none;">

          <input id="ot-name" placeholder="Ex : plat du resto" style="margin-bottom:9px;">

          <input type="number" inputmode="decimal" step="1" min="0" id="ot-prot" placeholder="25">
        </div>
        <div id="ot-live" style="font-size:15px; font-weight:700; color:var(--accent); min-height:22px;"></div>
        <p style="margin:0; font-size:12px; color:var(--ink-mute);">Pas sûr de la quantité ? Envoie une photo de ton assiette à Claude, il te l'estime.</p>
        <button class="btn btn-accent" id="ot-ok">Ajouter</button>
      </div>`);
    const foodEl = document.getElementById("ot-food"), gEl = document.getElementById("ot-g"), liveEl = document.getElementById("ot-live");
    const calc = ()=>{

      if(manual){ liveEl.textContent = ""; return null; }

      if(!g || g<=0){ liveEl.textContent = ""; return null; }
      const prot = Math.round(per*g/100);
      const name = foodEl.options[foodEl.selectedIndex].text.replace(/\s*\(.*?\)/,"");
      liveEl.textContent = `${g} g de ${name.toLowerCase()} ≈ ${prot} g de protéines`;
      return {label:`${name} ${g} g (~${prot} g prot.)`, prot};
    };
    foodEl.onchange = calc; gEl.oninput = calc;
    document.getElementById("ot-ok").onclick=()=>{
      let label;
      if(foodEl.value==="manuel"){

        label = `${document.getElementById("ot-name").value.trim()||"Autre"} (~${p} g prot.)`;
      } else {
        const r = calc();
        if(!r) return;
        label = r.label;
      }
      if(!db.habitSel[todayKey]) db.habitSel[todayKey] = {};
      db.habitSel[todayKey][i] = (db.habitSel[todayKey][i]||[]).concat(label);
      save(); closeSheet(); render();
    };
  });
  document.getElementById("cardio-card").innerHTML = `
    ${cs.n? `<div style="font-size:15px; margin-bottom:2px;">Cette semaine tu as ${cs.verb} <b>${fmtKg(cs.km)} km</b> (${cs.n} sortie${cs.n>1?"s":""}), soit environ <b style="color:var(--accent);">${cs.kcal} kcal</b>${kcalEquiv(cs.kcal)}.</div>` : ""}
    <div style="font-size:13.5px; color:var(--ink-soft); margin-bottom:10px;">${motivPhrase(cs.km)}</div>
    <div class="row">
      <button class="btn btn-accent btn-sm grow" id="cardio-add">＋ Ajouter une sortie</button>
      <button class="btn btn-sm" id="cardio-list">Mes sorties</button>
    </div>`;
  document.getElementById("cardio-add").onclick=openCardioAdd;
  document.getElementById("cardio-list").onclick=openCardioList;

  const zone = document.getElementById("tpl-zone");
  if(!db.templates.length){
    zone.innerHTML = `<div class="card empty"><div class="big">🏗️</div>Aucune séance pour l'instant.<br>Crée ta première dans l'onglet <b>Programmes</b>.</div>`;
  } else {
    const ordered = sug? [sug].concat(db.templates.filter(t=>t.id!==sug.id)) : db.templates.slice();
    zone.innerHTML = `<div class="hscroll">${ordered.map(t=>{
      const mins = Math.max(15, Math.round(t.items.reduce((a,it)=>a+it.sets*(((it.rest||90)+45)/60),0)/5)*5);
      const icons = t.items.slice(0,4).map(it=>exIcon(getEx(it.exId), true)).join("");
      const more = t.items.length>4? `<span class="ex-ico sm" style="font-size:12px; font-weight:800; color:var(--ink-mute);">+${t.items.length-4}</span>`:"";
      return `<div class="sess-card">
        ${sug && sug.id===t.id? `<div class="sugg-badge">Conseillée aujourd'hui</div>`:""}
        <button class="inline-edit" data-preview="${t.id}" style="display:block; width:100%; padding:0; margin:0;">
          <div style="font-size:18px; font-weight:800;">${esc(t.name)}</div>
          <div style="font-size:12.5px; color:var(--ink-mute); margin:2px 0 10px;">${t.items.length} exercice${t.items.length>1?"s":""} · ~${mins} min · voir le détail</div>
          <div class="row" style="gap:6px; margin-bottom:12px;">${icons}${more}</div>
        </button>
        <button class="btn btn-accent btn-sm" data-launch="${t.id}" style="width:100%;">Lancer</button>
      </div>`;}).join("")}</div>`;
    zone.querySelectorAll("[data-launch]").forEach(b=>b.onclick=()=>startWorkout(b.dataset.launch));
    zone.querySelectorAll("[data-preview]").forEach(b=>b.onclick=()=>openPreview(b.dataset.preview));
  }
  document.getElementById("free-btn").onclick=()=>startWorkout(null);
}

function openPreview(tplId){
  const t = db.templates.find(x=>x.id===tplId);
  if(!t) return;
  const mins = Math.max(15, Math.round(t.items.reduce((a,it)=>a+it.sets*(((it.rest||90)+45)/60),0)/5)*5);
  openSheet(`<h3>${esc(t.name)}</h3>
    <div class="row" style="gap:6px; margin-bottom:14px;">
      <span class="pill">${t.items.length} exercice${t.items.length>1?"s":""}</span>
      <span class="pill">~${mins} min</span>
      <span class="pill">${t.items.reduce((a,i)=>a+i.sets,0)} séries</span>
    </div>
    <div style="max-height:52dvh; overflow-y:auto;">${t.items.map((it,i)=>{
      const ex = getEx(it.exId);
      const last = lastPerf(it.exId);
      const note = injuryNote(ex.name);
      return `<div class="pick-row" style="cursor:default;">${exIcon(ex)}
        <div class="grow"><div>${i+1}. ${esc(ex.name)}</div>
        <div class="eq">${it.sets} × ${esc(String(it.reps||"?"))} · repos ${it.rest||90} s${last? ` · dernière fois ${fmtKg(Math.max(...last.sets.map(s=>s.w||0)))} kg`:""}</div>
        ${note? `<div class="eq" style="color:var(--bad);">⚠️ ${esc(note.injury)} : ${esc(note.tip)}</div>`:""}</div></div>`;
    }).join("")}</div>
    <button class="btn btn-accent" id="pv-start" style="width:100%; margin-top:14px;">Lancer cette séance</button>
    <button class="btn" id="pv-close" style="width:100%; margin-top:8px;">Fermer</button>`);
  document.getElementById("pv-start").onclick=()=>{ closeSheet(); startWorkout(tplId); };
  document.getElementById("pv-close").onclick=closeSheet;
}
function startWorkout(tplId){
  const tpl = tplId ? db.templates.find(t=>t.id===tplId) : null;
  const entries = tpl ? tpl.items.map(it=>{
    const last = lastPerf(it.exId);
    const sug = suggestFor(it.exId, it);
    const rng = parseReps(it.reps);
    const sets = [];
    for(let i=0;i<it.sets;i++){
      const ls = last && last.sets[Math.min(i,last.sets.length-1)];
      const w = sug && (sug.mode==="up"||sug.mode==="down") ? sug.w : (ls? ls.w:"");
      const r = sug && (sug.mode==="up"||sug.mode==="down") ? (rng? rng.lo:"") : (ls? ls.r : (rng? rng.lo:""));
      sets.push({w, r, done:false});
    }
    return {exId:it.exId, target:it, sets};
  }) : [];
  /* série d'échauffement sur le premier exercice */
  if(entries.length){
    const w0 = entries[0].sets[0] && entries[0].sets[0].w;
    const wu = w0 ? Math.max(0, Math.round(w0*0.5/2.5)*2.5) : "";
    entries[0].sets.unshift({w:wu, r:10, done:false, warm:true});
  }
  db.active = {name: tpl? tpl.name : "Séance libre", templateId:tplId, start:Date.now(), entries};
  save(); render();
}

function renderActive(app){
  const a = db.active;
  app.innerHTML = `
    <div class="topbar">
      <div><div class="label">Séance en cours</div><h2 style="font-size:21px;">${esc(a.name)}</h2></div>
      <div class="chrono" id="chrono"></div>
    </div>
    <div style="height:14px"></div>
    <div class="stack" id="ex-list"></div>
    <button class="btn btn-ghost" id="add-ex" style="width:100%; margin-top:12px;">＋ Ajouter un exercice</button>
    <div class="row" style="margin-top:20px;">
      <button class="btn btn-danger" id="cancel-w" style="flex:0 0 auto; padding-inline:14px;">Annuler</button>
      <button class="btn btn-accent grow" id="finish-w">Terminer la séance</button>
    </div>`;

  const tick=()=>{ const el=document.getElementById("chrono"); if(el) el.textContent = mmss((Date.now()-a.start)/1000); };
  tick(); chronoInt = setInterval(tick, 1000);

  const list = document.getElementById("ex-list");
  list.innerHTML = a.entries.length ? "" : `<div class="card empty">Ajoute un premier exercice pour commencer.</div>`;
  a.entries.forEach((en,ei)=>{
    const ex = getEx(en.exId);
    const last = lastPerf(en.exId);
    const lastTxt = last ? `Dernière fois (${fmtDateShort(last.date)}) : ${last.sets.map(s=>`${fmtKg(s.w)}×${s.r}`).join(" · ")}` : "Premier passage sur cet exercice";
    const target = en.target && en.target.reps ? ` · Objectif ${en.target.sets} × ${esc(String(en.target.reps))}` : "";
    const sug = suggestFor(en.exId, en.target);
    const sugLine = sug ? `<div class="hint" style="color:var(--accent);">→ ${esc(sug.text)}</div>` : "";
    const note = injuryNote(ex.name);
    const noteLine = note ? `<div class="inj-note">⚠️ <b>${esc(note.injury)} sensible.</b> ${esc(note.tip)}${note.alts.length? ` <button class="inj-swap" data-injswap="${ei}">Voir les variantes</button>`:""}</div>` : "";
    const card = document.createElement("div");
    card.className="ex-card";
    card.innerHTML = `
      <div class="ex-head" style="align-items:center; gap:10px; margin-bottom:6px;">${exIcon(ex,true)}
        <div class="grow"><div class="ex-name">${esc(ex.name)}</div></div>
        <span class="pill">${esc(ex.equip||ex.muscle)}</span></div>
      <div class="hint" style="margin-bottom:${sug?'2px':'10px'};">${lastTxt}${target}</div>${sugLine}${noteLine}
      ${en.sets.some(s=>s.warm)? hintBox("echauffement","La ligne <b>Éch.</b> est une série d'échauffement, pré-remplie à la moitié de ta charge de travail. Elle ne compte ni dans ton tonnage, ni dans tes records, ni dans ton profil musculaire.") : ""}
      <div class="set-cols"><span></span><span>kg</span><span>reps</span><span>✓</span></div>
      <div class="sets"></div>
      <div class="row">
        <button class="btn btn-sm btn-ghost grow" data-act="addset">＋ série</button>
        <button class="btn btn-sm btn-ghost" data-act="swap">⇄ Remplacer</button>
        <button class="btn btn-sm btn-ghost" data-act="delex" style="color:var(--bad); border-color:var(--border);">Retirer</button>
      </div>`;
    const setsDiv = card.querySelector(".sets");
    en.sets.forEach((st,si)=>{
      const row = document.createElement("div");
      row.className = "set-row"+(st.done?" done":"")+(st.warm?" warm":"");
      const num = st.warm ? "Éch." : String(en.sets.slice(0,si).filter(s=>!s.warm).length+1);
      row.innerHTML = `<div class="n">${num}</div>
        <input type="number" inputmode="decimal" step="0.5" min="0" placeholder="kg" value="${st.w!==""?st.w:""}">
        <input type="number" inputmode="numeric" min="0" placeholder="reps" value="${st.r!==""?st.r:""}">
        <button class="ck">${st.done?"✓":"○"}</button>`;
      const [wIn, rIn] = row.querySelectorAll("input");
      wIn.oninput=()=>{ st.w = wIn.value===""?"":parseFloat(wIn.value); save(); };
      rIn.oninput=()=>{ st.r = rIn.value===""?"":parseInt(rIn.value); save(); };
      row.querySelector(".ck").onclick=()=>{
        ensureAudio();
        st.w = parseFloat(wIn.value)||0; st.r = parseInt(rIn.value)||0;
        st.done = !st.done;
        if(!st.done) delete st.rir;
        save();
        row.classList.toggle("done", st.done);
        row.querySelector(".ck").textContent = st.done?"✓":"○";
        const oldAsk = card.querySelector(".rir-ask");
        if(oldAsk) oldAsk.remove();
        if(st.done && st.warm){
          startRest(60);
          return;
        }
        if(st.done){
          const rs = (en.target && en.target.rest) || db.settings.rest;
          startRest(rs);
          const ask = document.createElement("div");
          ask.className = "rir-ask";
          ask.innerHTML = `${dejaVu("rir")? "" : `<div style="font-size:12px; color:var(--ink-mute); line-height:1.5; margin-bottom:8px;">Ta réponse ajuste tout de suite la charge de la série suivante, et celle de ta prochaine séance. Réponds honnêtement, même les mauvais jours.</div>`}
            <div class="q">Aurais-tu pu faire plus de reps ?</div>
            <div class="row">
              <button data-rir="0">Non, 0</button>
              <button data-rir="1">1-2</button>
              <button data-rir="3">3-5+</button>
            </div>`;
          row.after(ask);
          ask.querySelectorAll("[data-rir]").forEach(b=>b.onclick=()=>{
            const rir = parseInt(b.dataset.rir);
            st.rir = rir;
            if(!dejaVu("rir")) marquerVu("rir");
            const rng = parseReps(en.target && en.target.reps) || {lo:8, hi:12};
            const next = en.sets.find(s=>!s.done);
            const inc = (st.w||0)>=20? 2.5 : 1;
            let msg;
            if(rir>=3){
              msg = `Trop léger — prochaine série à ${fmtKg((st.w||0)+inc)} kg.`;
              if(next) next.w = (st.w||0)+inc;
            } else if(rir===0 && (st.r||0) < rng.lo){
              msg = `Trop lourd — prochaine série à ${fmtKg(Math.max(0,(st.w||0)-inc))} kg.`;
              if(next) next.w = Math.max(0,(st.w||0)-inc);
            } else if(rir===0){
              msg = "À la limite — garde cette charge, c'est du bon travail.";
            } else {
              msg = "Parfait, pile la bonne zone pour prendre du muscle.";
            }
            save();
            ask.innerHTML = `<div class="q ok">${esc(msg)}</div>`;
            if(next){
              const ni = en.sets.indexOf(next);
              const nRow = setsDiv.querySelectorAll(".set-row")[ni];
              const nIn = nRow ? nRow.querySelector("input") : null;
              if(nIn) nIn.value = next.w;
            }
            setTimeout(()=>{ ask.remove(); }, 2600);
          });
        }
      };
      setsDiv.appendChild(row);
    });
    card.querySelector('[data-act="addset"]').onclick=()=>{
      const prev = en.sets[en.sets.length-1];
      en.sets.push({w: prev? prev.w:"", r: prev? prev.r:"", done:false});
      save(); render();
    };
    wireHints(card);
    card.querySelector('[data-act="swap"]').onclick=()=>openSwap(ei);
    const injBtn = card.querySelector("[data-injswap]");
    if(injBtn) injBtn.onclick=()=>openSwap(ei, true);
    card.querySelector('[data-act="delex"]').onclick=()=>{
      askConfirm("Retirer l'exercice ?", ex.name+" sera retiré de cette séance (les autres exercices sont conservés).", "Retirer", true, ()=>{
        a.entries.splice(ei,1); save(); render();
      });
    };
    list.appendChild(card);
  });

  document.getElementById("add-ex").onclick=()=>openPicker(exId=>{
    const last = lastPerf(exId);
    const ls = last? last.sets[0] : null;
    a.entries.push({exId, target:{sets:4, reps:"", rest:db.settings.rest}, sets:[{w:ls?ls.w:"", r:ls?ls.r:"", done:false}]});
    save(); render();
  });
  document.getElementById("cancel-w").onclick=()=>askConfirm("Annuler la séance ?","Tout ce que tu as saisi dans cette séance sera perdu.","Oui, annuler",true,()=>{ db.active=null; save(); render(); });
  document.getElementById("finish-w").onclick=()=>{
    const doneSets = a.entries.reduce((n,en)=>n+en.sets.filter(s=>s.done && !s.warm).length,0);
    if(!doneSets){ askConfirm("Aucune série validée","Valide au moins une série (bouton ○) avant de terminer, ou annule la séance.","OK",false,()=>{}); return; }
    const vol = a.entries.reduce((v,en)=>v+en.sets.reduce((x,s)=>x+((s.done&&!s.warm)?(s.w||0)*(s.r||0):0),0),0);
    const kcal = liftKcal(Date.now()-a.start, vol);
    askConfirm("Terminer la séance ?", `${doneSets} séries validées · ${fmtKg(vol)} kg soulevés · environ ${kcal} kcal brûlées. On enregistre ?`, "Enregistrer", false, ()=>{
      db.history.push({
        id:uid(), date:new Date().toISOString(), name:a.name, templateId:a.templateId,
        start:a.start, end:Date.now(),
        entries:a.entries.map(en=>({exId:en.exId, sets:en.sets.filter(s=>s.done).map(s=>({w:s.w||0, r:s.r||0, done:true, warm:!!s.warm, rir:(s.rir===undefined?null:s.rir)}))})).filter(en=>en.sets.length)
      });
      db.active=null; save(); render();
    });
  };
}

/* remplacer un exercice pendant la séance (machine prise, matériel manquant, blessure) */
function openSwap(ei, fromInjury){
  const en = db.active.entries[ei];
  const ex = getEx(en.exId);
  const note = injuryNote(ex.name);
  let list = altsFor(en.exId);
  if(fromInjury && note){
    const safe = note.alts.map(n=>allEx().find(e=>e.name===n)).filter(Boolean);
    list = safe.concat(list.filter(e=>!safe.some(s=>s.id===e.id)));
  }
  openSheet(`<h3>Remplacer ${esc(ex.name)}</h3>
    ${note? `<div class="inj-note" style="margin:0 0 12px;">⚠️ <b>${esc(note.injury)} sensible.</b> ${esc(note.tip)}</div>`:""}
    <p style="margin:0 0 10px; font-size:13px; color:var(--ink-soft);">Ces exercices travaillent les mêmes muscles — tes séries et ton objectif sont conservés.</p>
    <div style="max-height:52dvh; overflow-y:auto;">${list.map(e=>{
      const n2 = injuryNote(e.name);
      const reco = fromInjury && note && note.alts.includes(e.name);
      return `<div class="pick-row" data-swap="${e.id}">${exIcon(e)}
        <div class="grow"><div>${esc(e.name)}${reco? ' <span style="color:var(--good); font-size:11px; font-weight:700;">CONSEILLÉ</span>':""}</div>
        <div class="eq">${esc(e.equip||"")}${n2? ` · ⚠️ ${esc(n2.injury)}`:""}</div></div>
        <span style="color:var(--accent); font-weight:800;">⇄</span></div>`;
    }).join("")}</div>
    <button class="btn" id="sw-cancel" style="width:100%; margin-top:12px;">Annuler</button>`);
  document.getElementById("sw-cancel").onclick=closeSheet;
  document.querySelectorAll("[data-swap]").forEach(r=>r.onclick=()=>{
    const newId = r.dataset.swap;
    const last = lastPerf(newId);
    en.exId = newId;
    en.sets.forEach((s,i)=>{
      if(s.done) return;
      const ls = last && last.sets[Math.min(i, last.sets.length-1)];
      s.w = s.warm && ls ? Math.max(0, Math.round((ls.w||0)*0.5/2.5)*2.5) : (ls? ls.w : "");
      if(ls && !s.warm) s.r = ls.r;
    });
    save(); closeSheet(); render();
    toast("Remplacé par "+getEx(newId).name);
  });
}

function openTplEditor(id){
  let tpl = id ? JSON.parse(JSON.stringify(db.templates.find(t=>t.id===id))) : {id:uid(), name:"", items:[]};
  const draw = ()=>{
    openSheet(`<h3>${id?"Modifier la séance":"Nouvelle séance"}</h3>
      <div class="stack">
        <div><span class="label" style="display:block; margin-bottom:5px;">Nom de la séance</span>
        <input id="tp-name" placeholder="Ex : Push, Haut du corps…" value="${esc(tpl.name)}"></div>
        <div><span class="label" style="display:block; margin-bottom:5px;">Exercices</span><div id="tp-items"></div>
        <button class="btn btn-ghost" id="tp-add" style="width:100%;">＋ Ajouter un exercice</button></div>
        <div class="row">
          <button class="btn grow" id="tp-cancel">Annuler</button>
          <button class="btn btn-accent grow" id="tp-save">Enregistrer</button>
        </div>
      </div>`);
    const itemsEl = document.getElementById("tp-items");
    itemsEl.innerHTML = tpl.items.length? "" : `<div class="empty" style="padding:14px;">Aucun exercice pour l'instant.</div>`;
    tpl.items.forEach((it,i)=>{
      const ex = getEx(it.exId);
      const d = document.createElement("div");
      d.className="tpl-item";
      d.innerHTML = `
        <div class="row"><div class="grow" style="font-weight:700;">${i+1}. ${esc(ex.name)}</div>
          <button class="icon-btn" data-up style="width:32px;height:32px;">↑</button>
          <button class="icon-btn" data-dn style="width:32px;height:32px;">↓</button>
          <button class="icon-btn" data-rm style="width:32px;height:32px;color:var(--bad);">✕</button></div>
        <div class="cfg">
          <label><span class="label">Séries</span><input type="number" inputmode="numeric" min="1" value="${it.sets}" data-f="sets"></label>
          <label><span class="label">Reps</span><input type="text" placeholder="8-12" value="${esc(String(it.reps||""))}" data-f="reps"></label>
          <label><span class="label">Repos (s)</span><input type="number" inputmode="numeric" min="0" step="15" value="${it.rest}" data-f="rest"></label>
        </div>`;
      d.querySelector("[data-up]").onclick=()=>{ if(i>0){ tpl.items.splice(i-1,0,tpl.items.splice(i,1)[0]); tpl.name=document.getElementById("tp-name").value; draw(); } };
      d.querySelector("[data-dn]").onclick=()=>{ if(i<tpl.items.length-1){ tpl.items.splice(i+1,0,tpl.items.splice(i,1)[0]); tpl.name=document.getElementById("tp-name").value; draw(); } };
      d.querySelector("[data-rm]").onclick=()=>{ tpl.items.splice(i,1); tpl.name=document.getElementById("tp-name").value; draw(); };
      d.querySelectorAll("[data-f]").forEach(inp=>inp.oninput=()=>{
        const f = inp.dataset.f;
        it[f] = f==="reps"? inp.value : (parseInt(inp.value)||0);
      });
      itemsEl.appendChild(d);
    });
    document.getElementById("tp-add").onclick=()=>{
      tpl.name = document.getElementById("tp-name").value;
      openPicker(exId=>{ tpl.items.push({exId, sets:4, reps:"8-12", rest:db.settings.rest}); draw(); });
    };
    document.getElementById("tp-cancel").onclick=closeSheet;
    document.getElementById("tp-save").onclick=()=>{
      tpl.name = document.getElementById("tp-name").value.trim() || "Séance sans nom";
      const idx = db.templates.findIndex(t=>t.id===tpl.id);
      if(idx>=0) db.templates[idx]=tpl; else db.templates.push(tpl);
      save(); closeSheet(); render();
    };
  };
  draw();
}

    document.getElementById("af-off").onclick = autoFileOff;
  } else if(autoFile.handle){

      <div style="font-size:12.5px; color:var(--ink-soft); margin:3px 0 10px;">Le navigateur redemande l'autorisation d'écrire dans ${esc(autoFile.name||"ton fichier")}.</div>
      <button class="btn btn-accent btn-sm" id="af-resume" style="width:100%;">Réactiver</button></div>`;
    document.getElementById("af-resume").onclick = autoFileResume;
  } else {
    autoBox.innerHTML = `<button class="btn btn-accent" id="af-on" style="width:100%;">⚡ Activer la sauvegarde automatique</button>
      <div style="font-size:12px; color:var(--ink-mute); line-height:1.5; margin:6px 0 2px;">Tu choisis un fichier une seule fois, et l'app y écrit toute seule à chaque modification.</div>`;
    document.getElementById("af-on").onclick = autoFilePick;
  }
  const ago = ts => {
    if(!ts) return "jamais";
    const m = Math.round((Date.now()-Number(ts))/60000);
    if(m<1) return "à l'instant";
    if(m<60) return `il y a ${m} min`;
    const h = Math.round(m/60);
    return h<24? `il y a ${h} h` : `il y a ${Math.round(h/24)} j`;
  };
  const ico = v => v==="ok" ? '<span style="color:var(--good);">✓</span>' : (v==="?" ? '<span style="color:var(--ink-mute);">…</span>' : '<span style="color:var(--bad);">✕</span>');
  const survived = (diag.lsMark || diag.idbMark) ? true : false;
  document.getElementById("st-diag").innerHTML = `

    <div>${ico(diag.idb)} Mémoire de secours : ${diag.idb}</div>

    <div style="color:var(--ink-mute);">Dernier enregistrement chargé : ${diag.loadedSavedAt? ago(diag.loadedSavedAt) : "aucun"}</div>
    <div style="color:var(--ink-mute);">Dernière sauvegarde fichier : ${ago(db.lastBackup)}</div>
    <div style="color:var(--ink-mute); margin-top:6px;">Version ${BUILD}</div>
    ${!survived? `<div style="color:var(--bad); margin-top:8px; font-weight:600; line-height:1.5;">iOS efface la mémoire de l'app entre deux ouvertures. Utilise l'icône 💾 avant de fermer, et 📂 pour restaurer.</div>`:""}`;
  document.getElementById("st-file").onclick=async()=>{
    const btn = document.getElementById("st-file");
    const stamp = dayKey();
    try{
      const downloads = await useCap("downloads");
      if(!downloads) throw new Error("unavailable");
      await downloads.save({filename:`tonnage-sauvegarde-${stamp}.json`, data: JSON.stringify(db)});
      db.lastBackup = Date.now(); save();
      btn.textContent = "Sauvegarde enregistrée ✓";
    }catch(e){
      if(e && e.code==="declined"){ btn.textContent="Sauvegarde annulée"; return; }
      btn.textContent = "Indisponible — utilise « Exporter en texte »";
    }
  };
  document.getElementById("st-restore-in").onchange=(ev)=>{
    const f = ev.target.files && ev.target.files[0];
    if(!f) return;
    const fr = new FileReader();
    fr.onload = ()=>{
      try{
        const d = JSON.parse(String(fr.result));
        if(!d || !Array.isArray(d.history)) throw 0;
        db = d; applyDefaults(); save(); closeSheet(); render();
        toast("Sauvegarde restaurée ✓");
      }catch(e){ toast("Fichier illisible"); }
    };
    fr.readAsText(f);
  };
  document.getElementById("st-export").onclick=()=>{
    openSheet(`<h3>Exporter</h3><p style="font-size:13.5px; color:var(--ink-soft); margin:0 0 10px;">Copie ce texte et garde-le quelque part (Notes, mail…). Tu pourras le recoller dans « Importer » pour tout restaurer.</p>
