/* ================= HELPERS ================= */
const fmtKg = v => (Math.round(v*10)/10).toLocaleString("fr-FR");
/* clé d'une journée en heure LOCALE (toISOString donnerait l'heure universelle,
   et ferait basculer le jour avec plusieurs heures d'avance ou de retard) */
function dayKey(d){
  const x = d? new Date(d) : new Date();
  return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}-${String(x.getDate()).padStart(2,"0")}`;
}
function fmtDate(iso){ return new Date(iso).toLocaleDateString("fr-FR",{weekday:"long", day:"numeric", month:"long"}); }
function fmtDateShort(iso){ return new Date(iso).toLocaleDateString("fr-FR",{day:"numeric", month:"short"}); }
function fmtDur(ms){ const m=Math.round(ms/60000); return m<60? m+" min" : Math.floor(m/60)+" h "+String(m%60).padStart(2,"0"); }
function mmss(s){ s=Math.max(0,Math.round(s)); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }
/* avec deux haltères, la charge saisie est celle d'UN haltère : le tonnage compte les deux */
/* vrai quand la charge saisie est déjà celle d'un seul côté par nature :
   deux haltères = l'app compte déjà les deux. L'option « un côté à la fois » n'a alors aucun sens. */
function dejaParCote(exId){
  const ex = getEx(exId);
  return !!(ex && ex.equip==="Haltères" && !/haltère$|nuque/i.test(ex.name));
}
function facteurCharge(exId){
  if(dejaParCote(exId)) return 2;
  /* unilatéral : la charge saisie est celle d'un côté, on compte les deux */
  if(db.unilat && db.unilat[exId]) return 2;
  return 1;
}
function sessionVolume(sess){
  let v=0;
  sess.entries.forEach(en=>{
    const f = facteurCharge(en.exId);
    en.sets.forEach(st=>{ if(st.done && !st.warm) v += volSerie(st)*f; });
  });
  return v;
}
function lastPerf(exId){
  for(let i=db.history.length-1;i>=0;i--){
    const en = db.history[i].entries.find(e=>e.exId===exId);
    if(en){
      const sets = en.sets.filter(s=>s.done && !s.warm);
      if(sets.length) return {date:db.history[i].date, sets};
    }
  }
  return null;
}
function workSets(en){ return en.sets.filter(s=>!s.warm); }
/* tonnage d'une série, dégressifs compris : 6 x 12 kg puis 4 x 10 kg = 112 kg soulevés */
function volSerie(s){
  return (s.w||0)*(s.r||0) + ((s.drops||[]).reduce((a,d)=>a+(d.w||0)*(d.r||0),0));
}
function e1rm(w,r){ return r>1 ? w*(1+r/30) : w; }
/* kcal d'une séance de muscu : ~6 MET pendant la durée, ajusté par le volume soulevé */
function liftKcal(durMs, volume, nSeries){
  const kg = currentWeight() || (db.profile && db.profile.weight) || 75;
  const mesuree = Math.max(0, durMs/60000);
  /* si les séries ont été saisies après coup, la durée mesurée est ridicule :
     on retombe alors sur une estimation à partir du nombre de séries (~2,5 min chacune) */
  const estimee = (nSeries||0) * 2.5;
  const min = (estimee > 0 && mesuree < estimee*0.5) ? estimee : mesuree;
  const base = 6 * 3.5 * kg / 200 * min;       /* dépense liée à la durée d'effort */
  const travail = volume * 0.005;              /* travail mécanique du tonnage soulevé */
  return Math.round(base + travail);
}
function nbSeries(s){ return s.entries.reduce((n,en)=>n+en.sets.filter(x=>!x.warm).length,0); }
function parseReps(reps){
  const m = String(reps||"").match(/(\d+)(?:\D+(\d+))?/);
  if(!m) return null;
  const lo = parseInt(m[1]), hi = m[2]? parseInt(m[2]) : parseInt(m[1]);
  return {lo, hi:Math.max(lo,hi)};
}
/* charge bloquée : ni haltères plus lourds, ni lest disponible */
const REPS_PLAFOND = 25;                       /* au-delà, mieux vaut durcir le mouvement */
/* vrai seulement quand il n'y a physiquement rien à retirer : poids du corps sans lest.
   « Je n'ai pas de charge plus lourde » plafonne vers le haut, mais on peut toujours descendre. */
function sansChargeDuTout(exId, poidsSaisi){
  return estPoidsDuCorps(getEx(exId)) && !((poidsSaisi||0) > 0);
}
function chargeBloquee(exId){
  const ex = getEx(exId);
  return !!db.plafond[exId] || (estPoidsDuCorps(ex) && !db.plafond["libre:"+exId]);
}
/* une variante plus dure du même mouvement, prise dans la bibliothèque */
function varianteDure(exId){
  const ex = getEx(exId);
  const dures = {
    "Pompes":"Dips", "Dips":"Tractions", "Squat":"Fentes bulgares", "Fentes":"Fentes bulgares",
    "Fentes bulgares":"Hack squat", "Crunch":"Relevés de jambes", "Gainage":"Roulette abdominale",
    "Tractions":"Tractions lestées", "Curl haltères":"Curl incliné haltères", "Mollets debout":"Mollets debout une jambe"
  };
  const cible = dures[ex.name];
  if(cible && allEx().some(e=>e.name===cible)) return cible;
  return null;
}
/* que proposer quand la charge ne peut pas monter : reps -> série -> variante */
function progressionSansCharge(exId, repsActuelles, nbSeries){
  const v = varianteDure(exId);
  if(repsActuelles >= REPS_PLAFOND){
    return v ? {mode:"variante", cible:v, text:`Tu plafonnes à ${repsActuelles} reps — passe à « ${v} », plus dur à charge égale.`}
             : {mode:"tempo", text:`Tu plafonnes à ${repsActuelles} reps — ralentis la descente (3 s) et marque 2 s en bas plutôt que d'en rajouter.`};
  }
  if(repsActuelles >= REPS_PLAFOND - 5 && nbSeries < 5){
    return {mode:"serie", text:`Ajoute une série plutôt que des reps : tu es déjà à ${repsActuelles}.`};
  }
  return {mode:"reps", reps: repsActuelles + 2, text:`Vise ${repsActuelles+2} reps — et termine à une rep de l'échec.`};
}
function suggestFor(exId, target){
  const last = lastPerf(exId);
  if(!last || !last.sets.length) return null;
  const rng = parseReps(target && target.reps);
  if(!rng) return null;
  const maxW = Math.max(...last.sets.map(s=>s.w||0));
  const inc = maxW>=20? 2.5 : 1;
  const rirs = last.sets.map(s=>s.rir).filter(r=>r!==undefined && r!==null);
  const avgRir = rirs.length? rirs.reduce((a,b)=>a+b,0)/rirs.length : null;
  const allTop = last.sets.every(s=>(s.r||0)>=rng.hi);
  const anyBelow = last.sets.some(s=>(s.r||0)<rng.lo);
  /* charge bloquée (poids du corps, ou pas d'haltères plus lourds) : on progresse autrement */
  if(chargeBloquee(exId)){                    /* plafonné : on progresse en reps / séries / variante */
    const maxR = Math.max(...last.sets.map(s=>s.r||0));
    if(allTop || (avgRir!==null && avgRir>=3 && !anyBelow)){
      const pr = progressionSansCharge(exId, maxR, last.sets.length);
      return {mode:pr.mode, w:maxW, text:pr.text};
    }
    if(anyBelow && avgRir!==null && avgRir<0.5)
      return {mode:"hold", w:0, text:`Dernière fois tu étais à bout — reste sur ce nombre de reps jusqu'à ce que ça passe proprement.`};
    if(anyBelow)
      return {mode:"hold", w:0, text:`Continue à viser ${rng.lo} reps sur toutes les séries avant de charger.`};
    return {mode:"beat", w:0, text:`Essaie de gratter une répétition de plus sur la première série.`};
  }
  if(allTop || (avgRir!==null && avgRir>=3 && !anyBelow))
    return {mode:"up", w:maxW+inc, text: allTop
      ? `Toutes les séries à ${rng.hi} reps ou plus la dernière fois — passe à ${fmtKg(maxW+inc)} kg.`
      : `Trop facile la dernière fois (3+ reps en réserve) — passe à ${fmtKg(maxW+inc)} kg.`};
  if(anyBelow && avgRir!==null && avgRir<0.5)
    return {mode:"down", w:Math.max(0,maxW-inc), text:`Trop lourd la dernière fois — repars à ${fmtKg(Math.max(0,maxW-inc))} kg pour tenir ${rng.lo} reps.`};
  if(anyBelow)
    return {mode:"hold", w:maxW, text:`Reste à ${fmtKg(maxW)} kg jusqu'à faire ${rng.lo} reps sur toutes les séries.`};
  return {mode:"beat", w:maxW, text:`Garde ${fmtKg(maxW)} kg et essaie de gratter une rep de plus.`};
}

  sheet.addEventListener("touchstart", e=>{
    if(sheetVerrou){ y0 = null; return; }
    if(e.touches.length !== 1){ y0 = null; return; }
    if(sheet.scrollTop > 0){ y0 = null; return; }
    if(e.target.closest('input[type="range"], select, textarea')){ y0 = null; return; }
    if(zoneDefilante(e.target)){ y0 = null; return; }
    y0 = e.touches[0].clientY; dy = 0; glisse = false;
    sheet.style.transition = "none";
  }, {passive:true});
  sheet.addEventListener("touchmove", e=>{
    if(y0 === null) return;
    dy = e.touches[0].clientY - y0;
    if(dy <= 0){ if(glisse){ sheet.style.transform = ""; glisse = false; } return; }
    if(!glisse && dy < 8) return;
    glisse = true;
    sheet.style.transform = `translateY(${dy}px)`;
    e.preventDefault();
  }, {passive:false});
  const fin = ()=>{
    if(y0 === null) return;
    const assez = glisse && dy > 90;
    sheet.style.transition = "transform .2s ease";
    if(assez){
      sheet.style.transform = "translateY(100%)";
      setTimeout(()=>{ sheet.style.transform = ""; sheet.style.transition = ""; closeSheet(); }, 190);
    } else {
      sheet.style.transform = "";
    }
    y0 = null; dy = 0; glisse = false;
  };
  sheet.addEventListener("touchend", fin);
  sheet.addEventListener("touchcancel", fin);
})();

/* ================= REST TIMER ================= */
let rest = {end:0, total:0, int:null, paused:false, remaining:0, hideTo:null};
let audioCtx = null;
function ensureAudio(){ try{ if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==="suspended") audioCtx.resume(); }catch(e){} }
function beep(){
  if(!audioCtx) return;
  try{
    [0,.25,.5].forEach((t,i)=>{
      const o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.type="sine"; o.frequency.value = i===2? 1320: 880;
      g.gain.setValueAtTime(.001, audioCtx.currentTime+t);
      g.gain.exponentialRampToValueAtTime(.4, audioCtx.currentTime+t+.02);
      g.gain.exponentialRampToValueAtTime(.001, audioCtx.currentTime+t+.2);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(audioCtx.currentTime+t); o.stop(audioCtx.currentTime+t+.22);
    });
  }catch(e){}
}
const restbar = document.getElementById("restbar");
function startRest(sec){
  if(!sec || sec<=0) return;
  /* remise à zéro complète : rien de la minuterie précédente ne doit survivre */
  if(rest.int) clearInterval(rest.int);
  if(rest.hideTo) clearTimeout(rest.hideTo);
  rest.hideTo = null;
  rest.paused = false;
  rest.remaining = 0;
  rest.total = sec;
  rest.end = Date.now() + sec*1000;
  restbar.classList.add("show");
  restbar.classList.remove("ending", "paused");
  placerRest();
  document.getElementById("rest-lbl").textContent = "Repos";
  document.getElementById("rest-picon").textContent = "⏸";
  rest.int = setInterval(tickRest, 250);
  tickRest();
  if(!dejaVu("repos")){
    marquerVu("repos");
    setTimeout(()=>toast("Repos lancé — touche la barre pour la mettre en pause"), 500);
  }
}
function togglePauseRest(){
  if(!restbar.classList.contains("show")) return;
  if(rest.paused){
    rest.end = Date.now() + rest.remaining;
    rest.paused = false;
    restbar.classList.remove("paused");
    document.getElementById("rest-lbl").textContent = "Repos";
    document.getElementById("rest-picon").textContent = "⏸";
    if(rest.int) clearInterval(rest.int);
    rest.int = setInterval(tickRest, 250);
    tickRest();
  } else {
    rest.remaining = Math.max(0, rest.end - Date.now());
    rest.paused = true;
    restbar.classList.add("paused");
    document.getElementById("rest-lbl").textContent = "En pause";
    document.getElementById("rest-picon").textContent = "▶";
    if(rest.int) clearInterval(rest.int);
    rest.int = null;
  }
}
function tickRest(){
  const left = (rest.end - Date.now())/1000;
  if(left<=0){
    clearInterval(rest.int); rest.int=null;
    document.getElementById("rest-t").textContent="0:00";
    document.getElementById("rest-bar").style.width="0%";
    restbar.classList.add("ending");
    beep();
    if(navigator.vibrate) navigator.vibrate([200,100,200]);
    if(rest.hideTo) clearTimeout(rest.hideTo);
    rest.hideTo = setTimeout(()=>{ restbar.classList.remove("show","ending"); rest.hideTo=null; }, 1600);
    return;
  }
  document.getElementById("rest-t").textContent = mmss(left);
  document.getElementById("rest-bar").style.width = (left/rest.total*100)+"%";
}
document.getElementById("rest-skip").onclick=()=>{ if(rest.int) clearInterval(rest.int); rest.int=null; rest.paused=false; restbar.classList.remove("show","paused"); };
document.getElementById("rest-plus").onclick=()=>{ if(rest.paused){ rest.remaining+=15000; rest.total+=15; document.getElementById("rest-t").textContent=mmss(rest.remaining/1000); } else { rest.end+=15000; rest.total+=15; tickRest(); } };
document.getElementById("rest-minus").onclick=()=>{ if(rest.paused){ rest.remaining=Math.max(0,rest.remaining-15000); document.getElementById("rest-t").textContent=mmss(rest.remaining/1000); } else { rest.end-=15000; tickRest(); } };
restbar.addEventListener("click", e=>{
  if(e.target.closest("button")) return;
  if(Date.now() - restDrag.tFin < 350) return;    /* on vient de le déplacer, pas de pause */
  togglePauseRest();
});

/* le minuteur se déplace : relâché au-dessus du milieu il se cale en haut, en dessous il revient en bas */
const restDrag = {actif:false, bouge:false, y0:0, top0:0, tFin:0};
function placerRest(){ restbar.classList.toggle("haut", db.settings.restHaut === true); }
function restDragStart(y, cible){
  if(cible.closest("button")) return;
  const r = restbar.getBoundingClientRect();
  restDrag.actif = true; restDrag.bouge = false; restDrag.y0 = y; restDrag.top0 = r.top;
  restbar.classList.add("drag");
}
function restDragMove(y){
  if(!restDrag.actif) return;
  const dy = y - restDrag.y0;
  if(Math.abs(dy) > 4) restDrag.bouge = true;
  if(!restDrag.bouge) return;
  const h = restbar.offsetHeight;
  const top = Math.max(6, Math.min(window.innerHeight - h - 6, restDrag.top0 + dy));
  restbar.style.top = top + "px";
  restbar.style.bottom = "auto";
}
function restDragEnd(){
  if(!restDrag.actif) return;
  restDrag.actif = false;
  restbar.classList.remove("drag");
  if(!restDrag.bouge) return;
  restDrag.tFin = Date.now();
  restDrag.bouge = false;
  const r = restbar.getBoundingClientRect();
  const enHaut = (r.top + r.height/2) < window.innerHeight/2;
  db.settings.restHaut = enHaut;
  save();
  restbar.style.top = ""; restbar.style.bottom = "";
  placerRest();
  if(navigator.vibrate) navigator.vibrate(12);
}
restbar.addEventListener("touchstart", e=>{ restDragStart(e.touches[0].clientY, e.target); }, {passive:true});
restbar.addEventListener("touchmove", e=>{ if(restDrag.actif && restDrag.bouge) e.preventDefault(); restDragMove(e.touches[0].clientY); }, {passive:false});
["touchend","touchcancel"].forEach(ev=>restbar.addEventListener(ev, restDragEnd));
restbar.addEventListener("pointerdown", e=>{ if(e.pointerType==="touch") return; restDragStart(e.clientY, e.target); });
window.addEventListener("pointermove", e=>{ if(restDrag.actif && e.pointerType!=="touch") restDragMove(e.clientY); });
window.addEventListener("pointerup", e=>{ if(e.pointerType!=="touch") restDragEnd(); });
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden && rest.int) tickRest(); });

function basculerAliment(meal, label){
  const k = dayKey();

  if(db.dayFix[k]) delete db.dayFix[k];      /* la saisie manuelle reprend la main */
  save(); renderSurPlace();
}

  let mode = auPoids ? "poids" : "portion";

    document.getElementById("ma-lab").textContent = mode==="poids" ? `Quantité (${unite})` : "Nombre de portions";
    nEl.step = mode==="poids" ? 10 : 0.5;
    nEl.value = mode==="poids" ? gBase : 1;
    maj();
  });
  document.getElementById("ma-cancel").onclick = closeSheet;
  document.getElementById("ma-ok").onclick = ()=>{
    const f = facteur();
    if(!f) return;
    if(!db.habitSel[k]) db.habitSel[k] = {};
    let arr = (db.habitSel[k][meal]||[]).filter(x=>x!==label);
    let neuf;
    if(Math.abs(f-1) < 0.001) neuf = label;
    else if(mode === "poids")
      neuf = `${pa.nom} ${Math.round(gBase*f)} ${unite} (~${Math.round(prot*f)} g prot.${kcal? ` · ${Math.round(kcal*f)} kcal`:""})`;
    else
      neuf = `${pa.nom} ×${f.toLocaleString("fr-FR")} (~${Math.round(prot*f)} g prot.${kcal? ` · ${Math.round(kcal*f)} kcal`:""})`;
    db.habitSel[k][meal] = arr.concat(neuf);
    if(db.dayFix[k]) delete db.dayFix[k];
    save(); closeSheet(); render();
  };
  document.getElementById("ma-del").onclick = ()=>{
    if(grp){ demanderRetrait(label, grp); return; }
    if(db.habitSel[k]) db.habitSel[k][meal] = (db.habitSel[k][meal]||[]).filter(x=>x!==label);
    save(); closeSheet(); render();
  };

/* à quel groupe de propositions appartient cet aliment (null s'il est libre) */
function trouverGroupe(label){
  let cle = null;
  Object.keys(HB_OPTS).forEach(k=>{ if(HB_OPTS[k].some(x=>x[0]===label)) cle = cle || k; });
  if(cle) return cle;
  Object.keys(db.hbPerso||{}).forEach(ty=>{ if((db.hbPerso[ty]||[]).some(x=>x[0]===label)) cle = cle || "perso:"+ty; });
  return cle;
}

/* ================= CARDIO ================= */
function cardioKcal(km, min, pente, kg, courir){
  if(!km || !min || !kg) return 0;
  const vkmh = km/(min/60);
  const v = vkmh*1000/60;               /* m/min */
  const g = Math.max(0,(pente||0))/100;
  const run = (courir === undefined) ? vkmh >= 7 : !!courir;
  const vo2 = run ? 0.2*v + 0.9*v*g + 3.5 : 0.1*v + 1.8*v*g + 3.5;  /* ACSM, ml/kg/min */
  return vo2 * kg / 1000 * 5 * min;
}
/* Machines et activités. MET = coût énergétique (léger / modéré / intense), valeurs du Compendium. */
const MACHINES = [
  ["course",     "Marche / course", "🏃", null],
  ["velo",       "Vélo",            "🚴", [4.0, 6.8, 10.0]],
  ["rameur",     "Rameur",          "🚣", [4.8, 7.0, 10.0]],
  ["elliptique", "Elliptique",      "⚡", [4.6, 5.5, 8.0]],
  ["stepper",    "Stepper",         "🪜", [5.0, 7.0, 9.0]],
  ["corde",      "Corde à sauter",  "🪢", [8.8, 11.8, 12.3]],
  ["natation",   "Natation",        "🏊", [5.3, 7.0, 9.8]],
  ["autre",      "Autre",           "💪", [4.0, 6.0, 8.0]]
];
const INTENSITES = [["leger","Léger"],["modere","Modéré"],["intense","Intense"]];
function machineOf(c){ return MACHINES.find(m=>m[0]===(c && c.machine)) || MACHINES[0]; }
function machineNom(c){ const m = machineOf(c); return m[2]+" "+m[1]; }
/* kcal d'une machine : MET × 3,5 × poids / 200 × minutes */
function metKcal(c, kg){
  const m = machineOf(c);
  if(!m[3] || !c.min) return 0;
  const i = Math.max(0, INTENSITES.findIndex(x=>x[0]===(c.intensite||"modere")));
  return m[3][i] * 3.5 * kg / 200 * c.min;
}
/* marche, course ou mixte : le choix de l'utilisateur prime, sinon on devine d'après l'allure */
function cardioType(c){
  if(c && c.type) return c.type;
  return (c && c.km/(c.min/60) >= 7) ? "course" : "marche";
}
const CARDIO_VERBE = {marche:"marché", course:"couru", mixte:"marché et couru"};
const CARDIO_NOM   = {marche:"Marche", course:"Course", mixte:"Marche + course"};
/* kcal d'une sortie. Ordre de fiabilité : la montre, puis la fréquence cardiaque,
   puis le modèle ACSM — en séparant la part courue de la part marchée si la sortie est mixte. */
function sortieKcal(c, kg){
  if(c.kcalM > 0) return c.kcalM;
  if(c.hr > 0 && c.min > 0){
    /* La FC dit l'effort réel, quelle que soit l'alternance marche / course.
       FC max théorique (Tanaka) → % de VO2max → consommation d'oxygène → kcal. */
    const p = db.profile || {};
    const age = p.age || 30;
    const fcMax = 208 - 0.7*age;
    const pctVO2 = (c.hr/fcMax - 0.37) / 0.64;
    if(pctVO2 > 0.15){
      let vo2max = (p.sex === "f" ? 38 : 45) - Math.max(0, age-25)*0.25 + ((p.days||3) >= 4 ? 3 : 0);
      vo2max = Math.min(60, Math.max(25, vo2max));
      const vo2 = Math.min(1, pctVO2) * vo2max;          /* ml/kg/min */
      return vo2 * kg / 1000 * 5 * c.min;
    }
  }
  if(c.machine && c.machine !== "course") return metKcal(c, kg);
  const t = cardioType(c);
  if(t === "mixte" && c.runMin > 0 && c.runMin < c.min){
    /* on ne connaît que le temps couru : la distance se répartit au prorata des allures
       (on court environ 1,8 fois plus vite qu'on marche) */
    const tr = c.runMin, tw = c.min - tr;
    const kmRun = c.km * (1.8*tr) / (1.8*tr + tw);
    return cardioKcal(kmRun, tr, c.pente, kg, true) + cardioKcal(c.km-kmRun, tw, c.pente, kg, false);
  }
  return cardioKcal(c.km, c.min, c.pente, kg, t === "course");
}
/* d'où vient le chiffre affiché, pour être franc sur la précision */
function sourceKcal(c){
  if(c.kcalM > 0) return "d'après ta montre";
  if(c.hr > 0) return "d'après ta FC moyenne";
  if(c.machine && c.machine !== "course"){
    const lab = (INTENSITES.find(x=>x[0]===(c.intensite||"modere"))||INTENSITES[1])[1].toLowerCase();
    return `effort ${lab}`;
  }
  return cardioType(c) === "mixte" ? "en séparant marche et course" : "";
}
function weekStartDate(){
  const d = new Date(); d.setHours(0,0,0,0);
  d.setDate(d.getDate() - ((d.getDay()+6)%7));
  return d;
}
function cardioWeekStats(){
  const w0 = weekStartDate();
  const kg = currentWeight() || 75;
  const wk = db.cardio.filter(c=>new Date(c.date)>=w0);
  const km = wk.reduce((a,c)=>a+c.km,0);
  const kcal = wk.reduce((a,c)=>a+sortieKcal(c,kg),0);
  const types = wk.map(c=>cardioType(c));
  const ran = types.some(t=>t==="course"||t==="mixte");
  const walked = types.some(t=>t==="marche"||t==="mixte");
  const verb = ran && walked ? "marché / couru" : (ran ? "couru" : "marché");
  return {n:wk.length, km:Math.round(km*10)/10, kcal:Math.round(kcal), verb};
}
function motivPhrase(km){
  if(km<=0) return "Aucune sortie cette semaine — même 20 minutes de marche comptent. On enfile les baskets ? 👟";
  if(km<5)  return "C'est parti, chaque kilomètre compte ! 👏";
  if(km<15) return "Belle régularité, continue sur cette lancée 🔥";
  if(km<30) return "Grosse semaine — tes jambes te disent merci 💪";
  return "Machine ! Pense aussi à bien récupérer 😴";
}
function kcalEquiv(kcal){
  if(kcal<150) return "";
  const n = Math.round(kcal/270);
  return n>=1 ? ` — l'équivalent de ${n} pain${n>1?"s":""} au chocolat 🥐` : "";
}

/* « Poulet (150 g cuit) » ou « Œuf ×3 (~20 g prot. · 234 kcal) » -> nom, portion, protéines */
function partsAliment(label, prot){
  const net = (label||"").replace(/\s*\(~[^)]*\)\s*$/,"").trim();
  let nom = net, q = "";
  let m = net.match(/^(.*?)\s*\(([^()]+)\)\s*(?:×\s*([\d.,]+))?$/);
  if(m){ nom = m[1]; q = m[2]; if(m[3]) q += " ×"+m[3]; }
  else if((m = net.match(/^(.*?)\s*×\s*([\d.,]+)$/))){ nom = m[1]; q = "×"+m[2]; }
  else if((m = net.match(/^(.*?)\s+([\d.,]+\s*(?:g|ml|kg))$/i))){ nom = m[1]; q = m[2]; }
  /* « 150 g cuit » -> « 150 g » : la mention crue/cuite reste dans la fiche détaillée */
  const court = q.replace(/\s*(cuit(?:e|s|es)?|cru(?:e|s|es)?|égoutté(?:e|s|es)?)(?=\s|$)/gi,"")
                 .split(",")[0].replace(/\s+/g," ").trim();
  return {nom:nom.trim(), q:q.trim(), qCourt:court, prot:Math.round(prot)};
}

function weightVerdict(){
  if(!(db.settings.goal>0)) return {txt:"Renseigne ton profil pour recevoir des conseils adaptés à ton objectif.", tone:"mute"};
  const ws = db.weights.slice().sort((a,b)=>new Date(a.date)-new Date(b.date));
  if(ws.length<2) return {txt:"Note ton poids une fois par semaine — c'est la balance qui dira si tu manges assez.", tone:"mute"};
  const last = ws[ws.length-1];
  let refIdx = -1, refGap = Infinity;
  for(let i=ws.length-2;i>=0;i--){
    const days = (new Date(last.date)-new Date(ws[i].date))/864e5;
    if(days>=5 && Math.abs(days-7)<refGap){ refGap=Math.abs(days-7); refIdx=i; }
  }
  if(refIdx<0) return {txt:"Encore une pesée espacée d'une semaine et je pourrai juger ta progression.", tone:"mute"};
  const ref = ws[refIdx];
  const days = (new Date(last.date)-new Date(ref.date))/864e5;
  const rate = (last.kg-ref.kg)/days*7;
  const bulk = db.settings.goal >= last.kg;
  const r = Math.round(rate*100)/100;
  const rTxt = (r>0?"+":"")+r.toLocaleString("fr-FR")+" kg/sem";
  if(bulk){
    if(rate>=0.35) return {txt:`${rTxt} — ça monte vite, une partie sera du gras. Lève un peu le pied sur les extras.`, tone:"warn"};
    if(rate>=0.05) return {txt:`${rTxt} — c'est exactement le bon rythme, continue comme ça 💪`, tone:"good"};
    if(rate>-0.05) return {txt:`Poids stable — ajoute une collation ou un shake chaque jour cette semaine.`, tone:"warn"};
    return {txt:`${rTxt} — tu perds du poids, il faut manger nettement plus. Coche toutes les cases !`, tone:"bad"};
  }
  if(rate<=-0.05 && rate>-0.8) return {txt:`${rTxt} — bon rythme de perte, continue.`, tone:"good"};
  if(rate<=-0.8) return {txt:`${rTxt} — trop rapide, tu vas perdre du muscle. Mange un peu plus.`, tone:"warn"};
  return {txt:`Poids stable — pour perdre, réduis un peu les portions ou ajoute du cardio.`, tone:"warn"};
}
/* ===== Bilan hebdomadaire : analyse + conseils priorisés ===== */
function computeBilan(){
  const now = Date.now(), d7 = now-7*864e5, d14 = now-14*864e5, d28 = now-28*864e5;
  const cur = db.history.filter(s=>new Date(s.date).getTime()>=d7);
  const prev = db.history.filter(s=>{const t=new Date(s.date).getTime(); return t>=d14 && t<d7;});
  const volCur = cur.reduce((a,s)=>a+sessionVolume(s),0);
  const volPrev = prev.reduce((a,s)=>a+sessionVolume(s),0);
  /* force : meilleur 1RM estimé sur 7 j vs les 21 j précédents, par exercice */
  const ups=[], downs=[];
  const curBest={};
  cur.forEach(s=>s.entries.forEach(en=>{
    const sets = workSets(en);
    if(!sets.length) return;
    const b = Math.max(...sets.map(st=>e1rm(st.w||0,st.r||0)));
    if(b>(curBest[en.exId]||0)) curBest[en.exId]=b;
  }));
  Object.keys(curBest).forEach(exId=>{
    let pb=0;
    db.history.forEach(s=>{
      const t=new Date(s.date).getTime();
      if(t<d28||t>=d7) return;
      const en=s.entries.find(e=>e.exId===exId);
      if(en && workSets(en).length) pb=Math.max(pb, ...workSets(en).map(st=>e1rm(st.w||0,st.r||0)));
    });
    if(pb>0){
      const pct=(curBest[exId]-pb)/pb*100;
      if(pct>=2) ups.push(getEx(exId).name);
      else if(pct<=-3) downs.push(getEx(exId).name);
    }
  });
  const wv = weightVerdict();
  const kg = currentWeight()||74;
  const kmCur = db.cardio.filter(c=>new Date(c.date).getTime()>=d7).reduce((a,c)=>a+c.km,0);
  /* habitudes & protéines sur 7 j */
  /* un repas compte s'il contient au moins un aliment : l'ancien système de cases a disparu */
  let hbRemplis=0, protDays=0, protSum=0;
  for(let i=0;i<7;i++){
    const k=dayKey(now-i*864e5);
    const sel = db.habitSel[k] || {};
    hbRemplis += MEALS.filter(([id])=>(sel[id]||[]).length).length;
    if(Object.values(sel).some(a=>a && a.length)){ protDays++; protSum += dayProt(k); }
  }
  const hbPct = Math.round(hbRemplis/(7*MEALS.length)*100);
  const protAvg = protDays? Math.round(protSum/protDays) : null;
  const protTarget = Math.round(kg*1.9);
  const bulk = db.settings.goal >= kg;

  const prios=[], wins=[];
  if(wv.tone==="bad") prios.push(["Mange plus, c'est LA priorité", wv.txt+" Ajoute un shake (whey + lait + avoine + banane ≈ 600 kcal) chaque jour, sans exception."]);
  else if(wv.tone==="warn") prios.push([wv.txt.includes("vite")?"Lève un peu le pied sur les extras":(bulk?"Augmente un peu les apports":"Ajuste les apports"), wv.txt]);
  else if(wv.tone==="good") wins.push("Poids : "+wv.txt);
  if(cur.length<3) prios.push(["Remets de la régularité", `${cur.length} séance${cur.length>1?"s":""} de muscu sur 7 jours — vise 3 à 4. C'est le volume d'entraînement qui déclenche la prise de muscle.`]);
  else wins.push(`${cur.length} séances cette semaine — la régularité est là.`);
  if(downs.length>=2) prios.push(["Charges en baisse : récupère", `Tu as baissé sur ${downs.slice(0,3).join(", ")}. Souvent un signe de fatigue : vérifie ton sommeil, respecte les repos longs, et si ça persiste une semaine de charges légères relance la machine.`]);
  else if(downs.length===1) prios.push(["Un exercice en baisse", `${downs[0]} a reculé — regarde si c'est la fatigue ou la technique.`]);
  if(ups.length) wins.push(`Tu as progressé sur ${ups.slice(0,3).join(", ")}${ups.length>3?"…":""} 💪`);
  if(hbPct<60) prios.push(["Coche tes repas", `${hbPct} % de tes repas renseignés cette semaine. Même sans compter les calories, la checklist te tient — remplis-la chaque jour.`]);
  else if(hbPct>=80) wins.push(`Alimentation suivie à ${hbPct} % — solide.`);
  if(protAvg!==null && protAvg < protTarget*0.7) prios.push(["Monte les protéines", `≈ ${protAvg} g/jour en moyenne, l'objectif est ${protTarget} g. Le plus simple : whey + lait à la collation, et une vraie portion de viande/poisson à chaque repas.`]);
  else if(protAvg!==null && protAvg>=protTarget*0.9) wins.push(`Protéines ≈ ${protAvg} g/j en moyenne — dans la cible.`);
  if(bulk && kmCur>25) prios.push(["Cardio généreux pour une prise de masse", `${fmtKg(kmCur)} km cette semaine : c'est très bien pour le cœur, mais ça creuse ton déficit. Compense par une collation de plus les jours de sortie.`]);
  else if(kmCur>0) wins.push(`${fmtKg(kmCur)} km de cardio — le cœur suit.`);
  if(volCur && volPrev) {
    const dv = Math.round((volCur-volPrev)/volPrev*100);
    if(dv<=-20) prios.push(["Volume en baisse", `${Math.abs(dv)} % de tonnage en moins que la semaine passée (${fmtKg(volCur)} vs ${fmtKg(volPrev)} kg).`]);
    else if(dv>=10) wins.push(`Tonnage en hausse de ${dv} % (${fmtKg(volCur)} kg soulevés).`);
  }
  if(!prios.length) prios.push(["Continue exactement comme ça", "Aucun point faible détecté cette semaine. Le seul conseil : ne change rien, la constance fait le reste."]);
  return {cur:cur.length, volCur, volPrev, kmCur, wv, prios:prios.slice(0,3), wins:wins.slice(0,4)};
}

function suggestedTemplate(){
  if(!db.templates.length) return null;
  let best=null, bestDate=Infinity;
  db.templates.forEach(t=>{
    const last = db.history.slice().reverse().find(h=>h.templateId===t.id || h.name===t.name);
    const d = last? new Date(last.date).getTime() : -1;
    if(d < bestDate){ bestDate=d; best=t; }
  });
  return best;
}
/* photo d'ambiance d'une séance : choisie sur le nom, sinon sur les muscles travaillés */
const PHOTOS = ["push","pull","jambes","abdos","cardio"];
/* la photo suit d'abord les exercices choisis, le nom ne sert que de repli */
function photoSeance(t){
  if(t && t.photo && PHOTOS.includes(t.photo)) return t.photo;
  const score = {push:0, pull:0, jambes:0, abdos:0};
  ((t && t.items) || []).forEach(it=>{
    const ex = getEx(it.exId);
    const m = (ex.muscle || "").toLowerCase();
    if(/pector|épaul|epaul|triceps/.test(m)) score.push++;
    else if(/dos|biceps/.test(m)) score.pull++;
    else if(/jambe|fessier|mollet/.test(m)) score.jambes++;
    else if(/abdo|gainage/.test(m)) score.abdos++;
  });
  const total = score.push + score.pull + score.jambes + score.abdos;
  if(total){
    const best = Object.keys(score).sort((a,b)=>score[b]-score[a])[0];
    /* une majorité nette (au moins 40 % des exercices) suffit à choisir la photo */
    if(score[best] / total >= 0.4) return best;
  }
  const n = ((t && t.name) || "").toLowerCase();
  if(/push|poussée|pousse|pec|torse/.test(n)) return "push";
  if(/pull|tirage|dos/.test(n)) return "pull";
  if(/jambe|leg|cuisse|fessier|squat/.test(n)) return "jambes";
  if(/abdo|gainage|core|ceinture/.test(n)) return "abdos";
  if(/cardio|course|run|hiit|marche/.test(n)) return "cardio";
  return "push";
}

/* ================= « PROPOSE-MOI » : génération de séances =================
   Un moule décrit les rôles d'une séance (pectoraux lourd, dos horizontal…).
   Chaque rôle a plusieurs exercices interchangeables : on en tire un au sort en
   évitant ceux déjà faits cette semaine, pour que deux propositions ne se ressemblent pas. */
const RESERVOIRS = {
  pecLourd:  ["Développé couché","Développé incliné barre","Développé couché haltères","Développé incliné haltères","Développé machine","Développé couché à la Smith"],
  pecComp:   ["Écartés poulie","Butterfly (pec deck)","Écartés haltères","Écartés poulie haute","Dips","Pompes"],
  epaule:    ["Développé militaire","Développé militaire haltères","Arnold press","Développé machine épaules"],
  epauleIso: ["Élévations latérales","Élévations latérales poulie","Élévations frontales"],
  triceps:   ["Extension poulie","Extension poulie corde","Barre au front","Extension nuque haltère","Extension triceps machine","Pompes diamant","Kickback poulie"],
  dosVert:   ["Tractions","Tirage vertical","Tirage vertical prise neutre"],
  dosHoriz:  ["Rowing barre","Rowing haltère","Tirage horizontal","Rowing machine","Rowing T-bar","Tractions australiennes"],
  dosComp:   ["Pull-over poulie","Haussements d'épaules","Tirage horizontal","Rowing haltère"],
  arriere:   ["Face pull","Oiseau","Rowing menton"],
  biceps:    ["Curl barre","Curl haltères","Curl marteau","Curl pupitre","Curl poulie basse","Curl incliné haltères","Curl concentration"],
  quadLourd: ["Squat","Front squat","Goblet squat","Hack squat","Presse à cuisses"],
  posterieur:["Soulevé de terre roumain","Soulevé de terre","Good morning","Hip thrust","Soulevé de terre sumo"],
  uniJambe:  ["Fentes","Fentes bulgares","Montées sur banc","Presse à cuisses","Leg extension"],
  ischio:    ["Leg curl","Kickback fessier poulie","Abducteurs machine","Adducteurs machine"],
  mollets:   ["Mollets debout","Mollets assis"],
  abdos:     ["Crunch","Gainage","Relevés de jambes","Crunch câble","Russian twist","Roulette abdominale","Planche latérale","Mountain climber"]
};
/* rôles à faible charge : plus de répétitions, moins de repos */
const ROLES_LEGERS = ["epauleIso","arriere","mollets","abdos","dosComp","triceps","biceps","ischio"];
const MOULES = {
  push:   {nom:"Push",           sous:"Pectoraux, épaules, triceps", roles:["pecLourd","pecComp","epaule","epauleIso","triceps"]},
  pull:   {nom:"Pull",           sous:"Dos et biceps",               roles:["dosVert","dosHoriz","dosComp","arriere","biceps"]},
  jambes: {nom:"Jambes",         sous:"Cuisses, fessiers, mollets",  roles:["quadLourd","posterieur","uniJambe","ischio","mollets","abdos"]},
  haut:   {nom:"Haut du corps",  sous:"Tout le buste en une fois",   roles:["pecLourd","dosHoriz","epaule","dosVert","biceps","triceps"]},
  bas:    {nom:"Bas du corps",   sous:"Jambes, fessiers et gainage", roles:["quadLourd","posterieur","uniJambe","mollets","abdos"]},
  full:   {nom:"Full body",      sous:"Tout le corps en une séance", roles:["quadLourd","pecLourd","dosHoriz","epauleIso","abdos"]}
};
const MUSCLES_TYPE = {
  push:["Pectoraux","Épaules","Triceps"], pull:["Dos","Biceps"], jambes:["Jambes"],
  haut:["Pectoraux","Dos","Épaules"], bas:["Jambes"], full:["Jambes","Pectoraux","Dos"]
};
/* séries, répétitions et repos selon l'objectif */
const DOSES = {
  masse:     {lourd:{s:4, r:"8-12", p:150}, moyen:{s:3, r:"8-12", p:120}, leger:{s:3, r:"12-15", p:75}},
  seche:     {lourd:{s:3, r:"10-15", p:90}, moyen:{s:3, r:"10-15", p:75}, leger:{s:3, r:"15-20", p:50}},
  force:     {lourd:{s:5, r:"4-6",  p:210}, moyen:{s:4, r:"6-8",  p:150}, leger:{s:3, r:"10-12", p:75}},
  recomp:    {lourd:{s:4, r:"8-12", p:120}, moyen:{s:3, r:"8-12", p:105}, leger:{s:3, r:"12-15", p:60}},
  entretien: {lourd:{s:3, r:"8-12", p:120}, moyen:{s:3, r:"8-12", p:90},  leger:{s:3, r:"12-15", p:60}}
};
/* les types de séance qui ont du sens pour ce nombre de séances par semaine */
function typesProposables(){
  const j = (db.profile && db.profile.days) || 3;
  if(j <= 2) return ["full","haut","bas"];
  if(j === 3) return ["full","haut","bas","push","pull","jambes"];
  if(j === 4) return ["haut","bas","push","pull","jambes","full"];
  return ["push","pull","jambes","haut","bas","full"];
}
/* exercices déjà faits ces derniers jours : on préfère en proposer d'autres */
function exercicesRecents(jours){
  const limite = Date.now() - (jours||7)*864e5;
  const noms = new Set();
  (db.history||[]).forEach(h=>{
    if(new Date(h.date).getTime() < limite) return;
    (h.entries||[]).forEach(en=>{ const ex = getEx(en.exId); if(ex && ex.name) noms.add(ex.name); });
  });
  return noms;
}
/* dernière fois que ce type de séance a été travaillé, en jours (null = jamais) */
function joursDepuisType(type){
  const cibles = MUSCLES_TYPE[type] || [];
  let recent = null;
  (db.history||[]).forEach(h=>{
    const touche = (h.entries||[]).some(en=>cibles.includes((getEx(en.exId)||{}).muscle));
    if(!touche) return;
    const t = new Date(h.date).getTime();
    if(recent === null || t > recent) recent = t;
  });
  return recent === null ? null : Math.floor((Date.now() - recent)/864e5);
}
/* le type le plus en retard parmi ceux qui conviennent au profil */
function typeQuiManque(){
  const types = typesProposables();
  let meilleur = types[0], score = -1;
  types.forEach(t=>{
    const j = joursDepuisType(t);
    const v = (j === null) ? 999 : j;
    if(v > score){ score = v; meilleur = t; }
  });
  return {type:meilleur, jours:joursDepuisType(meilleur)};
}
function melanger(arr){
  const a = arr.slice();
  for(let i=a.length-1; i>0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; }
  return a;
}
/* génère une séance : un exercice par rôle, sans doublon, en évitant le récent et le risqué */
function genererSeance(type, evites){
  const moule = MOULES[type] || MOULES.full;
  const recents = exercicesRecents(6);
  const bannis = new Set(evites || []);
  const dose = DOSES[(db.profile && db.profile.aim) || "masse"] || DOSES.masse;
  const items = [];
  moule.roles.forEach((role, n)=>{
    const pool = melanger(RESERVOIRS[role] || []).filter(nom=>libId(nom) && !items.some(it=>it.nom===nom));
    if(!pool.length) return;
    /* 1er choix : ni banni, ni récent, ni déconseillé par une blessure. Puis on relâche. */
    const sain = nom => !injuryNote(nom);
    const choisi = pool.find(n2=>!bannis.has(n2) && !recents.has(n2) && sain(n2))
                || pool.find(n2=>!bannis.has(n2) && sain(n2))
                || pool.find(n2=>!recents.has(n2))
                || pool[0];
    const niveau = ROLES_LEGERS.includes(role) ? "leger" : (n === 0 ? "lourd" : "moyen");
    const d = dose[niveau];
    items.push({nom:choisi, sets:d.s, reps:d.r, rest:d.p, role});
  });
  return {type, nom:moule.nom, sous:moule.sous, items};
}
/* nom unique, pour ne pas écraser une séance existante */
function nomLibre(base){
  if(!db.templates.some(t=>t.name === base)) return base;
  for(let n=2; n<40; n++){ const c = `${base} ${n}`; if(!db.templates.some(t=>t.name === c)) return c; }
  return `${base} ${Date.now().toString(36)}`;
}
function enregistrerProposition(prop){
  const tpl = {
    id: uid(),
    name: nomLibre(`${prop.nom} · ${aimOf((db.profile&&db.profile.aim)||"masse").label}`),
    items: prop.items.map(it=>({exId:libId(it.nom), sets:it.sets, reps:it.reps, rest:it.rest})).filter(it=>it.exId)
  };
  db.templates.push(tpl);
  save();
  return tpl;
}

/* aperçu d'une proposition, avec la possibilité d'en redemander une autre */
function apercuProposition(type, evites){
  const prop = genererSeance(type, evites);
  const dejaVus = (evites || []).concat(prop.items.map(it=>it.nom));
  const total = prop.items.reduce((a,it)=>a+it.sets, 0);

  openSheet(`<h3 style="text-align:center;">${esc(prop.nom)}</h3>
    <p style="margin:0 0 12px; font-size:13px; color:var(--ink-soft); text-align:center;">
      ${esc(prop.sous)} · ${prop.items.length} exercices · ${total} séries · ~${minutes} min</p>
    <div class="stack" style="gap:7px; margin-bottom:14px;">
      ${prop.items.map(it=>{
        const bless = injuryNote(it.nom);

            <div style="min-width:0;">

        </div>`;
      }).join("")}
    </div>
    <button class="btn btn-accent" id="pp-add" style="width:100%; margin-bottom:8px;">Ajouter à mes séances</button>
    <button class="btn" id="pp-go" style="width:100%; margin-bottom:8px;">Ajouter et démarrer maintenant</button>

    <button class="btn btn-ghost" id="pp-back" style="width:100%;">Retour</button>`);
  /* ↻ sur une ligne : on ne rejoue que cet exercice */
  document.querySelectorAll("[data-ppswap]").forEach(b=>b.onclick=()=>{
    apercuProposition(type, (evites||[]).concat(b.dataset.ppswap));

function startWorkout(tplId){
  const tpl = tplId ? db.templates.find(t=>t.id===tplId) : null;
  const entries = tpl ? tpl.items.map(it=>{
    const last = lastPerf(it.exId);
    const sug = suggestFor(it.exId, it);
    const rng = parseReps(it.reps);
    const sets = [];
    for(let i=0;i<it.sets;i++){
      const ls = last && last.sets[Math.min(i,last.sets.length-1)];
      const w = sug && (sug.mode==="up"||sug.mode==="down") ? sug.w : (ls? ls.w:"");
      const r = sug && (sug.mode==="up"||sug.mode==="down") ? (rng? rng.lo:"") : (ls? ls.r : (rng? rng.lo:""));
      sets.push({w, r, done:false});
    }
    return {exId:it.exId, target:it, sets};
  }) : [];
  /* série d'échauffement sur le premier exercice */
  if(entries.length){
    entries[0].sets.unshift(serieEchauffement(entries[0].exId, entries[0].target && entries[0].target.reps));
  }
  db.active = {name: tpl? tpl.name : "Séance libre", templateId:tplId, start:Date.now(), entries};
  save(); render();
}

/* durée réellement écoulée, pauses déduites */
function dureeSeance2(a){
  const fin = a.pauseAt || Date.now();
  return Math.max(0, fin - a.start - (a.pauseTotal||0));
}
function basculerChrono(a){
  if(a.pauseAt){
    a.pauseTotal = (a.pauseTotal||0) + (Date.now() - a.pauseAt);
    a.pauseAt = null;
    toast("Chrono relancé");
  } else {
    a.pauseAt = Date.now();
    toast("Chrono en pause");
  }
  save();
}
/* toute validation de série relance le chrono : on n'oublie pas de le remettre en marche */
function reprendreChrono(a){
  if(a && a.pauseAt){
    a.pauseTotal = (a.pauseTotal||0) + (Date.now() - a.pauseAt);
    a.pauseAt = null;
    save();
  }
}

              <button data-rir="1">1-2</button>
              <button data-rir="3">3-5+</button>
            </div>
            <button class="rir-lourd" data-rir="-1">C'était trop lourd — baisse la charge</button>`;
          /* la question se place sous la série, dégressifs compris */
          let ancre = row, nx = row.nextElementSibling;
          while(nx && nx.classList.contains("drop")){ ancre = nx; nx = nx.nextElementSibling; }
          ancre.after(ask);
          ask.querySelectorAll("[data-rir]").forEach(b=>b.onclick=()=>{
            const rir = parseInt(b.dataset.rir);
            st.rir = rir < 0 ? 0 : rir;        /* « trop lourd » = tu étais à bout : 0 rep en réserve */
            if(!dejaVu("rir")) marquerVu("rir");
            const rng = parseReps(en.target && en.target.reps) || {lo:8, hi:12};
            const next = en.sets.find(s=>!s.done && !s.warm);   /* jamais l'échauffement */
            const inc = (st.w||0)>=20? 2.5 : 1;
            /* applique une valeur à toutes les séries restantes, pas seulement à la suivante */
            const appliquerSuite = (champ, valeur)=>{
              en.sets.forEach((s2,j)=>{
                if(s2.done || s2.warm) return;
                s2[champ] = valeur;
                const l = setsDiv.querySelector('.set-row[data-si="'+j+'"]');
                const inp = l && l.querySelectorAll("input")[champ==="w"?0:1];
                if(inp) inp.value = (valeur===""? "" : valeur);
              });
              save();
            };
            const plafonne = chargeBloquee(en.exId);          /* ne peut pas monter en charge */
            const rienARetirer = sansChargeDuTout(en.exId, st.w); /* ne peut pas descendre non plus */
            let msg;
            if(rir === -1){
              /* trop lourd : on descend la charge en gardant les répétitions visées.
                 Le plafond ne concerne que la montée — descendre est toujours possible. */
              if(rienARetirer){
                const nr = Math.max(1, Math.round((st.r||0)*0.8));
                msg = `Trop lourd — vise ${nr} reps sur les séries suivantes, la qualité prime.`;
                if(next) appliquerSuite("r", nr);
              } else {
                const bas = Math.max(0, Math.round(((st.w||0) - Math.max(inc, (st.w||0)*0.08))*2)/2);
                const cible = Math.max(st.r||0, rng.lo);
                msg = next ? `Trop lourd — séries suivantes à ${fmtKg(bas)} kg, on garde ${cible} reps.`
                            : `Trop lourd — repars de ${fmtKg(bas)} kg à la prochaine séance.`;
                if(next){ appliquerSuite("w", bas); appliquerSuite("r", cible); }
              }
            } else if(rir>=3){
              if(plafonne){
                const pr = progressionSansCharge(en.exId, st.r||0, en.sets.filter(x=>!x.warm).length);
                msg = `Trop léger — ${pr.text.charAt(0).toLowerCase()}${pr.text.slice(1)}`;
                if(next && pr.mode==="reps") appliquerSuite("r", pr.reps);
              } else {
                const nw = (st.w||0)+inc;
                msg = next ? `Trop léger — séries suivantes à ${fmtKg(nw)} kg.`
                            : `Trop léger — passe à ${fmtKg(nw)} kg à la prochaine séance.`;
                if(next) appliquerSuite("w", nw);
              }
            } else if(rir===0 && (st.r||0) < rng.lo){
              if(rienARetirer){
                const nr = Math.max(1,(st.r||0)-1);
                msg = next ? `Trop dur — vise ${nr} reps sur les séries suivantes, la qualité prime.`
                            : `Trop dur — reste sur ce nombre de reps jusqu'à ce que ça passe proprement.`;
                if(next) appliquerSuite("r", nr);
              } else {
                const nw = Math.max(0,(st.w||0)-inc);
                if(next) appliquerSuite("r", Math.max(st.r||0, rng.lo));
                msg = next ? `Trop lourd — séries suivantes à ${fmtKg(nw)} kg.`
                            : `Trop lourd — garde cette charge la prochaine fois, elle viendra.`;
                if(next) appliquerSuite("w", nw);
              }
            } else if(rir===0){
              /* à la limite : on garde exactement ce que tu viens de faire */
              if(next && !sansCharge) appliquerSuite("w", st.w);
              msg = sansCharge ? "À la limite — c'est exactement là qu'il faut être."
                                : (next ? `À la limite — on reste à ${fmtKg(st.w||0)} kg sur les séries suivantes.`
                                        : "À la limite — garde cette charge, c'est du bon travail.");
            } else {
              /* zone idéale : les séries suivantes reprennent la charge qui vient de fonctionner */
              if(next && !sansCharge) appliquerSuite("w", st.w);
              msg = next ? `Parfait — on reste à ${fmtKg(st.w||0)} kg, pile la bonne zone.`
                          : "Parfait — c'est noté pour ta prochaine séance.";
            }
            save();
            ask.innerHTML = `<div class="q ok">${esc(msg)}</div>`;
            setTimeout(()=>{ ask.remove(); }, 2600);
          });
        }
      };
      /* ajouter une ligne à charge réduite : bouton ↓ ou menu d'appui long */
      const ajouterDrop = ()=>{
        const inc = (st.w||0)>=20? 2.5 : 1;
        const dernier = (st.drops && st.drops.length)? st.drops[st.drops.length-1] : st;
        if(!st.drops) st.drops = [];
        st.drops.push({w: Math.max(0, (dernier.w||0)-inc), r: ""});
        save(); renderSurPlace();
      };
      const dgBtn = row.querySelector(".dg");
      if(dgBtn) dgBtn.onclick = ajouterDrop;
      /* appui long sur la ligne : menu de la série (dégressif, suppression) */
      let sTimer = null, sLong = false;
      const ouvrirMenu = ()=>{
        sLong = true;
        if(navigator.vibrate) navigator.vibrate(18);
        openSheet(`<h3>${st.warm? "Série d'échauffement" : "Série "+num}</h3>
          <div class="stack">
            <button class="btn btn-accent" id="ms-drop">＋ Ajouter un dégressif</button>
            <div style="font-size:12.5px; color:var(--ink-mute); line-height:1.55;">Tu as baissé la charge pour finir la série ? Ajoute une ligne : <b>6 × 12 kg puis 4 × 10 kg</b> compte comme une seule série, et les 112 kg soulevés partent bien dans ton tonnage.</div>
            ${en.sets.length>1? `<button class="btn btn-ghost" id="ms-del" style="color:var(--bad);">Supprimer cette série</button>`:""}
          </div>`);
        document.getElementById("ms-drop").onclick = ()=>{ closeSheet(); ajouterDrop(); };
        const sup = document.getElementById("ms-del");
        if(sup) sup.onclick = ()=>{ en.sets.splice(si,1); save(); closeSheet(); renderSurPlace(); };
      };
      const lgStart = e=>{
        if(e.target.closest("input") || e.target.closest("button")) return;
        sLong = false; clearTimeout(sTimer);
        sTimer = setTimeout(ouvrirMenu, 550);
      };
      const lgStop = ()=>clearTimeout(sTimer);
      row.addEventListener("touchstart", lgStart, {passive:true});
      ["touchend","touchmove","touchcancel"].forEach(ev=>row.addEventListener(ev, lgStop));
      row.addEventListener("mousedown", lgStart); row.addEventListener("mouseup", lgStop); row.addEventListener("mouseleave", lgStop);
      row.oncontextmenu = e=>{ e.preventDefault(); if(!e.target.closest("input")) ouvrirMenu(); };
      setsDiv.appendChild(row);
      /* lignes dégressives : même série, charge plus basse */
      (st.drops||[]).forEach((d,di)=>{
        const dr = document.createElement("div");
        dr.className = "set-row drop"+(st.done?" done":"");
        dr.innerHTML = `<div class="n">↳</div>
          <input type="number" inputmode="decimal" step="0.5" min="0" placeholder="kg" value="${d.w!==""&&d.w!=null?d.w:""}">
          <input type="number" inputmode="numeric" min="0" placeholder="reps" value="${d.r!==""&&d.r!=null?d.r:""}">
          <span></span>
          <button class="ck" title="Retirer ce dégressif">✕</button>`;
        const [dw, dq] = dr.querySelectorAll("input");
        dw.oninput = ()=>{ d.w = dw.value===""?"":parseFloat(dw.value); save(); };
        dq.oninput = ()=>{ d.r = dq.value===""?"":parseInt(dq.value); save(); };
        dr.querySelector(".ck").onclick = ()=>{
          st.drops.splice(di,1);
          if(!st.drops.length) delete st.drops;
          save(); renderSurPlace();
        };
        setsDiv.appendChild(dr);
      });
    });
    card.querySelector('[data-act="addset"]').onclick=()=>{
      const prev = en.sets[en.sets.length-1];
      en.sets.push({w: prev? prev.w:"", r: prev? prev.r:"", done:false});
      save(); renderSurPlace();
    };
    const delSet = card.querySelector('[data-act="delset"]');
    if(delSet) delSet.onclick=()=>{
      /* on retire la dernière série de travail ; l'échauffement n'est jamais concerné */
      let i = -1;
      for(let j=en.sets.length-1; j>=0; j--){ if(!en.sets[j].warm){ i = j; break; } }
      if(i < 0 || en.sets.filter(x=>!x.warm).length <= 1) return;
      const st = en.sets[i];
      const retirer = ()=>{ en.sets.splice(i,1); save(); renderSurPlace(); };
      if(st.done) askConfirm("Supprimer la dernière série ?",
        `${fmtKg(st.w||0)} kg × ${st.r||0} reps sera retirée de cette séance.`, "Supprimer", true, retirer);
      else retirer();
    };
    wireHints(card);
    card.querySelectorAll("[data-exinfo]").forEach(b=>b.onclick=(e)=>{ e.stopPropagation(); openExoInfo(b.dataset.exinfo); });
    const hx = card.querySelector("[data-hist-ex]");
    if(hx) hx.onclick = (e)=>{ e.stopPropagation(); openHistoExo(parseInt(hx.dataset.histEx)); };
    const bl = card.querySelector("[data-injinfo]");
    if(bl) bl.onclick = (e)=>{ e.stopPropagation(); openBlessureExo(parseInt(bl.dataset.injinfo)); };
    card.querySelector('[data-act="swap"]').onclick=()=>openSwap(ei);
    card.querySelector('[data-act="delex"]').onclick=()=>{
      askConfirm("Retirer l'exercice ?", ex.name+" sera retiré de cette séance (les autres exercices sont conservés).", "Retirer", true, ()=>{
        a.entries.splice(ei,1); save(); render();
      });
    };
    list.appendChild(card);
  });

  document.getElementById("add-ex").onclick=()=>openPicker(exId=>{
    const last = lastPerf(exId);
    const ls = last? last.sets[0] : null;
    a.entries.push({exId, target:{sets:4, reps:"", rest:db.settings.rest}, sets:[{w:ls?ls.w:"", r:ls?ls.r:"", done:false}]});
    save(); closeSheet(); render();
  });
  document.getElementById("cancel-w").onclick=()=>askConfirm("Annuler la séance ?","Tout ce que tu as saisi dans cette séance sera perdu.","Oui, annuler",true,()=>{ db.active=null; save(); render(); });
  document.getElementById("finish-w").onclick=()=>{
    const doneSets = a.entries.reduce((n,en)=>n+en.sets.filter(s=>s.done && !s.warm).length,0);
    if(!doneSets){ askConfirm("Aucune série validée","Valide au moins une série (bouton ○) avant de terminer, ou annule la séance.","OK",false,()=>{}); return; }
    const vol = a.entries.reduce((v,en)=>{ const f=facteurCharge(en.exId); return v+en.sets.reduce((x,s)=>x+((s.done&&!s.warm)?volSerie(s)*f:0),0); },0);
    const kcal = liftKcal(dureeSeance2(a), vol, doneSets);
    askConfirm("Terminer la séance ?", `${doneSets} séries validées · ${fmtKg(vol)} kg soulevés · environ ${kcal} kcal brûlées. On enregistre ?`, "Enregistrer", false, ()=>{
      /* le récapitulatif se calcule AVANT d'ajouter la séance, sinon elle se compare à elle-même */
      const recap = {
        nom: a.name, series: doneSets, volume: Math.round(vol), kcal,
        duree: dureeSeance2(a), exos: a.entries.length,
        records: nouveauxRecords(a)
      };
      db.history.push({
        id:uid(), date:new Date().toISOString(), name:a.name, templateId:a.templateId,
        start:a.start, end:a.start + dureeSeance2(a),
        entries:a.entries.map(en=>({exId:en.exId, sets:en.sets.filter(s=>s.done).map(s=>({w:s.w||0, r:s.r||0, done:true, warm:!!s.warm, rir:(s.rir===undefined?null:s.rir), drops:(s.drops&&s.drops.length? s.drops.map(d=>({w:d.w||0, r:d.r||0})) : undefined)}))})).filter(en=>en.sets.length)
      });
      db.active=null; save(); render();
      setTimeout(()=>openFinSeance(recap), 260);
    });
  };
}
/* records battus pendant la séance : meilleur 1RM estimé face à tout l'historique précédent */
function nouveauxRecords(a){
  const out = [];
  a.entries.forEach(en=>{
    const sets = en.sets.filter(s=>s.done && !s.warm);
    if(!sets.length) return;
    const best = Math.max(...sets.map(st=>e1rm(st.w||0, st.r||0)));
    if(!(best>0)) return;
    let avant = 0;
    db.history.forEach(h=>h.entries.forEach(e2=>{
      if(e2.exId !== en.exId) return;
      e2.sets.filter(s=>!s.warm).forEach(st=>{ avant = Math.max(avant, e1rm(st.w||0, st.r||0)); });
    }));
    if(best > avant*1.005 && avant > 0) out.push({nom:getEx(en.exId).name, gain:Math.round((best-avant)*10)/10});
    else if(best > 0 && avant === 0) out.push({nom:getEx(en.exId).name, gain:0});
  });
  return out;
}
/* confettis : quelques centaines de rectangles qui retombent, sans bibliothèque */
function confettis(canvas, duree){
  const ctx = canvas.getContext("2d");
  const dpr = Math.min(2, window.devicePixelRatio||1);
  const W = canvas.clientWidth, H = canvas.clientHeight;
  canvas.width = W*dpr; canvas.height = H*dpr; ctx.scale(dpr,dpr);
  const coul = ["#f58220","#4caf50","#3ca0e8","#f2506e","#ffd166","#ffffff"];
  const bouts = [];
  for(let i=0;i<110;i++) bouts.push({
    x: Math.random()*W, y: -20 - Math.random()*H*0.6,
    l: 5+Math.random()*6, h: 8+Math.random()*8,
    vy: 60+Math.random()*90, vx: (Math.random()-0.5)*50,
    rot: Math.random()*Math.PI, vr: (Math.random()-0.5)*6,
    c: coul[(Math.random()*coul.length)|0]
  });
  let t0 = null, stop = false;
  const boucle = t=>{
    if(stop) return;
    if(t0===null) t0 = t;
    const dt = 1/60, ecoule = t - t0;
    ctx.clearRect(0,0,W,H);
    bouts.forEach(b=>{
      b.x += b.vx*dt; b.y += b.vy*dt; b.rot += b.vr*dt; b.vy += 22*dt;
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.rot);
      ctx.fillStyle = b.c; ctx.globalAlpha = Math.max(0, 1 - ecoule/duree);
      ctx.fillRect(-b.l/2, -b.h/2, b.l, b.h); ctx.restore();
    });
    if(ecoule < duree) requestAnimationFrame(boucle);
    else ctx.clearRect(0,0,W,H);
  };
  if(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  requestAnimationFrame(boucle);
}

/* remplacer un exercice pendant la séance (machine prise, matériel manquant, blessure) */
function openSwap(ei, fromInjury){
  const en = db.active.entries[ei];
  const ex = getEx(en.exId);
  const note = injuryNote(ex.name);
  let list = altsFor(en.exId);
  if(fromInjury && note){
    const safe = note.alts.map(n=>allEx().find(e=>e.name===n)).filter(Boolean);
    list = safe.concat(list.filter(e=>!safe.some(s=>s.id===e.id)));
  }
  openSheet(`<h3>Remplacer ${esc(ex.name)}</h3>
    ${note? `<div class="inj-note" style="margin:0 0 12px;">⚠️ <b>${esc(note.injury)} sensible.</b> ${esc(note.tip)}</div>`:""}
    <p style="margin:0 0 10px; font-size:13px; color:var(--ink-soft);">Ces exercices travaillent les mêmes muscles — tes séries et ton objectif sont conservés.</p>
    <div style="max-height:52dvh; overflow-y:auto;">${list.map(e=>{
      const n2 = injuryNote(e.name);
      const reco = fromInjury && note && note.alts.includes(e.name);
      return `<div class="pick-row" data-swap="${e.id}">${exIcon(e)}
        <div class="grow"><div>${esc(e.name)}${reco? ' <span style="color:var(--good); font-size:11px; font-weight:700;">CONSEILLÉ</span>':""}</div>
        <div class="eq">${esc(e.equip||"")}${n2? ` · ⚠️ ${esc(n2.injury)}`:""}</div>${musclesHtml(e.name,3)}</div>
        <span style="color:var(--accent); font-weight:800;">⇄</span></div>`;
    }).join("")}</div>
    <button class="btn" id="sw-cancel" style="width:100%; margin-top:12px;">Annuler</button>`);
  document.getElementById("sw-cancel").onclick=closeSheet;
  document.querySelectorAll("[data-swap]").forEach(r=>r.onclick=()=>{
    const newId = r.dataset.swap;
    const last = lastPerf(newId);
    en.exId = newId;
    en.sets.forEach((s,i)=>{
      if(s.done) return;
      if(s.warm){
        const e = serieEchauffement(newId, en.target && en.target.reps);
        s.w = e.w; s.r = e.r;
        return;
      }
      const ls = last && last.sets[Math.min(i, last.sets.length-1)];
      s.w = ls? ls.w : "";
      if(ls) s.r = ls.r;
    });
    save(); closeSheet(); render();
    toast("Remplacé par "+getEx(newId).name);
  });
}

/* ================= EXERCISE PICKER ================= */
function openPicker(cb){
  const browse = !cb;
  openSheet(`<h3>${browse? "Bibliothèque d'exercices" : "Choisir un exercice"}</h3>
    <input id="pk-search" placeholder="Rechercher un exercice ou un matériel…" style="margin-bottom:2px;">

  document.getElementById("pk-close").onclick = closeSheet;
  const listEl = document.getElementById("pk-list");
  const draw = q=>{
    q=(q||"").toLowerCase();
    /* on cherche aussi dans le groupe musculaire et dans les muscles sollicités :
       « abdos » doit sortir le relevé de jambes, « fessier » les squats… */
    const sansAccent = t => (t||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
    const qn = sansAccent(q);
    /* score : le groupe et le nom priment sur les muscles secondaires */
    const score = e=>{
      if(!qn) return 0;
      if(sansAccent(e.muscle).includes(qn)) return 3;
      if(sansAccent(e.name).includes(qn)) return 2;
      if(sansAccent(e.equip||"").includes(qn)) return 2;
      return (MUSCLE_WORK[e.name]||[]).some(x=>sansAccent(x[0]).includes(qn)) ? 1 : 0;
    };
    const filtered = allEx().filter(e=>!qn || score(e) > 0);
    const groups = {};
    filtered.forEach(e=>{ (groups[e.muscle||"Autres"] = groups[e.muscle||"Autres"]||[]).push(e); });
    const ordre = Object.keys(groups).sort((a,b)=>
      Math.max(...groups[b].map(score)) - Math.max(...groups[a].map(score)));
    listEl.innerHTML = ordre.map(m=>
      `<div class="pk-h">${esc(m)}</div>`+groups[m].map(e=>
        `<div class="pk-row" data-pk="${e.id}"><div class="th">${exIcon(e, true)}</div>
          <div class="grow" style="min-width:0;"><div class="nm">${esc(e.name)}</div>
            <div class="eq">${esc(e.equip||"—")}${e.custom?" · perso":""}</div>${musclesHtml(e.name,3)}</div>
          <button class="icon-btn info-btn" data-exinfo="${e.id}" title="Fiche de l'exercice">ⓘ</button>
          ${browse? "" : `<span class="pk-add">＋</span>`}</div>`).join("")
    ).join("") || `<div class="empty">Aucun résultat.</div>`;
    /* on ne ferme pas ici : c'est l'appelant qui décide (rouvrir l'éditeur, ou fermer) */
    if(!browse) listEl.querySelectorAll("[data-pk]").forEach(r=>r.onclick=(e)=>{ if(e.target.closest("[data-exinfo]")) return; cb(r.dataset.pk); });
    listEl.querySelectorAll("[data-exinfo]").forEach(b=>b.onclick=(e)=>{ e.stopPropagation(); openExoInfo(b.dataset.exinfo); });
  };
  draw("");
  document.getElementById("pk-search").oninput=e=>draw(e.target.value);
  document.getElementById("pk-new").onclick=()=>{

function renderProgs(app){
  app.innerHTML = `
    ${hero(`<div class="big">Mes programmes</div>`)}
    <div class="under-hero" style="height:14px;"></div>
    <div class="stack" id="prog-list"></div>

    <div id="coach-card"></div>`;
  const cur = currentWeight(), obj = db.settings.goal;
  if(!coachGoal) coachGoal = (cur!==null && obj>0 && obj<cur) ? "seche" : "masse";
  const prog = COACH_PROGRAMS[coachGoal];
  const missing = prog.templates.filter(t=>!db.templates.some(x=>x.name===t.name));
  document.getElementById("coach-card").innerHTML = `
    <div class="section-t"><i>🎯</i>Programmes conseillés</div>
    <div class="chips" style="margin-bottom:10px;">
      ${Object.keys(COACH_PROGRAMS).map(k=>`<button class="chip ${k===coachGoal?'on':''}" data-goal="${k}">${COACH_PROGRAMS[k].label}</button>`).join("")}
    </div>
    <div class="card">
      <div style="font-weight:700; margin-bottom:4px;">${prog.title}</div>
      <p style="margin:0 0 10px; font-size:13.5px; color:var(--ink-soft);">${coachDesc(coachGoal)}</p>
      ${missing.length
        ? `<button class="btn btn-accent" id="coach-add" style="width:100%;">Ajouter les ${missing.length} séance${missing.length>1?"s":""}</button>`
        : `<div style="font-size:13.5px; color:var(--good); font-weight:600;">✓ Séances déjà dans tes programmes</div>`}
    </div>`;
  document.querySelectorAll("[data-goal]").forEach(b=>b.onclick=()=>{ coachGoal=b.dataset.goal; render(); });
  if(missing.length) document.getElementById("coach-add").onclick=()=>{ addCoachProgram(coachGoal); render(); };
  const list = document.getElementById("prog-list");
  if(!db.templates.length){
    list.innerHTML=`<div class="card empty"><div class="big">📋</div>Crée tes séances types ici — par exemple <b>Push</b>, <b>Pull</b>, <b>Legs</b> — pour les lancer en un clic.</div>`;
  } else {
    list.innerHTML = db.templates.map(t=>`
      <div class="lrow">
        <button class="inline-edit grow" data-preview="${t.id}" style="padding:0; margin:0;">
          <div><div class="t1">${esc(t.name)}</div>
          <div class="t2">${t.items.length} exercice${t.items.length>1?"s":""} · voir le détail</div></div>
        </button>
        <button class="icon-btn" data-edit="${t.id}">✎</button>
        <button class="icon-btn" data-del="${t.id}" style="color:var(--bad);">✕</button>
      </div>`).join("");
    list.querySelectorAll("[data-preview]").forEach(b=>b.onclick=()=>openPreview(b.dataset.preview));
    list.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>openTplEditor(b.dataset.edit));
    list.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{
      const t = db.templates.find(x=>x.id===b.dataset.del);
      askConfirm("Supprimer la séance ?", `"${t.name}" sera supprimée. Ton historique de séances passées est conservé.`, "Supprimer", true, ()=>{
        db.templates = db.templates.filter(x=>x.id!==t.id); save(); render();
      });
    });
  }
  document.getElementById("new-tpl").onclick=()=>openTplEditor(null);
  document.getElementById("lib-btn").onclick=()=>openPicker(null);
  wireTopbar();
}

function openTplEditor(id){
  let tpl = id ? JSON.parse(JSON.stringify(db.templates.find(t=>t.id===id))) : {id:uid(), name:"", items:[]};
  const draw = ()=>{
    openSheet(`<h3>${id?"Modifier la séance":"Nouvelle séance"}</h3>
      <div class="stack">
        <div><span class="f-lab">Nom de la séance</span>
        <input id="tp-name" placeholder="Ex : Push, Haut du corps…" value="${esc(tpl.name)}"></div>
        <div><span class="f-lab">Exercices</span><div id="tp-items"></div>
        <button class="btn-dash" id="tp-add">＋ Ajouter un exercice</button></div>
        <div class="row" style="gap:9px;">
          <button class="btn grow" id="tp-cancel" style="background:var(--field);">Annuler</button>
          <button class="btn btn-accent grow" id="tp-save">Enregistrer</button>
        </div>
        ${id? `<button class="btn" id="tp-del" style="background:var(--bad); color:#fff; border-color:var(--bad);">Supprimer la séance</button>`:""}
      </div>`);
    const itemsEl = document.getElementById("tp-items");
    itemsEl.innerHTML = tpl.items.length? "" : `<div class="tpl-vide">Aucun exercice pour l'instant.</div>`;
    tpl.items.forEach((it,i)=>{
      const ex = getEx(it.exId);
      const d = document.createElement("div");
      d.className="tpl-item";
      d.innerHTML = `
        <div class="row" style="align-items:flex-start;">
          <div class="grow" style="font-weight:700; font-size:13.5px; line-height:1.3;">${i+1}. ${esc(ex.name)}</div>
          <div style="display:flex; flex-direction:column; gap:1px;">
            <button class="icon-btn" data-up style="width:24px;height:18px; font-size:11px;">▲</button>
            <button class="icon-btn" data-dn style="width:24px;height:18px; font-size:11px;">▼</button>
          </div>
          <button class="icon-btn" data-rm style="width:26px;height:26px;color:#fff;background:var(--bad);border-radius:7px;font-size:13px;">✕</button>
        </div>
        <div class="cfg">
          <label><span class="label">Séries</span><input type="number" inputmode="numeric" min="1" value="${it.sets}" data-f="sets"></label>
          <label><span class="label">Reps</span><input type="text" placeholder="8-12" value="${esc(String(it.reps||""))}" data-f="reps"></label>
          <label><span class="label">Repos (sec)</span><input type="number" inputmode="numeric" min="0" step="15" value="${it.rest}" data-f="rest"></label>
        </div>`;
      d.querySelector("[data-up]").onclick=()=>{ if(i>0){ tpl.items.splice(i-1,0,tpl.items.splice(i,1)[0]); tpl.name=document.getElementById("tp-name").value; draw(); } };
      d.querySelector("[data-dn]").onclick=()=>{ if(i<tpl.items.length-1){ tpl.items.splice(i+1,0,tpl.items.splice(i,1)[0]); tpl.name=document.getElementById("tp-name").value; draw(); } };
      d.querySelector("[data-rm]").onclick=()=>{ tpl.items.splice(i,1); tpl.name=document.getElementById("tp-name").value; draw(); };
      d.querySelectorAll("[data-f]").forEach(inp=>inp.oninput=()=>{
        const f = inp.dataset.f;
        it[f] = f==="reps"? inp.value : (parseInt(inp.value)||0);
      });
      itemsEl.appendChild(d);
    });
    document.getElementById("tp-add").onclick=()=>{
      tpl.name = document.getElementById("tp-name").value;
      openPicker(exId=>{ tpl.items.push({exId, sets:4, reps:"8-12", rest:db.settings.rest}); draw(); });
    };
    document.getElementById("tp-cancel").onclick=closeSheet;
    const sup = document.getElementById("tp-del");
    if(sup) sup.onclick=()=>{
      const nom = document.getElementById("tp-name").value.trim() || tpl.name || "Cette séance";
      askConfirm("Supprimer la séance ?", `${nom} disparaîtra de ton accueil. Les séances déjà faites restent dans ton historique.`, "Supprimer", true, ()=>{
        db.templates = db.templates.filter(t=>t.id!==tpl.id);
        save(); closeSheet(); render(); toast("Séance supprimée");
      });
    };
    document.getElementById("tp-save").onclick=()=>{
      tpl.name = document.getElementById("tp-name").value.trim() || "Séance sans nom";
      const idx = db.templates.findIndex(t=>t.id===tpl.id);
      if(idx>=0) db.templates[idx]=tpl; else db.templates.push(tpl);
      save(); closeSheet(); render();
    };
  };
  draw();
}

function openSettings(){
  openSheet(`<h3>Réglages</h3>
    <div class="stack">
      <button class="btn" id="st-hints">💡 Revoir les explications de l'app</button>
      <button class="btn" id="st-legal">📄 Aide, confidentialité et conditions</button>
