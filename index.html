        <span class="grow" style="text-align:left;">Garder l'écran allumé en séance</span>
        <span style="font-weight:800; color:var(--accent);">${db.settings.ecranAllume===false? "Non" : "Oui"}</span>
      </button>
      <button class="btn" id="st-theme">
        <span class="grow" style="text-align:left;">Apparence</span>
        <span style="font-weight:800; color:var(--accent);">${db.settings.theme==="clair"? "☀️ Clair" : "🌙 Sombre"}</span>
      </button>

      <div><span class="label" style="display:block; margin-bottom:5px;">Repos par défaut (secondes)</span>
      <input type="number" inputmode="numeric" step="15" min="0" id="st-rest" value="${db.settings.rest}"></div>

      <button class="btn" id="st-bk-toggle" style="margin-top:4px;">
        <span class="grow" style="text-align:left;">Détails de sauvegarde</span>
        <span id="st-bk-caret" style="font-weight:800; color:var(--accent);">▸</span>
      </button>
      <div id="st-backup" class="stack" style="display:none;">
      <p style="margin:0; font-size:13.5px; color:var(--ink-soft);">Tes données sont enregistrées automatiquement dans ce téléphone. Ces options servent seulement à les copier sur un autre appareil, ou à les mettre à l'abri avant un changement de téléphone.</p>
      <div id="st-auto"></div>
      <button class="btn" id="st-file">💾 Enregistrer un fichier</button>
      <label class="btn" for="st-restore-in" style="display:flex;">📂 Restaurer depuis un fichier</label>
      <input type="file" id="st-restore-in" accept=".json,application/json,text/plain" style="display:none;">
      <button class="btn" id="st-export">Exporter en texte</button>
      <button class="btn" id="st-import">Importer un texte</button>
      <div class="section-t" style="margin-top:6px;">État de la sauvegarde</div>
      <div id="st-diag" style="font-size:13px; line-height:1.9;"></div>
      <button class="btn btn-danger" id="st-reset">Tout effacer</button>
      </div>
      <button class="btn btn-accent" id="st-ok">Fermer</button>
    </div>`);
  document.getElementById("st-bk-toggle").onclick = ()=>{
    const z = document.getElementById("st-backup");
    const ouvert = z.style.display !== "none";
    z.style.display = ouvert ? "none" : "flex";
    document.getElementById("st-bk-caret").textContent = ouvert ? "▸" : "▾";
  };
  /* enregistrement au fil de la saisie : rien n'est perdu si la fiche est fermée d'un geste */
  const applySettings = ()=>{
    const el = id => document.getElementById(id);
    if(!el("st-rest")) return;                      /* la fiche n'est plus à l'écran */
    db.settings.rest = parseInt(el("st-rest").value)||90;
    save();
  };
  ["st-rest"].forEach(id=>{
    const el = document.getElementById(id);
    if(el){ el.oninput = applySettings; el.onchange = applySettings; }
  });
  /* quelle que soit la façon de fermer (bouton, clic à côté, touche retour) : on enregistre */
  onSheetClose = ()=>{ render(); };
  document.getElementById("st-ok").onclick=()=>{ applySettings(); closeSheet(); };
  document.getElementById("st-ecran").onclick=(e)=>{
    db.settings.ecranAllume = (db.settings.ecranAllume === false);
    save(); syncWakeLock();
    e.currentTarget.lastElementChild.textContent = db.settings.ecranAllume===false? "Non" : "Oui";
  };
  document.getElementById("st-theme").onclick=(e)=>{
    db.settings.theme = (db.settings.theme==="clair") ? "sombre" : "clair";
    save(); appliquerTheme();
    e.currentTarget.lastElementChild.textContent = db.settings.theme==="clair" ? "☀️ Clair" : "🌙 Sombre";
  };
  document.getElementById("st-legal").onclick = openLegal;
  document.getElementById("st-hints").onclick=()=>{ db.seen = {}; save(); closeSheet(); render(); toast("Les explications réapparaîtront ✓"); };
  /* bloc sauvegarde automatique : seulement là où le navigateur le permet */
  const autoBox = document.getElementById("st-auto");
  if(!fileApiOk()){
    autoBox.innerHTML = `<div style="font-size:12px; color:var(--ink-mute); line-height:1.5; margin-bottom:4px;">La sauvegarde automatique dans un fichier n'est pas disponible sur ce navigateur (Safari/iPhone ne la propose pas). Tes données restent enregistrées dans le téléphone.</div>`;
  } else if(autoFile.ok){
    autoBox.innerHTML = `<div class="card" style="background:var(--surface2); padding:12px; margin-bottom:2px;">
      <div style="font-weight:700; color:var(--good); font-size:13.5px;">✓ Sauvegarde automatique active</div>
      <div style="font-size:12.5px; color:var(--ink-soft); margin:3px 0 10px;">Chaque modification est écrite dans <b>${esc(autoFile.name||"ton fichier")}</b>, sans rien te demander.</div>
      <div class="row"><button class="btn btn-sm grow" id="af-change">Changer de fichier</button>
      <button class="btn btn-sm" id="af-off" style="color:var(--bad);">Désactiver</button></div></div>`;
    document.getElementById("af-change").onclick = autoFilePick;
    document.getElementById("af-off").onclick = autoFileOff;
  } else if(autoFile.handle){
    autoBox.innerHTML = `<div class="card" style="background:var(--surface2); padding:12px; margin-bottom:2px;">
      <div style="font-weight:700; color:var(--accent); font-size:13.5px;">⏸ Sauvegarde automatique en pause</div>
      <div style="font-size:12.5px; color:var(--ink-soft); margin:3px 0 10px;">Le navigateur redemande l'autorisation d'écrire dans ${esc(autoFile.name||"ton fichier")}.</div>
      <button class="btn btn-accent btn-sm" id="af-resume" style="width:100%;">Réactiver</button></div>`;
    document.getElementById("af-resume").onclick = autoFileResume;
  } else {
    autoBox.innerHTML = `<button class="btn btn-accent" id="af-on" style="width:100%;">⚡ Activer la sauvegarde automatique</button>
      <div style="font-size:12px; color:var(--ink-mute); line-height:1.5; margin:6px 0 2px;">Tu choisis un fichier une seule fois, et l'app y écrit toute seule à chaque modification.</div>`;
    document.getElementById("af-on").onclick = autoFilePick;
  }
  const ago = ts => {
    if(!ts) return "jamais";
    const m = Math.round((Date.now()-Number(ts))/60000);
    if(m<1) return "à l'instant";
    if(m<60) return `il y a ${m} min`;
    const h = Math.round(m/60);
    return h<24? `il y a ${h} h` : `il y a ${Math.round(h/24)} j`;
  };
  const ico = v => v==="ok" ? '<span style="color:var(--good);">✓</span>' : (v==="?" ? '<span style="color:var(--ink-mute);">…</span>' : '<span style="color:var(--bad);">✕</span>');
  const survived = (diag.lsMark || diag.idbMark) ? true : false;
  document.getElementById("st-diag").innerHTML = `
    <div>${ico(diag.ls)} Mémoire principale : ${diag.ls}</div>
    <div>${ico(diag.idb)} Mémoire de secours : ${diag.idb}</div>
    <div>${survived? '<span style="color:var(--good);">✓</span>' : '<span style="color:var(--bad);">✕</span>'} Trace de la session précédente : ${survived? "retrouvée ("+ago(diag.lsMark||diag.idbMark)+")" : "perdue"}</div>
    <div style="color:var(--ink-mute);">Dernier enregistrement chargé : ${diag.loadedSavedAt? ago(diag.loadedSavedAt) : "aucun"}</div>
    <div style="color:var(--ink-mute);">Dernière sauvegarde fichier : ${ago(db.lastBackup)}</div>
    <div style="color:var(--ink-mute);">Écran maintenu allumé : ${esc(wakeEtat)}</div>
    <div style="color:var(--ink-mute); margin-top:6px;">Version ${BUILD}</div>
    ${!survived? `<div style="color:var(--bad); margin-top:8px; font-weight:600; line-height:1.5;">iOS efface la mémoire de l'app entre deux ouvertures. Utilise l'icône 💾 avant de fermer, et 📂 pour restaurer.</div>`:""}`;
  document.getElementById("st-file").onclick=async()=>{
    const btn = document.getElementById("st-file");
    const stamp = dayKey();
    try{
      const downloads = await useCap("downloads");
      if(!downloads) throw new Error("unavailable");
      await downloads.save({filename:`tonnage-sauvegarde-${stamp}.json`, data: JSON.stringify(db)});
      db.lastBackup = Date.now(); save();
      btn.textContent = "Sauvegarde enregistrée ✓";
    }catch(e){
      if(e && e.code==="declined"){ btn.textContent="Sauvegarde annulée"; return; }
      btn.textContent = "Indisponible — utilise « Exporter en texte »";
    }
  };
  document.getElementById("st-restore-in").onchange=(ev)=>{
    const f = ev.target.files && ev.target.files[0];
    if(!f) return;
    const fr = new FileReader();
    fr.onload = ()=>{
      try{
        const d = JSON.parse(String(fr.result));
        if(!d || !Array.isArray(d.history)) throw 0;
        db = d; applyDefaults(); save(); closeSheet(); render();
        toast("Sauvegarde restaurée ✓");
      }catch(e){ toast("Fichier illisible"); }
    };
    fr.readAsText(f);
  };
  document.getElementById("st-export").onclick=()=>{
    openSheet(`<h3>Exporter</h3><p style="font-size:13.5px; color:var(--ink-soft); margin:0 0 10px;">Copie ce texte et garde-le quelque part (Notes, mail…). Tu pourras le recoller dans « Importer » pour tout restaurer.</p>
      <textarea id="ex-out" rows="8" readonly style="font-size:12px; font-family:ui-monospace,monospace;"></textarea>
      <button class="btn btn-accent" id="ex-copy" style="width:100%; margin-top:12px;">Copier</button>`);
    const ta = document.getElementById("ex-out");
    ta.value = JSON.stringify(db);
    document.getElementById("ex-copy").onclick=()=>{ ta.select(); document.execCommand("copy"); document.getElementById("ex-copy").textContent="Copié ✓"; };
  };
  document.getElementById("st-import").onclick=()=>{
    openSheet(`<h3>Importer</h3><p style="font-size:13.5px; color:var(--ink-soft); margin:0 0 10px;">Colle ici un export précédent. Attention : cela remplace toutes les données actuelles.</p>
      <textarea id="im-in" rows="8" placeholder="Colle ton export ici…" style="font-size:12px; font-family:ui-monospace,monospace;"></textarea>
      <button class="btn btn-accent" id="im-ok" style="width:100%; margin-top:12px;">Importer</button>`);
    document.getElementById("im-ok").onclick=()=>{
      try{
        const d = JSON.parse(document.getElementById("im-in").value);
        if(!d || !Array.isArray(d.history)) throw 0;
        db = d; applyDefaults(); save(); closeSheet(); render(); toast("Données restaurées ✓");
      }catch(e){
        document.getElementById("im-ok").textContent="Format invalide — vérifie le texte collé";
      }
    };
  };
  document.getElementById("st-reset").onclick=()=>askConfirm("Tout effacer ?","Programmes, historique et exercices persos seront définitivement supprimés de ce téléphone.","Tout effacer",true,()=>{
    db = {custom:[], templates:[], history:[], settings:{rest:90, goal:80, name:db.settings.name}, active:null, seq:1, weights:[], cardio:[], habits:["Petit-déj complet","Déjeuner solide","Dîner solide","Shake ou collation en +"], habitLog:{}}; save(); render();
  });
}

/* ================= HISTORIQUE ================= */
function renderHist(app){
  app.innerHTML = `
    ${hero(`<div class="big">Historique</div>`)}
    <div class="under-hero" style="height:14px;"></div>
    <div class="stack" id="h-list"></div>`;
  wireTopbar();
  const list = document.getElementById("h-list");
  if(!db.history.length){
    list.innerHTML = `<div class="card empty"><div class="big">🕰️</div>Aucune séance enregistrée pour l'instant.<br>Elles apparaîtront ici une fois terminées.</div>`;
    return;
  }
  const hist = db.history.slice().reverse();
  list.innerHTML = hist.map(s=>{
    const vol = sessionVolume(s);
    const nSets = s.entries.reduce((n,e)=>n+e.sets.length,0);
    return `<div class="card" data-h="${s.id}">
      <div class="row" style="align-items:flex-start;">
        <div class="grow">
          <div style="font-weight:700;">${esc(s.name)}</div>
          <div class="t2" style="font-size:12.5px; color:var(--ink-mute); text-transform:capitalize;">${fmtDate(s.date)}</div>
        </div>
        <button class="icon-btn" data-hedit="${s.id}" style="width:32px; height:32px;">✎</button>
        <button class="icon-btn" data-hdel="${s.id}" style="color:var(--bad); width:32px; height:32px;">✕</button>
      </div>
      <div class="row" style="gap:6px; margin-top:8px; flex-wrap:wrap;">
        <span class="pill">${fmtDur(s.end-s.start)}</span>
        <span class="pill">${nSets} séries</span>
        <span class="pill" style="color:var(--accent);">${fmtKg(vol)} kg</span>
        <span class="pill">≈ ${liftKcal(s.end-s.start, vol, nSets)} kcal</span>
      </div>
      <div class="hist-detail">${s.entries.map(en=>`
        <div class="hist-ex"><div class="n">${esc(getEx(en.exId).name)}</div>
        <div class="s">${en.sets.map(st=>`${fmtKg(st.w)}×${st.r}${(st.drops||[]).map(d=>` ↳ ${fmtKg(d.w)}×${d.r}`).join("")}`).join(" · ")}</div></div>`).join("")}
      </div>
    </div>`;
  }).join("");
  list.querySelectorAll("[data-h]").forEach(c=>c.addEventListener("click", e=>{
    if(e.target.closest("[data-hdel]") || e.target.closest("[data-hedit]")) return;
    c.querySelector(".hist-detail").classList.toggle("show");
  }));
  list.querySelectorAll("[data-hedit]").forEach(b=>b.onclick=()=>openHistEdit(b.dataset.hedit));
  list.querySelectorAll("[data-hdel]").forEach(b=>b.onclick=()=>{
    const s = db.history.find(x=>x.id===b.dataset.hdel);
    askConfirm("Supprimer cette séance ?", `${s.name} du ${fmtDateShort(s.date)} sera retirée de l'historique et des courbes.`, "Supprimer", true, ()=>{
      db.history = db.history.filter(x=>x.id!==s.id); save(); render();
    });
  });
}

/* modifier une séance déjà enregistrée (erreur de saisie, oubli d'une série…) */
function openHistEdit(id){
  const s = db.history.find(x=>x.id===id);
  if(!s) return;
  const corps = s.entries.map((en,ei)=>{
    const ex = getEx(en.exId);
    return `<div class="tpl-item">
      <div class="row" style="margin-bottom:8px;">
        <div class="grow" style="font-weight:700; font-size:14px;">${esc(ex.name)}</div>
        <button class="icon-btn" data-hex-del="${ei}" style="width:30px; height:30px; color:var(--bad);">✕</button>
      </div>
      <div class="set-cols" style="margin-bottom:4px;"><span></span><span>kg</span><span>reps</span><span></span><span></span></div>
      ${en.sets.map((st,si)=>`<div class="set-row" style="margin-bottom:6px;">
        <div class="n">${st.warm? "Éch." : si+1}</div>
        <input type="number" inputmode="decimal" step="0.5" min="0" value="${st.w}" data-hw="${ei}.${si}">
        <input type="number" inputmode="numeric" min="0" value="${st.r}" data-hr="${ei}.${si}">
        <span></span>
        <button class="ck" data-hset-del="${ei}.${si}" style="color:var(--bad); font-size:14px;">✕</button>
      </div>
      ${(st.drops||[]).map((d,di)=>`<div class="set-row drop" style="margin-bottom:6px;">
        <div class="n">↳</div>
        <input type="number" inputmode="decimal" step="0.5" min="0" value="${d.w}" data-hdw="${ei}.${si}.${di}">
        <input type="number" inputmode="numeric" min="0" value="${d.r}" data-hdr="${ei}.${si}.${di}">
        <span></span>
        <button class="ck" data-hdrop-del="${ei}.${si}.${di}" style="color:var(--bad); font-size:14px;">✕</button>
      </div>`).join("")}`).join("")}
      <button class="btn btn-sm btn-ghost" data-hset-add="${ei}" style="width:100%; margin-top:4px;">＋ série</button>
    </div>`;
  }).join("");
  openSheet(`<h3>Modifier la séance</h3>
    <div style="font-size:12.5px; color:var(--ink-mute); margin-bottom:12px; text-transform:capitalize;">${esc(s.name)} · ${fmtDate(s.date)}</div>
    <div style="max-height:56dvh; overflow-y:auto;">${corps || `<div class="empty">Séance vide.</div>`}</div>
    <button class="btn btn-accent" id="he-ok" style="width:100%; margin-top:12px;">Enregistrer</button>
    <button class="btn btn-ghost" id="he-cancel" style="width:100%; margin-top:8px;">Annuler</button>`);

  document.querySelectorAll("[data-hw]").forEach(i=>i.oninput=()=>{
    const [ei,si] = i.dataset.hw.split(".").map(Number);
    s.entries[ei].sets[si].w = parseFloat(i.value)||0;
  });
  document.querySelectorAll("[data-hr]").forEach(i=>i.oninput=()=>{
    const [ei,si] = i.dataset.hr.split(".").map(Number);
    s.entries[ei].sets[si].r = parseInt(i.value)||0;
  });
  document.querySelectorAll("[data-hdw]").forEach(i=>i.oninput=()=>{
    const [ei,si,di] = i.dataset.hdw.split(".").map(Number);
    s.entries[ei].sets[si].drops[di].w = parseFloat(i.value)||0;
  });
  document.querySelectorAll("[data-hdr]").forEach(i=>i.oninput=()=>{
    const [ei,si,di] = i.dataset.hdr.split(".").map(Number);
    s.entries[ei].sets[si].drops[di].r = parseInt(i.value)||0;
  });
  document.querySelectorAll("[data-hdrop-del]").forEach(b=>b.onclick=()=>{
    const [ei,si,di] = b.dataset.hdropDel.split(".").map(Number);
    const st = s.entries[ei].sets[si];
    st.drops.splice(di,1);
    if(!st.drops.length) delete st.drops;
    save(); openHistEdit(id);
  });
  document.querySelectorAll("[data-hset-del]").forEach(b=>b.onclick=()=>{
    const [ei,si] = b.dataset.hsetDel.split(".").map(Number);
    s.entries[ei].sets.splice(si,1);
    if(!s.entries[ei].sets.length) s.entries.splice(ei,1);
    openHistEdit(id);
  });
  document.querySelectorAll("[data-hset-add]").forEach(b=>b.onclick=()=>{
    const ei = parseInt(b.dataset.hsetAdd);
    const prev = s.entries[ei].sets[s.entries[ei].sets.length-1] || {w:0,r:0};
    s.entries[ei].sets.push({w:prev.w, r:prev.r, done:true, warm:false, rir:null});
    openHistEdit(id);
  });
  document.querySelectorAll("[data-hex-del]").forEach(b=>b.onclick=()=>{
    const ei = parseInt(b.dataset.hexDel);
    askConfirm("Retirer cet exercice ?", `${getEx(s.entries[ei].exId).name} sera retiré de cette séance.`, "Retirer", true, ()=>{
      s.entries.splice(ei,1); save(); openHistEdit(id);
    });
  });
  document.getElementById("he-cancel").onclick=()=>{ closeSheet(); render(); };
  document.getElementById("he-ok").onclick=()=>{
    s.entries = s.entries.filter(en=>en.sets.length);
    if(!s.entries.length) db.history = db.history.filter(x=>x.id!==id);
    save(); closeSheet(); render(); toast("Séance modifiée ✓");
  };
}

/* ================= PROGRESSION ================= */
let prgEx = null, prgMetric = "max";
/* ce que l'utilisateur a déplié : conservé d'un rendu à l'autre */
const prgPlis = {poids:false, analyse:false};
const CHEV = '<svg viewBox="0 0 20 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l7 5 7-5"/><path d="M3 8.5l7 3 7-3" opacity=".45"/></svg>';
/* une languette centrée qui déplie le bloc « cible » */
function pliBouton(id, ouvert, libelle){
  return `<div class="pli"><button id="${id}" aria-expanded="${ouvert}" aria-label="${esc(libelle)}">${CHEV}</button></div>`;
}
function renderProgress(app){
  const counts = {};
  db.history.forEach(s=>s.entries.forEach(en=>{ counts[en.exId]=(counts[en.exId]||0)+1; }));
  const exIds = Object.keys(counts).sort((a,b)=>counts[b]-counts[a]);

  app.innerHTML = `
    ${hero(`<div class="big">Progression</div>`)}
    <div class="under-hero stack" id="wt-sec"></div>
    <div id="prg-body"></div>`;
  wireTopbar();
  renderWeightSection(document.getElementById("wt-sec"));
  renderProteinSection(document.getElementById("wt-sec"));
  renderMuscleSection(document.getElementById("wt-sec"));
  renderCardioSection(document.getElementById("wt-sec"));
  const body = document.getElementById("prg-body");
  if(!exIds.length){
    body.innerHTML = `<div class="card" style="margin-top:14px;">
      <div class="card-t">Évolution des charges</div>
      <div class="empty" style="padding:20px 10px;">Tes courbes par exercice apparaîtront ici après tes premières séances.</div>
    </div>`;
    return;
  }
  if(!prgEx || !exIds.includes(prgEx)) prgEx = exIds[0];

  body.innerHTML = `
    <div class="card" style="margin-top:14px;">
      <div class="card-t" style="margin-bottom:10px;">Évolution des charges</div>
      <select id="prg-sel" style="margin-bottom:12px;">${exIds.map(id=>`<option value="${id}" ${id===prgEx?"selected":""}>${esc(getEx(id).name)}</option>`).join("")}</select>
      <div class="chips" style="margin-bottom:14px;">
        <button class="chip ${prgMetric==="max"?"on":""}" data-m="max">Charge max</button>
        <button class="chip ${prgMetric==="1rm"?"on":""}" data-m="1rm">1RM estimé</button>
        <button class="chip ${prgMetric==="vol"?"on":""}" data-m="vol">Volume</button>
      </div>
      <div class="tiles" id="prg-tiles"></div>
      <div class="chart-wrap" id="chart-wrap" style="margin-top:12px;"><div class="chart-tip" id="chart-tip"></div></div>
    </div>`;
  /* changer d'exercice ou de mesure ne doit pas renvoyer en haut de page */
  document.getElementById("prg-sel").onchange=e=>{ prgEx=e.target.value; renderSurPlace(); };
  body.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{ prgMetric=b.dataset.m; renderSurPlace(); });

  // series: one point per session containing this exercise
  const pts = [];
  db.history.forEach(s=>{
    const en = s.entries.find(e=>e.exId===prgEx);
    if(!en) return;
    const sets = workSets(en);
    if(!sets.length) return;
    let v;
    if(prgMetric==="max") v = Math.max(...sets.map(st=>st.w||0));
    else if(prgMetric==="1rm") v = Math.max(...sets.map(st=>e1rm(st.w||0, st.r||0)));
    else v = sets.reduce((x,st)=>x+volSerie(st),0)*facteurCharge(prgEx);
    pts.push({date:s.date, v:Math.round(v*10)/10});
  });

  const unit = "kg";
  const record = Math.max(...pts.map(p=>p.v));
  const lastV = pts[pts.length-1].v;
  document.getElementById("prg-tiles").innerHTML = `
    <div class="tile"><div class="v" style="color:var(--accent);">${fmtKg(record)}</div><div class="u">record (${unit})</div></div>
    <div class="tile"><div class="v">${fmtKg(lastV)}</div><div class="u">dernière (${unit})</div></div>
    <div class="tile"><div class="v">${pts.length}</div><div class="u">séance${pts.length>1?"s":""}</div></div>`;

  drawChart(document.getElementById("chart-wrap"), pts, unit);
}

function renderWeightSection(sec){
  const ws = db.weights.slice().sort((a,b)=>new Date(a.date)-new Date(b.date));
  const cur = ws.length? ws[ws.length-1].kg : null;
  const goal = db.settings.goal;
  const delta = (cur!==null && goal>0)? Math.round((goal-cur)*10)/10 : null;
  const first = ws.length? ws[0].kg : null;
  const total = (cur!==null && first!==null)? Math.round((cur-first)*10)/10 : null;
  /* où en est-on entre la première pesée et le poids visé ? */
  const depart = (db.profile && db.profile.weight > 0 && ws.length) ? ws[0].kg : first;
  let pct = null;
  if(cur !== null && goal > 0 && depart !== null && Math.abs(goal - depart) > 0.05)
    pct = Math.max(0, Math.min(100, (cur - depart)/(goal - depart)*100));
  const ouvert = prgPlis.poids;
  sec.innerHTML = `
    <div class="card">
      <div class="row" style="align-items:center; gap:11px;">
        <div class="card-t grow">Poids</div>
        <div style="font-size:25px; font-weight:800; font-variant-numeric:tabular-nums; white-space:nowrap;">${
          cur!==null? fmtKg(cur)+` <span style="font-size:16px;">kg</span>` : "—"}</div>
        <button class="btn btn-accent btn-sm" id="wt-add" style="flex:0 0 auto;">＋ Noter</button>
      </div>
      ${goal>0 ? `<div class="jauge"><i style="width:${pct===null? (cur!==null?100:0) : pct.toFixed(1)}%"></i></div>` : ""}
      <div class="jauge-txt"><button class="inline-edit" id="wt-goal">${goal>0
        ? (delta===null ? `Objectif ${fmtKg(goal)} kg` : (Math.abs(delta) < 0.05 ? `Objectif ${fmtKg(goal)} kg atteint 🎉`
          : `Objectif ${fmtKg(goal)} · Encore ${fmtKg(Math.abs(delta))} kg`))
        : "Définir un objectif"} <span class="pen">✎</span></button></div>
      <div id="wt-plie" ${ouvert?"":"hidden"} style="margin-top:14px;">
        ${ws.length? `<div class="chart-wrap" id="wt-chart"></div>
          ${ws.length>1? `<div class="row" style="justify-content:space-between; margin-top:8px; font-size:12.5px;">
            <span style="color:var(--ink-mute);">Depuis la 1re pesée</span>
            <span style="font-weight:800; color:${total>0?'var(--good)':(total<0?'var(--bad)':'var(--ink-soft)')};">${total>0?"+":""}${fmtKg(total)} kg</span></div>`
          : `<div style="font-size:12.5px; color:var(--ink-mute);">Note-toi à nouveau dans quelques jours : la courbe se dessinera.</div>`}`
        : `<div class="empty" style="padding:20px 10px;">Ta courbe de poids apparaîtra ici dès ta première pesée.</div>`}
      </div>
    </div>
    ${pliBouton("wt-pli", ouvert, "Afficher la courbe de poids")}`;
  const pli = document.getElementById("wt-pli");
  pli.onclick = ()=>{
    prgPlis.poids = !prgPlis.poids;
    const zone = document.getElementById("wt-plie");
    zone.hidden = !prgPlis.poids;
    pli.setAttribute("aria-expanded", prgPlis.poids);
    /* le graphique se mesure une fois visible, jamais avant */
    if(prgPlis.poids && ws.length) drawChart(document.getElementById("wt-chart"), ws.map(w=>({date:w.date, v:w.kg})), "kg", goal);
  };
  document.getElementById("wt-goal").onclick=editGoal;
  document.getElementById("wt-add").onclick=()=>{
    openSheet(`<h3>Noter mon poids</h3>
      <div class="stack">
        <input type="number" inputmode="decimal" step="0.1" min="30" max="300" id="wt-in" placeholder="kg" value="${cur!==null?cur:""}">
        <button class="btn btn-accent" id="wt-ok">Enregistrer</button>
      </div>`);
    document.getElementById("wt-ok").onclick=()=>{
      const kg = parseFloat(document.getElementById("wt-in").value);
      if(!kg) return;
      const err = verifieChamp("weight", kg);
      if(err){ toast(err); return; }
      const today = dayKey();
      db.weights = db.weights.filter(w=>dayKey(w.date)!==today);
      db.weights.push({date:new Date().toISOString(), kg});
      save(); closeSheet(); renderSurPlace();
    };
  };
  if(ws.length && ouvert) drawChart(document.getElementById("wt-chart"), ws.map(w=>({date:w.date, v:w.kg})), "kg", goal);
}

/* muscles suivis dans le profil, avec le nom court affiché sur la silhouette */
const MP_MUSCLES = ["Pectoraux","Grand dorsal","Trapèzes","Deltoïdes","Biceps","Triceps","Avant-bras",
                    "Quadriceps","Ischio-jambiers","Fessiers","Mollets","Abdos","Lombaires"];
/* rattache un libellé précis (« Pectoraux (haut) », « Mollets (soléaire) »…) à son groupe suivi */
function groupeDe(nom){
  const base = nom.replace(/\s*\(.*\)$/, "");
  if(MP_MUSCLES.includes(base)) return base;
  if(base==="Obliques") return "Abdos";
  if(base==="Avant-bras") return "Avant-bras";
  if(base==="Brachial") return "Biceps";
  return null;   /* Avant-bras, Adducteurs… : pas de zone sur la silhouette */
}
/* ===== Récupération : ce que tes séances récentes ont laissé comme fatigue ===== */
/* heures de récupération complète après une sollicitation lourde, par groupe */
const RECUP_H = {
  "Pectoraux":48, "Grand dorsal":48, "Trapèzes":36, "Deltoïdes":36,
  "Biceps":36, "Triceps":36, "Avant-bras":24, "Quadriceps":72, "Ischio-jambiers":72,
  "Fessiers":60, "Mollets":36, "Abdos":36, "Lombaires":60
};
/* Coût d'une série : l'échec coûte plus cher, la réserve moins.
   Un dégressif prolonge la série au-delà de l'échec, il ajoute sa part. */
function poidsFatigue(st){
  const r = (st.rir === undefined || st.rir === null) ? 1.5 : st.rir;
  let f = r <= 0 ? 1.35 : (r <= 2 ? 1 : 0.7);
  f += (st.drops || []).length * 0.35;
  return f;
}
/* état de chaque groupe : 100 % = frais, 0 % = à plat */
function recuperation(){
  const now = Date.now();
  const fat = {};
  MP_MUSCLES.forEach(m=>fat[m]=0);
  db.history.forEach(sess=>{
    const t = new Date(sess.date).getTime();
    const heures = (now - t)/36e5;
    if(heures < 0 || heures > 96) return;
    sess.entries.forEach(en=>{
      const ex = getEx(en.exId);
      const series = (en.sets||[]).filter(x=>x.done && !x.warm);
      if(!series.length) return;
      /* une série menée à l'échec fatigue bien plus qu'une série gardée en réserve */
      const cout = series.reduce((a,st)=>a + poidsFatigue(st), 0);
      (MUSCLE_WORK[ex.name]||[]).forEach(([mus, niveau])=>{
        const g = groupeDe(mus);
        if(!g) return;
        const plein = RECUP_H[g] || 48;
        if(heures >= plein) return;
        const reste = 1 - heures/plein;              /* la fatigue s'efface avec le temps */
        fat[g] += cout * (niveau/3) * 11 * reste;    /* ~11 points pour 1 série lourde à 1-2 reps de l'échec */
      });
    });
  });
  const muscles = {};
  MP_MUSCLES.forEach(m=>{
    const pct = Math.max(0, Math.min(100, Math.round(100 - fat[m])));
    muscles[m] = {pct, etat: pct>=85? "frais" : (pct>=50? "recup" : "fatigue")};
  });
  const vals = MP_MUSCLES.map(m=>muscles[m].pct);
  const global = Math.round(vals.reduce((a,b)=>a+b,0)/vals.length);
  const n = {frais:0, recup:0, fatigue:0};
  MP_MUSCLES.forEach(m=>n[muscles[m].etat]++);
  return {global, muscles, n};
}

}

function recupPire(r){

function muscleProfile(){
  const bw = currentWeight() || 75;
  const byEx = {};
  db.history.forEach(s=>s.entries.forEach(en=>{
    const ex = getEx(en.exId);
    const ref = STRENGTH_REF[ex.name];
    const sets = workSets(en);
    if(!ref || !sets.length) return;
    /* un exercice fait bras par bras : la charge d'un côté vaut le double en équivalent bilatéral */
    const f = (db.unilat && db.unilat[en.exId] && !dejaParCote(en.exId)) ? 2 : 1;
    const best = Math.max(...sets.map(st=>e1rm((st.w||0)*f, st.r||0)));
    if(best<=0) return;
    (byEx[en.exId] = byEx[en.exId] || {nom:ex.name, ref, vals:[]}).vals.push(best);
  }));
  const agg = {};
  Object.values(byEx).forEach(o=>{
    const val = Math.max(...o.vals.slice(-3));            /* forme récente */
    const score = val/(o.ref*bw)*100;
    const wgt = Math.min(3, o.vals.length);
    /* l'exercice alimente tous les muscles qu'il sollicite fortement */
    const cibles = (MUSCLE_WORK[o.nom]||[]).filter(([m,n])=>n===3).map(([m])=>groupeDe(m)).filter(Boolean);
    [...new Set(cibles)].forEach(g=>{
      const m = agg[g] = agg[g] || {sum:0, w:0, n:0};
      m.sum += score*wgt; m.w += wgt; m.n += o.vals.length;
    });
  });
  const out = {};
  MP_MUSCLES.forEach(name=>{
    const m = agg[name];
    out[name] = (m && m.n>=2) ? Math.round(m.sum/m.w) : null;
  });
  return out;
}
/* moyenne de tes propres scores : c'est elle qui sert de référence, pas un barème absolu */
function mpMoyenne(prof){
  const vals = MP_MUSCLES.map(m=>prof[m]).filter(v=>v!==null);
  if(vals.length < 3) return null;                 /* trop peu de groupes pour se comparer à soi-même */
  return vals.reduce((a,b)=>a+b,0)/vals.length;
}
/* score : ton niveau sur ce groupe. moy : ta moyenne. On compare l'écart en points de pourcentage. */
function mpStatus(score, moy){
  if(score===null) return {tag:"Pas encore assez de données", color:"#3b352c", op:1, nodata:true};
  if(moy === null || moy <= 0){
    /* pas encore de quoi comparer : on retombe sur le barème absolu */
    if(score>=115) return {tag:"Point fort", color:"var(--good)", op:1};
    if(score>=105) return {tag:"Point fort léger", color:"var(--good)", op:.7};
    if(score>=95)  return {tag:"Équilibré", color:"#b9a97f", op:1};
    if(score>=85)  return {tag:"Point faible léger", color:"var(--bad)", op:.7};
    return {tag:"Point faible", color:"var(--bad)", op:1};
  }
  const ecart = (score - moy) / moy * 100;          /* en % de ta moyenne */
  if(ecart >= 15) return {tag:"Point fort", color:"var(--good)", op:1, ecart};
  if(ecart >= 6)  return {tag:"Point fort léger", color:"var(--good)", op:.7, ecart};
  if(ecart > -6)  return {tag:"Équilibré", color:"#b9a97f", op:1, ecart};
  if(ecart > -15) return {tag:"Point faible léger", color:"var(--bad)", op:.7, ecart};
  return {tag:"Point faible", color:"var(--bad)", op:1, ecart};
}

function analyseProfil(prof){

  const moyenne = Math.round(moyenneBrute);

  const pc = m => Math.round((prof[m] - moyenneBrute) / moyenneBrute * 100);
  const signe = v => (v>=0? "+" : "−") + Math.abs(v) + " %";
  const ecart = Math.round((prof[fort] - prof[faible]) / moyenneBrute * 100);

function drawChart(wrap, pts, unit, goal){
  const W = Math.max(280, wrap.clientWidth || 300), H = 220;
  const padL = 40, padR = 16, padT = 18, padB = 26;
  let min0 = Math.min(...pts.map(p=>p.v)), max0 = Math.max(...pts.map(p=>p.v));
  const useGoal = goal && Math.abs(goal - pts[pts.length-1].v) <= 12;
  if(useGoal){ min0 = Math.min(min0, goal); max0 = Math.max(max0, goal); }
  const span = (max0-min0)||1;
  const lo = Math.max(0, min0 - span*0.15), hi = max0 + span*0.15;
  const X = i => pts.length===1 ? W/2 : padL + (W-padL-padR) * i/(pts.length-1);
  const Y = v => padT + (H-padT-padB) * (1 - (v-lo)/(hi-lo));

  let grid="", ylab="";
  for(let g=0; g<4; g++){
    const v = lo + (hi-lo)*g/3;
    const y = Y(v);
    grid += `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="var(--border)" stroke-width="1"/>`;
    ylab += `<text x="${padL-7}" y="${y+4}" text-anchor="end" font-size="10.5" fill="var(--ink-mute)" style="font-variant-numeric:tabular-nums;">${(hi-lo)<4? (Math.round(v*10)/10).toLocaleString("fr-FR") : Math.round(v)}</text>`;
  }
  const path = pts.map((p,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(p.v).toFixed(1)).join(" ");
  const area = pts.length>1 ? path + ` L${X(pts.length-1).toFixed(1)} ${H-padB} L${X(0).toFixed(1)} ${H-padB} Z` : "";
  const dots = pts.map((p,i)=>{
    const lastP = i===pts.length-1;
    return `<circle cx="${X(i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="${lastP?5:3.5}" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>`;
  }).join("");
  const lastLabel = `<text x="${Math.min(X(pts.length-1), W-padR-4).toFixed(1)}" y="${(Y(pts[pts.length-1].v)-11).toFixed(1)}" text-anchor="${pts.length===1?"middle":"end"}" font-size="12" font-weight="700" fill="var(--ink)" style="font-variant-numeric:tabular-nums;">${fmtKg(pts[pts.length-1].v)}</text>`;
  const xl0 = `<text x="${X(0).toFixed(1)}" y="${H-8}" text-anchor="${pts.length===1?"middle":"start"}" font-size="10.5" fill="var(--ink-mute)">${fmtDateShort(pts[0].date)}</text>`;
  const xl1 = pts.length>1? `<text x="${X(pts.length-1).toFixed(1)}" y="${H-8}" text-anchor="end" font-size="10.5" fill="var(--ink-mute)">${fmtDateShort(pts[pts.length-1].date)}</text>`:"";

  wrap.innerHTML = `<div class="chart-tip" id="chart-tip"></div>
    <svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" id="chart-svg" style="display:block; touch-action:pan-y;">
      ${grid}${ylab}
      ${useGoal? `<line x1="${padL}" y1="${Y(goal).toFixed(1)}" x2="${W-padR}" y2="${Y(goal).toFixed(1)}" stroke="var(--good)" stroke-width="1.5" stroke-dasharray="5 4" opacity=".85"/>
        <text x="${W-padR}" y="${(Y(goal)-6).toFixed(1)}" text-anchor="end" font-size="10.5" font-weight="700" fill="var(--good)">objectif ${fmtKg(goal)}</text>`:""}
      ${area?`<path d="${area}" fill="var(--accent)" opacity="0.10"/>`:""}
      ${pts.length>1?`<path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`:""}
      <line id="cross" x1="0" y1="${padT}" x2="0" y2="${H-padB}" stroke="var(--ink-mute)" stroke-width="1" stroke-dasharray="3 3" style="display:none;"/>
      ${dots}${lastLabel}${xl0}${xl1}
    </svg>`;

  const svg = wrap.querySelector("#chart-svg");
  const tip = wrap.querySelector("#chart-tip");
  const cross = wrap.querySelector("#cross");
  const showTip = clientX=>{
    const rect = svg.getBoundingClientRect();
    const sx = (clientX-rect.left) * (W/rect.width);
    let best=0, bd=1e9;
    pts.forEach((p,i)=>{ const d=Math.abs(X(i)-sx); if(d<bd){bd=d; best=i;} });
    const p = pts[best];
    cross.style.display="block";
    cross.setAttribute("x1", X(best)); cross.setAttribute("x2", X(best));
    tip.style.display="block";
    tip.innerHTML = `${fmtDateShort(p.date)} — <b>${fmtKg(p.v)} ${unit}</b>`;
    const tx = Math.min(Math.max(4, X(best)/W*rect.width - 50), rect.width-110);
    tip.style.left = tx+"px";
    tip.style.top = Math.max(0, Y(p.v)/H*220 - 44)+"px";
  };
  const hide = ()=>{ tip.style.display="none"; cross.style.display="none"; };
  svg.addEventListener("pointerdown", e=>showTip(e.clientX));
  svg.addEventListener("pointermove", e=>{ if(e.pressure>0 || e.pointerType==="mouse") showTip(e.clientX); });
  svg.addEventListener("pointerleave", hide);
}

/* ================= WAKE LOCK (écran allumé pendant la séance) ================= */
let wakeLock = null;
let wakeEtat = ("wakeLock" in navigator) ? "en attente" : "non supporté par ce navigateur";
async function syncWakeLock(){
  const voulu = !!db.active && db.settings.ecranAllume !== false;
  if(!("wakeLock" in navigator)) return;
  try{
    if(voulu){
      if(!wakeLock && !document.hidden){
        wakeLock = await navigator.wakeLock.request("screen");
        wakeEtat = "actif";
        wakeLock.addEventListener("release", ()=>{ wakeLock = null; if(wakeEtat==="actif") wakeEtat = "relâché"; });
      }
    } else if(wakeLock){
      await wakeLock.release(); wakeLock = null; wakeEtat = "inactif hors séance";
    }
  }catch(e){ wakeEtat = "refusé : " + (e && e.name ? e.name : "erreur"); }
}
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) syncWakeLock(); });
/* certains navigateurs n'accordent le verrou qu'après une interaction : on retente au premier contact */
["pointerdown","touchstart"].forEach(ev=>document.addEventListener(ev, ()=>{ if(db.active && !wakeLock) syncWakeLock(); }, {passive:true}));
const _origRender = render;
render = function(){ _origRender(); syncWakeLock(); };

    }
  }catch(e){ diag.idb = "bloqué"; }

  /* fichier de sauvegarde automatique choisi lors d'une session précédente */
  if(fileApiOk()){
    const h = await idbTake(AUTOFILE);
    if(h){
      autoFile.handle = h; autoFile.name = h.name || "";
      try{ autoFile.ok = (await h.queryPermission({mode:"readwrite"})) === "granted"; }catch(e){ autoFile.ok = false; }
    }
  }

  const raw = await idbGet();
  if(!raw){ if(!isEmptyDb(db)) save(); return; }
  let alt=null;
  try{ alt = JSON.parse(raw); }catch(e){ return; }
  if(!alt) return;
  const mine = db.savedAt||0, theirs = alt.savedAt||0;
  if(theirs>mine || (isEmptyDb(db) && !isEmptyDb(alt))){
    db = alt; applyDefaults(); save(); render();
    if(isEmptyDb(db)===false) toast("Données récupérées ✓");
  }
})();
</script>
