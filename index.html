<meta charset="utf-8">
<title>Tonnage</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1b1d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tonnage">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});}</script>
<style>
  :root{
    /* clair : fond crème, bandeau sombre, orange franc — d'après la maquette Figma */
    --bg:#eae7e0; --surface:#ffffff; --surface2:#f2efe9; --border:#e0dbd1;
    --ink:#17181a; --ink-soft:#5c5c5e; --ink-mute:#8e8e90;
    --accent:#f58220; --accent-deep:#d96f10; --accent-ink:#ffffff;
    --hero:#1b1b1d; --hero-ink:#ffffff; --hero-soft:#c9c7c3;
    --good:#3f9c62; --bad:#e0554a;
    --barre:rgba(255,255,255,.96);
    --sheet:#f4f1eb; --field:#ffffff;
    --figure:invert(1);
    --radius:16px;
    --matin:#3ca0e8; --midi:#f58220; --collation:#5b5bd6; --soir:#f2506e; --extra:#4caf50;
  }
  :root[data-theme="dark"]{
    --bg:#141416; --surface:#1f1f22; --surface2:#2a2a2e; --border:#333338;
    --ink:#f4f2ef; --ink-soft:#b3b1ad; --ink-mute:#85837f;
    --accent:#f58220; --accent-deep:#c96a12; --accent-ink:#1a1207;
    --hero:#0e0e10; --hero-ink:#ffffff; --hero-soft:#b0aeaa;
    --good:#6fbf8b; --bad:#e06c5a;
    --barre:rgba(20,20,22,.96);
    --sheet:#1f1f22; --field:#2a2a2e;
    --figure:none;
    --radius:16px;
    --matin:#4aa8ea; --midi:#f58220; --collation:#6f6fe0; --soir:#f2607b; --extra:#5cba60;
  }
  /* Le parcours de profil se lit toujours sur fond clair, même si l'app est en thème sombre :
     ces écrans sont conçus clairs, et on veut la même lecture pour tout le monde. */
  :root[data-onb]{
    --bg:#eae7e0; --surface:#ffffff; --surface2:#f2efe9; --border:#e0dbd1;
    --ink:#17181a; --ink-soft:#5c5c5e; --ink-mute:#8e8e90;
    --accent:#f58220; --accent-deep:#d96f10; --accent-ink:#ffffff;
    --hero:#1b1b1d; --hero-ink:#ffffff; --hero-soft:#c9c7c3;
    --good:#3f9c62; --bad:#e0554a;
    --barre:rgba(255,255,255,.96);
    --sheet:#f4f1eb; --field:#ffffff;
    --figure:invert(1);
  }
  :root[data-onb] .onb-prog{background:#d9d4c9;}
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  /* Aucune règle overflow ici : sur Android, borner la largeur du document
     (hidden comme clip) empêchait tout défilement vertical. */
  html,body{margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:16px; line-height:1.45;
    min-height:100dvh;
    -webkit-font-smoothing:antialiased;
    /* pas de rebond latéral, mais le défilement vertical reste intact */
    overscroll-behavior-x:none;
    overscroll-behavior-y:none;
  }
  #app{max-width:560px; margin:0 auto; padding:calc(16px + env(safe-area-inset-top)) 16px 150px;}
  /* les bandeaux qui défilent gardent leur propre rebond, pas celui de la page */
  .car, .hist-strip{overscroll-behavior-x:contain;}
  h1,h2,h3{margin:0; text-wrap:balance;}
  button{font-family:inherit; font-size:16px; border:none; cursor:pointer; color:inherit; background:none; padding:0;}
  input,select,textarea{font-family:inherit; font-size:16px; color:var(--ink); background:var(--field); border:1px solid var(--border); border-radius:10px; padding:11px 12px; outline:none; width:100%;}
  input:focus,select:focus,textarea:focus{border-color:var(--accent-deep);}
  input[type=number]{font-variant-numeric:tabular-nums;}
  ::placeholder{color:var(--ink-mute);}

  .wordmark{font-weight:800; letter-spacing:.14em; font-size:15px; text-transform:uppercase;}
  .wordmark b{color:var(--accent);}
  .topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:4px;}
  .date-line{color:var(--ink-mute); font-size:13px; margin-bottom:18px; text-transform:capitalize;}

  .label{font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-mute);}
  .section-t i{font-style:normal; font-size:13px; margin-right:6px; vertical-align:-1px;}
  .section-t{font-size:12.5px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft); margin:26px 0 10px;}

  .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px;}
  .stack{display:flex; flex-direction:column; gap:10px;}
  .row{display:flex; align-items:center; gap:10px;}
  .grow{flex:1; min-width:0;}

  .btn{display:flex; align-items:center; justify-content:center; gap:8px; font-weight:700; border-radius:12px; padding:13px 16px; background:var(--surface2); border:1px solid var(--border);}
  .btn:active{transform:scale(.98);}
  .btn-accent{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
  .btn-ghost{background:none; border:1px dashed var(--border); color:var(--ink-soft); font-weight:600;}
  .btn-danger{color:var(--bad);}
  .btn-sm{padding:8px 12px; font-size:14px; border-radius:10px;}
  .icon-btn{width:38px; height:38px; display:flex; align-items:center; justify-content:center; border-radius:10px; background:var(--surface2); border:1px solid var(--border); flex:none; font-size:15px;}

  .pill{font-size:12px; font-weight:600; color:var(--ink-soft); background:var(--surface2); border-radius:99px; padding:3px 9px; white-space:nowrap;}
  .hint-box{display:flex; gap:10px; align-items:flex-start; background:rgba(232,163,61,.10); border:1px solid rgba(232,163,61,.32);
    border-radius:11px; padding:10px 12px; margin-bottom:11px; font-size:12.5px; line-height:1.55; color:var(--ink-soft);}
  .hint-box b{color:var(--ink);}
  .hint-box button{flex:none; font-size:11.5px; font-weight:800; color:var(--accent); padding:2px 4px; align-self:center;}
  .ob-steps{display:flex; gap:5px; margin-bottom:10px;}
  .ob-steps i{flex:1; height:4px; border-radius:2px; background:var(--surface2); transition:background .3s;}
  .ob-steps i.on{background:var(--accent);}
  .start-card{border-color:var(--accent-deep) !important;}
  .start-step{display:flex; gap:10px; align-items:flex-start; margin-bottom:9px; font-size:13.5px; color:var(--ink-soft);}
  .start-step b{color:var(--ink);}
  .start-step .num{flex:none; width:21px; height:21px; border-radius:50%; background:var(--surface2); color:var(--ink-mute);
    font-size:11px; font-weight:800; display:flex; align-items:center; justify-content:center; margin-top:1px;}
  .start-step.done .num{background:var(--good); color:#0d1a12;}
  .start-step.done b{color:var(--ink-mute); text-decoration:line-through;}
  .slider{-webkit-appearance:none; appearance:none; width:100%; height:6px; border-radius:99px; padding:0; border:none;
    background:linear-gradient(90deg, var(--accent-deep), var(--accent)); outline:none;}
  .slider::-webkit-slider-thumb{-webkit-appearance:none; width:26px; height:26px; border-radius:50%; background:var(--accent);
    border:3px solid var(--surface); box-shadow:0 2px 8px rgba(0,0,0,.5); cursor:pointer;}
  .slider::-moz-range-thumb{width:22px; height:22px; border-radius:50%; background:var(--accent); border:3px solid var(--surface); cursor:pointer;}
  .inline-edit{font:inherit; color:inherit; text-align:left; display:inline-flex; align-items:center; gap:6px; border-radius:8px; padding:1px 5px; margin-left:-5px;}
  .inline-edit .pen{font-size:.62em; color:var(--accent); opacity:.75;}
  .inline-edit:active{background:var(--surface2);}
  .tb-save{position:relative; color:var(--ink-soft);}
  .tb-save svg{width:19px; height:19px;}
  .tb-save .tb-dot{position:absolute; top:-2px; right:-2px; width:9px; height:9px; border-radius:50%; background:var(--accent); border:2px solid var(--bg);}

  /* stat tiles */
  .tiles{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
  .tile{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:12px 10px; text-align:left;}
  .tile .v{font-size:22px; font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:-.01em; line-height:1.1;}
  .tile .u{font-size:12px; color:var(--ink-mute); margin-top:2px;}

  /* tab bar */
  /* ---- bandeau sombre incurvé (accueil, alimentation, progression) ---- */
  /* le fond est l'image fournie : forme sombre détourée, transparente ailleurs */
  .hero{position:relative; color:var(--hero-ink);
    margin:calc(-16px - env(safe-area-inset-top)) -16px 0;}
  .hero-bg{display:block; width:100%; height:auto; aspect-ratio:605/446;}
  .hero-bg rect{transition:none;}
  .hero-in{position:absolute; inset:0; padding:calc(14px + env(safe-area-inset-top)) 18px 0;
    display:flex; flex-direction:column;}
  /* tout ce qui suit le bandeau se dessine par-dessus lui */
  #app > *{position:relative; z-index:2;}
  #app > .hero{z-index:1;}
  .hero-top{display:flex; align-items:center; justify-content:space-between; position:relative; z-index:2;}
  .hero-ic{width:31px; height:31px; border-radius:50%; background:#fff; color:#1b1b1d;
    display:flex; align-items:center; justify-content:center; flex:0 0 auto;}
  .hero-ic svg{width:19px; height:19px;}
  .hero-h{position:relative; z-index:2; text-align:center; margin-top:11%;}
  .hero-h h1{font-size:34px; font-weight:800; letter-spacing:-.02em; line-height:1.05;}
  .hero-h .sub{font-size:14px; font-weight:600; color:var(--hero-soft); margin-top:8px;}
  .hero-h .big{font-size:27px; font-weight:800; letter-spacing:.04em; text-transform:uppercase;}
  .under-hero{margin-top:-19%; position:relative; z-index:3;}

  /* ---- carte de la semaine ---- */
  .wk-card{background:var(--surface); border-radius:18px; padding:12px 14px 13px;
    box-shadow:0 6px 22px rgba(0,0,0,.14);}
  .wk-days{display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-bottom:9px;}
  .wk-day i{display:block; height:13px; border-radius:7px; background:var(--surface2); border:1.5px solid transparent;}
  .wk-day.on i{background:var(--accent);}
  .wk-day.today i{border-color:var(--accent-deep); background:transparent;}
  .wk-day.today.on i{background:var(--accent);}
  .wk-day span{display:block; text-align:center; font-size:10.5px; font-weight:700; color:var(--ink-mute); margin-top:3px;}
  .wk-sep{height:1px; background:var(--border); margin:0 -4px 9px;}
  .wk-nums{display:flex; align-items:center; justify-content:space-between; position:relative;}
  .wk-nums .n{flex:1; text-align:center;}
  .wk-nums .v{font-size:21px; font-weight:800; font-variant-numeric:tabular-nums; line-height:1.1;}
  .wk-nums .u{font-size:11px; color:var(--ink-mute);}
  .wk-bilan{position:absolute; left:50%; top:5px; transform:translateX(-50%);
    background:var(--accent); color:var(--accent-ink); font-size:12px; font-weight:800;
    border-radius:99px; padding:3px 12px;}

  /* ---- carrousel de séances ---- */
  .car{--cardw:min(63vw, 320px);
    display:flex; gap:10px; overflow-x:auto; scroll-snap-type:x mandatory;
    margin:0 -16px -14px; padding:16px calc((100% - var(--cardw))/2) 34px; -webkit-overflow-scrolling:touch;}
  .car::-webkit-scrollbar{display:none;}
  .prog-slot{position:relative; flex:0 0 var(--cardw); scroll-snap-align:center; padding-top:13px;
    transform:scale(.86); transform-origin:center 62%; opacity:.72; transition:transform .08s linear, opacity .08s linear;}
  .prog-slot.mid{transform:scale(1); opacity:1;}
  .prog-card{position:relative; width:100%; aspect-ratio:192/279; border-radius:16px;
    overflow:hidden; background:var(--hero); color:#fff; display:block;
    box-shadow:0 7px 12px rgba(0,0,0,.34), 0 16px 30px rgba(0,0,0,.22);}
  .prog-card .ph{position:absolute; inset:0; background-size:cover; background-position:center;}
  .prog-card .ph::after{content:""; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(0,0,0,.15) 0%, rgba(0,0,0,.35) 45%, rgba(0,0,0,.82) 100%);}
  .prog-card .in{position:absolute; inset:0; padding:12px; display:flex; flex-direction:column; justify-content:flex-end;}
  .prog-card .nm{font-size:34px; font-weight:800; letter-spacing:-.02em; line-height:1;}
  .prog-card .ex{font-size:12px; font-weight:600; line-height:1.45; color:rgba(255,255,255,.92); margin-top:6px;}
  .prog-card .dur{position:absolute; top:10px; right:10px; z-index:2; background:rgba(255,255,255,.92);
    color:#1b1b1d; font-size:11px; font-weight:800; border-radius:99px; padding:3px 9px;}
  .prog-card .pen{position:absolute; bottom:10px; right:10px; z-index:2; width:30px; height:30px;
    border-radius:50%; background:rgba(255,255,255,.16); display:flex; align-items:center; justify-content:center; padding:0;}
  .prog-card .pen img{width:17px; height:17px; display:block;}
  .prog-slot .sug{position:absolute; top:0; left:50%; transform:translateX(-50%); z-index:4;
    background:var(--accent); color:var(--accent-ink); font-size:11.5px; font-weight:800;
    border-radius:99px; padding:3px 11px; white-space:nowrap;}
  .car-wrap{position:relative;}

  /* ================= PARCOURS D'ACCUEIL (plein écran) ================= */
  .onb{position:fixed; inset:0; z-index:55; background:var(--bg); color:var(--ink);
    display:flex; flex-direction:column; min-height:100dvh; overflow:hidden;}
  .onb-top{display:flex; align-items:center; gap:12px; padding:calc(14px + env(safe-area-inset-top)) 20px 0;
    width:100%; max-width:540px; margin-inline:auto;}
  .onb-back{width:30px; height:30px; flex:0 0 auto; font-size:22px; line-height:1; color:var(--ink);
    display:flex; align-items:center; justify-content:center;}
  .onb-prog{flex:1; height:7px; border-radius:5px; background:#d9d4c9; overflow:hidden;}
  :root[data-theme="dark"] .onb-prog{background:#33322e;}
  .onb-prog i{display:block; height:100%; border-radius:5px; background:var(--ink); transition:width .3s ease;}
  .onb-x{width:30px; height:30px; flex:0 0 auto; font-size:19px; color:var(--ink-mute);
    display:flex; align-items:center; justify-content:center;}
  .onb-body{flex:1; min-height:0; overflow-y:auto; padding:22px 20px 10px; -webkit-overflow-scrolling:touch;
    width:100%; max-width:540px; margin-inline:auto;}
  .onb-foot{padding:10px 20px calc(18px + env(safe-area-inset-bottom)); width:100%; max-width:540px; margin-inline:auto;}
  .onb h2{font-size:29px; font-weight:800; letter-spacing:-.02em; line-height:1.15; margin:0 0 6px;}
  .onb .sous{font-size:13.5px; color:var(--ink-mute); line-height:1.45; margin-bottom:22px;}
  .onb-btn{width:100%; background:var(--hero); color:#fff; border-radius:14px; padding:16px;
    font-size:16.5px; font-weight:800;}
  .onb-btn[disabled]{opacity:.35;}
  .onb-lien{display:block; width:100%; text-align:center; margin-top:12px; font-size:13.5px; color:var(--ink-soft);}
  .onb-lien b{color:var(--ink); text-decoration:underline;}

  /* choix multiples : apparition bouton par bouton */
  .onb-choix{display:flex; flex-direction:column; gap:9px;}
  .onb-choix .ch{background:var(--surface); border-radius:12px; padding:14px; font-size:14.5px; font-weight:700;
    text-align:center; box-shadow:0 1px 3px rgba(0,0,0,.06); opacity:0; transform:translateY(8px);
    animation:chIn .28s ease forwards;}
  .onb-choix .ch.on{background:var(--accent); color:#fff;}
  .onb-desc{font-size:12.5px; color:var(--ink-soft); text-align:center; line-height:1.5; margin-top:10px;}
  @keyframes chIn{to{opacity:1; transform:none;}}
  /* redessin apres un choix : les boutons sont deja la, ils ne rejouent pas l'apparition */
  .onb-choix .ch.fixe{animation:none; opacity:1; transform:none;}
  @media (prefers-reduced-motion:reduce){ .onb-choix .ch{animation:none; opacity:1; transform:none;} }

  /* saisie du prénom */
  .onb-nom{width:100%; border:none; background:none; padding:0; font-size:31px; font-weight:800;
    color:var(--ink); outline:none;}
  .onb-nom::placeholder{color:var(--ink-mute); opacity:.55;}

  /* roulettes de sélection */
  .onb-rou{display:flex; gap:18px; justify-content:center;}
  .rou{flex:1; max-width:190px; text-align:center;}
  .rou-t{font-size:13px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; margin-bottom:6px;}
  .rou-box{position:relative; height:238px; overflow:hidden;
    -webkit-mask-image:linear-gradient(#0000, #000 22%, #000 78%, #0000);
    mask-image:linear-gradient(#0000, #000 22%, #000 78%, #0000);}
  .rou-band{position:absolute; left:0; right:0; top:50%; height:40px; transform:translateY(-50%);
    background:var(--accent); border-radius:10px; pointer-events:none;}
  .rou-scroll{position:relative; height:100%; overflow-y:scroll; scroll-snap-type:y mandatory;
    scrollbar-width:none; -webkit-overflow-scrolling:touch; z-index:2;}
  .rou-scroll::-webkit-scrollbar{display:none;}
  .rou-vide{height:99px;}
  .regle-vide{flex:0 0 50%;}
  .onb-lab{font-size:12px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:3px;}
  .onb-aide{font-size:12.5px; color:var(--ink-mute); line-height:1.5; margin-bottom:9px;}
  .proj-txt{font-size:12.5px; color:var(--ink-mute); text-align:center; line-height:1.55; margin-top:6px;}
  .proj-duo{display:flex; gap:10px; text-align:center;}
  .proj-duo > div{flex:1;}
  .proj-duo b{display:block; font-size:22px; font-weight:800;}
  .proj-duo span{font-size:11.5px; color:var(--ink-mute);}
  .rou-i{height:40px; line-height:40px; scroll-snap-align:center; font-size:21px; font-weight:700;
    color:var(--ink-soft); transition:color .12s;}
  .rou-i.mid{color:#fff; font-weight:800;}
  .rou-unite{display:inline-flex; gap:2px; background:var(--hero); border-radius:99px; padding:3px; margin-top:10px;}
  .rou-unite button{padding:5px 13px; border-radius:99px; font-size:12px; font-weight:800; color:rgba(255,255,255,.6);}
  .rou-unite button.on{background:#fff; color:var(--hero);}

  /* règle graduée du poids cible */
  .regle{position:relative; margin-top:6px;}
  .regle-val{text-align:center; font-size:32px; font-weight:800; letter-spacing:-.01em;}
  .regle-lab{text-align:center; font-size:13px; color:var(--ink-soft); margin-bottom:2px;}
  .regle-box{position:relative; height:98px; overflow:hidden;
    -webkit-mask-image:linear-gradient(90deg, transparent, #000 18%, #000 82%, transparent);
    mask-image:linear-gradient(90deg, transparent, #000 18%, #000 82%, transparent);}
  .regle-scroll{height:100%; overflow-x:scroll; scroll-snap-type:x mandatory; display:flex; align-items:flex-start;
    scrollbar-width:none; padding-top:12px;}
  .regle-scroll::-webkit-scrollbar{display:none;}
  .regle-t{flex:0 0 10px; scroll-snap-align:center; display:flex; justify-content:center;
    transform-origin:top center; will-change:transform;}
  .regle-t i{width:2px; border-radius:2px; background:var(--ink-mute); opacity:.5;}
  .regle-t.maj i{opacity:1; background:var(--ink);}
  .regle-aig{position:absolute; left:50%; top:4px; width:3px; height:46px; border-radius:2px;
    background:var(--accent); transform:translateX(-50%); pointer-events:none;}

  /* carrousel d'introduction */
  .onb-hero{display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; padding-top:8px;}
  .onb-tel{position:relative; flex:1 1 auto; min-height:0; width:100%; max-width:300px; margin-bottom:22px;}
  .onb-tel img{position:absolute; inset:0; width:100%; height:100%; object-fit:contain;
    opacity:0; transition:opacity .55s ease;}
  .onb-tel img.on{opacity:1;}
  .onb-titre{font-size:27px; font-weight:800; text-align:center; line-height:1.2; min-height:66px;
    transition:opacity .3s ease;}
  .onb-dots{display:flex; gap:7px; justify-content:center; margin-top:16px;}
  .onb-dots i{width:7px; height:7px; border-radius:50%; background:var(--ink-mute); opacity:.35;}
  .onb-dots i.on{opacity:1; background:var(--ink);}

  /* projection */
  .proj{background:var(--surface); border-radius:16px; padding:16px 14px;}
  .proj h3{font-size:15px; font-weight:800; margin-bottom:10px;}

  /* ---- jauge de récupération ---- */
  .recup-card{display:flex; align-items:center; gap:11px; width:100%; margin-top:14px;
    background:var(--hero); color:#fff; border-radius:16px; padding:10px 14px 10px 10px;
    box-shadow:0 5px 16px rgba(0,0,0,.18);}
  .recup-card .rc-ring{flex:0 0 auto; display:block; line-height:0;}
  .recup-card .rc-t{display:block; font-size:11px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:rgba(255,255,255,.55);}
  .recup-card .rc-s{display:block; font-size:15px; font-weight:800; margin-top:2px;}
  .recup-card .rc-bar{flex:0 0 64px; height:7px; border-radius:5px; background:rgba(255,255,255,.16); overflow:hidden;}
  .recup-card .rc-bar i{display:block; height:100%; border-radius:5px;}
  .mp-body .mp-fig{max-width:118px;}

  /* ---- bouton + flottant ---- */
  .fab{width:58px; height:58px; border-radius:50%; background:var(--accent); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:31px; font-weight:300;
    box-shadow:0 6px 18px rgba(245,130,32,.42); line-height:1;}
  .fab-row{display:flex; justify-content:flex-end; margin:2px 4px 0;}

  /* ---- bandeau historique ---- */
  .hist-strip{display:flex; gap:8px; overflow-x:auto; margin:0 -16px; padding:2px 16px 14px;}
  .hist-strip::-webkit-scrollbar{display:none;}
  .hist-c{position:relative; flex:0 0 108px; height:112px; border-radius:12px; overflow:hidden;
    background:var(--hero); color:#fff; text-align:left;}
  .hist-c .ph{position:absolute; inset:0; background-size:cover; background-position:center;}
  .hist-c .ph::after{content:""; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(0,0,0,.28) 0%, rgba(0,0,0,.72) 100%);}
  .hist-c .in{position:absolute; inset:0; padding:8px 9px; display:flex; flex-direction:column; justify-content:flex-end;}
  .hist-c .dt{position:absolute; top:7px; left:50%; transform:translateX(-50%); z-index:2;
    background:rgba(255,255,255,.9); color:#1b1b1d; font-size:9.5px; font-weight:800;
    border-radius:99px; padding:2px 7px; white-space:nowrap;}
  .hist-c .nm{font-size:15px; font-weight:800; line-height:1.1;}
  .hist-c .st{font-size:10px; font-weight:600; line-height:1.4; color:rgba(255,255,255,.9); margin-top:3px;}

  /* ---- alimentation : jauges, onglets de repas, pastilles ---- */
  .eat-card{background:var(--surface); border-radius:16px; padding:13px 15px 15px; box-shadow:0 6px 22px rgba(0,0,0,.16);}
  .eat-line{display:flex; align-items:baseline; gap:8px; justify-content:center;}
  .eat-line .v{font-size:29px; font-weight:800; font-variant-numeric:tabular-nums; line-height:1.05;}
  .eat-line .l{font-size:12.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-soft);}
  .eat-bar{height:16px; border-radius:9px; background:var(--surface2); overflow:hidden; margin:6px 0 12px; position:relative;}
  .eat-bar i{display:block; height:100%; border-radius:9px; background:var(--accent);}
  .eat-bar b{position:absolute; right:9px; top:0; line-height:16px; font-size:11px; font-weight:700; color:var(--ink-mute);}
  .eat-side{display:flex; flex-direction:column; gap:9px; justify-content:center;}
  .eat-side button{width:38px; height:38px; border-radius:11px; background:var(--surface); color:var(--ink);
    display:flex; align-items:center; justify-content:center; box-shadow:0 3px 10px rgba(0,0,0,.18);}
  .eat-side svg{width:21px; height:21px;}

  /* les onglets passent DERRIÈRE le panneau blanc : leur bas est masqué, aucun trou possible */
  .meal-tabs{display:flex; gap:5px; margin:18px 0 0; position:relative; z-index:1; align-items:flex-end;}
  /* chaque onglet porte un bloc blanc qui rejoint le panneau : la couleur encadre la page */
  .meal-tab{position:relative; flex:1; border-radius:13px 13px 0 0; background:var(--surface2); color:var(--ink-mute);
    font-size:9.5px; font-weight:800; letter-spacing:.02em; text-transform:uppercase;
    padding:7px 2px 24px; text-align:center; transform:translateY(16px);
    /* les onglets au repos sont ombrés en bas : ils paraissent glissés sous la page */
    box-shadow:inset 0 -13px 11px -10px rgba(0,0,0,.22);
    transition:transform .34s cubic-bezier(.34,1.56,.64,1), background .22s ease, color .22s ease, box-shadow .22s ease;}
  /* le bloc blanc ne se voit que sur l onglet choisi : abaissé, il passe entièrement sous le panneau */
  .meal-tab i{position:absolute; left:5px; right:5px; bottom:0; height:16px; display:block;
    /* pas de fondu : à mi-transition le bloc laissait voir la couleur de l onglet
       et ne paraissait plus tout à fait du même blanc que la page. Il monte, il ne s efface pas. */
    border-radius:8px 8px 0 0; background:var(--surface); opacity:0;}
  .meal-tab.on{transform:translateY(0); color:#fff; box-shadow:none;}
  .meal-tab.on i{opacity:1;}
  @media (prefers-reduced-motion:reduce){ .meal-tab{transition:background .2s ease, color .2s ease;} }
  @keyframes repasIn{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:none;}}
  .meal-panel.swap{animation:repasIn .3s cubic-bezier(.22,.9,.35,1);}
  @media (prefers-reduced-motion:reduce){ .meal-panel.swap{animation:none;} }
  .meal-panel{background:var(--surface); border-radius:0 0 14px 14px; padding:16px 13px 22px; position:relative; z-index:2;
    /* décalage et retrait choisis pour que le flou ne déborde jamais au-dessus du panneau :
       il grisait le bas du bloc blanc de l onglet, qui ne paraissait plus du même blanc que la page */
    box-shadow:0 14px 22px -6px rgba(0,0,0,.12); min-height:52vh;}
  .meal-h{font-size:10.5px; font-weight:800; letter-spacing:.1em; text-transform:uppercase;
    color:var(--ink-mute); text-align:center; margin:2px 0 9px;}
  .fgrid{display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-bottom:16px;}
  .fchip{display:flex; align-items:center; gap:6px; background:var(--surface); border:1px solid var(--border);
    border-radius:10px; padding:7px 8px; text-align:left; min-width:0;}
  .fchip .ic{font-size:14px; flex:0 0 auto;}
  .fchip .tx{flex:1; min-width:0;}
  .fchip .nm{display:block; font-size:11.5px; font-weight:700; line-height:1.2; overflow-wrap:break-word; hyphens:auto;}
  .fchip .q{display:block; font-size:9.5px; line-height:1.3; color:var(--ink-mute); margin-top:1px;}
  .fchip .g{margin-left:auto; font-size:12px; font-weight:800; flex:0 0 auto;}
  .fchip.on{color:#fff; border-color:transparent;}
  .fchip.on .q{color:rgba(255,255,255,.8);}
  .fab-center{display:flex; justify-content:center; margin-top:14px;}

  .tabbar{position:fixed; left:0; right:0; bottom:0; z-index:40; background:var(--barre); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); border-top:1px solid var(--border); padding-bottom:env(safe-area-inset-bottom);}
  .tabbar-in{max-width:560px; margin:0 auto; display:flex;}
  .tab{flex:1; display:flex; flex-direction:column; align-items:center; gap:5px; padding:11px 0 9px; color:var(--ink-mute); font-size:11px; font-weight:700; letter-spacing:.01em;}
  .tab svg{width:22px; height:22px;}
  .tab.on{color:var(--accent);}

  /* rest timer */
  .restbar{position:fixed; left:12px; right:12px; bottom:calc(64px + env(safe-area-inset-bottom)); z-index:45; max-width:536px; margin:0 auto;
    background:var(--accent); color:var(--accent-ink); border-radius:16px; padding:10px 14px;
    display:none; align-items:center; gap:10px; box-shadow:0 8px 30px rgba(0,0,0,.5);
    touch-action:none; transition:top .22s ease, bottom .22s ease;}
  /* posé en haut de l'écran */
  .restbar.haut{bottom:auto; top:calc(10px + env(safe-area-inset-top));}
  .restbar.drag{transition:none; box-shadow:0 14px 40px rgba(0,0,0,.55); cursor:grabbing;}
  .restbar .grip{width:16px; flex:0 0 auto; display:flex; flex-direction:column; gap:3px; opacity:.5; margin-right:2px;}
  .restbar .grip i{display:block; height:2px; border-radius:2px; background:var(--accent-ink);}
  .restbar.show{display:flex;}
  .restbar .t{font-size:26px; font-weight:800; font-variant-numeric:tabular-nums; min-width:86px;}
  .restbar .lbl{font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; opacity:.75;}
  .restbar button{background:rgba(26,20,8,.14); border-radius:10px; padding:8px 12px; font-weight:800; font-size:14px; color:var(--accent-ink);}
  .restbar .bar{position:absolute; left:14px; right:14px; bottom:5px; height:3px; border-radius:2px; background:rgba(26,20,8,.18); overflow:hidden;}
  .restbar .bar i{display:block; height:100%; background:var(--accent-ink); border-radius:2px;}
  @keyframes flashEnd{0%,100%{background:var(--accent);}50%{background:#fff;}}
  .restbar.ending{animation:flashEnd .5s 3;}
  .restbar.paused{background:var(--surface2); color:var(--ink);}
  .restbar.paused button{background:var(--surface); color:var(--ink);}
  .restbar.paused .bar{display:none;}

  /* workout */
  .chrono{font-variant-numeric:tabular-nums; font-weight:800; font-size:15px; color:var(--accent);}
  .ex-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px;}
  .ex-head{display:flex; align-items:baseline; gap:8px; margin-bottom:2px;}
  .ex-name{font-size:17px; font-weight:700;}
  .hint{font-size:12.5px; color:var(--ink-mute); margin-bottom:10px;}
  .set-row{display:grid; grid-template-columns:26px 1fr 1fr 34px 44px; gap:8px; align-items:center; margin-bottom:8px;}
  .set-row .dg{width:34px; height:42px; border-radius:10px; border:1px dashed var(--border); background:none;
    color:var(--accent); font-size:16px; font-weight:700; display:flex; align-items:center; justify-content:center;}
  .set-row.done .dg{opacity:.55;}
  .set-row .n{font-size:13px; font-weight:700; color:var(--ink-mute); font-variant-numeric:tabular-nums;}
  .set-row input{text-align:center; padding:9px 6px;}
  .set-row .ck{width:44px; height:42px; border-radius:10px; border:1px solid var(--border); background:var(--surface2); display:flex; align-items:center; justify-content:center; font-size:17px; color:var(--ink-mute);}
  .set-row.done input{background:var(--surface); color:var(--ink-soft); border-color:transparent;}
  .set-row.warm .n{font-size:10px; letter-spacing:.02em; color:var(--accent); font-weight:800;}
  .set-row.warm input{border-style:dashed;}
  .inj-note{background:rgba(224,108,90,.12); border:1px solid rgba(224,108,90,.35); border-radius:10px; padding:9px 11px; margin-bottom:10px; font-size:12.5px; line-height:1.5; color:var(--ink-soft);}
  .inj-note b{color:var(--bad);}
  .inj-swap{color:var(--accent); font-weight:700; text-decoration:underline; font-size:12.5px;}
  .set-row.done .ck{background:var(--good); border-color:var(--good); color:#0d1a12;}
  .rir-ask{background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:10px 12px; margin:2px 0 10px;}
  .rir-ask .q{font-size:13.5px; font-weight:600; margin-bottom:8px; color:var(--ink-soft);}
  .rir-ask .q.ok{margin:0; color:var(--accent);}
  .rir-ask .row button{flex:1; background:var(--surface); border:1px solid var(--border); border-radius:9px; padding:9px 0; font-weight:700; font-size:14px;}
  .icon-btn.inj-btn{color:var(--bad); font-size:15px;}
  .icon-btn svg{width:17px; height:17px;}
  .chrono.pause{opacity:.5;}
  .chrono::after{content:"";}
  .hist-ex-line{font-size:13.5px; color:var(--ink-soft); line-height:1.6;}
  .rir-lourd{display:block; width:100%; margin-top:7px; padding:9px; border-radius:10px;
    border:1px dashed var(--border); background:none; color:var(--ink-mute); font-size:12.5px; font-weight:700;}
  .set-row.drop{margin-top:-3px;}
  .set-row.drop .n{font-size:14px; color:var(--accent); text-align:right;}
  .set-row.drop input{padding:6px 6px; font-size:13.5px; background:var(--surface2);}
  .set-row.drop .ck{width:44px; height:34px; font-size:14px; color:var(--bad); background:none; border-style:dashed;}
  .set-cols{display:grid; grid-template-columns:26px 1fr 1fr 34px 44px; gap:8px; margin-bottom:6px;}
  .set-cols span{font-size:10.5px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-mute); text-align:center;}

  /* list rows */
  .lrow{display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:13px 14px;}
  .lrow .t1{font-weight:700;}
  .lrow .t2{font-size:12.5px; color:var(--ink-mute);}

  /* chips */
  .chips{display:flex; gap:6px; flex-wrap:wrap;}
  .chip{padding:7px 13px; border-radius:99px; font-size:13.5px; font-weight:600; background:var(--surface); border:1px solid var(--border); color:var(--ink-soft);}
  .chip.on{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}

  /* chart */
  .chart-wrap{position:relative; margin-top:6px;}
  .chart-tip{position:absolute; pointer-events:none; background:var(--surface2); border:1px solid var(--border); border-radius:9px; padding:6px 9px; font-size:12.5px; display:none; white-space:nowrap; box-shadow:0 4px 16px rgba(0,0,0,.4); z-index:5;}
  .chart-tip b{font-variant-numeric:tabular-nums;}

  /* modal */
  .overlay{position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:60; display:none; align-items:flex-end; justify-content:center;}
  .overlay.show{display:flex;}
  .sheet{background:var(--surface); border-radius:20px 20px 0 0; width:100%; max-width:560px; max-height:88dvh; overflow-y:auto; padding:18px 16px calc(24px + env(safe-area-inset-bottom)); border-top:1px solid var(--border);}
  .sheet h3{font-size:18px; margin-bottom:14px; text-align:center; padding:0 34px;}
  /* croix de fermeture, présente sur toutes les fiches */
  .sheet-x{position:absolute; top:10px; right:12px; z-index:5; width:32px; height:32px; border-radius:50%;
    background:var(--surface2); color:var(--ink-soft); display:flex; align-items:center; justify-content:center;
    font-size:17px; line-height:1;}
  .sheet{position:relative;}
  .sheet{background:var(--sheet);}
  /* ---- fiche « nouvelle séance » ---- */
  .f-lab{font-size:10.5px; font-weight:800; letter-spacing:.11em; text-transform:uppercase; color:var(--ink-mute); display:block; margin-bottom:6px;}
  .tpl-item{background:var(--field); border:1px solid var(--border); border-radius:12px; padding:10px 11px; margin-bottom:8px;}
  .tpl-item .cfg{display:grid; grid-template-columns:1fr 1fr 1fr; gap:7px; margin-top:8px;}
  .tpl-item .cfg .label{font-size:9px; letter-spacing:.08em; text-align:center; display:block; margin-bottom:3px;}
  .tpl-item .cfg input{text-align:center; padding:7px 4px; font-size:14px; background:var(--sheet);}
  .tpl-vide{text-align:center; font-size:13.5px; color:var(--ink-mute); padding:12px 0 14px;}
  .btn-dash{border:1px dashed var(--border); background:none; color:var(--ink-soft); font-weight:700;
    border-radius:12px; padding:12px; width:100%;}
  /* ---- fiche « choisir un exercice » ---- */
  .pk-h{font-size:11px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--accent); margin:14px 0 7px;}
  .pk-row{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--border);}
  .pk-row .th{width:44px; height:44px; border-radius:9px; background:var(--surface2); flex:0 0 auto;
    display:flex; align-items:center; justify-content:center;}
  .pk-row .nm{font-size:14px; font-weight:700; line-height:1.25;}
  .pk-row .eq{font-size:11.5px; color:var(--ink-mute);}
  .pk-add{width:26px; height:26px; border-radius:50%; background:var(--accent); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:17px; font-weight:600; flex:0 0 auto;}
  .grab{width:44px; height:5px; border-radius:3px; background:var(--ink-mute); opacity:.55; margin:0 auto 6px;}
  .grab::after{content:""; display:block; height:14px;}   /* zone de préhension plus large au doigt */
  .sheet{touch-action:pan-y;}

  .hb-row{display:flex; align-items:center; gap:10px; background:var(--surface2); border:1px solid var(--border); border-radius:11px; padding:11px 12px; font-weight:600; font-size:14.5px;}
  .hb-row .hb-ck{width:24px; height:24px; flex:none; border-radius:8px; border:1.5px solid var(--border); background:var(--surface); display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:800;}
  .hb-row.on{border-color:var(--accent-deep);}
  .hb-row.on .hb-ck{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
  .hb-row.on .hb-lbl{color:var(--ink-soft); text-decoration:line-through; text-decoration-color:var(--ink-mute);}
  .hb-row{width:100%;}
  .hb-lbl{font:inherit; font-weight:600; padding:2px 0;}
  .hb-caret{flex:none; width:26px; color:var(--ink-mute); font-size:13px;}
  .hb-sub{padding:9px 4px 4px 12px; display:flex; flex-direction:column; gap:9px;}
  .chip-sm{padding:6px 10px; font-size:12.5px;}
  .chip-sm i{font-style:normal; font-size:10.5px; color:var(--ink-mute); margin-left:4px; font-weight:700;}
  .chip-sm.on i{color:var(--accent-ink); opacity:.7;}
  .pr-plot{position:relative; display:flex; gap:5px; align-items:flex-end; height:132px; padding-left:32px;}
  .pr-target{position:absolute; left:32px; right:0; border-top:1.5px dashed var(--ink-mute); opacity:.7; z-index:2;}
  .pr-target i{position:absolute; left:-32px; top:-8px; font-style:normal; font-size:10.5px; font-weight:700; color:var(--ink-mute); background:var(--surface); padding:0 2px;}
  .pr-col{flex:1; display:flex; flex-direction:column; justify-content:flex-end; height:100%; padding:0; background:none; border:none; min-width:0;}
  .pr-col .pr-val{height:17px; line-height:17px; font-size:11px; font-weight:800; font-variant-numeric:tabular-nums; text-align:center;}
  .pr-col .pr-barwrap{flex:1; display:flex; align-items:flex-end; width:100%;}
  .pr-col .pr-b{width:100%; border-radius:4px 4px 2px 2px; display:block;}
  .pr-col:active .pr-b{opacity:.6;}
  .pr-labels{display:flex; gap:5px; margin-top:5px; padding-left:32px;}
  .pr-labels span{flex:1; text-align:center; font-size:11px; font-weight:700; color:var(--ink-mute);}
  .week-dots{display:flex; gap:8px; margin:12px 0 14px;}
  .wd{flex:1; text-align:center;}
  .wd i{display:block; height:26px; border-radius:9px; background:var(--surface2); border:1px solid var(--border); margin-bottom:4px;}
  .wd.on i{background:var(--accent); border-color:var(--accent);}
  .wd.today i{border-color:var(--accent-deep); border-width:2px;}
  .wd span{font-size:10px; font-weight:700; color:var(--ink-mute); letter-spacing:.05em;}
  .wd.today span{color:var(--accent);}
  .wk-stats{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; border-top:1px solid var(--border); padding-top:12px;}
  .wk-stats .v{font-weight:800; font-size:15.5px; font-variant-numeric:tabular-nums;}
  .wk-stats .u{font-size:11px; color:var(--ink-mute);}
  .hscroll{display:flex; gap:10px; overflow-x:auto; scroll-snap-type:x mandatory; margin:0 -16px; padding:0 16px 6px; scrollbar-width:none;}
  .hscroll::-webkit-scrollbar{display:none;}
  .sess-card{flex:0 0 76%; max-width:260px; scroll-snap-align:start; background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:14px;}
  .sugg-badge{display:inline-block; font-size:10.5px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--accent-ink); background:var(--accent); border-radius:99px; padding:3px 9px; margin-bottom:8px;}
  /* ---- écran Progression ---- */
  .card-t{font-size:21px; font-weight:800; letter-spacing:-.01em; line-height:1.15;}
  .card-sub{font-size:13px; color:var(--ink-soft); margin-top:1px;}
  .card-i{width:20px; height:20px; flex:0 0 auto; border-radius:50%; border:1.5px solid var(--accent);
    color:var(--accent); font-size:12px; font-weight:800; line-height:1;
    display:inline-flex; align-items:center; justify-content:center; vertical-align:2px;}
  /* jauge de progression vers le poids visé */
  .jauge{height:15px; border-radius:99px; background:var(--surface2); border:1px solid var(--border);
    overflow:hidden; margin-top:12px;}
  .jauge i{display:block; height:100%; border-radius:99px; background:var(--accent); transition:width .35s ease;}
  .jauge-txt{text-align:center; font-size:12.5px; color:var(--ink-mute); margin-top:7px;}
  /* languette qui déplie un graphique, à cheval sur le bas de la carte */
  .pli{display:flex; justify-content:center; margin-top:-12px; position:relative; z-index:4;}
  .pli button{display:flex; align-items:center; justify-content:center; gap:6px;
    background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:6px 20px;
    box-shadow:0 3px 10px rgba(0,0,0,.08); color:var(--ink-soft);}
  .pli svg{width:17px; height:11px; transition:transform .25s ease;}
  .pli button[aria-expanded="true"] svg{transform:rotate(180deg);}
  /* bloc d'analyse repliable */
  .depli{border:1.5px dashed var(--border); border-radius:12px; margin-top:14px; overflow:hidden;}
  .depli-h{width:100%; display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:12px 14px; font-size:15px; font-weight:800; color:var(--ink);}

  .mp-bodies{display:flex; justify-content:center; gap:14px; margin:10px 0 16px; border-radius:12px;}
  
  .mp-fig{position:relative; width:46%; max-width:160px;}
  /* base blanche > muscles colorés > lignes : la base reste blanche dans les deux thèmes */
  .mp-fig .mp-base{width:100%; display:block;}
  /* les calques suivent le format de la silhouette (658 × 1200), jamais la hauteur du cadre :

  .mp-fig .mp-lignes{position:absolute; top:0; left:0; width:100%; aspect-ratio:658/1200; height:auto;

  .mp-fig svg{position:absolute; inset:0; width:100%; height:100%;}

/* exercices où la charge est ton propre corps : le champ kg sert au lest éventuel */
function estPoidsDuCorps(ex){ return ex && (ex.equip==="Poids du corps" || ex.equip==="Barre fixe"); }
function serieEchauffement(exId, reps){
  const ex = getEx(exId);
  const rng = parseReps(reps);
  const cible = rng ? rng.lo : 8;
  if(estPoidsDuCorps(ex)){
    /* impossible d'alléger : on fait moins de répétitions, pas plus */
    return {w:"", r:Math.max(3, Math.round(cible/2)), done:false, warm:true};
  }
  const last = lastPerf(exId);
  const w = last ? Math.max(0, Math.round(Math.max(...last.sets.map(s=>s.w||0))*0.5/2.5)*2.5) : "";
  return {w, r:Math.min(12, cible+4), done:false, warm:true};
}
function altsFor(exId){
  const ex = getEx(exId);
  const names = ALTS[ex.name] || [];
  const out = [];
  names.forEach(n=>{ const e = allEx().find(x=>x.name===n); if(e) out.push(e); });
  allEx().forEach(e=>{ if(e.muscle===ex.muscle && e.id!==exId && !out.some(o=>o.id===e.id)) out.push(e); });
  return out;
}

const NIVEAU_COULEUR = {3:"var(--bad)", 2:"#e8a33d", 1:"var(--good)"};
const NIVEAU_TEXTE = {3:"forte", 2:"moyenne", 1:"légère"};
function musclesHtml(exName, max){
  const list = MUSCLE_WORK[exName];
  if(!list) return "";
  return `<span class="mw">${list.slice(0, max||4).map(([m,n])=>
    `<span class="mw-item" title="Sollicitation ${NIVEAU_TEXTE[n]}"><i style="background:${NIVEAU_COULEUR[n]};"></i>${esc(m)}</span>`).join("")}</span>`;
}

/* fiche complète d'un exercice : anatomie, exécution, conseil */
function exoBodyHtml(exName, back){
  const cle = back? "back" : "front";
  const niveaux = {};
  (MUSCLE_WORK[exName]||[]).forEach(([m,n])=>{
    const g = groupeDe(m);
    if(g && (!niveaux[g] || n>niveaux[g])) niveaux[g] = n;
  });
  const masques = MASK_OK[cle].filter(m=>niveaux[m])
    .map(m=>masqueHtml(cle, m, {color:NIVEAU_COULEUR[niveaux[m]], op: niveaux[m]===3? 1 : (niveaux[m]===2? 0.75 : 0.5)})).join("");
  if(!masques) return "";
  return `<div class="mp-fig" style="max-width:110px;">
    <img class="mp-base" src="${MASK_DIR}${cle}-base.png" alt="${back?'dos':'face'}" onerror="figKo(this)">
    ${masques}
    <img class="mp-lignes" src="${MASK_DIR}${cle}-ligne.png" alt="" aria-hidden="true" onerror="figKo(this)">
    <div style="text-align:center; font-size:9.5px; font-weight:800; letter-spacing:.1em; color:var(--ink-mute); margin-top:2px;">${back?"VUE DOS":"VUE FACE"}</div></div>`;
}
function openExoInfo(exId){
  const ex = getEx(exId);
  const info = EXO_INFO[ex.name];
  const note = injuryNote(ex.name);
  const muscles = MUSCLE_WORK[ex.name] || [];
  const principaux = muscles.filter(([m,n])=>n===3);
  const assistes = muscles.filter(([m,n])=>n<3);
  /* on n'affiche que les vues où l'exercice a réellement des zones */
  const face = exoBodyHtml(ex.name,false), dos = exoBodyHtml(ex.name,true);
  openSheet(`
    <div class="row" style="gap:12px; align-items:center; margin-bottom:4px;">
      ${exIcon(ex)}
      <div class="grow"><h3 style="margin:0;">${esc(ex.name)}</h3>
      <div style="font-size:12.5px; color:var(--ink-mute);">${esc(ex.equip||"")} · ${esc(ex.muscle)}</div></div>
    </div>
    ${note? `<div class="inj-note" style="margin:12px 0;">⚠️ <b>${esc(note.injury)} sensible.</b> ${esc(note.tip)}</div>`:""}
    ${info? `<div class="astuce"><div class="label" style="color:var(--accent); margin-bottom:5px;">✨ Astuce de pro</div>${esc(info.tip)}</div>`:""}
    ${info? `<div class="label" style="margin:16px 0 8px;">Comment l'exécuter · ${info.steps.length} étapes</div>
      <div>${info.steps.map((t,i)=>`<div class="etape"><span class="num">${String(i+1).padStart(2,"0")}</span><span>${esc(t)}</span></div>`).join("")}</div>`
      : `<div style="font-size:13px; color:var(--ink-mute); margin:14px 0;">Pas encore de fiche d'exécution pour cet exercice.</div>`}
    ${muscles.length? `<div class="label" style="margin:18px 0 8px;">Muscles sollicités</div>
      <div class="row" style="gap:14px; align-items:flex-start;">
        ${(face||dos)? `<div class="row" style="gap:6px; flex:0 0 auto;">${face}${dos}</div>`:""}
        <div class="grow">
          ${principaux.map(([m])=>`<div style="margin-bottom:8px;">
            <div class="mw-item" style="font-size:10.5px; color:var(--bad); letter-spacing:.08em;"><i style="background:var(--bad);"></i>PRINCIPAL</div>
            <div style="font-size:16px; font-weight:800; line-height:1.2;">${esc(m)}</div>
          </div>`).join("")}
          ${assistes.length? `<div class="mw-item" style="font-size:10.5px; letter-spacing:.08em; margin-top:10px;"><i style="background:var(--ink-mute);"></i>ASSISTÉS · ${assistes.length}</div>
            <div style="font-size:13.5px; color:var(--ink-soft); line-height:1.7;">${assistes.map(([m,n])=>`${esc(m)} <span style="color:${NIVEAU_COULEUR[n]};">●</span>`).join("<br>")}</div>`:""}
        </div>
      </div>`:""}
    <button class="btn btn-accent" id="ei-ok" style="width:100%; margin-top:18px;">Fermer</button>`);
  document.getElementById("ei-ok").onclick = closeSheet;
}

function injuryNote(exName){
  const list = (db.profile && db.profile.injuries) || [];
  for(const id of list){
    const rule = INJURY_RULES[id] && INJURY_RULES[id][exName];
    if(rule){
      const lab = (INJURIES.find(x=>x.id===id)||{}).label || id;
      return {injury:lab, tip:rule.tip, alts:rule.alts};
    }
  }
  return null;
}

/* Recalage : compare ce que tu as réellement mangé avec l'évolution réelle du poids.
   7 700 kcal ≈ 1 kg. Si le poids ne bouge pas, ta dépense = ce que tu manges. */
function tdeeMesure(){
  const jours = Object.keys(db.habitSel||{}).filter(k=>dayKcal(k) > 800).sort();
  if(jours.length < 10) return null;                       /* pas assez de jours renseignés */
  const debut = jours[0], fin = jours[jours.length-1];
  const nJours = Math.round((new Date(fin) - new Date(debut))/864e5) + 1;
  if(nJours < 14) return null;                             /* il faut au moins deux semaines */
  if(jours.length < nJours*0.6) return null;               /* trop de trous dans le suivi */
  const moyKcal = jours.reduce((a,k)=>a+dayKcal(k),0)/jours.length;
  const pesees = (db.weights||[]).map(w=>({t:new Date(w.date), kg:w.kg}))
                   .filter(w=>w.t >= new Date(debut) && w.t <= new Date(fin+"T23:59:59"))
                   .sort((a,b)=>a.t-b.t);
  if(pesees.length < 2) return null;
  const dKg = pesees[pesees.length-1].kg - pesees[0].kg;
  const dJours = Math.max(7, (pesees[pesees.length-1].t - pesees[0].t)/864e5);
  const tdee = moyKcal - (dKg*7700)/dJours;
  if(!(tdee > 1200) || tdee > 6000) return null;
  return {tdee:Math.round(tdee), jours:jours.length, moyKcal:Math.round(moyKcal), dKg:Math.round(dKg*10)/10, dJours:Math.round(dJours)};
}

  if(!p || !(p.weight>0) || !(p.height>0) || !(p.age>0) || !(p.goalWeight>0)) return null;
  const bmr = 10*p.weight + 6.25*p.height - 5*p.age
            + (p.sex==="f" ? -161 : (p.sex==="n" ? -78 : 5));   /* "n" : moyenne des deux */
  let tdee = bmr * (ACTIVITY[p.days]||1.55) * (METAB_ADJ[p.metab]||1);
  /* correction manuelle (réglages) puis mesure réelle : le vécu prime sur la formule */
  const mesure = (typeof tdeeMesure === "function") ? tdeeMesure() : null;
  let tdeeSource = "formule";
  if(p.tdeeManuel > 0){ tdee = p.tdeeManuel; tdeeSource = "manuel"; }
  else if(mesure){ tdee = mesure.tdee; tdeeSource = "mesure"; }
  const diff = p.goalWeight - p.weight;
  const aimId = p.aim || (diff > 1 ? "masse" : (diff < -1 ? "seche" : "recomp"));
  const aim = aimOf(aimId);
  const pace = p.pace || "modere";
  let delta = tdee * (((PACE_PCT[aim.id]||{})[pace]) || 0);
  /* garde-fous : jamais plus de 20 % de surplus ni 25 % de déficit, jamais sous 1,2 × le métabolisme de base */
  delta = Math.max(-tdee*0.25, Math.min(tdee*0.20, delta));
  const kcal = Math.max(tdee + delta, bmr*1.2);
  const deltaReel = kcal - tdee;
  const plafonne = (kcal > tdee + delta + 1);   /* le plancher de sécurité a joué */
  const perKg = p.protPerKg || aim.prot;
  const prot = p.weight * perKg;
  /* rythme déduit de l'écart calorique : ~6500 kcal par kilo pris, ~7700 par kilo perdu */
  const rate = PACE_RATE[aim.id] ? Math.abs(deltaReel)*7/(deltaReel>0 ? 6500 : 7700) : 0;
  const rateAff = Math.round(rate*20)/20;
  const semaines = (rate>0.02 && Math.abs(diff)>=1) ? Math.max(2, Math.round(Math.abs(diff)/rate)) : null;
  const rythme = rate>0.02 ? `${deltaReel<0?"−":"+"}${rateAff.toLocaleString("fr-FR")} kg par semaine` : "poids stable";
  /* fourchette : ±5 %, la vraie précision de ces formules. Le plancher est l'objectif à viser,
     le plafond la limite au-delà de laquelle on prend surtout du gras (ou on casse le déficit). */
  const kcalMin = Math.round(kcal*0.95/10)*10;
  const kcalMax = Math.round(kcal*1.05/10)*10;
  return {
    bmr: Math.round(bmr), tdee: Math.round(tdee), tdeeSource, mesure,
    kcal: Math.round(kcal/10)*10, kcalMin, kcalMax, prot: Math.round(prot), perKg,
    aim: aim.id, aimLabel: aim.label, pace, rythme, semaines,
    diff: Math.round(diff*10)/10, delta: Math.round(deltaReel), plafonne,
    program: aim.prog, seances: Math.min(5, Math.max(2, p.days))
  };
}
/* le conseil nutrition, formulé selon l'objectif et le rythme choisis */
function planAdvice(pl, p){
  const kg = p.weight, cible = p.goalWeight;
  const perKg = pl.perKg.toLocaleString("fr-FR");
  if(pl.plafonne){
    return `Ton objectif est fixé à <b>${pl.kcal} kcal</b> et <b>${pl.prot} g de protéines</b> par jour (${perKg} g par kilo). Je ne descends pas plus bas : sous ce seuil, le corps puise dans le muscle et le moral suit. Ta dépense estimée étant de ${pl.tdee} kcal, le déficit reste léger — pour accélérer, ajoute plutôt des séances ou du cardio que de nouvelles restrictions.`;
  }
  if(pl.aim==="masse"){
    const vite = pl.pace==="rapide";
    return `Pour atteindre ${fmtKg(cible)} kg${pl.semaines? ` d'ici environ ${pl.semaines} semaines`:""}, vise <b>${pl.kcal} kcal</b> et <b>${pl.prot} g de protéines</b> par jour, soit ${perKg} g par kilo de poids de corps.${vite? " Attention : à ce rythme, une part plus importante de la prise sera du gras — si le tour de taille grimpe vite, repasse en modéré." : " C'est le rythme qui maximise le muscle en limitant le gras."}`;
  }
  if(pl.aim==="seche"){
    const vite = pl.pace==="rapide";
    return `Pour descendre à ${fmtKg(cible)} kg${pl.semaines? ` d'ici environ ${pl.semaines} semaines`:""}, vise <b>${pl.kcal} kcal</b> et <b>${pl.prot} g de protéines</b> par jour, soit ${perKg} g par kilo — les protéines sont ta protection contre la fonte musculaire.${vite? " Ce rythme est agressif : si tu perds de la force sur tes séances, ralentis." : ""}`;
  }
  if(pl.aim==="recomp"){
    return `Mange à ta maintenance, <b>${pl.kcal} kcal</b> par jour, avec <b>${pl.prot} g de protéines</b> (${perKg} g par kilo). Le poids bougera peu : juge tes progrès à la glace et aux charges soulevées, pas à la balance.`;
  }
  if(pl.aim==="force"){
    return `Vise <b>${pl.kcal} kcal</b> et <b>${pl.prot} g de protéines</b> par jour (${perKg} g par kilo). Un léger surplus soutient la récupération nerveuse et articulaire, indispensable quand on pousse lourd.`;
  }
  return `Mange à ta maintenance, <b>${pl.kcal} kcal</b> par jour, avec <b>${pl.prot} g de protéines</b> (${perKg} g par kilo) pour conserver ta masse musculaire.`;
}
function proteinTarget(){
  const pl = planFor(db.profile);
  if(pl) return pl.prot;
  return Math.round((currentWeight()||74)*1.9);
}
/* ================= PARCOURS D'ACCUEIL =================
   Plein écran, une question par étape. Rejoué par « Modifier mon profil » :
   dans ce cas une croix permet de sortir sans rien changer. */
let onbEl = null;
function fermerOnb(){
  if(onbEl){ onbEl.remove(); onbEl = null; }
  document.documentElement.removeAttribute("data-onb");
  appliquerTheme();
}
/* petit clic de roulette, sans fichier son */
let onbAudio = null;
function clicRoue(){
  try{
    if(navigator.vibrate) navigator.vibrate(3);
    onbAudio = onbAudio || new (window.AudioContext||window.webkitAudioContext)();
    if(onbAudio.state === "suspended") onbAudio.resume();
    const o = onbAudio.createOscillator(), g = onbAudio.createGain();
    o.frequency.value = 1700; g.gain.value = 0.012;
    o.connect(g); g.connect(onbAudio.destination); o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, onbAudio.currentTime + 0.03);
    o.stop(onbAudio.currentTime + 0.04);
  }catch(e){}
}
const LBS = 2.20462, POUCE = 0.393701;

function openOnboarding(first, brouillon, depart){
  const base = brouillon || db.profile || {};
  /* profil déjà rempli une première fois : on peut ressortir sans rien casser */
  const dejaRempli = !!(base.weight > 0 && base.height > 0 && base.age > 0);
  const d = {
    name: base.name || db.settings.name || "",
    sex: base.sex || "h",
    age: base.age || 30,
    height: base.height || 172,
    weight: base.weight || currentWeight() || 72,
    goalWeight: base.goalWeight || (db.settings.goal > 0 ? db.settings.goal : 0),
    aim: base.aim || "masse",
    pace: base.pace || "modere",
    protPerKg: base.protPerKg || null,
    metab: base.metab || "normal",
    days: base.days || 4,
    injuries: (base.injuries || []).slice(),
    tdeeManuel: base.tdeeManuel || 0

  const unites = db.settings.unites || (db.settings.unites = {taille:"cm", poids:"kg"});
  const demiTour = v => Math.round(v*2)/2;

  /* le carrousel n'apparaît qu'à la toute première ouverture */
  const ETAPES = (dejaRempli ? [] : ["intro"])
    .concat(["nom","sexe","objectif","corps","age","cible","frequence","projection","fin"]);
  let i = Math.min(depart != null ? depart : 0, ETAPES.length - 1);

  fermerOnb();
  onbEl = document.createElement("div");
  onbEl.className = "onb";
  document.body.appendChild(onbEl);
  document.documentElement.setAttribute("data-onb", "1");
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute("content", "#eae7e0");

  const quitter = ()=>{
    if(!dejaRempli) return;
    askConfirm("Quitter sans enregistrer ?",
      "Les réponses de ce parcours seront perdues. Ton profil actuel, lui, est conservé.",
      "Quitter", true, ()=>{ fermerOnb(); render(); });
  };

  function enregistrer(){
    db.profile = {
      name: d.name || "Champion", sex: d.sex, age: d.age, height: d.height,
      weight: d.weight, goalWeight: d.goalWeight || d.weight, aim: d.aim, pace: d.pace,
      protPerKg: d.protPerKg || aimOf(d.aim).prot, metab: d.metab, days: d.days,
      injuries: d.injuries, tdeeManuel: d.tdeeManuel, avance: true
    };
    db.settings.name = db.profile.name;
    db.settings.goal = db.profile.goalWeight;
    const today = dayKey();
    db.weights = db.weights.filter(w => dayKey(w.date) !== today);
    db.weights.push({date:new Date().toISOString(), kg:d.weight});
    coachGoal = null;
    save();
    fermerOnb(); render(); showPlan(true);
  }

  function dessiner(){
    const etape = ETAPES[i];
    const intro = etape === "intro";
    /* sur les deux dernières pages, pas de croix : on part avec un plan ou on choisit « non merci » */
    const derniere = etape === "fin" || etape === "affiner";
    const avancement = Math.round((i+1) / ETAPES.length * 100);
    onbEl.innerHTML = `
      ${intro ? "" : `<div class="onb-top">
        <button class="onb-back" id="onb-back" aria-label="Retour">‹</button>
        <div class="onb-prog"><i style="width:${avancement}%"></i></div>
        ${(dejaRempli && !derniere) ? `<button class="onb-x" id="onb-x" aria-label="Quitter">✕</button>`
                     : `<span style="width:30px; flex:0 0 auto;"></span>`}
      </div>`}
      <div class="onb-body" id="onb-body"></div>
      <div class="onb-foot" id="onb-foot"></div>`;
    const corps = onbEl.querySelector("#onb-body"), pied = onbEl.querySelector("#onb-foot");
    const retour = onbEl.querySelector("#onb-back");
    if(retour) retour.onclick = ()=>{ if(i > 0){ i--; dessiner(); } else quitter(); };
    const croix = onbEl.querySelector("#onb-x");
    if(croix) croix.onclick = quitter;

    const suivant = (label, action)=>{
      pied.innerHTML = `<button class="onb-btn" id="onb-next">${label || "Suivant"}</button>`;
      onbEl.querySelector("#onb-next").onclick = action || (()=>{ i++; dessiner(); });
    };
    /* liste de choix : apparition bouton par bouton */
    const choix = (items, actif, desc, anime)=>
      `<div class="onb-choix">${items.map(([v,l],n)=>
        `<button class="ch ${actif===v?"on":""} ${anime?"":"fixe"}" data-ch="${v}" ${anime?`style="animation-delay:${n*55}ms"`:""}>${l}</button>` +
        (actif===v && desc && desc(v) ? `<div class="onb-desc">${desc(v)}</div>` : "")).join("")}</div>`;
    const brancher = fn => corps.querySelectorAll("[data-ch]").forEach(b=>b.onclick=()=>{ clicRoue(); fn(b.dataset.ch); });

    /* -------------------------------------------------------- 1. carrousel */
    if(etape === "intro"){
      const vues = [
        {img:"img/tel1.png", titre:"Ton coach<br>dans la poche"},
        {img:"img/tel2.png", titre:"Ton alimentation,<br>sans prise de tête"},
        {img:"img/tel1.png", titre:"Chaque progrès,<br>noir sur blanc"}
      ];
      corps.innerHTML = `<div class="onb-hero">
        <div class="onb-tel">${vues.map((v,n)=>
          `<img src="${v.img}" alt="" class="${n===0?"on":""}" onerror="this.style.display='none'">`).join("")}</div>
        <div class="onb-titre" id="onb-titre">${vues[0].titre}</div>
        <div class="onb-dots">${vues.map((v,n)=>`<i class="${n===0?"on":""}"></i>`).join("")}</div>
      </div>`;
      let n = 0;
      const tour = setInterval(()=>{
        if(!document.body.contains(onbEl)){ clearInterval(tour); return; }
        n = (n+1) % vues.length;
        onbEl.querySelectorAll(".onb-tel img").forEach((im,k)=>im.classList.toggle("on", k===n));
        onbEl.querySelectorAll(".onb-dots i").forEach((pt,k)=>pt.classList.toggle("on", k===n));
        const t = onbEl.querySelector("#onb-titre");
        if(!t) return;
        t.style.opacity = 0;
        setTimeout(()=>{ if(t.isConnected){ t.innerHTML = vues[n].titre; t.style.opacity = 1; } }, 240);
      }, 2600);
      pied.innerHTML = `<button class="onb-btn" id="onb-next">Commencer</button>
        <button class="onb-lien" id="onb-tard">Plus tard, <b>je veux d'abord regarder</b></button>`;
      onbEl.querySelector("#onb-next").onclick = ()=>{ clearInterval(tour); i++; dessiner(); };
      onbEl.querySelector("#onb-tard").onclick = ()=>{
        clearInterval(tour);
        db.profile = {skipped:true}; save();
        fermerOnb(); render();
      };
      return;
    }

    /* -------------------------------------------------------- 2. prénom */
    if(etape === "nom"){
      corps.innerHTML = `<h2>Comment veux-tu<br>qu'on t'appelle ?</h2>
        <div class="sous">Ton prénom sert seulement à personnaliser l'app. Il ne quitte jamais ton téléphone.</div>
        <input class="onb-nom" id="onb-nom" placeholder="Ton prénom" maxlength="20"
          value="${esc(d.name)}" autocomplete="given-name" enterkeyhint="next">`;
      const valider = ()=>{ d.name = onbEl.querySelector("#onb-nom").value.trim(); i++; dessiner(); };
      suivant("Suivant", valider);
      const inp = onbEl.querySelector("#onb-nom");
      setTimeout(()=>inp.focus(), 250);
      inp.onkeydown = e=>{ if(e.key === "Enter"){ e.preventDefault(); valider(); } };
      return;
    }

    /* -------------------------------------------------------- 3. sexe */
    if(etape === "sexe"){
      const dess = anime=>{
        corps.innerHTML = `<h2>Tu es…</h2>
          <div class="sous">La dépense au repos n'est pas la même. Sans cette information, l'estimation calorique se trompe d'environ 150 kcal par jour.</div>
          ${choix([["h","Un homme"],["f","Une femme"],["n","Je préfère ne pas répondre"]], d.sex,
            v => v==="n" ? "On prendra une valeur intermédiaire entre les deux." : "", anime)}`;
        brancher(v=>{ d.sex = v; dess(false); });
      };
      dess(true); suivant();
      return;
    }

    /* -------------------------------------------------------- 4. objectif */
    if(etape === "objectif"){
      const dess = anime=>{
        corps.innerHTML = `<h2>Quel est ton objectif ?</h2>
          <div class="sous">Il détermine tes calories, tes protéines et la forme de tes séances.</div>
          ${choix(AIMS.map(a=>[a.id, esc(a.label)]), d.aim, v=>esc(aimOf(v).desc), anime)}
          <button class="onb-lien" id="onb-info" style="margin-top:14px;">ⓘ <b>Tout savoir sur cet objectif</b></button>`;
        brancher(v=>{
          const ancienne = aimOf(d.aim).prot;
          d.aim = v;
          if(d.protPerKg && Math.abs(d.protPerKg - ancienne) < 0.05) d.protPerKg = null;
          dess(false);
        });
        corps.querySelector("#onb-info").onclick = ()=>openAimInfo(d.aim, ()=>{});
      };
      dess(true); suivant();
      return;
    }

    /* -------------------------------------------------------- 5. taille et poids */
    if(etape === "corps"){
      corps.innerHTML = `<h2>Ta taille et ton poids</h2>
        <div class="sous">Pour calculer ta dépense réelle et calibrer tes charges de départ.</div>
        <div class="onb-rou">
          <div class="rou">
            <div class="rou-t">Taille</div>
            <div class="rou-box"><div class="rou-band"></div><div class="rou-scroll" id="rou-h"></div></div>
            <div class="rou-unite">
              <button data-uh="cm" class="${unites.taille==="cm"?"on":""}">cm</button>
              <button data-uh="in" class="${unites.taille==="in"?"on":""}">in</button>
            </div>
          </div>
          <div class="rou">
            <div class="rou-t">Poids</div>
            <div class="rou-box"><div class="rou-band"></div><div class="rou-scroll" id="rou-w"></div></div>
            <div class="rou-unite">
              <button data-uw="kg" class="${unites.poids==="kg"?"on":""}">kg</button>
              <button data-uw="lbs" class="${unites.poids==="lbs"?"on":""}">lbs</button>
            </div>
          </div>
        </div>`;
      const cm = unites.taille === "cm", kg = unites.poids === "kg";
      roulette(corps.querySelector("#rou-h"),
        cm ? 120 : Math.round(120*POUCE), cm ? 230 : Math.round(230*POUCE),
        cm ? Math.round(d.height) : Math.round(d.height*POUCE), cm ? " cm" : " in",
        v => { d.height = cm ? v : Math.round(v/POUCE); });
      roulette(corps.querySelector("#rou-w"),
        kg ? 30 : Math.round(30*LBS), kg ? 300 : Math.round(300*LBS),
        kg ? Math.round(d.weight) : Math.round(d.weight*LBS), kg ? " kg" : " lbs",
        v => { d.weight = kg ? v : Math.round(v/LBS*10)/10; });
      corps.querySelectorAll("[data-uh]").forEach(b=>b.onclick=()=>{ unites.taille = b.dataset.uh; save(); dessiner(); });
      corps.querySelectorAll("[data-uw]").forEach(b=>b.onclick=()=>{ unites.poids = b.dataset.uw; save(); dessiner(); });
      suivant("Suivant", ()=>{
        const err = verifieProfil(d, ["height","weight"]);
        if(err){ toast(err); return; }
        if(!(d.goalWeight > 0)) d.goalWeight = d.weight;
        i++; dessiner();
      });
      return;
    }

    /* -------------------------------------------------------- 6. âge */
    if(etape === "age"){
      corps.innerHTML = `<h2>Quel âge as-tu ?</h2>
        <div class="sous">Le métabolisme baisse d'environ 2 % par décennie : c'est ce qui garde l'estimation juste dans la durée.</div>
        <div class="onb-rou"><div class="rou" style="max-width:210px;">
          <div class="rou-t">Années</div>
          <div class="rou-box"><div class="rou-band"></div><div class="rou-scroll" id="rou-a"></div></div>
        </div></div>`;
      roulette(corps.querySelector("#rou-a"), 14, 100, Math.round(d.age), "", v => { d.age = v; });
      suivant("Suivant", ()=>{
        const err = verifieChamp("age", d.age);
        if(err){ toast(err); return; }
        i++; dessiner();
      });
      return;
    }

    /* -------------------------------------------------------- 7. poids cible */
    if(etape === "cible"){
      d.goalWeight = demiTour(d.goalWeight > 0 ? d.goalWeight : d.weight);
      corps.innerHTML = `<h2>Quel poids vises-tu ?</h2>
        <div class="sous">Rien n'est figé : tu pourras le changer quand tu veux.</div>
        <div class="regle">
          <div class="regle-lab" id="reg-lab"></div>
          <div class="regle-val" id="reg-val"></div>
          <div class="regle-box"><div class="regle-aig"></div><div class="regle-scroll" id="reg"></div></div>
        </div>
        <div id="reg-alerte" style="margin-top:18px;"></div>`;
      const scroll = corps.querySelector("#reg");
      let html = "";
      for(let k = 60; k <= 400; k++){                  /* de 30 à 200 kg, par pas de 500 g */
        const v = k/2, maj = k % 10 === 0;
        html += `<div class="regle-t${maj?" maj":""}" data-v="${v}"><i style="height:${maj?34:19}px"></i></div>`;
      }
      scroll.innerHTML = `<div class="regle-vide"></div>${html}<div class="regle-vide"></div>`;
      const ticks = [...scroll.querySelectorAll(".regle-t")];
      const majAff = ()=>{
        const diff = Math.round((d.goalWeight - d.weight)*10)/10;
        corps.querySelector("#reg-lab").textContent =
          Math.abs(diff) < 0.4 ? "Maintenir mon poids"
                               : (diff > 0 ? `Prendre ${fmtKg(diff)} kg` : `Perdre ${fmtKg(-diff)} kg`);
        corps.querySelector("#reg-val").textContent = fmtKg(d.goalWeight) + " kg";
        const a = alerteObjectif(d), w = aimWarning(d.aim, d.weight, d.goalWeight);
        const rouge = a && a.niveau === "danger";
        corps.querySelector("#reg-alerte").innerHTML = a
          ? `<div class="inj-note" style="margin:0; border-color:${rouge?"var(--bad)":"var(--accent)"};">
               <b style="color:${rouge?"var(--bad)":"var(--accent)"};">${rouge?"⛔":"⚠️"} ${esc(a.titre)}</b><br>${a.txt}</div>`
          : (w ? `<div class="inj-note" style="margin:0;">⚠️ ${w}</div>` : "");
      };
      let pose = false;
      /* les graduations suivent un arc de cercle : la règle se lit comme le cadran d'une balance */
      const R = 620;
      const courber = (mid, centre0, large)=>{
        const demi = Math.ceil(scroll.clientWidth/large/2) + 4;
        const idx = Math.round((mid - centre0)/large);
        for(let n = idx - demi; n <= idx + demi; n++){
          const t = ticks[n];
          if(!t) continue;
          const dx = centre0 + n*large - mid;
          if(Math.abs(dx) >= R){ t.style.transform = ""; continue; }
          const bas = R - Math.sqrt(R*R - dx*dx);
          t.style.transform = `translateY(${bas.toFixed(1)}px) rotate(${(Math.asin(dx/R)*180/Math.PI).toFixed(2)}deg)`;
        }
      };
      const auScroll = ()=>{
        if(ticks.length < 2 || !scroll.isConnected || !scroll.clientWidth) return;
        const t0 = ticks[0], large = (ticks[1].offsetLeft - t0.offsetLeft) || 10;
        const centre0 = t0.offsetLeft + t0.offsetWidth/2;
        const mid = scroll.scrollLeft + scroll.clientWidth/2;
        courber(mid, centre0, large);
        const idx = Math.max(0, Math.min(ticks.length-1, Math.round((mid - centre0)/large)));
        const v = parseFloat(ticks[idx].dataset.v);
        if(v !== d.goalWeight){ d.goalWeight = v; if(pose) clicRoue(); majAff(); }
      };
      scroll.addEventListener("scroll", ()=>requestAnimationFrame(auScroll), {passive:true});
      requestAnimationFrame(()=>{
        if(!scroll.isConnected) return;
        const cible = ticks.find(t => parseFloat(t.dataset.v) === d.goalWeight) || ticks[0];
        scroll.scrollLeft = cible.offsetLeft + cible.offsetWidth/2 - scroll.clientWidth/2;
        auScroll();
        majAff();
        setTimeout(()=>{ pose = true; }, 300);
      });
      suivant("Suivant", ()=>{
        const a = alerteObjectif(d);
        if(a && a.niveau === "danger"){ toast("Choisis un objectif au-dessus du poids de santé"); return; }
        i++; dessiner();
      });
      return;
    }

    /* -------------------------------------------------------- 8. fréquence */
    if(etape === "frequence"){
      const AIDE = {2:"Deux full body : le minimum pour progresser vraiment.",
                    3:"Le meilleur rapport résultats / temps quand on démarre.",
                    4:"Rythme confortable pour séparer le haut et le bas du corps.",
                    5:"Il faut déjà bien récupérer et manger en conséquence.",

/* trois doses de protéines autour de la valeur conseillée pour l'objectif */
function fourchetteProt(reco){
  const r = v => Math.round(Math.min(2.6, Math.max(1.2, v))*10)/10;
  return [[r(reco-0.3), "le minimum utile"], [r(reco), "conseillé"], [r(reco+0.3), "confortable"]];
}
/* mois approximatif dans N jours */
function dateDans(jours){
  return new Date(Date.now() + jours*864e5).toLocaleDateString("fr-FR", {month:"long", year:"numeric"});
}
/* roulette verticale : une valeur par ligne, celle du centre est retenue */
function roulette(box, min, max, valeur, unite, onChange){
  const H = 40;
  let html = `<div class="rou-vide"></div>`;
  for(let v = min; v <= max; v++) html += `<div class="rou-i" data-v="${v}">${v}${unite}</div>`;
  html += `<div class="rou-vide"></div>`;
  box.innerHTML = html;
  const items = [...box.querySelectorAll(".rou-i")];
  let courant = valeur, pose = false;
  const maj = ()=>{
    /* écran déjà remplacé, ou pas encore mesurable : on ne renvoie surtout pas une valeur fausse */
    if(!box.isConnected || !box.clientHeight) return;
    const mid = box.scrollTop + box.clientHeight/2;
    let best = null, bestD = 1e9;
    items.forEach(it=>{
      const dist = Math.abs(it.offsetTop + H/2 - mid);
      if(dist < bestD){ bestD = dist; best = it; }
      /* les valeurs éloignées s'effacent progressivement */
      const k = Math.min(1, dist / (box.clientHeight/2));
      it.style.transform = `scale(${(1 - 0.28*k).toFixed(3)})`;
      it.style.opacity = (1 - 0.7*k).toFixed(2);
      it.classList.toggle("mid", dist < H/2);
    });
    if(best){
      const v = parseFloat(best.dataset.v);
      if(v !== courant){ courant = v; if(pose) clicRoue(); onChange(v); }
    }
  };
  box.addEventListener("scroll", ()=>requestAnimationFrame(maj), {passive:true});
  requestAnimationFrame(()=>{
    if(!box.isConnected) return;
    const cible = items.find(it => parseFloat(it.dataset.v) === valeur) || items[0];
    box.scrollTop = cible.offsetTop + H/2 - box.clientHeight/2;
    maj();
    setTimeout(()=>{ pose = true; }, 300);
  });
}

function currentWeight(){

function coachDesc(goal){
  const cur = currentWeight(), obj = db.settings.goal;
  const delta = (cur!==null && obj>0)? Math.round((obj-cur)*10)/10 : null;
  if(goal==="masse"){
    let p = "3 séances en 8 à 12 répétitions sur les gros mouvements — la zone de référence pour prendre du muscle — avec des repos longs, 3 à 4 fois par semaine en alternant. Côté assiette : ~300-500 kcal au-dessus de tes besoins et 1,6-2 g de protéines par kilo.";
    if(delta!==null && delta>0) p = `Objectif +${fmtKg(delta)} kg (${fmtKg(cur)} → ${fmtKg(obj)} kg), soit environ ${Math.max(2,Math.round(delta/0.375))} semaines à un rythme propre. `+p;
    return p;
  }
  if(goal==="seche"){
    let p = "2 séances full body (8 à 12 reps sur les gros mouvements, 12 à 15 en isolation) pour garder le muscle + 2-3 sorties cardio par semaine (à enregistrer dans l'onglet Séance). Côté assiette : ~400-500 kcal sous tes besoins.";
    if(delta!==null && delta<0) p = `Objectif −${fmtKg(-delta)} kg (${fmtKg(cur)} → ${fmtKg(obj)} kg), soit environ ${Math.max(1,Math.round(-delta/0.5))} semaines à −0,5 kg/semaine, un rythme sain. `+p;
    return p;
  }
  if(goal==="force"){
    return "3 séances organisées autour du squat, du développé couché et du soulevé de terre : peu de répétitions (3 à 6), charges lourdes et repos très longs (3 à 4 min) pour récupérer entre les séries. Progresse en ajoutant du poids, pas des répétitions.";
  }
  if(goal==="entretien"){
    return "2 séances full body par semaine suffisent largement à conserver muscle et force. Séries de 8 à 12 répétitions, intensité modérée, sans chercher la performance — l'objectif est la régularité sur le long terme.";
  }
  return "3 séances (haut / bas / full body) à intensité moyenne-haute pour construire du muscle tout en perdant du gras. Côté assiette : mange à ta maintenance avec beaucoup de protéines (2 g/kg), et le corps fait l'échange gras → muscle.";
}

/* --- stockage de secours : IndexedDB (survit quand localStorage est éphémère) --- */
function idbOpen(){
  return new Promise(res=>{
    try{
      const r = indexedDB.open("tonnage_db", 1);
      r.onupgradeneeded = ()=>{ try{ r.result.createObjectStore("kv"); }catch(e){} };
      r.onsuccess = ()=>res(r.result);
      r.onerror = ()=>res(null);
      r.onblocked = ()=>res(null);
    }catch(e){ res(null); }
  });
}
async function idbPut(key, val){
  const d = await idbOpen(); if(!d) return;
  try{ d.transaction("kv","readwrite").objectStore("kv").put(val, key); }catch(e){}
}
async function idbTake(key){
  const d = await idbOpen(); if(!d) return null;
  return new Promise(res=>{
    try{
      const r = d.transaction("kv","readonly").objectStore("kv").get(key);
      r.onsuccess = ()=>res(r.result||null);
      r.onerror = ()=>res(null);
    }catch(e){ res(null); }
  });
}
async function idbDel(key){
  const d = await idbOpen(); if(!d) return;
  try{ d.transaction("kv","readwrite").objectStore("kv").delete(key); }catch(e){}
}
function idbSet(json){ return idbPut(KEY, json); }
function idbGet(){ return idbTake(KEY); }

const AUTOFILE = "tonnage_autofile";

async function autoFileWrite(){
