<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Messages des plats</title>
<!-- Relire d'un coup ce que Tonnup dit pour des plats types (Nico, 30 sept. 2026).
     La page charge l'app elle-meme (en mode demo : rien n'est enregistre) et lui fait
     juger chaque assiette : c'est toujours le code du jour qui parle. -->
<style>
  :root{--bg:#f6f4f1; --carte:#fff; --ink:#1d1d1f; --doux:#6b6b70; --bord:#e6e2dc; --orange:#f58220; --vert:#1f9d55; --ambre:#c77700;}
  @media (prefers-color-scheme: dark){ :root{--bg:#121214; --carte:#1c1c1f; --ink:#f2f2f4; --doux:#a0a0a8; --bord:#2c2c31;} }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;}
  main{max-width:1100px; margin:0 auto; padding:20px 16px 60px;}
  h1{font-size:22px; margin:0 0 4px;}
  .sous{color:var(--doux); margin:0 0 18px;}
  .filtres{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px;}
  .filtres button{border:1px solid var(--bord); background:var(--carte); color:var(--ink); border-radius:99px; padding:7px 14px; font:inherit; font-weight:600; cursor:pointer;}
  .filtres button.on{background:var(--orange); border-color:var(--orange); color:#fff;}
  .plat{background:var(--carte); border:1px solid var(--bord); border-radius:16px; padding:14px; margin-bottom:14px;}
  .plat h2{font-size:16px; margin:0;}
  .plat .meta{color:var(--doux); font-size:13px; margin:2px 0 10px;}
  .grille{display:grid; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); gap:10px;}
  .obj{border:1px solid var(--bord); border-radius:12px; padding:10px 12px;}
  .obj .t{display:flex; justify-content:space-between; align-items:center; font-weight:700; margin-bottom:6px;}
  .cat{font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; padding:2px 8px; border-radius:99px; background:rgba(245,130,32,.14); color:var(--orange);}
  .cat.ok{background:rgba(31,157,85,.14); color:var(--vert);}
  .chips{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:6px;}
  .chips span{font-size:12px; font-weight:700; border:1px solid var(--bord); border-radius:99px; padding:2px 8px;}
  ul{margin:4px 0 6px; padding-left:18px;} li{margin:2px 0;}
  .leg{color:var(--vert); font-size:13.5px;}
  .suite{color:var(--doux); font-size:13.5px; border-top:1px dashed var(--bord); padding-top:6px; margin-top:6px;}
  .attente{color:var(--doux);}
  iframe{position:absolute; width:375px; height:800px; left:-9999px; border:0;}
</style>
</head>
<body>
<main>
  <h1>Messages des photos de plat</h1>
  <p class="sous">Ce que Tonnup affiche pour des plats types, selon l'objectif. Toutes les formulations possibles sont listées : l'app en tire une par photo. Les chiffres du bas dépendent de la journée d'exemple (mode démo).</p>
  <div class="filtres" id="filtres"></div>
  <div id="liste"><p class="attente">Chargement de l'app…</p></div>
</main>
<iframe id="app" title="Tonnup"></iframe>
<script>
const APP = /^(localhost|127\.0\.0\.1)$/.test(location.hostname) ? "tonnage.html" : "index.html";
const f = document.getElementById("app");
const esc = t => String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const L = (nom, g, k, p, gl, li, cat) => ({nom, nomFr:nom, categorie:cat || "", g, kcal100:k, prot100:p, gluc100:gl, lip100:li});
const PLATS = [
  ["Poulet, riz, haricots verts", "midi", false, false, [L("blanc de poulet",150,165,31,0,3.6,"proteine"), L("riz cuit",200,130,2.7,28,0.3,"feculent"), L("haricots verts",150,31,1.8,5,0.2,"legume")]],
  ["Saumon, quinoa, brocoli", "soir", false, false, [L("saumon",150,200,20,0,13,"proteine"), L("quinoa cuit",120,120,4.4,21,1.9,"feculent"), L("brocoli",120,35,2.8,7,0.4,"legume")]],
  ["Grosse assiette de pâtes au beurre", "midi", false, false, [L("pâtes cuites",350,158,5,31,1,"feculent"), L("beurre",10,740,0.5,0.5,82,"gras")]],
  ["Pâtes au beurre, après une séance", "midi", false, true, [L("pâtes cuites",350,158,5,31,1,"feculent"), L("beurre",10,740,0.5,0.5,82,"gras")]],
  ["Pizza entière", "soir", false, false, [L("pizza",350,270,11,33,10,"plat")]],
  ["Burger et frites", "soir", false, false, [L("burger",250,260,13,25,12,"plat"), L("frites",150,310,3.4,41,15,"feculent")]],
  ["Salade verte et tomates", "midi", false, false, [L("salade verte",100,15,1.3,2,0.2,"legume"), L("tomate",150,18,0.9,3.9,0.2,"legume"), L("vinaigrette",20,450,0,3,48,"gras")]],
  ["Tartines de confiture", "matin", false, false, [L("pain",100,260,9,49,3,"feculent"), L("confiture",30,250,0.5,60,0,"sucre")]],
  ["Omelette et pain", "matin", false, false, [L("omelette",150,154,11,1,12,"proteine"), L("pain",60,260,9,49,3,"feculent")]],
  ["Part de gâteau", "collation", false, false, [L("gâteau au chocolat",100,400,5,50,20,"sucre")]],
  ["Grosse part de gâteau", "soir", false, false, [L("gâteau au chocolat",250,400,5,50,20,"sucre")]],
  ["Carré de chocolat", "collation", false, false, [L("carré de chocolat",10,540,7,57,31,"sucre")]],
  ["Ajout : un skyr", "midi", true, false, [L("skyr",150,60,11,4,0.2,"laitage")]],
  ["Ajout : pain et fromage", "soir", true, false, [L("pain",60,260,9,49,3,"feculent"), L("comté",40,400,28,0,32,"gras")]],
  ["Ajout : beurre de cacahuète", "collation", true, false, [L("beurre de cacahuète",40,600,25,15,50,"gras")]],
];
const OBJ = [["masse", "Prise de masse"], ["seche", "Sèche"], ["entretien", "Maintien"]];
const REPAS = {matin:"petit-déjeuner", midi:"déjeuner", collation:"collation", soir:"dîner"};
let filtre = "tous", resultats = [];
function calculer(){
  const F = f.contentWindow;
  F.entrerModeDemo();                                  /* rien n'est enregistre */
  const db = F.eval("db"), histAvant = db.history, aimAvant = db.profile.aim;
  resultats = PLATS.map(([nom, meal, ajout, seance, lignes])=>{
    const tot = lignes.reduce((o, l)=>{ const k = l.g / 100; o.kcal += l.kcal100 * k; o.prot += l.prot100 * k; o.gluc += (l.gluc100 || 0) * k; o.lip += (l.lip100 || 0) * k; return o; }, {kcal:0, prot:0, gluc:0, lip:0});
    const res = OBJ.map(([aim, lab])=>{
      db.profile.aim = aim;
      db.history = seance ? (histAvant || []).concat([{id:"revue", date:new Date().toISOString(), entries:[]}]) : histAvant;
      const r = F.messagePlat(lignes, meal, 0.3, ajout);
      const d = F.document.createElement("div"); d.innerHTML = F.astuceScan(tot, r);
      return {aim, lab, cat:r ? r.cat : "—", variantes:r ? r.variantes : [], legumes:r ? r.legumes : "",
        chips:[...d.querySelectorAll(".sc-chips span")].map(x=>x.textContent), suite:(d.querySelector(".sc-obj") || {}).textContent || ""};
    });
    return {nom, meal, ajout, seance, kcal:Math.round(tot.kcal), prot:Math.round(tot.prot), res};
  });
  db.history = histAvant; db.profile.aim = aimAvant;
  dessiner();
}
const NOMS_CAT = {ok:"adapté", peuProt:"peu de protéines", copieux:"copieux", fec:"féculents", gras:"graisses", leger:"léger", sucre:"sucré", protDeja:"protéines déjà couvertes", calorique:"calorique"};
function dessiner(){
  document.getElementById("filtres").innerHTML = [["tous", "Tous les objectifs"]].concat(OBJ).map(([k, l])=>`<button data-f="${k}" class="${filtre === k ? "on" : ""}">${l}</button>`).join("");
  document.querySelectorAll("[data-f]").forEach(b=>b.onclick = ()=>{ filtre = b.dataset.f; dessiner(); });
  document.getElementById("liste").innerHTML = resultats.map(p=>`<section class="plat">
    <h2>${esc(p.nom)}</h2>
    <div class="meta">${REPAS[p.meal] || p.meal} · ${p.kcal} kcal · ${p.prot} g de protéines${p.ajout ? " · ajouté à un repas commencé" : ""}${p.seance ? " · séance faite dans la journée" : ""}</div>
    <div class="grille">${p.res.filter(r=>filtre === "tous" || r.aim === filtre).map(r=>`<div class="obj">
      <div class="t"><span>${r.lab}</span><span class="cat ${r.cat === "ok" ? "ok" : ""}">${NOMS_CAT[r.cat] || r.cat}</span></div>
      ${r.chips.length ? `<div class="chips">${r.chips.map(c=>`<span>${esc(c)}</span>`).join("")}</div>` : ""}
      <ul>${r.variantes.map(v=>`<li>${esc(v)}</li>`).join("")}</ul>
      ${r.legumes ? `<div class="leg">+ ${esc(r.legumes)}</div>` : ""}
      ${r.suite ? `<div class="suite">${esc(r.suite)}</div>` : ""}
    </div>`).join("")}</div></section>`).join("");
}
f.onload = ()=>{
  const essai = (n)=>{ try{ if(f.contentWindow.messagePlat){ calculer(); return; } }catch(e){}
    if(n > 0) setTimeout(()=>essai(n - 1), 300); else document.getElementById("liste").innerHTML = '<p class="attente">L\'app ne s\'est pas chargée.</p>'; };
  setTimeout(()=>essai(20), 500);
};
f.src = APP;
</script>
</body>
</html>
