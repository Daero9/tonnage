<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tonnup — tests des calculs</title>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       background:#14140f; color:#eee; margin:0; padding:20px 16px 60px; line-height:1.5;}
  h1{font-size:20px; margin:0 0 4px;}
  .sub{color:#8e8e90; font-size:13px; margin-bottom:18px;}
  #bilan{position:sticky; top:0; background:#14140f; padding:10px 0 14px; font-size:17px; font-weight:800;}
  .ok{color:#6fbf8b;} .ko{color:#e06c5a;}
  .grp{margin:16px 0 6px; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:#8e8e90;}
  .l{font-size:13.5px; padding:3px 0; border-bottom:1px solid #262620;}
  .l .d{color:#8e8e90; font-size:12px;}
  iframe{display:none;}
</style>

<h1>Tests des calculs</h1>
<div class="sub">Vérifie les fonctions de calcul de Tonnup sans toucher à tes données.
Ouvre cette page après chaque publication.</div>
<div id="bilan">Chargement de l'application…</div>
<div id="sortie"></div>
<!-- on charge la source directement : plus besoin d une copie index.html a cote -->
<iframe id="app" src="tonnage.html"></iframe>

<script>
const sortie = document.getElementById("sortie");
let total = 0, echecs = 0, groupe = "";
function grp(nom){ groupe = nom; sortie.insertAdjacentHTML("beforeend", `<div class="grp">${nom}</div>`); }
function ligne(ok, nom, detail){
  total++; if(!ok) echecs++;
  sortie.insertAdjacentHTML("beforeend",
    `<div class="l"><span class="${ok?'ok':'ko'}">${ok?"✔":"✘"}</span> ${nom}` +
    (detail? ` <span class="d">— ${detail}</span>`:"") + `</div>`);
}
function eq(nom, obtenu, attendu){
  const ok = JSON.stringify(obtenu) === JSON.stringify(attendu);
  ligne(ok, nom, ok? "" : `obtenu ${JSON.stringify(obtenu)}, attendu ${JSON.stringify(attendu)}`);
}
function pres(nom, obtenu, attendu, tol){
  const ok = Math.abs(obtenu - attendu) <= tol;
  ligne(ok, nom, ok? "" : `obtenu ${obtenu}, attendu ${attendu} ±${tol}`);
}
function vrai(nom, cond, detail){ ligne(!!cond, nom, cond? "" : (detail||"")); }

document.getElementById("app").addEventListener("load", () => setTimeout(lancer, 400));

async function lancer(){
  const F = document.getElementById("app").contentWindow;
  /* « db » est déclaré avec let dans l'app : il n'apparaît pas sur window, on va chercher la référence */
  const DB = F.eval("db");
  const profilType = {name:"Test", sex:"h", age:28, height:188, weight:74, goalWeight:80,
                      metab:"normal", days:4, injuries:[], aim:"masse", pace:"modere", protPerKg:1.9};
  /* base d'essai : on n'écrit jamais, on remplace l'objet en mémoire de l'iframe */
  const neuf = () => {
    DB.profile = JSON.parse(JSON.stringify(profilType));
    DB.history = []; DB.weights = [{date:new Date().toISOString(), kg:74}];
    DB.habitSel = {}; DB.cardio = []; DB.unilat = {}; DB.plafond = {}; DB.dayFix = {};
    DB.materiel = null;      /* sinon un essai enregistré sur ce domaine fausse les tirages */
  };
  const id = n => F.libId(n);
  const serie = (w,r,rir,drops) => ({w, r, done:true, warm:false, rir:(rir===undefined?1:rir), drops});
  const seance = (heuresAvant, entrees) => ({
    id:"t"+Math.random(), date:new Date(Date.now()-heuresAvant*36e5).toISOString(),
    name:"Test", templateId:"x", start:Date.now()-heuresAvant*36e5-3.4e6, end:Date.now()-heuresAvant*36e5,
    entries:entrees
  });

  /* ---------------------------------------------------------- langue et unités */
  grp("Langue et unités");
  neuf();
  DB.settings = DB.settings || {};
  /* pds, fmtKg et EN_PRET sont des const : elles n'apparaissent pas sur window */
  const PDS = F.eval("pds"), ENPRET = F.eval("EN_PRET");
  const TR = F.eval("TR");
  const enLangue = (l, u, f) => { DB.settings.lang = l; DB.settings.units = u; const r = f(); return r; };

  eq("Français : les kilos restent des kilos",
     enLangue("fr", "metrique", () => PDS(80)), "80 kg");
  eq("English : conversion en livres",
     enLangue("en", "imperial", () => PDS(80)), "176,4 lb".replace(",", "."));
  eq("Le choix des unités ne dépend pas de la langue",
     enLangue("en", "metrique", () => PDS(80)), "80 kg");
  eq("Taille en centimètres",
     enLangue("fr", "metrique", () => F.affTaille(178)), "178 cm");
  eq("Taille en pieds et pouces",
     enLangue("fr", "imperial", () => F.affTaille(178)), "5'10\"");
  eq("Le pied juste, sans 12 pouces",
     enLangue("fr", "imperial", () => F.affTaille(183)), "6'0\"");

  /* le temps de repos se lit comme on le dit à voix haute, pas en secondes brutes */
  eq("Moins d'une minute reste en secondes", F.fmtRepos(45), "45 s");
  eq("Une minute pile se dit en minutes", F.fmtRepos(60), "1 min");
  eq("Une minute et demie", F.fmtRepos(90), "1 min 30");
  eq("Deux minutes pile, sans zéro inutile", F.fmtRepos(120), "2 min");
  eq("Deux minutes trente", F.fmtRepos(150), "2 min 30");
  eq("Cinq minutes", F.fmtRepos(300), "5 min");
  eq("Zéro reste lisible", F.fmtRepos(0), "0 s");

  /* un champ <input type=number> refuse la virgule : jamais de séparateur français */
  vrai("Le champ de saisie n'a pas de virgule",
       enLangue("fr", "imperial", () => !/,/.test(F.saisiePoids(80))));
  pres("Aller-retour livres → kilos",
       enLangue("fr", "imperial", () => F.versKg(F.saisiePoids(80))), 80, 0.05);
  /* Les bornes sont stockées en kg/cm : le message doit être converti, sinon
     l'utilisateur en livres lit « entre 30 et 300 kg » alors qu'il tape des lb. */
  const VC = F.eval("verifieChamp");
  eq("Une valeur dans les bornes ne dit rien",
     enLangue("fr", "metrique", () => VC("weight", 80)), null);
  vrai("Poids hors bornes : message en kilos",
       enLangue("fr", "metrique", () => /30 et 300 kg/.test(VC("weight", 400) || "")));
  vrai("Poids hors bornes : message en livres",
       enLangue("fr", "imperial", () => /66 et 661 lb/.test(VC("weight", 400) || "")));
  vrai("Taille hors bornes : message en pouces",
       enLangue("fr", "imperial", () => /47 et 91 in/.test(VC("height", 300) || "")));
  vrai("Le message de bornes est traduit",
       enLangue("en", "imperial", () => /^Weight must be between/.test(VC("weight", 400) || "")));
  vrai("L'âge n'a pas d'unité collée",
       enLangue("en", "imperial", () => /between 14 and 100/.test(VC("age", 200) || "")));

  eq("Le pas suit les unités : 0,5 kg",
     enLangue("fr", "metrique", () => F.stepPoids()), 0.5);
  eq("Le pas suit les unités : 1 lb",
     enLangue("fr", "imperial", () => F.stepPoids()), 1);

  /* le repli : tant qu'une phrase n'est pas traduite, on affiche le français */
  eq("Traduit : la navigation",
     enLangue("en", "metrique", () => F.TR("Séance")), "Workout");
  eq("Non traduit : repli sur le français",
     enLangue("en", "metrique", () => F.TR("Une phrase que personne n'a traduite")),
     "Une phrase que personne n'a traduite");
  eq("En français, le dictionnaire n'est jamais consulté",
     enLangue("fr", "metrique", () => F.TR("Séance")), "Séance");

  /* Les distances sont stockées en km. fmtKg() les convertissait en livres :
     10 km s'affichaient « 22 km » en impérial. D'où ces tests. */
  const DIST = F.eval("dist"), VKM = F.eval("versKm"), UD = F.eval("uDist");
  eq("Distance en kilomètres", enLangue("fr", "metrique", () => DIST(10)), "10 km");
  eq("Distance en miles", enLangue("fr", "imperial", () => DIST(10)), "6,2 mi");
  eq("L'unité de distance suit le réglage",
     enLangue("fr", "imperial", () => UD()), "mi");
  pres("Aller-retour miles → kilomètres",
       enLangue("fr", "imperial", () => VKM("6.2")), 10, 0.05);
  eq("En métrique, la saisie est déjà en km",
     enLangue("fr", "metrique", () => VKM("10")), 10);

  /* La regle : le francais aux telephones francophones, l'anglais aux autres.
     L'inverse enverrait du francais a un telephone allemand ou japonais. */
  const LSYS = F.eval("langueSysteme");
  const simuleLangue = (code, f) => {
    const nav = F.navigator;
    const vraiL = Object.getOwnPropertyDescriptor(Object.getPrototypeOf(nav), "languages")
               || Object.getOwnPropertyDescriptor(nav, "languages");
    try {
      Object.defineProperty(nav, "languages", {value:[code], configurable:true});
      return f();
    } finally {
      if (vraiL) { try { Object.defineProperty(nav, "languages", vraiL); } catch(e){} }
    }
  };
  eq("Téléphone français → français", simuleLangue("fr-FR", LSYS), "fr");
  eq("Téléphone canadien francophone → français", simuleLangue("fr-CA", LSYS), "fr");
  eq("Téléphone américain → anglais", simuleLangue("en-US", LSYS), "en");
  eq("Téléphone allemand → anglais, pas français", simuleLangue("de-DE", LSYS), "en");
  eq("Téléphone espagnol → anglais, pas français", simuleLangue("es-ES", LSYS), "en");
  eq("Téléphone japonais → anglais, pas français", simuleLangue("ja-JP", LSYS), "en");

  /* Bug signalé par Nico : en impérial, la charge appliquée aux séries suivantes
     s'affichait en kilos bruts (40 lb saisis → « 18,1436948004014 »). Tout ce qui
     part dans un champ de saisie doit repasser par saisiePoids(). */
  const SP = F.eval("saisiePoids"), VK = F.eval("versKg");
  eq("Impérial : 40 lb saisis se réaffichent 40",
     enLangue("fr", "imperial", () => SP(VK("40"))), "40");
  eq("Métrique : 40 kg saisis se réaffichent 40",
     enLangue("fr", "metrique", () => SP(VK("40"))), "40");
  vrai("Le champ ne montre jamais un kilo brut en impérial",
       enLangue("fr", "imperial", () => SP(VK("40"))).indexOf("18") !== 0);
  /* une charge allégée reste un nombre propre, pas 14 décimales */
  vrai("Une charge allégée reste lisible",
       enLangue("fr", "imperial", () => SP(VK("40") * 0.9)).length <= 6,
       enLangue("fr", "imperial", () => SP(VK("40") * 0.9)));

  /* le garde-fou : « auto » ne doit pas basculer en anglais avant la fin du chantier */
  eq("« Auto » reste en français tant que la traduction n'est pas finie",
     enLangue("auto", "auto", () => F.langue()), ENPRET ? F.langueSysteme() : "fr");

  /* Le nom affiché change de langue, mais la CLÉ reste le français. Si un jour
     quelqu'un branche une recherche sur le nom affiché, ces tests le voient. */
  DB.settings.lang = "en"; DB.settings.units = "metrique";
  const LIBEN = F.eval("LIB"), CANONX = F.eval("nomCanon");
  const EXOI = F.eval("EXO_INFO"), MWK = F.eval("MUSCLE_WORK");

  eq("Les 115 exercices sont là", LIBEN.length, 115);
  /* L'identifiant d'un exercice est sa POSITION dans la liste. Insérer une ligne au
     milieu décale tous les suivants et rattache l'historique de chacun à son voisin —
     c'est arrivé le 8 septembre 2026, sur 49 exercices. Ces repères le rendraient
     visible immédiatement : un ajout ne doit jamais bouger un identifiant existant. */
  const REPERES = {"Développé couché":"lib0", "Extension poulie (barre)":"lib22", "Crunch":"lib33",
    "Roulette abdominale":"lib59", "Planche latérale":"lib60", "Superman":"lib101",
    "Rowing sous la table":"lib108"};
  const bouges = Object.keys(REPERES).filter(n=>id(n) !== REPERES[n]);
  vrai("Aucun identifiant d'exercice n'a bougé", bouges.length === 0,
    bouges.map(n=>n + " : " + REPERES[n] + " → " + id(n)).join(", "));
  vrai("Les nouveaux exercices sont ajoutés à la fin",
    ["Swing kettlebell","Développé kettlebell","Rowing TRX","Pompes TRX",
     "Crunch sur ballon","Leg curl sur ballon"]
      .every(n=>parseInt(String(id(n)).replace("lib",""), 10) >= 109));
  eq("Un nom s'affiche en anglais", LIBEN[0].name, "Bench press");
  eq("…mais sa clé reste le français", LIBEN[0].nameFr, "Développé couché");
  eq("Les 108 noms sont traduits",
     LIBEN.filter(e => e.name === e.nameFr && !/^(Dips|Squat|Crunch|Superman|Hip thrust|Face pull|Leg curl|Leg extension|Hack squat|Arnold press|Goblet squat|Front squat|Good morning|Russian twist)$/.test(e.nameFr)).length, 0);

  vrai("En anglais, chaque exercice retrouve sa fiche",
       LIBEN.every(e => !!EXOI[CANONX(e)]),
       "sans fiche : " + LIBEN.filter(e => !EXOI[CANONX(e)]).map(e => e.nameFr).join(", "));
  vrai("En anglais, chaque exercice retrouve ses muscles",
       LIBEN.every(e => !!MWK[CANONX(e)]),
       "sans muscles : " + LIBEN.filter(e => !MWK[CANONX(e)]).map(e => e.nameFr).join(", "));
  vrai("libId retrouve l'exercice par son nom français",
       F.libId("Développé couché") === LIBEN[0].id);
  vrai("libId le retrouve aussi par son nom anglais",
       F.libId("Bench press") === LIBEN[0].id);
  eq("Aucun doublon parmi les noms anglais",
     LIBEN.length - new Set(LIBEN.map(e => e.name)).size, 0);

  /* un exercice créé par la personne garde son propre nom, jamais traduit */
  DB.custom = [{id:"x1", name:"Ma variante", muscle:"Pectoraux", equip:"Barre"}];
  eq("Un exercice personnel n'est pas traduit", F.getEx("x1").name, "Ma variante");
  eq("…et son nom canonique est le sien", CANONX(F.getEx("x1")), "Ma variante");
  DB.custom = [];

  /* --- les 107 fiches en anglais --- */
  const FEN = F.eval("EXO_INFO_EN"), FICHE = F.eval("ficheDe");
  eq("Chaque fiche a sa version anglaise",
     Object.keys(EXOI).filter(n => !FEN[n]).length, 0);
  eq("Aucune fiche anglaise orpheline",
     Object.keys(FEN).filter(n => !EXOI[n]).length, 0);
  eq("Autant d'étapes des deux côtés",
     Object.keys(EXOI).reduce((a,n)=>a+EXOI[n].steps.length,0),
     Object.keys(FEN).reduce((a,n)=>a+FEN[n].steps.length,0));
  vrai("Chaque fiche anglaise a un conseil et au moins 3 étapes",
       Object.keys(FEN).every(n => FEN[n].tip && FEN[n].tip.length > 20 && FEN[n].steps.length >= 3));
  vrai("Aucune fiche anglaise n'a gardé du français",
       !Object.keys(FEN).some(n => /[éèêàçùôîû]|\b(les|des|une|tes|pour|avec|dans)\b/i
         .test(FEN[n].tip + " " + FEN[n].steps.join(" "))),
       Object.keys(FEN).filter(n => /[éèêàçùôîû]/.test(FEN[n].tip + FEN[n].steps.join(""))).join(", "));

  /* c'est bien la fiche anglaise qui sort quand la langue est l'anglais */
  DB.settings.lang = "en";
  vrai("En anglais, ficheDe rend la fiche anglaise",
       FICHE(LIBEN[0]).tip === FEN["Développé couché"].tip);
  DB.settings.lang = "fr";
  vrai("En français, ficheDe rend la fiche française",
       FICHE(LIBEN[0]).tip === EXOI["Développé couché"].tip);

  /* --- les chemins d'appel, en anglais --- */
  /* Ces fonctions cherchent par nom FRANÇAIS. Si un appelant leur passe le nom
     traduit, elles ne trouvent rien et échouent en silence : pas d'erreur, juste
     un avertissement de blessure qui n'apparaît plus. D'où ces tests. */
  DB.profile.injuries = ["epaule"];
  const BLESS = F.eval("injuryNote"), SILH = F.eval("exoBodyHtml");
  const dc = LIBEN.find(e => e.nameFr === "Développé couché");

  DB.settings.lang = "fr";
  vrai("En français, l'épaule sensible avertit sur le développé couché",
       !!BLESS(F.eval("nomCanon")(dc)));
  const silhFr = SILH(F.eval("nomCanon")(dc), false);

  DB.settings.lang = "en";
  vrai("En anglais aussi, l'avertissement de blessure s'affiche",
       !!BLESS(F.eval("nomCanon")(dc)),
       "l'appelant transmet sûrement ex.name au lieu de nomCanon(ex)");
  vrai("En anglais aussi, la silhouette anatomique se construit",
       SILH(F.eval("nomCanon")(dc), false).length > 0);
  /* on compare les ZONES colorées, pas le HTML entier : la légende est traduite */
  const zones = h => (h.match(/muscles\/[a-z-]+\.png/g) || []).sort().join("|");
  eq("Les mêmes zones anatomiques dans les deux langues",
     zones(SILH(F.eval("nomCanon")(dc), false)), zones(silhFr));

  /* le tour complet : chaque exercice, dans les deux langues */
  DB.profile.injuries = ["epaule", "dos", "genou", "coude", "poignet"];
  const compte = () => LIBEN.filter(e => !!BLESS(F.eval("nomCanon")(e))).length;
  DB.settings.lang = "fr"; const nFr = compte();
  DB.settings.lang = "en"; const nEn = compte();
  eq("Autant d'exercices déconseillés dans les deux langues", nEn, nFr);
  vrai("Et il y en a bien (sinon le test ne prouve rien)", nFr > 0);
  DB.profile.injuries = [];

  /* Les tables évaluées au chargement (MATERIELS, COACH_PROGRAMS) ne doivent PAS
     appeler TR() : la langue serait figée au démarrage, et db n'existe pas encore.
     On vérifie donc que leurs libellés restent en français dans la table... */
  const MATOS = F.eval("MATERIELS");
  eq("Le matériel garde le français comme clé",
     MATOS.find(m => m.id === "elastique").nom, "Bandes élastiques");
  /* ...et qu'ils ressortent bien traduits à l'affichage. */
  DB.settings.lang = "en";
  eq("...mais s'affiche traduit", TR("Bandes élastiques"), "Resistance bands");
  DB.settings.lang = "fr";
  eq("...et reste français en français", TR("Bandes élastiques"), "Bandes élastiques");

  DB.settings.lang = "auto"; DB.settings.units = "auto";

  /* ------------------------------------------------- progression sur plusieurs semaines */
  grp("Progression semaine après semaine");
  neuf();
  /* Le cas signalé par Nico : répondre « 1-2 » (RIR 1) à chaque série.
     Avant correction, l'app conseillait « gratte une rep » mais pré-remplissait
     les mêmes reps : la charge ne montait JAMAIS. */
  const modele = {id:"tp1", name:"Push", items:[{exId:id("Développé couché"), sets:3, reps:"8-12", rest:120}]};
  DB.templates = [modele];
  const START = F.eval("startWorkout");

  let charge = 60, reps = 10, monte = false, journal = [];
  for(let sem = 0; sem < 5; sem++){
    START("tp1");                                /* l'app propose la séance */
    const prop = DB.active.entries[0].sets.filter(x=>!x.warm);
    journal.push((Number(prop[0].w) || charge) + "×" + prop[0].r);
    /* à la 1re séance l'app ne propose pas de charge : il n'y a pas d'historique */
    const propose = Number(prop[0].w) || charge;
    if(propose > charge){ monte = true; }
    charge = propose; reps = prop[0].r;
    /* on fait exactement ce qui est proposé, en répondant « 1-2 » partout */
    /* chaque séance doit être PLUS RÉCENTE que la précédente : heures-avant décroissantes */
    DB.history.push(seance((6 - sem) * 48, [{exId:id("Développé couché"), target:modele.items[0],
      sets:[serie(charge, reps, 1), serie(charge, reps, 1), serie(charge, reps, 1)]}]));
    DB.history.sort((x,y)=> new Date(x.date) - new Date(y.date));
  }
  vrai("En répondant toujours « 1-2 », la charge finit par monter", monte,
       "séances proposées : " + journal.join(" → "));
  vrai("Les répétitions progressent d'une séance à l'autre",
       journal[1].split("×")[1] > journal[0].split("×")[1],
       "séances proposées : " + journal.join(" → "));
  DB.templates = [];

  /* ---------------------------------------------------------- force et tonnage */
  grp("Force et tonnage");
  neuf();
  pres("1RM Epley : 100 kg × 1", F.e1rm(100,1), 100, 0.01);
  pres("1RM Epley : 60 kg × 10", F.e1rm(60,10), 80, 0.01);
  eq("Tonnup d'une série simple", F.volSerie({w:60, r:10}), 600);
  eq("Tonnup avec dégressif", F.volSerie({w:12, r:6, drops:[{w:10, r:4}]}), 112);
  eq("Barre : facteur 1", F.facteurCharge(id("Développé couché")), 1);
  eq("Haltères : facteur 2", F.facteurCharge(id("Développé incliné haltères")), 2);
  DB.unilat[id("Extension poulie (barre)")] = true;
  eq("Unilatéral coché : facteur 2", F.facteurCharge(id("Extension poulie (barre)")), 2);
  DB.unilat[id("Développé incliné haltères")] = true;
  eq("Haltères + unilatéral : reste 2, jamais 4", F.facteurCharge(id("Développé incliné haltères")), 2);
  neuf();

  /* ---------------------------------------------------------- dates */
  grp("Dates");
  const d = new Date(2026, 0, 5, 23, 30);
  eq("Clé du jour en heure locale (pas UTC)", F.dayKey(d), "2026-01-05");
  eq("Clé du jour, 1er janvier", F.dayKey(new Date(2026, 0, 1, 0, 5)), "2026-01-01");

  /* ---------------------------------------------------------- plan calorique */
  grp("Plan calorique");
  neuf();
  let pl = F.planFor(DB.profile);
  pres("Métabolisme de base (Mifflin-St Jeor)", pl.bmr, 1780, 2);
  vrai("Dépense supérieure au métabolisme de base", pl.tdee > pl.bmr);
  vrai("Prise de masse : surplus positif", pl.delta > 0);
  vrai("Fourchette cohérente (min < cible < max)", pl.kcalMin < pl.kcal && pl.kcal < pl.kcalMax);
  pres("Protéines = 1,9 g/kg", pl.prot, Math.round(74*1.9), 1);
  DB.profile.aim = "seche"; DB.profile.goalWeight = 68;
  pl = F.planFor(DB.profile);
  vrai("Sèche : déficit", pl.delta < 0);
  vrai("Jamais sous 1,2 × le métabolisme de base", pl.kcal >= pl.bmr*1.2 - 1);
  DB.profile.tdeeManuel = 2200;
  pl = F.planFor(DB.profile);
  eq("Dépense saisie à la main : elle prime", pl.tdee, 2200);
  eq("…et la source est signalée", pl.tdeeSource, "manuel");
  neuf();

  /* ---------------------------------------------------------- garde-fous santé */
  grp("Garde-fous santé");
  pres("IMC 74 kg / 188 cm", F.imc(74,188), 20.9, 0.1);

    DB.active = null;
    DB.templates = [{id:"trep", name:"Abdos", items:[
      {exId:id("Gainage"), sets:3, reps:"30-45", rest:90},
      {exId:id("Développé couché"), sets:3, reps:"8-12", rest:120}]}];
    F.startWorkout("trep");
    const carte = F.document.querySelector(".ex-card");
    const val = () => carte.querySelector("[data-repv]").textContent;
    vrai("Le repos est sur la carte du gainage", !!carte.querySelector(".ex-repos"));
    vrai("…et sur elle seule",
      !F.document.querySelectorAll(".ex-card")[1].querySelector(".ex-repos"));
    eq("Il part de ce que dit le plan", val(), "1 min 30");
    carte.querySelector('[data-rep="15"]').click();
    eq("Le + ajoute quinze secondes", val(), "1 min 45");
    eq("…et l'écrit sur la séance", DB.active.entries[0].target.rest, 105);
    eq("…et sur le plan, pour la prochaine fois", DB.templates[0].items[0].rest, 105);
    carte.querySelector('[data-rep="-15"]').click();
    eq("Le − les retire", val(), "1 min 30");
    /* on ne descend pas sous quinze secondes ni au-dessus de cinq minutes */
    for(let k = 0; k < 20; k++) carte.querySelector('[data-rep="-15"]').click();
    eq("Plancher à quinze secondes", DB.active.entries[0].target.rest, 15);
    for(let k = 0; k < 30; k++) carte.querySelector('[data-rep="15"]').click();
    eq("Plafond à cinq minutes", DB.active.entries[0].target.rest, 300);
    DB.active = null; DB.templates = [];
    F.render();
  })();
  neuf();

  grp("Gainages : le temps à la place des reps");
  neuf();
  /* On ne repete pas un gainage, on le tient : le champ « reps » porte des secondes,
     et un chrono le remplit. */
  (()=>{
    const iso = F.eval("ISOMETRIQUES");
    eq("Trois exercices se tiennent", iso.length, 3);
    vrai("Le gainage en fait partie", F.estIsometrique(F.getEx(id("Gainage"))));
    vrai("La planche latérale aussi", F.estIsometrique(F.getEx(id("Planche latérale"))));
    vrai("Le développé couché non", !F.estIsometrique(F.getEx(id("Développé couché"))));
    /* les secondes se lisent en minutes au-delà de soixante */
    eq("45 secondes", F.fmtDuree(45), "45 s");
    eq("95 secondes", F.fmtDuree(95), "1:35");
    eq("120 secondes", F.fmtDuree(120), "2:00");

    DB.active = null;
    DB.templates = [{id:"tiso", name:"Abdos", items:[
      {exId:id("Gainage"), sets:3, reps:"30-45", rest:60}]}];
    F.startWorkout("tiso");
    const D2 = F.document;
    const carte = D2.querySelector(".ex-card");
    vrai("La carte se sait isométrique", carte.classList.contains("iso"));
    eq("La colonne porte la durée",
      [...carte.querySelectorAll(".set-cols span")][2].textContent, "durée");
    eq("Le champ attend des secondes",
      carte.querySelectorAll(".set-row input")[1].placeholder, "sec");
    /* un dégressif consiste à baisser la charge : sur un gainage à zéro kilo, rien à baisser */
    vrai("Pas de dégressif sur un gainage", !carte.querySelector(".dg"));
    /* l'enchaînement : une seule pression, l'app déroule tout */
    vrai("Le bouton est en tête de carte", !!carte.querySelector(".iso-chrono"));
    /* le repos fait partie de l'enchaînement : on le règle AVANT de lancer, donc
       au-dessus des séries et non tout en bas de la carte */
    const rgs = [...carte.children].map(n=>n.className);
    vrai("Le repos se règle au-dessus des séries",
      rgs.indexOf("ex-repos") > rgs.indexOf("iso-chrono") &&
      rgs.indexOf("ex-repos") < rgs.indexOf("set-cols"));
    eq("Il propose de démarrer", carte.querySelector("[data-iso]").textContent, "Démarrer");
    eq("Le bandeau annonce ce qu'il reste à tenir",
      carte.querySelector(".iso-chrono .k").textContent, "Séries à tenir");
    /* trois séries de 40 s avec 60 s de repos : tenue, repos, tenue, repos, tenue */
    DB.active.entries[0].sets.forEach(st=>{ st.r = 40; st.done = false; });
    DB.active.entries[0].target = {rest:60};
    const et = F.etapesIso(0);
    eq("Chaque tenue est suivie d'un repos",
      et.map(x=>x.type).join(","), "tenue,repos,tenue,repos,tenue,repos,tenue");
    eq("Pas de repos après la dernière", et[et.length-1].type, "tenue");
    eq("Les tenues durent ce qui est écrit", et[0].sec, 40);
    eq("Le repos vient de la séance", et[1].sec, 60);
    /* appuyer sur « Démarrer » ne lance pas la tenue : il reste cinq secondes pour
       poser le téléphone et se mettre en position */
    F.lancerSeqIso(0);
    vrai("Le décompte part", !!F.eval("preIso"));
    vrai("…et la tenue attend", !F.eval("seqIso"));
    eq("La barre annonce le départ",
      F.document.getElementById("rest-lbl").textContent, "Départ");
    eq("Le bouton propose d'annuler",
      F.document.querySelector("[data-iso]").textContent, "Annuler");
    eq("Le bandeau parle toujours des séries à tenir",
      F.document.querySelector(".iso-chrono .k").textContent, "Séries à tenir");
    /* une deuxième pression annule tout : ni décompte, ni barre, ni minuterie */
    F.lancerSeqIso(0);
    vrai("On peut annuler le décompte", !F.eval("preIso"));
    vrai("…la barre disparaît",
      !/\bshow\b/.test(F.document.getElementById("restbar").className));
    vrai("…et rien ne tourne plus", !F.eval("rest").int);
    /* on relance, et on amène le décompte à zéro sans attendre */
    F.lancerSeqIso(0);
    F.eval("rest").end = Date.now() - 1;
    F.tickRest();
    vrai("À zéro le décompte passe la main", !F.eval("preIso"));
    vrai("L'enchaînement tourne", !!F.eval("seqIso"));
    eq("Le bandeau passe à la série en cours",
      F.document.querySelector(".iso-chrono .k").textContent, "Série en cours");
    /* le décompte s'entend autant qu'il se voit : une note seule à trois, deux, un,
       puis le triple bip qui dit que ça commence */
    F.arreterSeqIso(false);
    /* on écoute les deux sonneries elles-mêmes, pas les oscillateurs : elles se
       taisent quand l onglet n est pas au premier plan, et le cadre de test l est
       rarement — le test dependait alors de la fenetre active. */
    const sons = [], noteOrig = F.bipDecompte, tripleOrig = F.bipRepos;
    F.bipDecompte = ()=>sons.push("note");
    F.bipRepos = ()=>sons.push("triple");
    F.lancerSeqIso(0);
    [2800, 1800, 800].forEach(ms=>{ F.eval("rest").end = Date.now() + ms; F.tickRest(); });
    F.eval("rest").end = Date.now() - 1; F.tickRest();
    F.bipDecompte = noteOrig; F.bipRepos = tripleOrig;
    eq("Trois notes puis le triple bip", sons.join(","), "note,note,note,triple");
    /* on repart d ici : le triple bip vient de lancer la tenue, comme plus haut */
    eq("On commence par tenir", F.document.getElementById("rest-lbl").textContent, "Gainage");
    vrai("…et la barre le dit",
      F.document.getElementById("restbar").classList.contains("tenue"));
    F.avancerIso();
    eq("Puis le repos", F.document.getElementById("rest-lbl").textContent, "Repos");
    vrai("La tenue est validée toute seule", DB.active.entries[0].sets[0].done);
    vrai("…et la barre reprend sa couleur",
      !F.document.getElementById("restbar").classList.contains("tenue"));
    F.avancerIso();
    eq("Puis on tient de nouveau", F.document.getElementById("rest-lbl").textContent, "Gainage");
    /* jusqu'au bout */
    for(let k = 0; k < 10 && F.eval("seqIso"); k++) F.avancerIso();
    vrai("L'enchaînement s'arrête au bout", !F.eval("seqIso"));
    vrai("Toutes les tenues sont validées",
      DB.active.entries[0].sets.every(st=>st.done));
    /* « Arrêter » coupe aussi la minuterie : elle finissait son compte toute seule,
       comme un repos que personne n'avait demandé */
    DB.active.entries[0].sets.forEach(st=>{ st.r = 40; st.done = false; });
    F.lancerSeqIso(0);
    F.eval("rest").end = Date.now() - 1;
    F.tickRest();
    vrai("Une tenue est en cours", !!F.eval("seqIso"));
    F.arreterSeqIso(false);
    vrai("L'arrêt coupe la minuterie", !F.eval("rest").int);
    vrai("…et retire la barre",
      !/\bshow\b/.test(F.document.getElementById("restbar").className));
    /* sans durée, rien à enchaîner */
    DB.active.entries[0].sets.forEach(st=>{ st.r = 0; st.done = false; });
    eq("Sans durée, aucune étape", F.etapesIso(0).length, 0);
    /* terminer la séance arrête l'enchaînement */
    DB.active.entries[0].sets.forEach(st=>{ st.r = 40; st.done = false; });
    F.lancerSeqIso(0);
    F.eval("rest").end = Date.now() - 1;
    F.tickRest();
    F.arreterChronos();
    vrai("La fin de séance arrête l'enchaînement", !F.eval("seqIso"));
    /* et un décompte qui n'avait pas encore commencé ne doit pas se réveiller */
    F.lancerSeqIso(0);
    F.arreterChronos();
    vrai("…et le décompte de départ avec", !F.eval("preIso"));
    DB.active = null; DB.templates = [];
    F.render();
  })();
  neuf();

  grp("Le minuteur de repos, en rond");
  neuf();
  /* La barre a pris la forme du croquis : un disque qui deborde de part et d autre,
     un anneau fin qui se remplit, un bouton de pause loge dedans. Ce qui compte
     ici n est pas le dessin mais qu il dise l heure : l anneau doit suivre le temps
     ecoule, et le bouton doit changer de sens des qu on met en pause. */
  (()=>{
    const D2 = F.document;
    const disque = D2.querySelector("#rest-pill .rb-disc");
    vrai("Le disque existe", !!disque);
    const arc = D2.getElementById("rest-arc");
    vrai("L'anneau existe", !!arc);
    const pause = D2.getElementById("rest-pause");
    vrai("Le bouton de pause est posé sur le disque",
      !!pause && pause.closest(".rb-disc") === disque);
    const C = n => F.getComputedStyle(n);
    const barre = D2.getElementById("restbar");
    const tour = F.eval("RB_TOUR");
    const creux = () => parseFloat(arc.style.strokeDashoffset);

    /* une séance de gainage laissait sa marque : le repos suivant repartait en vert */
    barre.classList.add("tenue");
    F.startRest(120);
    vrai("Un repos qui commence n'est pas une tenue", !barre.classList.contains("tenue"));
    vrai("Au départ l'anneau est vide", Math.abs(creux() - tour) < 1);
    /* le cadran est une pièce d'horlogerie : sombre dans les deux thèmes */
    eq("Le cadran est sombre", C(disque).backgroundColor, "rgb(46, 32, 21)");
    eq("…et ses chiffres clairs",
      C(D2.querySelector("#rest-pill .t")).color, "rgb(255, 255, 255)");
    /* pendant une tenue la barre passe au vert : le cadran suit, sinon le brun jurerait */
    barre.classList.add("tenue");
    eq("Le cadran suit la tenue", C(disque).backgroundColor, "rgb(39, 39, 25)");
    barre.classList.remove("tenue");
    eq("Le libellé annonce le repos", D2.getElementById("rest-lbl").textContent, "Repos");
    eq("Le bouton propose la pause", pause.getAttribute("aria-label"), "Mettre en pause");
    eq("…avec les deux barres", pause.querySelectorAll("rect").length, 2);

    /* la moitié du temps passée : la moitié de l'anneau */
    const r = F.eval("rest");
    r.end = Date.now() + 60000;
    F.tickRest();
    vrai("À mi-parcours l'anneau est à moitié", Math.abs(creux() - tour/2) < 6);

    F.togglePauseRest();
    eq("En pause il propose de reprendre", pause.getAttribute("aria-label"), "Reprendre");
    eq("…avec un triangle", pause.querySelectorAll("path").length, 1);
    F.togglePauseRest();
    eq("Et on repart", pause.getAttribute("aria-label"), "Mettre en pause");

    /* à zéro l'anneau est plein : un anneau à moitié effacé dirait qu'il reste du temps */
    F.eval("rest").end = Date.now() - 100;
    F.tickRest();
    vrai("À zéro l'anneau est plein", creux() < 1);

    /* le bouton ne deborde plus du cadran : il tient dedans, sous les chiffres.
       On lit les regles et non la geometrie : le cadre de test est masque, tous les
       rectangles y valent zero et une comparaison de positions passerait a vide. */
    const cp = C(pause);
    vrai("Le bouton tient dans le cadran", parseFloat(cp.bottom) >= 0);
    vrai("…et il est plus petit que lui",
      parseFloat(cp.width) < parseFloat(C(disque).width) / 2);

    F.arreterChronos();
  })();
  neuf();

  grp("Le bandeau d'une séance");
  neuf();
  /* Le bandeau est droit : plus d'arc, plus de cercle. Le titre, ce que pèse la séance
     et le chrono se calent en bas, sur la même ligne de base. */
  (()=>{
    DB.active = null; DB.seen = {};
    DB.templates = [{id:"tban", name:"Test RIR", items:[
      {exId:id("Développé couché"), sets:3, reps:"8-12", rest:120},
      {exId:id("Rowing barre"), sets:3, reps:"8-12", rest:120}]}];
    F.startWorkout("tban");
    const D2 = F.document;
    vrai("Le bandeau de séance n'a plus l'arc",
      !/A1021/.test(D2.querySelector(".hero-en-cours .hero-bg").innerHTML));
    /* ce que pèse la séance, en un coup d'œil */
    const meta = D2.querySelector(".hero-meta span").textContent;
    const travail = DB.active.entries.reduce((n, e)=>n + e.sets.filter(st=>!st.warm).length, 0);
    eq("L'échauffement ne compte pas comme une série", travail, 6);
    eq("Le bandeau dit ce que pèse la séance",
      meta.replace(/~\d+ min/, "~m"), "2 exercices · 6 séries · ~m");
    vrai("…et estime une durée", /~\d+ min/.test(meta));
    /* ce que la séance a déjà produit, dans les mêmes pastilles que le chrono */
    eq("Deux pastilles de plus", D2.querySelectorAll(".hero-stats .hs").length, 2);
    eq("Rien de soulevé au départ", D2.getElementById("hs-vol").textContent, "0 kg");
    DB.active.entries[0].sets.forEach(st=>{ if(!st.warm){ st.w = 60; st.r = 10; st.done = true; } });
    F.renderActive(D2.getElementById("app"));
    /* le séparateur des milliers est une espace insécable : on la ramène à une espace
       ordinaire, sinon la comparaison échoue sur deux textes identiques à l oeil */
    eq("Le tonnage suit les séries validées",
      D2.getElementById("hs-vol").textContent.replace(/\s/g, " "), "1 800 kg");
    vrai("…et les calories avec",
      parseInt(D2.getElementById("hs-kcal").textContent, 10) > 0);
    /* l'étiquette du chrono était posée en absolu et plus large que lui : elle
       sortait de l'écran par la droite. Elle est maintenant à côté, dans un bloc. */
    const bloc = D2.querySelector(".chrono-bloc");
    vrai("Le chrono et son étiquette font un bloc", !!bloc);
    vrai("…l'étiquette est hors du bouton",
      !D2.getElementById("chrono").querySelector(".lab") && !!bloc.querySelector(".lab"));
    /* l'encadré de l'échauffement */
    const enc = D2.querySelector(".hint-box");
    vrai("L'encadré porte la flamme", !!enc.querySelector(".hi .icm-flamme"));
    eq("L'abréviation reste en orange", enc.querySelector(".ht i").textContent, "Éch.");
    eq("…et on peut dire qu'on a compris",
      enc.querySelector(".hint-ok").textContent, "Compris");
    eq("L'encadré porte son étiquette", enc.querySelector(".bdg").textContent, "Astuce");
    /* la croix ferme sans lire : elle doit fermer aussi bien que « Compris » */
    vrai("…et une croix dans le coin", !!enc.querySelector(".hint-x[data-hintx]"));
    enc.querySelector(".hint-x").click();
    vrai("La croix referme l'encadré", !D2.querySelector(".hint-box .icm-flamme"));
    /* l'encadré suivant, celui du dégressif */
    const deg = D2.querySelector(".hint-box");
    eq("Le dégressif s'annonce", deg.querySelector(".ht").textContent, "Série dégressive");
    vrai("…avec la flèche qui descend", !!deg.querySelector(".hi svg"));
    eq("…et l'exemple en gras", deg.querySelector("b").textContent, "6 × 12 kg, puis 4 × 10 kg.");
    /* le bas de carte : un seul geste encadré, les autres sont des mots */
    const bas = D2.querySelector(".ex-bas");
    vrai("« + série » garde son cadre",
      bas.querySelector('[data-act="addset"]').classList.contains("btn-ghost"));
    vrai("« Remplacer » est un mot, pas un bouton",
      bas.querySelector('[data-act="swap"]').classList.contains("ex-lien"));
    vrai("« Retirer » aussi, en rouge",
      bas.querySelector('[data-act="delex"]').classList.contains("danger"));
    DB.active = null; DB.templates = [];
    F.render();
  })();
  neuf();

  grp("Fin de séance : tout s'éteint");
  neuf();
  /* Terminer ou annuler doit tout couper, et SANS UN BRUIT. Un repos qui arrivait a
     zero pendant qu on validait la fin de seance sonnait dans le vide, et la barre
     restait affichee par-dessus l accueil. */
  (()=>{
    DB.templates = [{id:"tfin", name:"Fin", items:[
      {exId:id("Développé couché"), sets:3, reps:"8-12", rest:120}]}];
    DB.active = null;
    F.startWorkout("tfin");
    F.startRest(120);
    const barre = () => F.document.getElementById("restbar").className;
    vrai("Le repos tourne", !!F.eval("rest").int);
    vrai("La barre est affichée", /\bshow\b/.test(barre()));
    vrai("Le chrono de séance tourne", !!F.eval("chronoInt"));
    F.arreterChronos();
    const r = F.eval("rest");
    vrai("Le compte à rebours est arrêté", !r.int);
    vrai("…et ne peut pas se rallumer", r.end === 0 && !r.hideTo && !r.paused);
    vrai("Le chrono de séance est arrêté", !F.eval("chronoInt"));
    vrai("La barre a disparu", !/\bshow\b/.test(barre()));
    vrai("…sans garder son clignotement", !/\bending\b/.test(barre()));
    vrai("…ni son état de pause", !/\bpaused\b/.test(barre()));
    /* le son en cours est coupé net, pas laissé finir */
    F.ensureAudio(); F.beep();
    const avant = F.eval("bipsEnCours").length;
    F.arreterChronos();
    vrai("Un bip en cours est coupé", avant === 0 || F.eval("bipsEnCours").length === 0);
    /* les deux chemins réels passent bien par là */
    vrai("Annuler éteint tout",
      /arreterChronos\(\)/.test(F.eval("document.getElementById('cancel-w').onclick.toString()")));
    DB.active = null; DB.templates = [];
    F.render();
  })();
  neuf();

  grp("Signes des analyses");
  neuf();
  /* Chaque section de la page Progression s ouvre par son signe : en defilant, on
     retrouve « le poids » ou « les proteines » a la forme avant de lire le mot. */
  (()=>{
    const j = n => { const d = new Date(); d.setDate(d.getDate()-n); return d.toISOString(); };
    DB.active = null;
    DB.weights = [{date:j(40), kg:70}, {date:j(20), kg:71.5}, {date:j(1), kg:73}];
    DB.habitSel = {}; DB.habitSel[F.jourAlim()] = {midi:["Poulet (1 filet, 130 g cuit)"]};
    DB.history = [{id:"ha", date:j(3), tplId:"t", name:"S", start:Date.now()-3.6e6, end:Date.now(),
      entries:[{exId:id("Développé couché"), sets:[{w:60,r:10,done:true},{w:60,r:10,done:true}]}]},
      {id:"hb", date:j(10), tplId:"t", name:"S", start:Date.now()-3.6e6, end:Date.now(),
      entries:[{exId:id("Développé couché"), sets:[{w:55,r:10,done:true},{w:55,r:10,done:true}]}]}];
    DB.cardio = [{date:j(4), km:5, min:30}, {date:j(11), km:4, min:25}];
    F.eval("curTab = 'prg';");
    F.render();
    const titres = [...F.document.querySelectorAll(".card-t")];
    vrai("La page des analyses a ses sections", titres.length >= 4);
    const sans = titres.filter(t=>!t.querySelector(".ic-t svg, .ic-t .icm")).map(t=>t.textContent.trim());
    vrai("Chaque section porte son signe" + (sans.length? " (manque : "+sans.join(", ")+")" : ""),
      sans.length === 0);
    /* le signe vient AVANT le mot, pas apres */
    vrai("Le signe ouvre le titre",
      titres.every(t=>t.firstElementChild && t.firstElementChild.classList.contains("ic-t")));
    /* et il prend l'orange de l'app */
    eq("Il est orange",
      F.getComputedStyle(titres[0].querySelector(".ic-t")).color, "rgb(245, 130, 32)");
    DB.weights = []; DB.history = []; DB.cardio = []; DB.habitSel = {};
    F.eval("curTab = 'seance';");
    F.render();
  })();
  neuf();

  grp("Les réflexes");
  neuf();
  (()=>{
    const lignes = () => [...F.document.querySelectorAll(".ref-c .li")];
    F.openKcalTips("up", F.planFor(DB.profile));
    eq("Quatre réflexes", lignes().length, 4);
    vrai("La carte s'annonce avec son ampoule",
      !!F.document.querySelector(".ref-c .hd .ic svg"));
    eq("…et son titre", F.document.querySelector(".ref-c .t").textContent, "Les réflexes");
    eq("Chaque ligne est cochée", F.document.querySelectorAll(".ref-c .ck svg").length, 4);
    /* la consigne devant les deux points passe en gras, le reste explique */
    eq("La consigne est en gras",
      lignes()[0].querySelector("b").textContent, "Bois tes calories");
    vrai("…sans avaler l'espace du français",
      !/\s$/.test(lignes()[0].querySelector("b").textContent));
    vrai("…et la ponctuation reste française",
      /<\/b> : /.test(lignes()[0].querySelector(".d").innerHTML));
    /* une phrase sans deux points reste d'un seul tenant */
    vrai("Une phrase sans deux points n'est pas coupée", !lignes()[3].querySelector("b"));
    F.hideSheet();
    /* en anglais, pas d'espace avant les deux points */
    DB.settings.lang = "en";
    F.openKcalTips("up", F.planFor(DB.profile));
    vrai("En anglais la ponctuation suit l'anglais",
      /<\/b>: /.test(F.document.querySelector(".ref-c .li .d").innerHTML));
    F.hideSheet();
    DB.settings.lang = "auto";
    /* l'autre versant : réduire les calories */
    F.openKcalTips("down", F.planFor(DB.profile));
    eq("Quatre réflexes aussi pour réduire", lignes().length, 4);
    F.hideSheet();
  })();
  neuf();

  grp("Aperçu d'une séance");
  neuf();
  (()=>{
    DB.active = null;
    DB.templates = [{id:"tap", name:"Test deux", items:[
      {exId:id("Développé couché"), sets:3, reps:"8-12", rest:120},

     fond, soit par sa couleur, soit par un filet. */
  (()=>{
    const D2 = F.document;
    const fondDerriere = el => { let p = el.parentElement;
      while(p){ const c = F.getComputedStyle(p).backgroundColor;
        if(c && c !== "rgba(0, 0, 0, 0)") return c; p = p.parentElement; }
      return "rgb(255, 255, 255)"; };
    const invisibles = racine => {
      const out = [];
      (racine || D2).querySelectorAll("*").forEach(el=>{
        const cs = F.getComputedStyle(el), bg = cs.backgroundColor;
        if(!bg || bg === "rgba(0, 0, 0, 0)") return;
        /* une case a cocher est dessinee par le navigateur : son style calcule ne dit
           rien de ce qui s affiche vraiment */
        if(el.tagName === "INPUT" && /^(checkbox|radio)$/.test(el.type)) return;
        if(bg !== fondDerriere(el)) return;
        /* un filet ou une ombre suffit a le detacher */
        if(parseFloat(cs.borderTopWidth) > 0 && cs.borderTopColor !== bg) return;
        if(cs.boxShadow && cs.boxShadow !== "none") return;
        if(cs.outlineStyle && cs.outlineStyle !== "none") return;
        out.push(String(el.className || el.tagName).split(" ")[0]);
      });
      return [...new Set(out)];

  (()=>{

    vrai("Chacun porte son signe",
      lignes.every(l => !!l.querySelector(":scope > .rgi svg")),
      lignes.filter(l => !l.querySelector(".rgi svg")).length + " sans icône");
    vrai("Le signe vient avant le texte",
      lignes.every(l => l.firstElementChild.classList.contains("rgi")));
    F.hideSheet();
  })();
  neuf();

  grp("L'alarme du minuteur");
  neuf();
  /* Depuis Android 13, « Alarmes et rappels » est refusée par défaut, et le greffon se
     rabat SILENCIEUSEMENT sur une alarme approximative. On la demande donc une fois, au
     premier repos, pendant que l'application est encore à l'écran. */
  await (async ()=>{
    const gardeSeen = DB.seen.alarmeExacte, gardeSon = DB.settings.son;
    const appels = {check:0, change:0, perm:0};
    let etat = "denied";
    /* faux greffon : les tests tournent dans un navigateur, où Capacitor n'existe pas */
    F.window.Capacitor = {isNativePlatform:()=>true, Plugins:{LocalNotifications:{
      checkPermissions: async ()=>({display:"prompt"}),
      requestPermissions: async ()=>{ appels.perm++; return {display:"granted"}; },
      checkExactNotificationSetting: async ()=>{ appels.check++; return {exact_alarm:etat}; },
      changeExactNotificationSetting: async ()=>{ appels.change++; etat = "granted";
        return {exact_alarm:etat}; },
      schedule: async ()=>({}), cancel: async ()=>({})
    }}};

    /* Toute cette fonction se tait quand la page n'est pas à l'écran — c'est voulu :
       on ne réclame pas une autorisation à quelqu'un qui regarde ailleurs. Mais la
       suite de tests, elle, tourne souvent dans une fenêtre passée en arrière-plan,
       et le navigateur déclare alors la page « hidden ». On force donc l'état visible
       le temps du groupe, exactement comme on remplace Capacitor par un faux greffon.
       Sans ça, ces essais échouaient selon que Nico avait la fenêtre devant lui. */
    const vraiEtat = Object.getOwnPropertyDescriptor(F.Document.prototype, "visibilityState");
    const vraiCache = Object.getOwnPropertyDescriptor(F.Document.prototype, "hidden");
    Object.defineProperty(F.Document.prototype, "visibilityState",
      {get:()=>"visible", configurable:true});
    Object.defineProperty(F.Document.prototype, "hidden", {get:()=>false, configurable:true});
    /* et on attend que la chose arrive plutôt qu'un délai fixe : en arrière-plan le
       navigateur étire les minuteurs, un « attendre 800 ms » devenait un pile ou face */
    const jusqua = async (cond, max) => { const t0 = Date.now();
      while(Date.now() - t0 < (max || 4000)){ if(cond()) return true;
        await new Promise(r=>setTimeout(r, 40)); } return cond(); };

    delete DB.seen.alarmeExacte;
    DB.settings.son = true;
    await F.verifierAlarmeExacte();
    vrai("L'état est lu auprès du système", appels.check === 1, appels.check);
    vrai("Le refus est retenu pour ne plus jamais redemander", !!DB.seen.alarmeExacte);
    await jusqua(()=>!!F.document.getElementById("alm-ok"));
    vrai("La fiche explique à quoi sert l'autorisation",
      !!F.document.getElementById("alm-ok"));
    eq("Deux promesses, pas une", F.document.querySelectorAll("#sheet .alm-note").length, 2);
    vrai("…et l'une dit qu'elle ne sert qu'aux séances",
      [...F.document.querySelectorAll("#sheet .alm-note .s")]
        .some(e=>/entraînement|séance/i.test(e.textContent)));
    /* les gens ne lisent pas : la fiche doit tenir en quelques lignes */
    vrai("La fiche reste courte",
      F.document.getElementById("sheet").textContent.replace(/\s+/g, " ").trim().length < 330,
      F.document.getElementById("sheet").textContent.replace(/\s+/g, " ").trim().length + " caractères");

    /* « Autoriser » ouvre la page système ; au retour l'état est relu, pas supposé */
    const bouton = F.document.getElementById("alm-ok");
    if(bouton) bouton.click();
    await jusqua(()=>appels.change === 1, 1000);
    vrai("« Autoriser » ouvre le réglage système", appels.change === 1, appels.change);
    /* le réglage revient du système, il est relu ensuite : deux temps, pas un */
    await jusqua(()=>F.eval("alarmeExacte") === "granted", 1000);
    eq("…et l'état est relu", F.eval("alarmeExacte"), "granted");
    F.hideSheet();

    /* on ne repose jamais la question */
    const avant = appels.check;
    await F.verifierAlarmeExacte();
    vrai("On ne redemande pas une deuxième fois", appels.check === avant + 0 || !!DB.seen.alarmeExacte);

    /* son coupé : il n'y a rien à autoriser */
    delete DB.seen.alarmeExacte;
    DB.settings.son = false;
    const avant2 = appels.check;
    await F.verifierAlarmeExacte();
    eq("Son coupé, on ne demande rien", appels.check, avant2);
    vrai("…et rien n'est retenu", !DB.seen.alarmeExacte);

    /* la permission des notifications se demande À L'ÉCRAN, pas une fois l'app cachée */
    DB.settings.son = true;
    delete DB.seen.alarmeExacte;
    F.eval("notifsOk = null");
    await F.verifierAlarmeExacte();
    vrai("La permission des notifications est demandée pendant qu'on la voit",
      appels.perm >= 1, appels.perm);

    delete F.window.Capacitor;
    if(vraiEtat) Object.defineProperty(F.Document.prototype, "visibilityState", vraiEtat);
    if(vraiCache) Object.defineProperty(F.Document.prototype, "hidden", vraiCache);
    F.eval("alarmeExacte = null; notifsOk = null");
    DB.seen.alarmeExacte = gardeSeen; DB.settings.son = gardeSon;
    if(gardeSeen === undefined) delete DB.seen.alarmeExacte;
  })();
  neuf();

  grp("Le ressenti de fin de séance");
  neuf();
  /* Le RIR dit si LA SÉRIE était lourde ; le ressenti dit si LA JOURNÉE a coûté. On peut
     tenir tous ses RIR et sortir vidé d'une nuit de quatre heures. */
  (()=>{
    const seance = (j, feel) => { const o = {id:"r"+j, date:new Date(Date.now()-j*36e5).toISOString(),
      name:"x", templateId:"x", start:0, end:0,

      if(feel) o.feel = feel; return o; };
    const recup = feel => { DB.history = [seance(20, feel)];
      return F.recuperation().muscles["Biceps"].pct; };

    const dur = recup("dur"), neutre = recup(null), facile = recup("facile");
    vrai("Une séance dite dure coûte plus cher", dur < neutre, dur + " contre " + neutre);
    vrai("Une séance dite facile coûte moins cher", facile > neutre, facile + " contre " + neutre);
    /* les coefficients restent petits : les RIR ont déjà remonté le coût */
    vrai("…sans écraser la récupération", neutre - dur < 12, "écart de " + (neutre - dur));
    eq("Ne rien répondre vaut « correct »", recup(undefined), neutre);

    /* une seule séance ne décide de rien */
    DB.history = [seance(20, "dur")];
    eq("Une seule séance ne fait pas une tendance", F.tendanceRessenti(), null);
    DB.history = [seance(20, "dur"), seance(60, "dur")];
    eq("Deux dures d'affilée, oui", F.tendanceRessenti(), "dur");
    DB.history = [seance(20, "facile"), seance(60, "facile")];
    eq("Deux faciles aussi", F.tendanceRessenti(), "facile");
    DB.history = [seance(20, "dur"), seance(60, "facile")];
    eq("Deux avis contraires ne disent rien", F.tendanceRessenti(), null);

    /* et la fiche l'annonce, en tête */
    DB.history = [seance(20, "dur"), seance(60, "dur")];
    const r = F.raisonsSeance("pull");
    vrai("La fiche annonce qu'on allège", /allège/i.test(r[0][1]), JSON.stringify(r[0]));
    DB.history = [seance(20, "facile"), seance(60, "facile")];
    vrai("…ou qu'on en remet une couche", /couche/i.test(F.raisonsSeance("pull")[0][1]));
    DB.history = [];
  })();
  neuf();

  /* Le niveau se déduit des charges, sans poser la question. */
  (()=>{
    DB.history = [];
    eq("Sans données, on ne suppose rien", F.niveauPratiquant(), "inconnu");
    const avant = F.cibleHebdo("Pectoraux");
    /* des charges très au-dessus des standards : pratiquant avancé */
    const fort = [["Développé couché", 140], ["Squat", 180], ["Soulevé de terre", 220],
                  ["Rowing barre", 130], ["Développé militaire", 95]];
    /* deux passages par exercice : le profil musculaire exige deux valeurs par groupe
       avant de se prononcer — un seul essai ne dit rien d'un niveau */
    const hist = (liste, f, p) => liste.reduce((a, [n, w], i)=>a.concat([0, 1].map(k=>({
      id:(p||"n")+i+k, date:new Date(Date.now()-(i*2+k+2)*864e5).toISOString(),
      name:"x", templateId:"x", start:0, end:0,
      entries:[{exId:id(n), sets:[serie(Math.round(w*f), 5, 1)]}]}))), []);
    DB.history = hist(fort, 1, "haut");
    eq("Des charges très hautes donnent « avancé »", F.niveauPratiquant(), "avance");
    vrai("…et un pratiquant avancé encaisse plus de volume",
      F.cibleHebdo("Pectoraux") > avant, F.cibleHebdo("Pectoraux") + " contre " + avant);
    /* des charges très basses : débutant */
    DB.history = hist(fort, 0.25, "bas");
    eq("Des charges basses donnent « débutant »", F.niveauPratiquant(), "debutant");
    vrai("…et un débutant se construit sur moins de volume",
      F.cibleHebdo("Pectoraux") < avant, F.cibleHebdo("Pectoraux") + " contre " + avant);
    DB.history = [];
  })();
  neuf();

  grp("Lever le pied, sur preuve");
  neuf();
  /* Pas de semaine de décharge au calendrier : rien ne dit qu'arrêter tous les quatre
     lundis fasse mieux que continuer. On lève le pied sur LE muscle qui le demande,
     et seulement quand trois signaux concordent. */
  (()=>{
    const jours = j => new Date(Date.now() - j*864e5).toISOString();
    /* deux exercices de biceps, charge figée, tout à l'échec, séances rapprochées */
    const seance = (j, w, rir) => ({id:"p"+j+w, date:jours(j), name:"x", templateId:"x",
      start:0, end:0, entries:[
        {exId:id("Curl barre"),    sets:[serie(w,8,rir), serie(w,8,rir), serie(w,8,rir)]},
        {exId:id("Curl haltères"), sets:[serie(w/2,8,rir), serie(w/2,8,rir), serie(w/2,8,rir)]}]});

    /* cas franc : charge plate, tout à zéro de réserve, et une séance d'hier */
    DB.history = [seance(12, 30, 0), seance(8, 30, 0), seance(4, 30, 0), seance(0.3, 30, 0)];
    const perf = F.progressionParExo(), rec = F.recuperation();
    vrai("Un muscle qu'on pilonne sans progresser est repéré",
      F.musclePompe("Biceps", perf, rec) === true);

    /* la charge monte : on continue, il n'y a rien à alléger */
    DB.history = [seance(12, 24, 0), seance(8, 26, 0), seance(4, 28, 0), seance(0.3, 32, 0)];
    vrai("Tant que la charge monte, on ne lève pas le pied",
      F.musclePompe("Biceps", F.progressionParExo(), F.recuperation()) === false);

    /* il reste de la réserve : la charge est plate mais l'effort ne l'explique pas */
    DB.history = [seance(12, 30, 3), seance(8, 30, 3), seance(4, 30, 3), seance(0.3, 30, 3)];
    vrai("Des séries gardées en réserve ne comptent pas comme un excès",
      F.musclePompe("Biceps", F.progressionParExo(), F.recuperation()) === false);

    /* et un muscle dont on n'a presque rien : on ne tranche pas sur du vide */
    DB.history = [seance(4, 30, 0)];
    vrai("Sans assez de suivi, on ne conclut rien",
      F.musclePompe("Biceps", F.progressionParExo(), F.recuperation()) === false);

    /* le besoin en tient compte, et la fiche le dit */
    DB.history = [seance(12, 30, 0), seance(8, 30, 0), seance(4, 30, 0), seance(0.3, 30, 0)];
    const b = F.besoinsMuscles("pull").find(x=>x.muscle === "Biceps");
    vrai("Le besoin porte la marque", b.pompe === true);
    const r = F.raisonsSeance("pull");
    vrai("…et la fiche dit qu'on lève le pied",
      r.some(([m, t])=>/lève le pied/i.test(t)), JSON.stringify(r));
    DB.history = [];
  })();
  neuf();

  /* La récupération ralentit avec l'âge — modérément. */
  (()=>{
    const garde = DB.profile.age;
    const pct = a => { DB.profile = Object.assign({}, DB.profile, {age:a});
      return F.recuperation().muscles["Biceps"].pct; };
    DB.history = [{id:"a1", date:new Date(Date.now()-20*36e5).toISOString(), name:"x",
      templateId:"x", start:0, end:0,
      entries:[{exId:id("Curl barre"), sets:[serie(30,8,0), serie(30,8,0), serie(30,8,0)]}]}];
    const jeune = pct(25), vieux = pct(55);

    vrai("…mais l'écart reste mesuré", jeune - vieux < 20, "écart de " + (jeune - vieux));
    eq("Le facteur est plafonné", Math.round(F.facteurAge()*100)/100 <= 1.33, true);
    DB.profile = Object.assign({}, DB.profile, {age:garde});
    DB.history = [];
  })();
  neuf();

  grp("Le repos réellement pris");
  neuf();
  /* Une série écourtée passait pour une charge trop lourde : les répétitions tombaient,
     l'app baissait le poids, et la force n'y était pour rien. */
  (()=>{
    const dc = id("Développé couché");
    const seance = (repos) => { let t = Date.now() - 3*864e5;
      const sets = [];
      [10, 6, 5].forEach((r, i)=>{ if(i) t += repos*1000; sets.push(Object.assign(serie(60, r, 0), {t:t})); });
      return [{id:"rp", date:new Date(t).toISOString(), name:"x", templateId:"x",
        start:0, end:0, entries:[{exId:dc, sets:sets}]}]; };
    const cible = {reps:"8-12", rest:180};
    DB.history = seance(45);                       /* 45 s au lieu de 3 min */
    const court = F.suggestFor(dc, cible);
    vrai("Un repos écourté n'est pas une charge trop lourde", court.mode === "hold",
      court.mode + " · " + court.text);
    vrai("…et l'app dit pourquoi", /repos/i.test(court.text), court.text);
    eq("…en gardant la charge", court.w, 60);

    DB.history = seance(200);                      /* repos respecté */
    const normal = F.suggestFor(dc, cible);
    vrai("Avec le repos pris, la baisse compte vraiment", normal.mode !== "hold",
      normal.mode + " · " + normal.text);

    /* un repos PLUS LONG que prévu ne prouve rien : on n'en fait rien */
    DB.history = seance(400);
    vrai("Un repos trop long ne change rien", F.suggestFor(dc, cible).mode !== "hold");

    /* sans horaire, on ne devine pas */
    DB.history = [{id:"rp2", date:new Date(Date.now()-3*864e5).toISOString(), name:"x",
      templateId:"x", start:0, end:0,
      entries:[{exId:dc, sets:[serie(60,10,0), serie(60,8,0), serie(60,7,0)]}]}];
    vrai("Sans heure enregistrée, la règle ne s'applique pas",
      F.suggestFor(dc, cible).mode !== "hold");
    DB.history = [];
  })();
  neuf();

  grp("Les identifiants recalés");

  /* Deux exercices insérés au milieu de la bibliothèque les 4 et 5 septembre ont fait

  (()=>{
    const garde = DB.libV3;
    const seance = (iso, ids) => ({id:"r"+iso, date:iso, name:"x", templateId:"x",
      start:0, end:0, entries:ids.map(i=>({exId:i, sets:[serie(20,10)]}))});
    /* le cas réel : séance du 4 septembre 17h44, « lib21 » voulait dire Extension poulie */
    DB.history = [seance("2026-09-04T17:44:04.186Z", ["lib0","lib1","lib12","lib21"])];
    delete DB.libV3;
    F.applyDefaults();
    const ids = DB.history[0].entries.map(e=>e.exId);
    eq("L'extension poulie retrouve son identifiant", ids[3], id("Extension poulie (barre)"));
    eq("…et redevient une extension poulie",
      F.getEx(ids[3]).name, F.getEx(id("Extension poulie (barre)")).name);
    vrai("Les exercices d'avant le décalage ne bougent pas",
      ids[0] === "lib0" && ids[1] === "lib1" && ids[2] === "lib12", ids.join(", "));

    /* une séance d'avant le 4 septembre subit LES DEUX décalages */
    DB.history = [seance("2026-09-01T10:00:00.000Z", ["lib10","lib20","lib45"])];
    delete DB.libV3;
    F.applyDefaults();
    eq("Rang inférieur aux deux seuils : inchangé", DB.history[0].entries[0].exId, "lib10");
    eq("Rang au-dessus du seuil du 5 septembre : +1", DB.history[0].entries[1].exId, "lib21");
    eq("Rang au-dessus des deux seuils : +2", DB.history[0].entries[2].exId, "lib47");

    DB.history = [seance(new Date().toISOString(), ["lib21","lib90"])];

    F.applyDefaults();
    eq("…et rien ne se rejoue au chargement suivant", DB.history[0].entries[1].exId, "lib90");

  (()=>{

    vrai("…sans charge à viser", !g.poids, g.poids);
    eq("Sans historique, rien ne s'affiche", F.objectifDuJour(id("Squat"), cible), null);
    /* et le bandeau est bien dans la carte, pendant la séance. Trois séries au sommet
       de la fourchette avec de la réserve : l'app doit proposer de charger, donc

    DB.history = [{id:"o2", date:new Date(Date.now()-4*864e5).toISOString(), name:"x",

    vrai("…et l'écart avec la dernière fois", !!(el && el.querySelector(".ecart")),
      el ? el.textContent.trim().slice(0, 60) : "");

  grp("La justesse du moteur adaptatif");
  neuf();
  /* Le volume comptait des LIGNES COCHÉES : trois séries arrêtées loin de l'échec
     pesaient autant que trois séries menées à bout. Le RIR est demandé après chaque
     série, il sert enfin à quelque chose. */
  (()=>{
    const seances = rirs => [{id:"v"+Math.random(), date:new Date(Date.now()-2*864e5).toISOString(),
      name:"x", templateId:"x", start:0, end:0,
      entries:[{exId:id("Curl barre"), sets:rirs.map(r=>serie(20, 10, r))}]}];
    DB.history = seances([0,0,0]);
    const dur = F.volumeRecent("Biceps", 7);
    DB.history = seances([4,4,4]);
    const facile = F.volumeRecent("Biceps", 7);
    vrai("Trois séries dures pèsent plus que trois séries faciles", dur > facile,
      dur.toFixed(2) + " contre " + facile.toFixed(2));
    vrai("…sans changer d'ordre de grandeur", dur < facile * 2.5);
    /* un dégressif prolonge la série au-delà de l'échec : il ajoute sa part */
    DB.history = [{id:"vd", date:new Date(Date.now()-2*864e5).toISOString(), name:"x",
      templateId:"x", start:0, end:0,
      entries:[{exId:id("Curl barre"), sets:[serie(20,10,0,[{w:12,r:6}])]}]}];
    const avecDeg = F.volumeRecent("Biceps", 7);

    vrai("Un dégressif compte davantage qu'une série simple", avecDeg > F.volumeRecent("Biceps", 7));
    DB.history = [];
  })();
  neuf();

  /* Une cible inatteignable met TOUS les muscles « en retard » en permanence : le
     classement par besoin ne distingue alors plus rien. Elle suit donc le rythme réel
     et l'objectif. */
  (()=>{
    const cible = (jours, aim) => {
      DB.profile = Object.assign({}, DB.profile, {days:jours, aim:aim});
      return F.cibleHebdo("Pectoraux");
    };
    const deux = cible(2, "masse"), cinq = cible(5, "masse");
    vrai("Moins de séances, cible plus basse", deux < cinq, deux + " contre " + cinq);
    const masse = cible(4, "masse"), entretien = cible(4, "entretien"), force = cible(4, "force");
    vrai("L'entretien demande moins que la prise de masse", entretien < masse,
      entretien + " contre " + masse);
    vrai("La force aussi", force < masse, force + " contre " + masse);
    vrai("Jamais en dessous de trois séries", cible(1, "entretien") >= 3);
    /* les trois faisceaux de l'épaule se partagent toujours la cible du groupe */
    DB.profile = Object.assign({}, DB.profile, {days:4, aim:"masse"});
    vrai("Un faisceau d'épaule demande moins que le groupe entier",
      F.cibleHebdo("Deltoïdes (latéral)") < F.cibleHebdo("Pectoraux"));
  })();
  neuf();

  /* Le volume seul ne dit rien du RYTHME : un dos martelé lundi gardait un volume élevé
     jusqu'à dimanche, donc il restait en bas de la pile toute la semaine. */
  (()=>{
    const avecDelai = j => {
      DB.history = [{id:"f"+j, date:new Date(Date.now()-j*864e5).toISOString(), name:"x",
        templateId:"x", start:0, end:0,
        entries:[{exId:id("Curl barre"), sets:[serie(20,10,1), serie(20,10,1), serie(20,10,1)]}]}];
      return F.besoinsMuscles("pull").find(b=>b.muscle === "Biceps");
    };
    const hier = avecDelai(1), vieux = avecDelai(6);
    vrai("Le besoin porte la date du dernier travail", typeof hier.jours === "number");
    vrai("Un muscle qui attend depuis six jours passe devant celui d'hier",
      vieux.besoin > hier.besoin, vieux.besoin.toFixed(1) + " contre " + hier.besoin.toFixed(1));
    DB.history = [];
  })();
  neuf();

  /* Chaque objectif ne cherche pas la même chose : en force on ne touche pas un muscle
     qui n'est pas frais, en entretien il s'agit surtout de tout revoir régulièrement. */
  (()=>{
    const P = F.eval("POIDS_BESOIN");
    const aims = ["masse", "seche", "force", "recomp", "entretien"];
    vrai("Chaque objectif a ses poids", aims.every(a=>!!P[a]), aims.filter(a=>!P[a]).join(", "));
    vrai("En force, la fraîcheur pèse le plus lourd",
      aims.every(a=>a === "force" || P.force.recup > P[a].recup));
    vrai("…et le volume, le moins",
      aims.every(a=>a === "force" || P.force.volume < P[a].volume));
    vrai("En entretien, c'est la régularité qui prime",
      aims.every(a=>a === "entretien" || P.entretien.freq >= P[a].freq));
    DB.profile = Object.assign({}, DB.profile, {aim:"force"});
    eq("Les poids suivent l'objectif du profil", F.poidsBesoin(), P.force);
    DB.profile = Object.assign({}, DB.profile, {aim:"masse"});
  })();
  neuf();

  /* Le commentaire promettait que le nombre de séries venait du besoin ; le code prenait
     la dose de l'objectif et rien d'autre. Un biceps en retard et un pectoral à jour,
     tous deux frais, recevaient exactement le même nombre de séries. */
  (()=>{
    DB.history = [];
    DB.materiel = null;
    let vuPlus = false, vuMoins = false, borne = true;
    for(let k=0;k<25;k++){
      for(const t of ["push", "pull", "bas"]){
        const b = F.besoinsMuscles(t);
        const gen = F.genererAdaptative(t);
        const dose = F.eval("DOSES").masse;
        /* le niveau se déduit de la récupération, exactement comme dans le moteur */
        const niv = r => r >= 85 ? "lourd" : (r >= 60 ? "moyen" : "leger");
        const premier = gen.items.filter(it=>it.role === b[0].muscle);
        const dernier = gen.items.filter(it=>it.role === b[b.length-1].muscle);
        gen.items.forEach(it=>{ if(it.sets < 2 || it.sets > 5) borne = false; });
        /* le muscle de tête reçoit souvent DEUX exercices : seul le premier est majoré,
           le second est une finition */
        if(premier.length && b[0].recup >= 60
           && premier.some(it=>it.sets === Math.min(5, dose[niv(b[0].recup)].s + 1))) vuPlus = true;
        if(dernier.length === 1 && b.length > 2
           && dernier[0].sets === Math.max(2, dose[niv(b[b.length-1].recup)].s - 1)) vuMoins = true;
      }
    }
    vrai("Le muscle le plus demandeur reçoit une série de plus", vuPlus);
    vrai("Celui qui ferme la marche en reçoit une de moins", vuMoins);
    vrai("Le nombre de séries reste borné entre 2 et 5", borne);
  })();
  neuf();

  grp("Pourquoi cette séance");
  neuf();
  /* La fiche explique le mécanisme ; l'encadré dit ce que l'app a lu DANS TON
     historique. Sans lui, « elle s'adapte à toi » reste une promesse invérifiable. */
  (()=>{
    const jours = h => new Date(Date.now() - h*864e5).toISOString();
    DB.history = [];
    /* aucun historique : rien n'est affirmé sur des muscles qu'on ne connaît pas */
    const vierge = F.raisonsSeance("pull");
    vrai("Sans historique, on dit qu'on ne connaît pas encore",
      vierge.every(([m, t])=>/[Jj]amais/.test(t)), JSON.stringify(vierge));

    /* du biceps il y a trois jours, rien d'autre : le dos doit passer devant */
    DB.history = [{id:"h1", date:jours(3), name:"x", templateId:"x", start:0, end:0,
      entries:[{exId:id("Curl barre"), sets:[serie(20,10)]}]}];
    const r = F.raisonsSeance("pull");
    vrai("Deux à trois raisons, pas plus", r.length >= 2 && r.length <= 3, r.length);
    vrai("Chaque raison nomme un muscle et dit pourquoi",
      r.every(([m, t])=>m && t && t.length > 10));
    vrai("Le dos, jamais travaillé, est cité en premier",
      /dorsal|Dos/i.test(r[0][0]), JSON.stringify(r[0]));
    /* pas de chiffres bruts : « une série sur douze » ne parle à personne */
    vrai("Aucune raison ne récite des chiffres de séries",
      !r.some(([m, t])=>/[0-9]+ séries?|sur [0-9]+/.test(t)), JSON.stringify(r));
    vrai("Chaque raison se termine par un point",
      r.every(([m, t])=>/\.$/.test(t.trim())), JSON.stringify(r));

    /* la fiche porte bien l'encadré quand on lui donne le type */
    F.openAdaptatifInfo("pull");
    const D2 = F.document;
    vrai("La fiche porte l'encadré", !!D2.querySelector(".ad-pq"));
    eq("…avec une ligne par raison", D2.querySelectorAll(".ad-pq .l").length, r.length);
    F.hideSheet();
    /* sans type (ancien appel), la fiche reste valable, simplement sans encadré */
    F.openAdaptatifInfo();
    vrai("Sans type, la fiche s'ouvre quand même", !!D2.querySelector(".ad-liste"));
    vrai("…et n'invente aucune raison", !D2.querySelector(".ad-pq"));
    F.hideSheet();
    DB.history = [];
  })();
  neuf();

  /* Déjà chaud en arrivant : on doit pouvoir cocher l'échauffement sans rien saisir. */
  (()=>{
    DB.templates = [{id:"tw", name:"Essai", items:[
      {exId:id("Développé couché"), sets:3, reps:"8-12", rest:120}]}];
    DB.active = null;
    F.startWorkout("tw");
    const st = DB.active.entries[0].sets[0];
    vrai("La première série est un échauffement", !!st.warm);
    st.w = 0; st.r = 0; st.done = true;
    vrai("Un échauffement à zéro reste validé", st.done && !st.w && !st.r);
    /* et il ne fausse rien : il ne compte ni dans le tonnage ni dans les séries faites */
    eq("Il n'ajoute pas de tonnage", F.sessionVolume(DB.active), 0);
    DB.active = null; DB.templates = [];
  })();
  neuf();

  grp("La bibliothèque d'exercices");
  neuf();
  /* Trois filtres qui se cumulent : la famille, le matériel, la recherche. Et le détail
     des muscles qu'on peut replier pour tenir deux fois plus d'exercices à l'écran. */
  (()=>{
    const gardeVM = DB.settings.pkMuscles;
    const EQ = F.eval("equipCanon");    /* const : absente de window */
    F.eval("pkFam = 'tous'; pkMat = ''");
    DB.settings.pkMuscles = true;
    F.openPicker(null);
    const D2 = F.document;
    const noms = () => [...D2.querySelectorAll("#pk-list .nm")].map(e=>e.textContent);
    const fam = f => { D2.querySelector(`[data-pkfam="${f}"]`).click(); return noms(); };
    const mat = m => { const sel = D2.getElementById("pk-mat");
      sel.value = m; sel.dispatchEvent(new F.Event("change")); return noms(); };

    eq("Huit familles", D2.querySelectorAll("[data-pkfam]").length, 8);
    eq("On part de « Tous »", D2.querySelector("[data-pkfam].on").dataset.pkfam, "tous");
    eq("« Tous » montre toute la bibliothèque", noms().length, F.allEx().length);

    /* « Bras » n'existe pas comme groupe : il réunit biceps et triceps */
    const bras = fam("bras");
    vrai("« Bras » sort les curls", bras.some(n=>/Curl/.test(n)), bras.join(", "));
    vrai("…et les extensions triceps", bras.some(n=>/Extension|Barre au front|Dips/.test(n)));
    vrai("…sans ramener le squat", !bras.some(n=>/Squat/.test(n)));

    const fess = fam("fessiers");
    vrai("« Fessiers » sort le hip thrust ou le pont",
      fess.some(n=>/Hip thrust|Pont fessier/.test(n)), fess.join(", "));
    vrai("…et le squat", fess.some(n=>/Squat/.test(n)));
    vrai("…sans ramener le développé couché", !fess.some(n=>/Développé couché/.test(n)));

    /* le matériel se cumule avec la famille */
    const avant = fess.length;
    const fessHalteres = mat("Haltères");
    vrai("Le matériel réduit la liste", fessHalteres.length < avant,
      fessHalteres.length + " sur " + avant);
    vrai("…et tout y est bien aux haltères",
      fessHalteres.every(n=>EQ(F.getEx(id(n))) === "Haltères"));
    eq("Le compte suit", D2.getElementById("pk-nb").textContent.split(" ")[0],
      String(fessHalteres.length));
    mat("");
    fam("tous");

    /* le détail des muscles est un réglage, il survit à la fermeture */
    vrai("Les muscles ciblés s'affichent", !!D2.querySelector("#pk-list .mw"));
    const bascule = D2.getElementById("pk-vm");
    bascule.checked = false; bascule.dispatchEvent(new F.Event("change"));
    vrai("On peut les replier", !D2.querySelector("#pk-list .mw"));
    eq("…et le choix est retenu", DB.settings.pkMuscles, false);

    F.hideSheet();
    DB.settings.pkMuscles = gardeVM;
    F.eval("pkFam = 'tous'; pkMat = ''");
  })();
  neuf();

  grp("Le lieu d'entraînement");
  neuf();
  /* Une séance adaptative se tirait pour la SALLE, puis on rafistolait exercice par
     exercice au démarrage : un face pull sans poulie devenait des pompes piquées,
     c'est-à-dire une poussée à la place d'un tirage. Elle se construit maintenant
     directement dans ce qu'on peut faire sur place. */
  /* la question du lieu s'ouvre après un tour de boucle : la feuille précédente doit
     être partie avant. Ce bloc attend donc, contrairement aux autres. */
  await (async ()=>{
    const garde = DB.templates, gardeMaison = DB.maison, gardeActif = DB.active;
    DB.active = null;
    DB.profile.lieu = "mixte";
    DB.maison = ["elastique", "traction"];      /* un élastique et une barre de traction */
    DB.templates = [{id:"tadapt", name:"Pull adaptatif", adaptatif:"pull",
                     items:[{exId:id("Face pull"), sets:3, reps:"12-15", rest:90}]}];
    const t = () => DB.templates[0];
    const faisables = () => t().items.every(it=>F.exoDispo(F.getEx(it.exId), DB.maison));
    const noms = () => t().items.map(it=>F.getEx(it.exId).name);

    /* ouvrir une séance pose d'abord la question du lieu : on choisit où l'on va,
       PUIS on voit la séance faite pour cet endroit. */
    F.openPreview("tadapt");
    await new Promise(r=>setTimeout(r, 350));
    vrai("Ouvrir une séance demande d'abord où tu vas",
      !!F.document.getElementById("lx-maison"));
    F.document.getElementById("lx-maison").click();
    eq("…et la réponse devient le lieu du jour", F.eval("lieuProp"), "maison");
    /* la fiche du lieu est REMPLACÉE par l'aperçu : la fermer d'abord aurait déclenché
       un history.back() qui, au tour suivant, emportait l'aperçu à peine ouvert */
    await new Promise(r=>setTimeout(r, 350));
    eq("L'aperçu prend la place de la question",
      (F.document.querySelector("#sheet h3")||{}).textContent, "Pull adaptatif");
    vrai("…sans que tout se referme", F.eval("sheetOpen"));
    F.hideSheet();

    /* chez moi : tout doit être faisable avec l'élastique et la barre */
    F.eval("lieuProp = 'maison'");
    F.openPreview("tadapt", true);
    eq("La séance est marquée du lieu pour lequel elle est faite", t().lieuAdapt, "maison");
    vrai("Chez moi, chaque exercice est faisable sur place", faisables(), noms().join(", "));
    vrai("…et aucune poussée ne remplace un tirage",
      !noms().some(n=>/Pompes piquées/.test(n)), noms().join(", "));
    /* la bascule salle / maison est bien dans l'aperçu, avant de lancer quoi que ce soit */
    const chips = [...F.document.querySelectorAll("#sheet [data-pvlieu]")];
    eq("Le lieu se choisit dans l'aperçu", chips.length, 2);
    eq("…et celui du jour est marqué",
      chips.filter(c=>c.classList.contains("on")).map(c=>c.dataset.pvlieu).join(), "maison");
    F.hideSheet();

    /* en salle : le filtre maison ne s'applique plus */
    F.eval("lieuProp = 'salle'");
    F.openPreview("tadapt", true);
    eq("En salle, la séance est marquée salle", t().lieuAdapt, "salle");
    F.hideSheet();

    /* démarrage direct, sans passer par l'aperçu : le lieu arrive en argument */
    t().majAdapt = 0;
    F.startWorkout("tadapt", "maison");
    eq("Un démarrage direct construit aussi pour le lieu", t().lieuAdapt, "maison");
    vrai("…et tout y est faisable", faisables(), noms().join(", "));
    vrai("Aucun exercice n'a eu besoin d'être remplacé",
      DB.active.entries.every(e=>t().items.some(it=>it.exId === e.exId)));
    DB.active = gardeActif; DB.templates = garde; DB.maison = gardeMaison;
    delete DB.profile.lieu;
  })();
  neuf();

  grp("Changer de programme");
  neuf();
  /* Deux programmes sur cinq — entretien et recomposition — n'étaient pas étiquetés :
     leurs séances ne se reconstruisaient jamais, alors que la fiche promet à tout le
     monde qu'elles se refont à chaque démarrage. */
  (()=>{
    const PROGS = F.eval("COACH_PROGRAMS");
    const MOULES = F.eval("MOULES");
    const toutes = Object.keys(PROGS).reduce((a,g)=>a.concat(PROGS[g].templates), []);
    vrai("Chaque séance d'un programme est adaptative",
      toutes.every(t=>!!t.type),
      toutes.filter(t=>!t.type).map(t=>t.name).join(", "));
    vrai("…et chaque type existe vraiment",
      toutes.every(t=>!!MOULES[t.type]),
      toutes.filter(t=>!MOULES[t.type]).map(t=>t.type).join(", "));
  })();
  neuf();

  /* Les plans déjà posés avant cette correction se réparent au chargement. */
  (()=>{
    const garde = DB.templates;
    DB.templates = [{id:"vieux", name:"Full body A · Entretien", items:[], adaptatif:null},
                    {id:"amoi",  name:"Ma séance à moi",         items:[], adaptatif:null}];
    delete DB.adaptV2;
    F.applyDefaults();
    eq("Une vieille séance d'entretien devient adaptative",
      DB.templates[0].adaptatif, "full");
    eq("…mais pas une séance que tu as créée",
      DB.templates[1].adaptatif, null);
    DB.templates = garde;
  })();
  neuf();

  /* Changer d'objectif empilait les deux programmes sans rien dire : cinq séances au
     plan, dont trois qui ne correspondaient plus à rien. */
  (()=>{
    const garde = DB.templates, gardeActif = DB.active;
    const noms = () => DB.templates.map(t=>t.name);
    DB.active = null;
    DB.templates = [];
    F.addCoachProgram("masse");
    const apresMasse = noms().length;
    vrai("Le premier programme pose ses séances", apresMasse === 3, apresMasse + " séances");

    const restes = F.seancesDunAutreProgramme("seche");
    eq("Les trois séances de masse sont repérées", restes.length, 3);
    eq("…et aucune n'est rangée dans le nouveau programme",
      F.seancesDunAutreProgramme("masse").length, 0);

    /* on garde : les deux programmes cohabitent, c'est le choix de l'utilisateur */
    F.ajouterProgramme("seche", "");
    F.document.getElementById("rp-keep").click();
    eq("« Les garder » laisse les deux programmes", noms().length, 5);

    /* on remplace : le plan ne contient plus que le nouveau */

    F.addCoachProgram("masse");
    F.ajouterProgramme("seche", "");

    eq("« Remplacer » ne laisse que le nouveau", noms().length, 2);
    vrai("…et ce sont bien les séances de perte de poids",

    /* une séance en cours ne se fait jamais retirer sous les pieds */

    F.addCoachProgram("masse");
    DB.active = {templateId: DB.templates[0].id, entries:[]};
    vrai("La séance en cours est épargnée",
      F.seancesDunAutreProgramme("seche").every(v=>v.tpl.id !== DB.templates[0].id));
    F.ajouterProgramme("seche", "");
    F.document.getElementById("rp-swap").click();
    vrai("…et elle survit au remplacement",
      noms().some(n=>/Prise de masse/.test(n)), noms().join(", "));

    /* sans rien à remplacer, on ajoute sans poser de question */
    DB.active = null;
    DB.templates = [];
    F.ajouterProgramme("masse", "");
    vrai("Un plan vide n'a rien à remplacer", DB.templates.length === 3);
    /* la feuille précédente laisse son contenu derrière elle : on regarde l'état
       interne, qui lui est posé tout de suite */
    vrai("…et aucune question n'est posée", !F.eval("sheetOpen"));

    DB.templates = garde; DB.active = gardeActif;
  })();
  neuf();

  grp("Les types de séance proposés");
  neuf();

  (()=>{

      DB.profile = Object.assign({}, DB.profile, {days:j});
      return F.typesProposables();
    });
    vrai("Jamais « Jambes » et « Bas du corps » ensemble",
      listes.every(l => !(l.includes("jambes") && l.includes("bas"))));
    vrai("« Jambes » ne se propose plus du tout",
      listes.every(l => !l.includes("jambes")));

    /* le moule survit pour le programme de prise de masse, qui s'y réfère encore */
    vrai("Le moule « Jambes » existe toujours", !!F.eval("MOULES").jambes);
    vrai("…et le programme de masse s'en sert",
      F.eval("COACH_PROGRAMS").masse.templates.some(t=>t.type === "jambes"));

  (()=>{

  (()=>{

  grp("La fiche d'une sortie cardio");
  neuf();
  /* Huit activités : sur trois colonnes elles tombaient sur trois rangs, dont un à
     moitié vide. Deux rangées de quatre tiennent dans la hauteur d'un téléphone.

  (()=>{

    /* la feuille n'est pas rendue dans l'iframe : le navigateur rend alors la valeur

    const cols = n => { const v = F.getComputedStyle(n).gridTemplateColumns.trim();

    eq("Deux rangées de quatre", cols(act), 4);
    vrai("Chacune porte son signe",
      [...act.querySelectorAll("[data-cmach]")].every(b=>!!b.querySelector(".ic")));
    const inten = D2.querySelector("#sheet .cd-grille.large");
    eq("L'intensité garde ses trois cases", cols(inten), 3);
