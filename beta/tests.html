  neuf();

  grp("Ordre des exercices");
  neuf();
  /* Le glissé lui-même se vérifie à la main : l'iframe des tests n'a aucune hauteur,
     donc toutes les mesures géométriques y valent zéro. Ce qu'on verrouille ici est
     la chaîne qui compte — l'ordre déposé devient le plan, et le plan devient la
     séance. C'est là qu'une régression passerait inaperçue. */
  (()=>{
    DB.templates = [{id:"tord", name:"Ordre", items:[
      {exId:id("Développé couché"), sets:3, reps:"8-12", rest:120},
      {exId:id("Rowing barre"),     sets:3, reps:"8-12", rest:120},
      {exId:id("Squat"),            sets:4, reps:"8-12", rest:150}]}];
    DB.active = null;
    const plan = () => DB.templates[0].items.map(i=>F.getEx(i.exId).name);
    const depart = plan();
    F.appliquerOrdre(DB.templates[0], [2, 0, 1]);        /* la dernière passe en tête */
    eq("L'ordre déposé devient celui du plan",
      plan().join(" / "), [depart[2], depart[0], depart[1]].join(" / "));
    F.startWorkout("tord");
    eq("La séance démarre dans cet ordre",
      DB.active.entries.map(e=>F.getEx(e.exId).name).join(" / "), plan().join(" / "));
    DB.active = null;
    /* deux déplacements de suite : le second part de la liste déjà réordonnée */
    F.appliquerOrdre(DB.templates[0], [1, 2, 0]);
    eq("Un second déplacement part bien du nouvel ordre",
      plan().join(" / "), [depart[0], depart[1], depart[2]].join(" / "));
    vrai("Aucun exercice n'est perdu ni dupliqué",
      new Set(DB.templates[0].items.map(i=>i.exId)).size === 3);
    F.startWorkout("tord");
    eq("Et la séance suit toujours", DB.active.entries.length, 3);
    DB.active = null;
  })();
  neuf();

  /* La carte qui restait « bloquée en l'air ». Déplacer la carte dans le DOM — ce que
     fait le tri à chaque échange — arrache la capture du pointeur à la poignée, qui
     voyage avec la carte. Les événements suivants partaient alors ailleurs : plus de
     déplacement, et surtout plus de pointerup, donc la carte restait figée sous le
     doigt avec son ombre portée. Les écouteurs vivent désormais sur la fenêtre.
     Aucune géométrie ici : l'iframe des tests n'a pas de hauteur. On vérifie la
     plomberie, qui est exactement ce qui cassait. */
  await (async ()=>{
    DB.templates = [{id:"tglis", name:"Glisse", items:[
      {exId:id("Développé couché"), sets:3, reps:"8-12", rest:120},
      {exId:id("Rowing barre"),     sets:3, reps:"8-12", rest:120}]}];
    F.openPreview("tglis", true);
    await new Promise(r=>setTimeout(r, 120));
    const D2 = F.document;
    const poignee = D2.querySelector(".pv-liste [data-poignee]");
    vrai("La poignée existe", !!poignee);
    if(poignee){
      const carte = poignee.closest(".pv-ex");
      const ev = (type, cible) => cible.dispatchEvent(new F.window.PointerEvent(type,
        {bubbles:true, cancelable:true, pointerId:1, pointerType:"touch", clientY:100}));
      ev("pointerdown", poignee);
      vrai("Appuyer sur la poignée saisit la carte", carte.classList.contains("prend"));
      /* le relâchement arrive AILLEURS que sur la poignée — c'est le cas réel une fois
         que la carte a changé de place dans le DOM */
      ev("pointerup", D2.body);
      vrai("Relâcher hors de la poignée repose quand même la carte",
        !carte.classList.contains("prend"), carte.className);
      eq("…et la carte ne reste pas décalée", carte.style.transform, "");

      /* un geste interrompu par le système ne bloque pas le suivant */
      ev("pointerdown", poignee);
      ev("pointercancel", D2.body);
      vrai("Un geste annulé relâche aussi la carte", !carte.classList.contains("prend"));

      /* et si malgré tout une carte restait saisie, un nouvel appui la libère */
      ev("pointerdown", poignee);
      const autre = [...D2.querySelectorAll(".pv-liste [data-poignee]")][1];
      if(autre) ev("pointerdown", autre);
      vrai("Une seule carte à la fois est saisie",
        D2.querySelectorAll(".pv-ex.prend").length <= 1,
        D2.querySelectorAll(".pv-ex.prend").length);
      ev("pointerup", D2.body);
      vrai("Rien ne reste saisi à la fin", D2.querySelectorAll(".pv-ex.prend").length === 0);

      /* La fiche se referme d'un glissé vers le bas. Descendre un exercice, c'est
         aussi un glissé vers le bas : le même geste descendait la carte ET toute la
         fiche derrière elle. La poignée est donc exclue de ce geste-là. */
      const feuille = D2.getElementById("sheet");
      const toucher = (type, cible, y) => cible.dispatchEvent(
        new F.window.TouchEvent(type, {bubbles:true, cancelable:true,
          touches: type === "touchend" ? [] : [new F.window.Touch(
            {identifier:1, target:cible, clientY:y})]}));
      feuille.scrollTop = 0;
      feuille.style.transform = "";
      toucher("touchstart", poignee, 100);
      toucher("touchmove", poignee, 260);
      vrai("Descendre un exercice ne fait pas descendre la fiche",
        !feuille.style.transform, feuille.style.transform);
      toucher("touchend", poignee, 260);

      /* mais le geste reste possible ailleurs sur la fiche */
      const titre = feuille.querySelector("h3, .pv-tete, div");
      if(titre){
        toucher("touchstart", titre, 100);
        toucher("touchmove", titre, 260);
        vrai("Ailleurs sur la fiche, le glissé vers le bas fonctionne toujours",
          !!feuille.style.transform, feuille.style.transform || "(rien)");
        toucher("touchend", titre, 260);
        feuille.style.transform = "";
      }
    }
    F.hideSheet();
  })();
  neuf();

  /* ---------------------------------------------------------- photo de la séance */
  grp("Photo de la séance");
  neuf();
  const exDe = g => F.eval("LIB").filter(e=>e.muscle===g).slice(0,3).map(e=>({exId:e.id}));
  eq("Une séance d'abdos n'est pas une séance de dos",
    F.photoSeance({name:"Abdos", items:exDe("Abdos")}), "abdos");
  eq("Le nom « Abdos » seul suffit", F.photoSeance({name:"Abdos", items:[]}), "abdos");
  eq("Une séance de dos reste une séance de dos",

  eq("Les pectoraux donnent push", F.photoSeance({name:"Push", items:exDe("Pectoraux")}), "push");
  eq("Les jambes donnent jambes", F.photoSeance({name:"Legs", items:exDe("Jambes")}), "jambes");
  eq("Les exercices priment sur le nom",

  eq("Une photo choisie à la main est respectée",

  /* Les essais ci-dessus donnaient tous un nom qui portait déjà la réponse : ils
     passaient même quand le classement par exercice était cassé. Ceux-ci ne le
     permettent pas — un nom neutre, et un seul exercice d'épaules au milieu du dos,

  const exos = noms => noms.map(n=>({exId:id(n)}));
  eq("Le dos est reconnu sans l'aide du nom",
    F.photoSeance({name:"Séance A", items:exos(["Tractions","Rowing barre","Tirage vertical"])}), "pull");
  eq("Un exercice d'épaules ne renverse pas une séance de dos",
    F.photoSeance({name:"Séance A",
      items:exos(["Tractions","Rowing barre","Tirage vertical","Curl haltères","Face pull"])}), "pull");
  eq("Le biceps compte du côté du tirage",
    F.photoSeance({name:"Séance A", items:exos(["Curl barre","Curl haltères","Curl marteau"])}), "pull");
  eq("La poussée est reconnue sans l'aide du nom",
    F.photoSeance({name:"Séance A",
      items:exos(["Développé couché","Développé militaire","Extension poulie (barre)"])}), "push");
  neuf();

  /* ---------------------------------------------------------- fiches d'exercice */
  grp("Fiches d'exercice");
  neuf();
  const LIBT = F.eval("LIB"), INFO = F.eval("EXO_INFO"), TRAVAIL = F.eval("MUSCLE_WORK");
  vrai("Chaque exercice a sa fiche d'exécution",
    LIBT.every(e => INFO[e.name]));
  vrai("Aucune fiche ne traîne sans exercice",
    Object.keys(INFO).every(n => LIBT.some(e => e.name === n)));
  vrai("Chaque fiche a une astuce et au moins trois étapes",
    Object.values(INFO).every(i => i.tip && i.tip.length > 20 && i.steps && i.steps.length >= 3));
  vrai("Aucune étape vide ou tronquée",
    Object.values(INFO).every(i => i.steps.every(t => typeof t === "string" && t.length > 10)));
  vrai("Chaque exercice déclare les muscles qu'il sollicite",
    LIBT.every(e => (TRAVAIL[e.name] || []).length > 0));
  vrai("Chaque exercice a un muscle principal",
    LIBT.every(e => (TRAVAIL[e.name] || []).some(([, n]) => n === 3)));
  neuf();

  /* ---------------------------------------------------------- parcours d'accueil */
  grp("Séances adaptatives");
  neuf();
  /* La séance ne se contente plus d un moule fixe : elle se construit sur l état réel
     des muscles. Avant, un Pull donnait toujours trois exercices de dos et trois séries
     de curl en 12-15, que les biceps soient frais, en retard ou déjà rincés. */
  (()=>{
    /* ---- les trois faisceaux de l épaule ---- */
    const mw = F.eval("MUSCLE_WORK");
    vrai("Un développé militaire travaille l'avant d'épaule",
      mw["Développé militaire"].some(m=>m[0] === "Deltoïdes (antérieur)" && m[1] === 3));
    vrai("…et pas l'arrière",
      !mw["Développé militaire"].some(m=>m[0] === "Deltoïdes (postérieur)"));
    vrai("Un face pull travaille l'arrière",
      mw["Face pull"].some(m=>m[0] === "Deltoïdes (postérieur)" && m[1] === 3));
    vrai("Une élévation latérale travaille le latéral",
      mw["Élévations latérales"].some(m=>m[0] === "Deltoïdes (latéral)" && m[1] === 3));
    /* le détail ne casse rien : la récupération raisonne toujours par groupe */
    eq("Le détail retombe sur le groupe suivi",
      F.groupeDe("Deltoïdes (postérieur)"), "Deltoïdes");
    vrai("La récupération connaît toujours les épaules",
      !!F.recuperation().muscles["Deltoïdes"]);

    /* ---- le muscle sur lequel un exercice est centré ---- */
    /* Un oiseau touche le grand dorsal, mais il est FAIT pour l arrière d épaule. */
    eq("L'oiseau est un exercice d'arrière d'épaule",
      F.centreSur("Oiseau"), "Deltoïdes (postérieur)");
    eq("Le squat est un exercice de quadriceps", F.centreSur("Squat"), "Quadriceps");
    eq("Le curl marteau est un exercice de biceps", F.centreSur("Curl marteau"), "Biceps");

    /* ---- la séance elle-même ---- */
    DB.materiel = null; DB.history = []; DB.templates = [];
    const pull = F.genererAdaptative("pull");
    eq("Cinq exercices", pull.items.length, 5);
    eq("…tous différents", new Set(pull.items.map(i=>i.nom)).size, 5);
    vrai("Les biceps ont enfin leur exercice",
      pull.items.some(i=>i.role === "Biceps"));
    vrai("Le premier exercice est un gros mouvement",
      F.chargeExo(pull.items[0].nom) >= 30, pull.items[0].nom);
    /* une isolation ne se fait pas en 8 reps avec deux minutes trente de repos */
    pull.items.forEach(it=>{
      if(F.chargeExo(it.nom) < 15)
        vrai("Une isolation garde des séries longues (" + it.nom + ")",
          it.rest <= 90, it.reps + " / " + it.rest + "s");
    });

    /* ---- elle s adapte vraiment ---- */
    const idOf = n => F.libId(n);
    const series = (w, r, n) => Array.from({length:n}, ()=>({w, r, done:true, rir:1}));
    DB.history = [{id:"ha", date:new Date(Date.now() - 30*36e5).toISOString(), start:0, end:0,
      name:"Pull", entries:[
        {exId:idOf("Rowing barre"), sets:series(70, 10, 5)},
        {exId:idOf("Tirage vertical"), sets:series(60, 10, 5)}]}];
    const besoins = F.besoinsMuscles("pull");
    const dos = besoins.find(b=>b.muscle === "Grand dorsal");
    const bic = besoins.find(b=>b.muscle === "Biceps");
    vrai("Dix séries de dos hier : le dos n'est plus prioritaire",
      dos.besoin < bic.besoin, "dos " + Math.round(dos.besoin) + " vs biceps " + Math.round(bic.besoin));
    vrai("…sa récupération a baissé", dos.recup < 75, dos.recup + " %");
    vrai("…et son volume de la semaine est compté", dos.vol >= 9, String(dos.vol));
    /* ---- la semaine, pas seulement la séance ---- */
    eq("Le dos a une cible hebdomadaire", dos.cible, 16);
    vrai("L arrière d épaule en a une plus petite",
      besoins.find(b=>b.muscle === "Deltoïdes (postérieur)").cible < dos.cible);
    /* ---- un seul mouvement par schéma ---- */
    const sch = n2 => F.schemaDe(n2);
    eq("Un soulevé de terre est une charnière de hanche", sch("Soulevé de terre"), "charniere");
    eq("Un good morning aussi", sch("Good morning"), "charniere");
    eq("Un squat est un squat", sch("Squat"), "squat");
    eq("Un curl est une isolation", sch("Curl barre"), "isolation");
    ["pull","push","jambes"].forEach(t2=>{
      const se = F.genererAdaptative(t2);
      const gros = se.items.map(i=>sch(i.nom)).filter(x=>x !== "isolation");
      eq("Aucun schéma en double dans un " + t2, gros.length, new Set(gros).size,
        gros.join(","));
    });
    /* une séance de tirage a un tirage vertical ET un horizontal */
    const pl = F.genererAdaptative("pull").items.map(i=>sch(i.nom));
    vrai("Un Pull tire dans les deux directions",
      pl.includes("tirageV") && pl.includes("tirageH"), pl.join(","));
    const ps = F.genererAdaptative("push").items.map(i=>sch(i.nom));
    vrai("Un Push pousse dans les deux directions",
      ps.includes("pousseeV") && ps.includes("pousseeH"), ps.join(","));
    const apres = F.genererAdaptative("pull");
    const nDos = apres.items.filter(i=>i.role === "Grand dorsal").length;
    vrai("Le dos reçoit moins d'exercices qu'à froid",
      nDos < pull.items.filter(i=>i.role === "Grand dorsal").length, "reste " + nDos);
    DB.history = [];

    /* ---- seules les séances du départ sont adaptatives ---- */
    DB.templates = [];
    F.addCoachProgram("masse");
    eq("Les trois séances du coach sont adaptatives",
      DB.templates.filter(t=>t.adaptatif).length, 3);
    eq("…chacune avec son type",
      DB.templates.map(t=>t.adaptatif).join(","), "push,pull,jambes");
    DB.templates.push({id:"perso", name:"Ma séance", items:[
      {exId:idOf("Curl barre"), sets:3, reps:"8-12", rest:90}]});
    vrai("Une séance créée à la main ne l'est pas",
      !DB.templates.find(t=>t.id === "perso").adaptatif);

    /* ---- le recalcul ---- */
    const tpl = DB.templates.find(t=>t.adaptatif === "pull");
    const avantNoms = tpl.items.map(i=>i.exId).join(",");
    tpl.items[0].rest = 222;                    /* un repos réglé à la main */
    const gardeId = tpl.items[0].exId;
    F.regenererAdaptative(tpl);
    eq("La séance garde cinq exercices", tpl.items.length, 5);
    vrai("…et son marqueur", tpl.adaptatif === "pull");
    const revenu = tpl.items.find(i=>i.exId === gardeId);
    if(revenu) eq("Un repos réglé à la main est conservé", revenu.rest, 222);
    /* ---- l aperçu montre la séance qu on va vraiment faire ----
       Elle se recalculait AU démarrage : l aperçu montrait donc la précédente, et
       l ordre qu on venait d y régler à la main était effacé une seconde plus tard. */
    const t2 = DB.templates.find(x=>x.adaptatif === "pull");
    F.openPreview(t2.id);
    const affichee = t2.items.map(i=>i.exId).join(",");
    /* on change l ordre comme le ferait un doigt sur la poignée */
    t2.items.reverse();
    const voulu = t2.items.map(i=>i.exId).join(",");
    vrai("L aperçu a bien recalculé la séance", !!affichee.length);
    F.startWorkout(t2.id);
    eq("L ordre réglé à la main est respecté",
      DB.active.entries.map(e=>e.exId).join(","), voulu);
    DB.active = null;
    DB.templates = []; DB.history = []; DB.materiel = null;
    F.render();
  })();
  neuf();

  grp("Le parcours de création de profil");
  neuf();
  /* Chaque réponse est une carte : signe, intitulé, raison, pastille. La raison vivait
     sous le bouton sélectionné — on ne pouvait comparer deux réponses qu'en les
     essayant l'une après l'autre. */
  (()=>{
    const etapes = {objectif:3, corps:4, lieu:7, frequence:8};
    F.openOnboarding(false, null, etapes.objectif);
    const D2 = F.document;
    const cts = () => [...D2.querySelectorAll(".onb-cartes .ct")];
    eq("Cinq objectifs, cinq cartes", cts().length, 5);
    vrai("Chacune porte son signe", cts().every(c=>!!c.querySelector(".ic")));
    vrai("…son intitulé et sa raison",
      cts().every(c=>c.querySelector(".t") && c.querySelector(".s")));
    vrai("…et sa pastille", cts().every(c=>!!c.querySelector(".rd")));
    eq("Une seule est choisie", cts().filter(c=>c.classList.contains("on")).length, 1);
    /* le mot qui porte la question est en orange */
    vrai("Le titre a son mot en orange", !!D2.querySelector("#onb-body h2 .hl"));
    eq("…et il est bien orange",
      F.getComputedStyle(D2.querySelector("#onb-body h2 .hl")).color, "rgb(245, 130, 32)");

    F.openOnboarding(false, null, etapes.lieu);
    eq("Trois lieux, trois cartes", cts().length, 3);
    F.openOnboarding(false, null, etapes.frequence);
    eq("Cinq rythmes, cinq cartes", cts().length, 5);
    vrai("Le nombre de séances se lit en chiffre",
      cts().map(c=>c.querySelector(".ic").textContent.trim()).join() === "2,3,4,5,6");

    /* la barre du haut : la même qu'avant, en orange et plus épaisse */
    const barre = D2.querySelector(".onb-prog i");
    eq("La barre d'avancement est orange",
      F.getComputedStyle(barre).backgroundColor, "rgb(245, 130, 32)");
    vrai("…et plus épaisse qu'avant",
      parseFloat(F.getComputedStyle(D2.querySelector(".onb-prog")).height) >= 9);

    /* taille et poids : deux roulettes en carte, et l'encadré qui explique */
    F.openOnboarding(false, null, etapes.corps);
    eq("Deux roulettes", D2.querySelectorAll(".onb-rou .rou").length, 2);
    vrai("Chacune porte son intitulé et son signe",
      [...D2.querySelectorAll(".onb-rou .rou-t")].every(t=>!!t.querySelector("svg")));
    vrai("L'encadré explique pourquoi on demande ça", !!D2.querySelector(".onb-note"));

    /* affiner : un bloc par réglage, les réponses côte à côte. On ne peut pas y sauter
       par son rang — cette page n'est pas dans la liste des étapes, elle s'ouvre depuis
       la dernière — donc on passe par le bouton, comme un utilisateur. */
    const aff = () => [...D2.querySelectorAll(".af-c")];
    F.openOnboarding(false, null, 10);
    const lien = [...D2.querySelectorAll("#onb-body button, #onb-foot button")]
      .find(b2=>/Affiner/.test(b2.textContent));
    vrai("La dernière page mène à « Affiner mon profil »", !!lien);
    if(lien) lien.click();
    vrai("Quatre réglages, quatre blocs", aff().length === 4, aff().length + " blocs");
    vrai("Chaque bloc porte son signe et son intitulé",
      aff().every(c=>c.querySelector(".af-h .ic svg, .af-h .ic .icm") && c.querySelector(".af-h .t")));
    const trios = [...D2.querySelectorAll(".af-opts")];
    eq("Trois réglages à trois réponses", trios.length, 3);
    vrai("Chaque réponse porte sa pastille", trios.every(o=>
      [...o.querySelectorAll(".af-o")].every(b2=>!!b2.querySelector(".rd"))));
    vrai("Une seule réponse choisie par réglage",
      trios.every(o=>o.querySelectorAll(".af-o.on").length === 1));
    eq("Cinq zones sensibles", D2.querySelectorAll(".af-z").length, 5);

    /* la dernière page : deux cartes, pas deux boutons empilés */
    F.openOnboarding(false, null, 10);
    eq("Deux gestes proposés à la fin", D2.querySelectorAll("#onb-body .fin-c").length, 2);
    vrai("Chacun porte son signe et sa raison",
      [...D2.querySelectorAll(".fin-c")].every(c=>c.querySelector(".ic svg")
        && c.querySelector(".t") && c.querySelector(".s")));
    vrai("Le geste principal est en orange", !!D2.querySelector(".fin-c.go"));
    eq("Les quatre réglages sont annoncés", D2.querySelectorAll(".fin-c .tags i").length, 4);
    vrai("Le titre a son mot en orange", !!D2.querySelector("#onb-body h2 .hl"));

    /* le carrousel n'a pas bougé : c'est une autre page */
    F.openOnboarding(false, null, 0);
    vrai("Le carrousel garde sa mise en page",
      !!D2.querySelector(".onb-body.intro") && !D2.querySelector(".onb-cartes"));
    vrai("…et son titre à lui", !!D2.querySelector(".onb-titre .hl"));
    F.fermerOnb();
  })();
  neuf();

  grp("Ce qu'on a chez soi sert vraiment");
  neuf();
  /* « J'ai des barres de dips, on ne m'a jamais proposé de dips. » Le dip était rangé
     avec les pompes et le développé couché : dès qu'un des deux passait, il était
     bloqué par la règle « un seul mouvement par schéma ». */
  (()=>{
    DB.history = [];
    DB.profile = Object.assign({}, DB.profile, {injuries:[], lieu:"maison"});
    const tire = (mat, types) => { DB.materiel = mat;
      const vus = {};
      for(let k=0;k<25;k++) types.forEach(t=>F.genererAdaptative(t).items
        .forEach(i=>{ vus[i.nom] = 1; }));
      return vus; };
    vrai("Avec des barres de dips, les dips sont proposés",
      !!tire(["dips"], ["push","haut"])["Dips"]);
    vrai("Avec une barre de traction, les tractions le sont",
      !!tire(["traction"], ["pull","haut"])["Tractions"]);
    vrai("Sans rien, ni l'un ni l'autre", (()=>{
      const v = tire([], ["push","pull","haut"]);

  /* Le son ne se joue pas depuis la page quand l'écran est éteint : c'est Android qui
     sonne, et depuis Android 8 le son appartient au CANAL de notification, pas à la
     notification. Un canal créé sans son reste muet pour toujours — il ne se modifie
     plus après coup. C'est exactement ce qui se passait : le canal par défaut du
     greffon n'a de son que si la configuration en déclare un, et elle n'en déclarait
     aucun. On vérifie donc que l'app pose bien SON canal, avec le fichier. */
  await (async ()=>{
    const gardeSon = DB.settings.son;
    const canaux = [], envois = [];
    F.window.Capacitor = {isNativePlatform:()=>true, getPlatform:()=>"android",
      Plugins:{LocalNotifications:{
        checkPermissions: async ()=>({display:"granted"}),
        requestPermissions: async ()=>({display:"granted"}),
        checkExactNotificationSetting: async ()=>({exact_alarm:"granted"}),
        changeExactNotificationSetting: async ()=>({exact_alarm:"granted"}),
        createChannel: async c => { canaux.push(c); },
        schedule: async o => { envois.push(o.notifications[0]); return {}; },
        cancel: async ()=>({})
      }}};
    F.eval("canalPose = false; notifsOk = null");
    DB.settings.son = true;
    F.eval("rest.int = 1; rest.paused = false; rest.end = Date.now() + 90000");
    await F.poserAlarmeRepos();

    vrai("Un canal est créé", canaux.length === 1, canaux.length);
    const c = canaux[0] || {};
    vrai("…avec un fichier de son", !!c.sound, c.sound);
    vrai("…et une importance qui laisse sortir le son", (c.importance || 0) >= 4, c.importance);
    /* le numéro dans l'identifiant permettra de changer le son un jour : un canal
       déjà installé garde ses réglages, seul un identifiant neuf les renouvelle */
    vrai("…sous un identifiant à nous, numéroté", /[0-9]$/.test(c.id || ""), c.id);

    const e = envois[0] || {};
    vrai("La notification part sur ce canal", e.channelId === c.id, e.channelId);
    vrai("…et porte aussi le son, pour les vieux Android", e.sound === c.sound, e.sound);

    /* on ne recrée pas le canal à chaque série */
    F.eval("rest.end = Date.now() + 90000");
    await F.poserAlarmeRepos();
    eq("Le canal n'est posé qu'une fois", canaux.length, 1);
    vrai("…mais l'alarme est bien reposée", envois.length === 2, envois.length);

    /* son coupé : ni canal ni alarme */
    const avant = envois.length;
    DB.settings.son = false;
    F.eval("rest.end = Date.now() + 90000");
    await F.poserAlarmeRepos();
    eq("Son coupé, rien n'est programmé", envois.length, avant);

    /* De retour dans l'app, il ne reste rien : ni alarme en attente, ni notification
       oubliée dans le volet. Les deux se retirent séparément — cancel() ne connaît
       que les alarmes à venir, une notification déjà tombée lui échappe. */
    const annules = [], retires = [];
    F.window.Capacitor.Plugins.LocalNotifications.cancel = async o => {
      annules.push(o.notifications[0].id); };
    F.window.Capacitor.Plugins.LocalNotifications.removeDeliveredNotificationsById =
      async o => { retires.push(o.ids[0]); };
    await F.retirerAlarmeRepos();
    eq("L'alarme en attente est annulée", annules.length, 1);
    eq("…et la notification déjà tombée est retirée du volet", retires.length, 1);
    vrai("…toutes deux sur la même", annules[0] === retires[0], annules[0]);

    /* un greffon plus ancien n'a pas la seconde fonction : on ne doit pas planter */
    delete F.window.Capacitor.Plugins.LocalNotifications.removeDeliveredNotificationsById;
    let boum = null;
    try{ await F.retirerAlarmeRepos(); }catch(e){ boum = String(e); }
    vrai("Un greffon sans cette fonction ne fait pas tomber l'app", boum === null, boum);

    delete F.window.Capacitor;
    F.eval("canalPose = false; notifsOk = null; rest.int = null; rest.end = 0");
    DB.settings.son = gardeSon;
  })();

  grp("L'alarme est posée à l'avance");
  neuf();
  /* Elle sonnait une fois sur cinq. La cause : elle n'était programmée qu'au moment
     où l'écran se verrouille, or Android gèle la WebView en quelques millisecondes et
     programmer l'alarme demande deux allers-retours vers le système. Le gel gagnait la
     course une fois sur cinq. On la pose donc dès le départ du repos, pendant que
     l'app est encore à l'écran, et on la retire juste avant la fin si on est resté
     devant — sinon la notification et le bip sonneraient tous les deux. */
  await (async ()=>{
    const gardeSon = DB.settings.son;
    const envois = [], annules = [];
    F.window.Capacitor = {isNativePlatform:()=>true, getPlatform:()=>"android",
      Plugins:{LocalNotifications:{
        checkPermissions: async ()=>({display:"granted"}),
        requestPermissions: async ()=>({display:"granted"}),
        checkExactNotificationSetting: async ()=>({exact_alarm:"granted"}),
        changeExactNotificationSetting: async ()=>({exact_alarm:"granted"}),
        createChannel: async ()=>{},
        schedule: async o => { envois.push(o.notifications[0]); return {}; },
        cancel: async ()=>{ annules.push(1); },
        removeDeliveredNotificationsById: async ()=>{}
      }}};
    /* la fenêtre des tests passe en arrière-plan dès qu'on regarde ailleurs : on force
       l'état visible, c'est justement ce que le code teste */
    const vraiEtat = Object.getOwnPropertyDescriptor(F.Document.prototype, "visibilityState");
    Object.defineProperty(F.Document.prototype, "visibilityState",
      {get:()=>"visible", configurable:true});
    F.eval("canalPose = false; notifsOk = null; alarmePosee = false");
    DB.settings.son = true;

    F.startRest(120);
    await new Promise(r=>setTimeout(r, 60));
    eq("Lancer le repos programme l'alarme, sans quitter l'app", envois.length, 1);
    vrai("…à l'heure de fin du repos",
      Math.abs(new Date(envois[0].schedule.at).getTime() - F.eval("rest.end")) < 50);
    vrai("…et elle survit à la veille", envois[0].schedule.allowWhileIdle === true);

    /* +15 s déplace l'heure de fin : l'alarme doit suivre */
    F.document.getElementById("rest-plus").click();
    await new Promise(r=>setTimeout(r, 60));
    eq("Ajouter 15 s repose l'alarme", envois.length, 2);
    vrai("…sur la nouvelle heure",
      new Date(envois[1].schedule.at).getTime() > new Date(envois[0].schedule.at).getTime());

    /* la fin approche et on est resté devant : la page bipera, pas le système */
    const avant = annules.length;
    F.eval("rest.end = Date.now() + 900");
    F.tickRest();
    await new Promise(r=>setTimeout(r, 60));
    vrai("Resté devant, l'alarme est retirée avant de sonner", annules.length > avant);
    vrai("…et on ne la retire qu'une fois", (F.eval("alarmePosee")) === false);

    F.eval("if(rest.int){ clearInterval(rest.int); rest.int = null; } rest.end = 0");
    if(vraiEtat) Object.defineProperty(F.Document.prototype, "visibilityState", vraiEtat);
    delete F.window.Capacitor;
    F.eval("canalPose = false; notifsOk = null; alarmePosee = false");
    DB.settings.son = gardeSon;
    F.document.getElementById("restbar").classList.remove("show");
  })();
  neuf();

  grp("La durée annoncée d'une séance");

  /* Elle reposait sur « le repos plus quarante secondes par série », partout dans
     l'app et sous trois formes légèrement différentes. Quarante secondes forfaitaires
     ne veulent rien dire : cinq répétitions lourdes en prennent quinze, vingt en

     n'est ni série ni repos — charger la barre, régler le siège, se mettre en place —

  (()=>{
    const it = (nom, sets, reps, rest) => ({exId:id(nom), sets, reps, rest});

    /* le nombre de répétitions compte, à repos et séries identiques */
    const court = F.dureeItem(id("Développé couché"), 3, "5", 120);

    /* un gainage : la « répétition » EST une durée, on ne la multiplie pas par le
       tempo. Soixante secondes de planche, c'est une minute — pas trois. On le
       vérifie en le comparant aux mêmes chiffres lus comme des répétitions. */
    const iso = F.dureeItem(id("Gainage"), 3, "60", 60);

    vrai("Une tenue de 60 s compte une minute, pas trois",
      iso < commeDesReps / 2,
      Math.round(iso) + " s contre " + Math.round(commeDesReps) + " s");

    /* l'installation dépend du matériel : charger une barre prend plus de temps
       que de saisir deux haltères */
    vrai("Charger une barre coûte plus qu'attraper des haltères",
      F.dureeItem(id("Squat"), 1, "10", 90) > F.dureeItem(id("Goblet squat"), 1, "10", 90));

    /* pas de repos après la dernière série : c'est l'exercice suivant qui enchaîne */

    vrai("Le repos qui suit la dernière série n'est pas compté", une < 200,

    /* les séries se ralentissent en approchant de l'échec */

    const s4 = F.dureeItem(id("Curl barre"), 4, "10", 0);

      (s4 - install) > 4 * (s1 - install),
      Math.round(s4 - install) + " s pour quatre séries");

    /* et une seule formule pour toute l'app */
    const seance = [it("Squat", 4, "8-12", 120), it("Gainage", 3, "45", 60)];
    eq("La carte du programme et le calcul commun disent la même chose",
      F.dureeSeance({items:seance}), F.dureeMinutes(seance));
    vrai("Le résultat est arrondi à cinq minutes", F.dureeMinutes(seance) % 5 === 0,
      F.dureeMinutes(seance));
    /* plus de plancher artificiel à quinze minutes : trois gainages ne durent pas
       un quart d'heure */
    vrai("Une séance très courte n'est plus gonflée à 15 min",
      F.dureeMinutes([it("Gainage", 3, "60", 60)]) < 15,

  })();

  /* Ce bloc existait parce que rien n'expliquait le parcours. Les étiquettes de

  grp("La sensibilité, en trois mots");

  /* Le conseil de posture et les variantes étaient écrits sous CHAQUE exercice de

     attend la séance, au moment où l'on va faire le mouvement. */
  await (async ()=>{
    const gardeP = DB.profile, gardeT = DB.templates;
    DB.profile = Object.assign({}, gardeP, {injuries:["epaule"], douleurs:{epaule:"mal"}});
    DB.templates = [{id:"tsens", name:"Push", items:[

    if(n){

    }

    /* les trois niveaux se disent chacun par leur mot */
    const mots = F.eval("INTENSITE");
    eq("Une gêne est une intensité faible", mots.gene, "faible");
    eq("« ça fait mal » est moyenne", mots.mal, "moyenne");
    eq("« je ne peux pas » est élevée", mots.stop, "élevée");
    /* et le conseil complet reste accessible là où il sert */

  grp("Les glucides et les lipides");
  neuf();
  /* Ils viennent de la table CIQUAL 2020 de l'ANSES, appariée aliment par aliment.
     Ce test ne vérifie pas les valeurs — elles ne sont pas de moi — mais que rien
     n'a été inventé : chaque entrée doit désigner un aliment qui existe, et les
     ordres de grandeur doivent rester physiquement possibles. */
  (()=>{
    const T = F.eval("MACROS_ALIM");
    const noms = new Set();
    F.eval("FOOD_100G").forEach(([, items]) => items.forEach(([n]) => noms.add(n)));
    F.eval("Object.values(HB_OPTS)").forEach(l => l.forEach(([n]) => noms.add(n)));
    const orphelines = Object.keys(T).filter(n => !noms.has(n));
    vrai("Chaque aliment renseigné existe dans l'app", orphelines.length === 0,
      orphelines.join(", "));
    vrai("La table couvre l'essentiel", Object.keys(T).length > 90,
      Object.keys(T).length + " aliments");
    /* glucides, lipides, puis sucres et saturés quand la table les donne */
    vrai("Glucides et lipides pour chacun, jamais négatifs",
      Object.values(T).every(v => v.length >= 2 && v[0] >= 0 && v[1] >= 0));
    vrai("Au plus quatre valeurs",
      Object.values(T).every(v => v.length <= 4));
    /* Le détail ne peut pas dépasser le tout : il y a au plus autant de sucres que de
       glucides, et au plus autant de saturés que de lipides. Un chiffre gonflé se
       trahirait ici. On tolère l'arrondi. */
    const debordent = Object.keys(T).filter(n => {
      const v = T[n];
      return (v[2] != null && v[2] > v[0] + 0.6) || (v[3] != null && v[3] > v[1] + 0.6);
    });
    vrai("Les sucres ne dépassent pas les glucides, les saturés pas les lipides",
      debordent.length === 0, debordent.join(", "));
    /* Une part sous le demi-gramme s'affiche forcément à zéro : quand le tout y est
       déjà, le détail ne peut pas rester inconnu. C'est de l'arithmétique, et ça
       évite qu'une viande sans glucides fasse disparaître la ligne des sucres de
       toute la journée. */
    const trousEvitables = Object.keys(T).filter(n => {
      const v = T[n];
      return (v[0] < 0.5 && (v.length < 3 || v[2] == null))
          || (v[1] < 0.5 && (v.length < 4 || v[3] == null));
    });
    vrai("Aucun trou là où l'arithmétique donne la réponse",
      trousEvitables.length === 0, trousEvitables.join(", "));
    /* un trou reste un trou : jamais transformé en zéro */
    vrai("Ce qui manque est écrit null, pas 0",
      Object.values(T).some(v => v.length === 3 || v[3] === null || v[2] === null)
      || Object.values(T).every(v => v.length === 4));

    /* Le contrôle qui compte : les calories reconstituées à partir des macros ne
       peuvent pas dépasser celles que l'app annonce. Un aliment dont les glucides
       auraient été gonflés se trahirait ici. 4 kcal par gramme de protéines et de
       glucides, 9 par gramme de lipides — les coefficients d'Atwater. */
    const kcalDe = {}, protDe = {};
    F.eval("FOOD_100G").forEach(([, items]) => items.forEach(([n, p2, k]) => {
      protDe[n] = p2; kcalDe[n] = k; }));
    F.eval("Object.values(HB_OPTS)").forEach(l => l.forEach(([n, p2, k]) => {
      if(!(n in kcalDe)){ protDe[n] = p2; kcalDe[n] = k; } }));
    const trop = Object.keys(T).filter(n => {
      if(!kcalDe[n]) return false;
      const reconstitue = 4 * protDe[n] + 4 * T[n][0] + 9 * T[n][1];
      return reconstitue > kcalDe[n] * 1.45 + 25;    /* large : les arrondis jouent */
    });
    vrai("Aucun aliment ne dépasse ses propres calories", trop.length === 0,
      trop.join(", "));

    /* et un aliment absent de la table ne fait pas tomber le calcul */
    vrai("Un aliment inconnu ne casse rien", F.macrosAliment("Chose inconnue") === null);
    const oeuf = F.macrosAliment("Œuf");
    vrai("Un aliment connu répond", !!oeuf && oeuf.length >= 2, JSON.stringify(oeuf));
    /* la portion multiplie : deux œufs valent deux fois un œuf */
    const deux = F.macrosAliment("Œuf ×2 (~13 g prot. · 156 kcal)");
    vrai("Deux portions comptent double",
      !!deux && Math.abs(deux[1] - oeuf[1] * 2) < 0.5,
      JSON.stringify(oeuf) + " → " + JSON.stringify(deux));

    /* Une seule cible dans la fiche du jour : celle des protéines, qui vient du
       profil. Celle des glucides et des lipides était de mon invention, et la
       répartition entre les deux n'a pas d'effet démontré à calories et protéines
       égales — la barre promettait un objectif qui n'en était pas un. */
    const gardeSel = DB.habitSel;
    DB.habitSel = {};
    const k2 = F.jourAlim();
    DB.habitSel[k2] = {matin:["Œuf", "Riz (200 g cuit)"]};
    F.openMacros(k2);
    const l = [...F.document.querySelectorAll(".mc-l")];
    eq("Trois nutriments détaillés", l.length, 3);
    eq("Une seule barre de progression : les protéines",
      F.document.querySelectorAll(".mc-l .b").length, 1);
    vrai("Les glucides disent leurs sucres",
      /dont .* sucres/.test(l[1].textContent), l[1].textContent.replace(/\s+/g, " "));
    vrai("Les lipides disent leurs saturés",
      /dont .* saturés/.test(l[2].textContent), l[2].textContent.replace(/\s+/g, " "));
    F.hideSheet();

    /* Si un aliment CONNU n'a pas le détail des sucres — le veau, seul aliment que
       CIQUAL ne renseigne pas là-dessus — on ne publie pas un total qui l'oublierait
       en silence. Un aliment absent de la table, lui, est déjà signalé par le
       compteur « renseignés sur total ». */
    DB.habitSel[k2] = {matin:["Œuf", "Veau"]};
    const m2 = F.macrosDuJour(k2);
    vrai("Un aliment sans détail met les sucres en attente", m2.sucres === null,
      JSON.stringify(m2));
    vrai("…mais les saturés, eux, restent comptés", m2.satures != null,
      JSON.stringify(m2));
    DB.habitSel = gardeSel;
  })();
  neuf();

  grp("Les étiquettes de première visite");
  neuf();
  /* Elles désignent un élément réel de l'écran. Si cet élément est renommé un jour,
     l'étape disparaît en silence — l'utilisateur ne verra rien, et personne ne s'en
     apercevra. On vérifie donc que chaque cible existe vraiment sur son onglet. */
  await (async ()=>{
    const G = F.eval("GUIDES");
    /* render() lance la visite tout seul une demi-seconde plus tard : pendant qu'on
       inspecte les cibles, on la marque comme déjà vue pour qu'elle ne s'ouvre pas
       dans notre dos. On rendra la main juste après. */
    const gardes = {};
    Object.keys(G).forEach(o=>{ gardes[o] = DB.seen["guide-" + o]; DB.seen["guide-" + o] = true; });
    /* « seanceActive » n'est pas un onglet mais un état : il faut une séance en cours
       pour que ses cibles existent. On la lance donc au lieu de changer d'onglet. */
    const gardeAct = DB.active, gardeTpl = DB.templates, gardeHist = DB.history;
    const poser = onglet => {
      if(onglet === "seanceActive"){
        DB.templates = [{id:"tguide", name:"G", items:[
          {exId:id("Développé couché"), sets:3, reps:"8-12", rest:120}]}];
        /* Le bandeau de l'objectif n'existe qu'une fois qu'il y a une séance passée
           à battre — c'est voulu. Il faut donc un historique pour que cette cible
           soit là, comme elle le sera dès la deuxième séance de l'utilisateur. */
        DB.history = [{id:"hg", date:new Date(Date.now() - 3*864e5).toISOString(),
          name:"G", templateId:"tguide", start:0, end:0,
          entries:[{exId:id("Développé couché"),
            sets:[serie(80, 10, 2), serie(80, 10, 2)]}]}];
        /* la séance s'affiche dans l'onglet Séance : sans ça, startWorkout redessine
           l'onglet où l'on se trouvait, et aucune de ses cibles n'existe */
        F.eval("curTab = 'seance'");
        F.startWorkout("tguide");
        F.eval("render()");
      } else {
        DB.active = null;
        F.eval("curTab = " + JSON.stringify(onglet) + "; render()");
      }
    };
    const manquantes = [];
    for(const onglet of Object.keys(G)){
      poser(onglet);
      await new Promise(r=>setTimeout(r, 150));
      G[onglet].forEach(([sel, titre])=>{
        if(!F.document.querySelector(sel)) manquantes.push(onglet + " → " + sel + " (" + titre + ")");
      });
    }
    DB.active = gardeAct; DB.templates = gardeTpl;
    vrai("Chaque étiquette désigne un élément qui existe", manquantes.length === 0,
      manquantes.join(" ; "));
    /* Un projecteur braqué sur un conteneur n'éclaire plus rien : « #wt-sec »
       englobait le poids ET les protéines, et l'étiquette montrait la moitié de la
       page. On ne peut pas mesurer de hauteur ici — l'iframe n'en a pas — mais on
       peut vérifier qu'aucune cible n'en contient une autre du même onglet. */
    const englobantes = [];
    for(const onglet of Object.keys(G)){
      poser(onglet);
      await new Promise(r=>setTimeout(r, 150));
      const els = G[onglet].map(([sel])=>[sel, F.document.querySelector(sel)]);
      els.forEach(([selA, a2])=>els.forEach(([selB, b2])=>{
        if(a2 && b2 && a2 !== b2 && a2.contains(b2)) englobantes.push(selA + " contient " + selB);
      }));
    }
    vrai("Aucune étiquette n'englobe une autre étape", englobantes.length === 0,
      englobantes.join(" ; "));
    vrai("Les trois onglets et la séance en cours sont couverts",
      Object.keys(G).length === 4, Object.keys(G).join(", "));
    vrai("La séance en cours a sa propre visite", !!G.seanceActive);
    /* on ne noie pas quelqu'un qui arrive : trois étapes au plus par onglet */
    vrai("Pas plus de trois étapes par onglet",
      Object.values(G).every(e=>e.length <= 3),
      Object.values(G).map(e=>e.length).join("/"));
    vrai("Chacune tient en une phrase courte",
      Object.values(G).every(e=>e.every(([, , t])=>t.length <= 105)),
      Math.max(...Object.values(G).flat().map(([, , t])=>t.length)) + " caractères");

    DB.active = gardeAct; DB.templates = gardeTpl; DB.history = gardeHist;
    F.eval("curTab = 'seance'; render()");
    await new Promise(r=>setTimeout(r, 700));
    /* table rase avant de tester le comportement lui-même */
    F.document.querySelectorAll(".gd-voile, .gd-bulle").forEach(e=>e.remove());
    F.eval("guideEnCours = false");
    Object.keys(G).forEach(o=>{
      if(gardes[o] === undefined) delete DB.seen["guide-" + o]; else DB.seen["guide-" + o] = gardes[o];
    });

    /* elle ne revient jamais */
    const garde = DB.seen["guide-seance"];
    DB.seen["guide-seance"] = true;
    F.lancerGuide("seance");
    vrai("Une visite déjà faite ne recommence pas", !F.document.querySelector(".gd-voile"));
    delete DB.seen["guide-seance"];

    /* pas avant que le profil soit rempli : le parcours de création a l'écran pour lui */
    const gardeProfil = DB.profile;
    DB.profile = {};
    F.lancerGuide("seance");
    vrai("Sans profil, aucune étiquette", !F.document.querySelector(".gd-voile"));
    vrai("…et rien n'est marqué comme vu", !DB.seen["guide-seance"]);
    DB.profile = gardeProfil;

    /* elle s'affiche, et se referme au bout du compte */
    F.lancerGuide("seance");
    await new Promise(r=>setTimeout(r, 120));
    vrai("Le voile s'ouvre sur la première étape", !!F.document.querySelector(".gd-voile"));
    vrai("…avec un bouton pour avancer", !!F.document.getElementById("gd-suite"));
    for(let k = 0; k < 6; k++){
      const b2 = F.document.getElementById("gd-suite");
      if(!b2) break;
      b2.click();
      await new Promise(r=>setTimeout(r, 90));
    }
    vrai("Au bout des étapes, tout se referme", !F.document.querySelector(".gd-voile"));
    vrai("…et elle est retenue comme vue", !!DB.seen["guide-seance"]);
    if(garde === undefined) delete DB.seen["guide-seance"]; else DB.seen["guide-seance"] = garde;
  })();
  neuf();

  grp("Les dessins d'exercice");
  neuf();
  /* La table est indexée sur le NOM français de l'exercice. Un renommage ferait donc
     disparaître son dessin sans rien casser d'autre — l'exercice reprendrait son icône
     dessinée et personne ne s'en apercevrait. On vérifie que chaque clé désigne bien
     un exercice qui existe. Le nom de fichier, lui, se vérifie au chargement de la
     page : une image absente laisse une vignette vide, ça se voit tout de suite. */
  (()=>{
    const photos = F.eval("EXO_PHOTO");
    const noms = new Set(F.eval("LIB").map(e=>e.nameFr || e.name));
    const orphelines = Object.keys(photos).filter(n=>!noms.has(n));
    vrai("Chaque dessin désigne un exercice qui existe", orphelines.length === 0,
      orphelines.join(", "));
    vrai("Aucun fichier n'est nommé à vide",
      Object.values(photos).every(f=>/^[a-z0-9-]+$/.test(f)));
    /* deux exercices peuvent partager un dessin — le butterfly avant et arrière se
       montrent sur la même machine — mais un exercice n'en a qu'un */
    vrai("Il y a bien des dessins", Object.keys(photos).length > 40,
      Object.keys(photos).length);
  })();
  neuf();

  /* ---------------------------------------------------------- bilan */
  const bilan = document.getElementById("bilan");
  bilan.innerHTML = echecs === 0
    ? `<span class="ok">✔ ${total} tests passés</span>`
    : `<span class="ko">✘ ${echecs} test${echecs>1?"s":""} en échec</span> sur ${total}`;
  window.RESULTS = {total, echecs};
}
</script>
</html>
