<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tonnup — tests des calculs</title>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       background:#14140f; color:#eee; margin:0; padding:20px 16px 60px; line-height:1.5;}
  h1{font-size:20px; margin:0 0 4px;}
  .sub{color:#8e8e90; font-size:13px; margin-bottom:18px;}
  #bilan{position:sticky; top:0; background:#14140f; padding:10px 0 14px; font-size:17px; font-weight:800;}
  .ok{color:#6fbf8b;} .ko{color:#e06c5a;}
  .grp{margin:16px 0 6px; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:#8e8e90;}
  .l{font-size:13.5px; padding:3px 0; border-bottom:1px solid #262620;}
  .l .d{color:#8e8e90; font-size:12px;}
  iframe{display:none;}
</style>

<h1>Tests des calculs</h1>
<div class="sub">Vérifie les fonctions de calcul de Tonnup sans toucher à tes données.
Ouvre cette page après chaque publication.</div>
<div id="bilan">Chargement de l'application…</div>
<div id="sortie"></div>
<!-- on charge la source directement : plus besoin d une copie index.html a cote -->
<iframe id="app" src="tonnage.html"></iframe>

<script>
const sortie = document.getElementById("sortie");
let total = 0, echecs = 0, groupe = "";
function grp(nom){ groupe = nom; sortie.insertAdjacentHTML("beforeend", `<div class="grp">${nom}</div>`); }
function ligne(ok, nom, detail){
  total++; if(!ok) echecs++;
  sortie.insertAdjacentHTML("beforeend",
    `<div class="l"><span class="${ok?'ok':'ko'}">${ok?"✔":"✘"}</span> ${nom}` +
    (detail? ` <span class="d">— ${detail}</span>`:"") + `</div>`);
}
function eq(nom, obtenu, attendu){
  const ok = JSON.stringify(obtenu) === JSON.stringify(attendu);
  ligne(ok, nom, ok? "" : `obtenu ${JSON.stringify(obtenu)}, attendu ${JSON.stringify(attendu)}`);
}
function pres(nom, obtenu, attendu, tol){
  const ok = Math.abs(obtenu - attendu) <= tol;
  ligne(ok, nom, ok? "" : `obtenu ${obtenu}, attendu ${attendu} ±${tol}`);
}
function vrai(nom, cond, detail){ ligne(!!cond, nom, cond? "" : (detail||"")); }

document.getElementById("app").addEventListener("load", () => setTimeout(lancer, 400));

async function lancer(){
  const F = document.getElementById("app").contentWindow;
  /* « db » est déclaré avec let dans l'app : il n'apparaît pas sur window, on va chercher la référence */
  const DB = F.eval("db");
  const profilType = {name:"Test", sex:"h", age:28, height:188, weight:74, goalWeight:80,
                      metab:"normal", days:4, injuries:[], aim:"masse", pace:"modere", protPerKg:1.9};
  /* base d'essai : on n'écrit jamais, on remplace l'objet en mémoire de l'iframe */
  const neuf = () => {
    DB.profile = JSON.parse(JSON.stringify(profilType));
    DB.history = []; DB.weights = [{date:new Date().toISOString(), kg:74}];
    DB.habitSel = {}; DB.cardio = []; DB.unilat = {}; DB.plafond = {}; DB.dayFix = {};
    DB.materiel = null;      /* sinon un essai enregistré sur ce domaine fausse les tirages */
  };
  const id = n => F.libId(n);
  const serie = (w,r,rir,drops) => ({w, r, done:true, warm:false, rir:(rir===undefined?1:rir), drops});
  const seance = (heuresAvant, entrees) => ({
    id:"t"+Math.random(), date:new Date(Date.now()-heuresAvant*36e5).toISOString(),
    name:"Test", templateId:"x", start:Date.now()-heuresAvant*36e5-3.4e6, end:Date.now()-heuresAvant*36e5,
    entries:entrees
  });

  /* ---------------------------------------------------------- langue et unités */
  grp("Langue et unités");
  neuf();
  DB.settings = DB.settings || {};
  /* pds, fmtKg et EN_PRET sont des const : elles n'apparaissent pas sur window */
  const PDS = F.eval("pds"), ENPRET = F.eval("EN_PRET");
  const TR = F.eval("TR");
  const enLangue = (l, u, f) => { DB.settings.lang = l; DB.settings.units = u; const r = f(); return r; };

  eq("Français : les kilos restent des kilos",
     enLangue("fr", "metrique", () => PDS(80)), "80 kg");
  eq("English : conversion en livres",
     enLangue("en", "imperial", () => PDS(80)), "176,4 lb".replace(",", "."));
  eq("Le choix des unités ne dépend pas de la langue",
     enLangue("en", "metrique", () => PDS(80)), "80 kg");
  eq("Taille en centimètres",
     enLangue("fr", "metrique", () => F.affTaille(178)), "178 cm");
  eq("Taille en pieds et pouces",
     enLangue("fr", "imperial", () => F.affTaille(178)), "5'10\"");
  eq("Le pied juste, sans 12 pouces",
     enLangue("fr", "imperial", () => F.affTaille(183)), "6'0\"");

  /* le temps de repos se lit comme on le dit à voix haute, pas en secondes brutes */
  eq("Moins d'une minute reste en secondes", F.fmtRepos(45), "45 s");
  eq("Une minute pile se dit en minutes", F.fmtRepos(60), "1 min");
  eq("Une minute et demie", F.fmtRepos(90), "1 min 30");
  eq("Deux minutes pile, sans zéro inutile", F.fmtRepos(120), "2 min");
  eq("Deux minutes trente", F.fmtRepos(150), "2 min 30");
  eq("Cinq minutes", F.fmtRepos(300), "5 min");
  eq("Zéro reste lisible", F.fmtRepos(0), "0 s");

  /* un champ <input type=number> refuse la virgule : jamais de séparateur français */
  vrai("Le champ de saisie n'a pas de virgule",
       enLangue("fr", "imperial", () => !/,/.test(F.saisiePoids(80))));
  pres("Aller-retour livres → kilos",
       enLangue("fr", "imperial", () => F.versKg(F.saisiePoids(80))), 80, 0.05);
  /* Les bornes sont stockées en kg/cm : le message doit être converti, sinon
     l'utilisateur en livres lit « entre 30 et 300 kg » alors qu'il tape des lb. */
  const VC = F.eval("verifieChamp");
  eq("Une valeur dans les bornes ne dit rien",
     enLangue("fr", "metrique", () => VC("weight", 80)), null);
  vrai("Poids hors bornes : message en kilos",
       enLangue("fr", "metrique", () => /30 et 300 kg/.test(VC("weight", 400) || "")));
  vrai("Poids hors bornes : message en livres",
       enLangue("fr", "imperial", () => /66 et 661 lb/.test(VC("weight", 400) || "")));
  vrai("Taille hors bornes : message en pouces",
       enLangue("fr", "imperial", () => /47 et 91 in/.test(VC("height", 300) || "")));
  vrai("Le message de bornes est traduit",
       enLangue("en", "imperial", () => /^Weight must be between/.test(VC("weight", 400) || "")));
  vrai("L'âge n'a pas d'unité collée",
       enLangue("en", "imperial", () => /between 14 and 100/.test(VC("age", 200) || "")));

  eq("Le pas suit les unités : 0,5 kg",
     enLangue("fr", "metrique", () => F.stepPoids()), 0.5);
  eq("Le pas suit les unités : 1 lb",
     enLangue("fr", "imperial", () => F.stepPoids()), 1);

  /* le repli : tant qu'une phrase n'est pas traduite, on affiche le français */
  eq("Traduit : la navigation",
     enLangue("en", "metrique", () => F.TR("Séance")), "Workout");
  eq("Non traduit : repli sur le français",
     enLangue("en", "metrique", () => F.TR("Une phrase que personne n'a traduite")),
     "Une phrase que personne n'a traduite");
  eq("En français, le dictionnaire n'est jamais consulté",
     enLangue("fr", "metrique", () => F.TR("Séance")), "Séance");

  /* Les distances sont stockées en km. fmtKg() les convertissait en livres :
     10 km s'affichaient « 22 km » en impérial. D'où ces tests. */
  const DIST = F.eval("dist"), VKM = F.eval("versKm"), UD = F.eval("uDist");
  eq("Distance en kilomètres", enLangue("fr", "metrique", () => DIST(10)), "10 km");
  eq("Distance en miles", enLangue("fr", "imperial", () => DIST(10)), "6,2 mi");
  eq("L'unité de distance suit le réglage",
     enLangue("fr", "imperial", () => UD()), "mi");
  pres("Aller-retour miles → kilomètres",
       enLangue("fr", "imperial", () => VKM("6.2")), 10, 0.05);
  eq("En métrique, la saisie est déjà en km",
     enLangue("fr", "metrique", () => VKM("10")), 10);

  /* La regle : le francais aux telephones francophones, l'anglais aux autres.
     L'inverse enverrait du francais a un telephone allemand ou japonais. */
  const LSYS = F.eval("langueSysteme");
  const simuleLangue = (code, f) => {
    const nav = F.navigator;
    const vraiL = Object.getOwnPropertyDescriptor(Object.getPrototypeOf(nav), "languages")
               || Object.getOwnPropertyDescriptor(nav, "languages");
    try {
      Object.defineProperty(nav, "languages", {value:[code], configurable:true});
      return f();
    } finally {
      if (vraiL) { try { Object.defineProperty(nav, "languages", vraiL); } catch(e){} }
    }
  };
  eq("Téléphone français → français", simuleLangue("fr-FR", LSYS), "fr");
  eq("Téléphone canadien francophone → français", simuleLangue("fr-CA", LSYS), "fr");
  eq("Téléphone américain → anglais", simuleLangue("en-US", LSYS), "en");
  eq("Téléphone allemand → anglais, pas français", simuleLangue("de-DE", LSYS), "en");
  eq("Téléphone espagnol → anglais, pas français", simuleLangue("es-ES", LSYS), "en");
  eq("Téléphone japonais → anglais, pas français", simuleLangue("ja-JP", LSYS), "en");

  /* Bug signalé par Nico : en impérial, la charge appliquée aux séries suivantes
     s'affichait en kilos bruts (40 lb saisis → « 18,1436948004014 »). Tout ce qui
     part dans un champ de saisie doit repasser par saisiePoids(). */
  const SP = F.eval("saisiePoids"), VK = F.eval("versKg");
  eq("Impérial : 40 lb saisis se réaffichent 40",
     enLangue("fr", "imperial", () => SP(VK("40"))), "40");
  eq("Métrique : 40 kg saisis se réaffichent 40",
     enLangue("fr", "metrique", () => SP(VK("40"))), "40");
  vrai("Le champ ne montre jamais un kilo brut en impérial",
       enLangue("fr", "imperial", () => SP(VK("40"))).indexOf("18") !== 0);
  /* une charge allégée reste un nombre propre, pas 14 décimales */
  vrai("Une charge allégée reste lisible",
       enLangue("fr", "imperial", () => SP(VK("40") * 0.9)).length <= 6,
       enLangue("fr", "imperial", () => SP(VK("40") * 0.9)));

  /* le garde-fou : « auto » ne doit pas basculer en anglais avant la fin du chantier */
  eq("« Auto » reste en français tant que la traduction n'est pas finie",
     enLangue("auto", "auto", () => F.langue()), ENPRET ? F.langueSysteme() : "fr");

  /* Le nom affiché change de langue, mais la CLÉ reste le français. Si un jour
     quelqu'un branche une recherche sur le nom affiché, ces tests le voient. */
  DB.settings.lang = "en"; DB.settings.units = "metrique";
  const LIBEN = F.eval("LIB"), CANONX = F.eval("nomCanon");
  const EXOI = F.eval("EXO_INFO"), MWK = F.eval("MUSCLE_WORK");

  eq("Les 108 exercices sont là", LIBEN.length, 108);
  eq("Un nom s'affiche en anglais", LIBEN[0].name, "Bench press");
  eq("…mais sa clé reste le français", LIBEN[0].nameFr, "Développé couché");
  eq("Les 108 noms sont traduits",
     LIBEN.filter(e => e.name === e.nameFr && !/^(Dips|Squat|Crunch|Superman|Hip thrust|Face pull|Leg curl|Leg extension|Hack squat|Arnold press|Goblet squat|Front squat|Good morning|Russian twist)$/.test(e.nameFr)).length, 0);

  vrai("En anglais, chaque exercice retrouve sa fiche",
       LIBEN.every(e => !!EXOI[CANONX(e)]),
       "sans fiche : " + LIBEN.filter(e => !EXOI[CANONX(e)]).map(e => e.nameFr).join(", "));
  vrai("En anglais, chaque exercice retrouve ses muscles",
       LIBEN.every(e => !!MWK[CANONX(e)]),
       "sans muscles : " + LIBEN.filter(e => !MWK[CANONX(e)]).map(e => e.nameFr).join(", "));
  vrai("libId retrouve l'exercice par son nom français",
       F.libId("Développé couché") === LIBEN[0].id);
  vrai("libId le retrouve aussi par son nom anglais",
       F.libId("Bench press") === LIBEN[0].id);
  eq("Aucun doublon parmi les noms anglais",
     LIBEN.length - new Set(LIBEN.map(e => e.name)).size, 0);

  /* un exercice créé par la personne garde son propre nom, jamais traduit */
  DB.custom = [{id:"x1", name:"Ma variante", muscle:"Pectoraux", equip:"Barre"}];
  eq("Un exercice personnel n'est pas traduit", F.getEx("x1").name, "Ma variante");
  eq("…et son nom canonique est le sien", CANONX(F.getEx("x1")), "Ma variante");
  DB.custom = [];

  /* --- les 107 fiches en anglais --- */
  const FEN = F.eval("EXO_INFO_EN"), FICHE = F.eval("ficheDe");
  eq("Chaque fiche a sa version anglaise",
     Object.keys(EXOI).filter(n => !FEN[n]).length, 0);
  eq("Aucune fiche anglaise orpheline",
     Object.keys(FEN).filter(n => !EXOI[n]).length, 0);
  eq("Autant d'étapes des deux côtés",
     Object.keys(EXOI).reduce((a,n)=>a+EXOI[n].steps.length,0),
     Object.keys(FEN).reduce((a,n)=>a+FEN[n].steps.length,0));
  vrai("Chaque fiche anglaise a un conseil et au moins 3 étapes",
       Object.keys(FEN).every(n => FEN[n].tip && FEN[n].tip.length > 20 && FEN[n].steps.length >= 3));
  vrai("Aucune fiche anglaise n'a gardé du français",
       !Object.keys(FEN).some(n => /[éèêàçùôîû]|\b(les|des|une|tes|pour|avec|dans)\b/i
         .test(FEN[n].tip + " " + FEN[n].steps.join(" "))),
       Object.keys(FEN).filter(n => /[éèêàçùôîû]/.test(FEN[n].tip + FEN[n].steps.join(""))).join(", "));

  /* c'est bien la fiche anglaise qui sort quand la langue est l'anglais */
  DB.settings.lang = "en";
  vrai("En anglais, ficheDe rend la fiche anglaise",
       FICHE(LIBEN[0]).tip === FEN["Développé couché"].tip);
  DB.settings.lang = "fr";
  vrai("En français, ficheDe rend la fiche française",
       FICHE(LIBEN[0]).tip === EXOI["Développé couché"].tip);

  /* --- les chemins d'appel, en anglais --- */
  /* Ces fonctions cherchent par nom FRANÇAIS. Si un appelant leur passe le nom
     traduit, elles ne trouvent rien et échouent en silence : pas d'erreur, juste
     un avertissement de blessure qui n'apparaît plus. D'où ces tests. */
  DB.profile.injuries = ["epaule"];
  const BLESS = F.eval("injuryNote"), SILH = F.eval("exoBodyHtml");
  const dc = LIBEN.find(e => e.nameFr === "Développé couché");

  DB.settings.lang = "fr";
  vrai("En français, l'épaule sensible avertit sur le développé couché",
       !!BLESS(F.eval("nomCanon")(dc)));
  const silhFr = SILH(F.eval("nomCanon")(dc), false);

  DB.settings.lang = "en";
  vrai("En anglais aussi, l'avertissement de blessure s'affiche",
       !!BLESS(F.eval("nomCanon")(dc)),
       "l'appelant transmet sûrement ex.name au lieu de nomCanon(ex)");
  vrai("En anglais aussi, la silhouette anatomique se construit",
       SILH(F.eval("nomCanon")(dc), false).length > 0);
  /* on compare les ZONES colorées, pas le HTML entier : la légende est traduite */
  const zones = h => (h.match(/muscles\/[a-z-]+\.png/g) || []).sort().join("|");
  eq("Les mêmes zones anatomiques dans les deux langues",
     zones(SILH(F.eval("nomCanon")(dc), false)), zones(silhFr));

  /* le tour complet : chaque exercice, dans les deux langues */
  DB.profile.injuries = ["epaule", "dos", "genou", "coude", "poignet"];
  const compte = () => LIBEN.filter(e => !!BLESS(F.eval("nomCanon")(e))).length;
  DB.settings.lang = "fr"; const nFr = compte();
  DB.settings.lang = "en"; const nEn = compte();
  eq("Autant d'exercices déconseillés dans les deux langues", nEn, nFr);
  vrai("Et il y en a bien (sinon le test ne prouve rien)", nFr > 0);
  DB.profile.injuries = [];

  /* Les tables évaluées au chargement (MATERIELS, COACH_PROGRAMS) ne doivent PAS
     appeler TR() : la langue serait figée au démarrage, et db n'existe pas encore.
     On vérifie donc que leurs libellés restent en français dans la table... */
  const MATOS = F.eval("MATERIELS");
  eq("Le matériel garde le français comme clé",
     MATOS.find(m => m.id === "elastique").nom, "Bandes élastiques");
  /* ...et qu'ils ressortent bien traduits à l'affichage. */
  DB.settings.lang = "en";
  eq("...mais s'affiche traduit", TR("Bandes élastiques"), "Resistance bands");
  DB.settings.lang = "fr";
  eq("...et reste français en français", TR("Bandes élastiques"), "Bandes élastiques");

  DB.settings.lang = "auto"; DB.settings.units = "auto";

  /* ------------------------------------------------- progression sur plusieurs semaines */
  grp("Progression semaine après semaine");
  neuf();
  /* Le cas signalé par Nico : répondre « 1-2 » (RIR 1) à chaque série.
     Avant correction, l'app conseillait « gratte une rep » mais pré-remplissait
     les mêmes reps : la charge ne montait JAMAIS. */
  const modele = {id:"tp1", name:"Push", items:[{exId:id("Développé couché"), sets:3, reps:"8-12", rest:120}]};
  DB.templates = [modele];
  const START = F.eval("startWorkout");

  let charge = 60, reps = 10, monte = false, journal = [];
  for(let sem = 0; sem < 5; sem++){
    START("tp1");                                /* l'app propose la séance */
    const prop = DB.active.entries[0].sets.filter(x=>!x.warm);
    journal.push((Number(prop[0].w) || charge) + "×" + prop[0].r);
    /* à la 1re séance l'app ne propose pas de charge : il n'y a pas d'historique */
    const propose = Number(prop[0].w) || charge;
    if(propose > charge){ monte = true; }
    charge = propose; reps = prop[0].r;
    /* on fait exactement ce qui est proposé, en répondant « 1-2 » partout */
    /* chaque séance doit être PLUS RÉCENTE que la précédente : heures-avant décroissantes */
    DB.history.push(seance((6 - sem) * 48, [{exId:id("Développé couché"), target:modele.items[0],
      sets:[serie(charge, reps, 1), serie(charge, reps, 1), serie(charge, reps, 1)]}]));
    DB.history.sort((x,y)=> new Date(x.date) - new Date(y.date));
  }
  vrai("En répondant toujours « 1-2 », la charge finit par monter", monte,
       "séances proposées : " + journal.join(" → "));
  vrai("Les répétitions progressent d'une séance à l'autre",
       journal[1].split("×")[1] > journal[0].split("×")[1],
       "séances proposées : " + journal.join(" → "));
  DB.templates = [];

  /* ---------------------------------------------------------- force et tonnage */
  grp("Force et tonnage");
  neuf();
  pres("1RM Epley : 100 kg × 1", F.e1rm(100,1), 100, 0.01);
  pres("1RM Epley : 60 kg × 10", F.e1rm(60,10), 80, 0.01);
  eq("Tonnup d'une série simple", F.volSerie({w:60, r:10}), 600);
  eq("Tonnup avec dégressif", F.volSerie({w:12, r:6, drops:[{w:10, r:4}]}), 112);
  eq("Barre : facteur 1", F.facteurCharge(id("Développé couché")), 1);
  eq("Haltères : facteur 2", F.facteurCharge(id("Développé incliné haltères")), 2);
  DB.unilat[id("Extension poulie")] = true;
  eq("Unilatéral coché : facteur 2", F.facteurCharge(id("Extension poulie")), 2);
  DB.unilat[id("Développé incliné haltères")] = true;
  eq("Haltères + unilatéral : reste 2, jamais 4", F.facteurCharge(id("Développé incliné haltères")), 2);
  neuf();

  /* ---------------------------------------------------------- dates */
  grp("Dates");
  const d = new Date(2026, 0, 5, 23, 30);
  eq("Clé du jour en heure locale (pas UTC)", F.dayKey(d), "2026-01-05");
  eq("Clé du jour, 1er janvier", F.dayKey(new Date(2026, 0, 1, 0, 5)), "2026-01-01");

  /* ---------------------------------------------------------- plan calorique */
  grp("Plan calorique");
  neuf();
  let pl = F.planFor(DB.profile);
  pres("Métabolisme de base (Mifflin-St Jeor)", pl.bmr, 1780, 2);
  vrai("Dépense supérieure au métabolisme de base", pl.tdee > pl.bmr);
  vrai("Prise de masse : surplus positif", pl.delta > 0);
  vrai("Fourchette cohérente (min < cible < max)", pl.kcalMin < pl.kcal && pl.kcal < pl.kcalMax);
  pres("Protéines = 1,9 g/kg", pl.prot, Math.round(74*1.9), 1);
  DB.profile.aim = "seche"; DB.profile.goalWeight = 68;
  pl = F.planFor(DB.profile);
  vrai("Sèche : déficit", pl.delta < 0);
  vrai("Jamais sous 1,2 × le métabolisme de base", pl.kcal >= pl.bmr*1.2 - 1);
  DB.profile.tdeeManuel = 2200;
  pl = F.planFor(DB.profile);
  eq("Dépense saisie à la main : elle prime", pl.tdee, 2200);
  eq("…et la source est signalée", pl.tdeeSource, "manuel");
  neuf();

  /* ---------------------------------------------------------- garde-fous santé */
  grp("Garde-fous santé");
  pres("IMC 74 kg / 188 cm", F.imc(74,188), 20.9, 0.1);
  eq("Poids plancher pour 188 cm (IMC 18,5)", F.poidsMiniSain(188), 65.4);
  eq("Objectif sain : aucune alerte", F.alerteObjectif({weight:74, height:188, goalWeight:80}), null);
  eq("IMC cible 18,1 : danger", F.alerteObjectif({weight:74, height:188, goalWeight:64}).niveau, "danger");
  eq("IMC cible 15,6 : danger", F.alerteObjectif({weight:74, height:188, goalWeight:55}).niveau, "danger");
  eq("Perte de 27 % : prudence", F.alerteObjectif({weight:110, height:175, goalWeight:80}).niveau, "prudence");
  eq("IMC cible 36,8 en prise : danger", F.alerteObjectif({weight:74, height:188, goalWeight:130}).niveau, "danger");
  eq("IMC cible 31,1 en prise : prudence", F.alerteObjectif({weight:74, height:188, goalWeight:110}).niveau, "prudence");
  eq("Prise de 28 % : prudence", F.alerteObjectif({weight:74, height:188, goalWeight:95}).niveau, "prudence");
  eq("Obèse qui maintient : pas d'alerte de prise", F.alerteObjectif({weight:120, height:175, goalWeight:120}), null);
  vrai("Poids visé de 250 kg refusé", !!F.verifieChamp("goalWeight", 250));

     L'app doit donc refuser d'activer ce qu'elle n'a pas pu relire.

     il n'existe pas sur window et ne peut se manipuler que de l'intérieur. */
  const essaiAuto = c => F.eval(`(async () => {
    const faux = {
      name: "tonnage-donnees.json",
      async createWritable(){ return {async write(){}, async close(){}}; },
      async getFile(){ return new Blob([${'"vide"'} === "${c}" ? "" : JSON.stringify(db)],
                                       {type:"application/json"}); }
    };
    const dits = []; const vraiToast = toast; toast = m => dits.push(m);
    autoFile = {handle: faux, ok: true, to: null, name: faux.name, err: ""};
    await autoFileEssai("ok");
    toast = vraiToast;
    const r = {dits: dits.slice(), actif: autoFile.ok, garde: !!autoFile.handle, err: autoFile.err};
    autoFile = {handle: null, ok: false, to: null, name: "", err: ""};
    return r;
  })()`);

  vrai("En entretien aussi, la charge se maintient",
    DOSES.entretien.lourd.r === DOSES.masse.lourd.r);
  vrai("Aucun mouvement lourd ne repose moins de 2 minutes",
    Object.values(DOSES).every(d => d.lourd.p >= 120));
  vrai("Aucune isolation ne repose moins de 75 secondes",
    Object.values(DOSES).every(d => d.leger.p >= 75));
  vrai("La force reste la seule à descendre sous 8 répétitions",
    Object.keys(DOSES).every(k => k === "force" || parseInt(DOSES[k].lourd.r) >= 8));
  const PROGS = F.eval("COACH_PROGRAMS");
  const tousLesItems = Object.values(PROGS).reduce((a,p)=>a.concat(p.templates.reduce((b,t)=>b.concat(t.items), [])), []);
  vrai("Aucune séance toute faite ne repose moins d'une minute",
    tousLesItems.every(([nom, sets, reps, repos]) => repos >= 60));
  DB.materiel = [];
  vrai("Aucune fourchette impossible au poids du corps", (()=>{
    for(let k=0;k<60;k++){
      for(const t of F.typesProposables()){
        for(const it of F.genererSeance(t).items){
          const ex = F.getEx(id(it.nom)), r = F.parseReps(it.reps);
          if(!ex || !r) continue;
          if(F.estPoidsDuCorps(ex) && r.lo > 8) return false;
          if(ex.equip === "Barre fixe" && r.hi > 12) return false;
        }
      }
    }
    return true;
  })());
  DB.materiel = null;
  vrai("En perte de poids, plus aucune série au-delà de 15 répétitions",
    PROGS.seche.templates.every(t => t.items.every(([nom, sets, reps]) => !/1[6-9]|2[0-9]/.test(String(reps)))));
  neuf();

  /* ------------------------------------------------- ordre des exercices d'une séance */
  /* ------------------------------------------------- fiches empilées */
  grp("Fiches empilées");
  neuf();
  /* Il n'y a qu'une feuille dans la page : en ouvrir une deuxième remplaçait la
     première, et la refermer ne laissait rien — on se retrouvait sur l'accueil au
     lieu de revenir à l'aperçu de la séance. */
  (()=>{
    const titre = () => { const h = F.document.querySelector("#sheet h3"); return h ? h.textContent : ""; };
    const ouverte = () => F.document.getElementById("overlay").classList.contains("show");
    /* la fermeture pour de bon passe par history.back(), qui n'agit qu'au tour suivant :
       on regarde donc l'état interne, qui lui est posé tout de suite */
    const encoreOuverte = () => F.eval("sheetOpen");
    const pile = () => F.eval("pileFiches").length;
    DB.templates = [{id:"tpile", name:"Pile", items:[
      {exId:id("Développé couché"), sets:3, reps:"8-12", rest:120},
      {exId:id("Rowing barre"),     sets:3, reps:"8-12", rest:120}]}];
    DB.active = null;
    F.openPreview("tpile");
    eq("On part de l'aperçu de la séance", titre(), "Pile");
    F.ouvrirParDessus(()=>F.openPreview("tpile"), ()=>F.openExoInfo(id("Développé couché")));
    eq("La fiche de l'exercice passe par-dessus", titre(), F.getEx(id("Développé couché")).name);
    eq("…et l'aperçu est mis de côté", pile(), 1);
    F.closeSheet();
    eq("La fermer ramène à l'aperçu", titre(), "Pile");
    eq("…et la pile est vidée", pile(), 0);
    vrai("…sans jamais tout fermer", ouverte());
    F.closeSheet();
    vrai("Fermer l'aperçu ferme pour de bon", !encoreOuverte());
    /* le bouton retour du téléphone ne doit rien laisser derrière lui */
    F.openPreview("tpile");
    F.ouvrirParDessus(()=>F.openPreview("tpile"), ()=>F.openExoInfo(id("Rowing barre")));
    eq("Deux fiches ouvertes", pile(), 1);
    F.hideSheet();
    eq("Une fermeture nette vide la pile", pile(), 0);
    F.openSettings();
    F.closeSheet();
    vrai("Aucune fiche ne resurgit après coup", !encoreOuverte() && pile() === 0);
    DB.active = null;
  })();
  neuf();

  grp("Ordre des exercices");
  neuf();
  /* Le glissé lui-même se vérifie à la main : l'iframe des tests n'a aucune hauteur,
     donc toutes les mesures géométriques y valent zéro. Ce qu'on verrouille ici est
     la chaîne qui compte — l'ordre déposé devient le plan, et le plan devient la
     séance. C'est là qu'une régression passerait inaperçue. */
  (()=>{
    DB.templates = [{id:"tord", name:"Ordre", items:[
      {exId:id("Développé couché"), sets:3, reps:"8-12", rest:120},
      {exId:id("Rowing barre"),     sets:3, reps:"8-12", rest:120},
      {exId:id("Squat"),            sets:4, reps:"8-12", rest:150}]}];
    DB.active = null;
    const plan = () => DB.templates[0].items.map(i=>F.getEx(i.exId).name);
    const depart = plan();
    F.appliquerOrdre(DB.templates[0], [2, 0, 1]);        /* la dernière passe en tête */
    eq("L'ordre déposé devient celui du plan",
      plan().join(" / "), [depart[2], depart[0], depart[1]].join(" / "));
    F.startWorkout("tord");
    eq("La séance démarre dans cet ordre",
      DB.active.entries.map(e=>F.getEx(e.exId).name).join(" / "), plan().join(" / "));
    DB.active = null;
    /* deux déplacements de suite : le second part de la liste déjà réordonnée */
    F.appliquerOrdre(DB.templates[0], [1, 2, 0]);
    eq("Un second déplacement part bien du nouvel ordre",
      plan().join(" / "), [depart[0], depart[1], depart[2]].join(" / "));
    vrai("Aucun exercice n'est perdu ni dupliqué",
      new Set(DB.templates[0].items.map(i=>i.exId)).size === 3);
    F.startWorkout("tord");
    eq("Et la séance suit toujours", DB.active.entries.length, 3);
    DB.active = null;
  })();
  neuf();

  /* ---------------------------------------------------------- photo de la séance */
  grp("Photo de la séance");
  neuf();
  const exDe = g => F.eval("LIB").filter(e=>e.muscle===g).slice(0,3).map(e=>({exId:e.id}));
  eq("Une séance d'abdos n'est pas une séance de dos",
    F.photoSeance({name:"Abdos", items:exDe("Abdos")}), "abdos");
  eq("Le nom « Abdos » seul suffit", F.photoSeance({name:"Abdos", items:[]}), "abdos");
  eq("Une séance de dos reste une séance de dos",
    F.photoSeance({name:"Pull", items:exDe("Dos")}), "pull");
  eq("Les pectoraux donnent push", F.photoSeance({name:"Push", items:exDe("Pectoraux")}), "push");
  eq("Les jambes donnent jambes", F.photoSeance({name:"Legs", items:exDe("Jambes")}), "jambes");
  eq("Les exercices priment sur le nom",
    F.photoSeance({name:"Pull", items:exDe("Jambes")}), "jambes");
  eq("Une photo choisie à la main est respectée",
    F.photoSeance({photo:"cardio", name:"Abdos", items:exDe("Abdos")}), "cardio");
  /* Les essais ci-dessus donnaient tous un nom qui portait déjà la réponse : ils
     passaient même quand le classement par exercice était cassé. Ceux-ci ne le
     permettent pas — un nom neutre, et un seul exercice d'épaules au milieu du dos,
     qui suffisait à faire basculer toute la séance du côté « push ». */
  const exos = noms => noms.map(n=>({exId:id(n)}));
  eq("Le dos est reconnu sans l'aide du nom",
    F.photoSeance({name:"Séance A", items:exos(["Tractions","Rowing barre","Tirage vertical"])}), "pull");
  eq("Un exercice d'épaules ne renverse pas une séance de dos",
    F.photoSeance({name:"Séance A",
      items:exos(["Tractions","Rowing barre","Tirage vertical","Curl haltères","Face pull"])}), "pull");
  eq("Le biceps compte du côté du tirage",
    F.photoSeance({name:"Séance A", items:exos(["Curl barre","Curl haltères","Curl marteau"])}), "pull");
  eq("La poussée est reconnue sans l'aide du nom",
    F.photoSeance({name:"Séance A",
      items:exos(["Développé couché","Développé militaire","Extension poulie"])}), "push");
  neuf();

  /* ---------------------------------------------------------- fiches d'exercice */
  grp("Fiches d'exercice");
  neuf();
  const LIBT = F.eval("LIB"), INFO = F.eval("EXO_INFO"), TRAVAIL = F.eval("MUSCLE_WORK");
  vrai("Chaque exercice a sa fiche d'exécution",
    LIBT.every(e => INFO[e.name]));
  vrai("Aucune fiche ne traîne sans exercice",
    Object.keys(INFO).every(n => LIBT.some(e => e.name === n)));
  vrai("Chaque fiche a une astuce et au moins trois étapes",
    Object.values(INFO).every(i => i.tip && i.tip.length > 20 && i.steps && i.steps.length >= 3));
  vrai("Aucune étape vide ou tronquée",
    Object.values(INFO).every(i => i.steps.every(t => typeof t === "string" && t.length > 10)));
  vrai("Chaque exercice déclare les muscles qu'il sollicite",
    LIBT.every(e => (TRAVAIL[e.name] || []).length > 0));
  vrai("Chaque exercice a un muscle principal",
    LIBT.every(e => (TRAVAIL[e.name] || []).some(([, n]) => n === 3)));
  neuf();

  /* ---------------------------------------------------------- parcours d'accueil */
  grp("Parcours d'accueil");
  neuf();
  const sansSexe = F.planFor({...profilType, sex:"n"});
  const homme = F.planFor({...profilType, sex:"h"});
  const femme = F.planFor({...profilType, sex:"f"});
  vrai("Sexe non renseigné : entre homme et femme", sansSexe.bmr < homme.bmr && sansSexe.bmr > femme.bmr);
  pres("Sexe non renseigné : moyenne des deux", sansSexe.bmr, (homme.bmr+femme.bmr)/2, 1);
  const fk = F.fourchetteProt(1.9);
  eq("Fourchette protéines : trois choix", fk.length, 3);
  eq("Fourchette protéines : la valeur conseillée est au centre", fk[1][0], 1.9);
  vrai("Fourchette protéines : ordre croissant", fk[0][0] < fk[1][0] && fk[1][0] < fk[2][0]);
  vrai("Fourchette protéines : jamais en dessous de 1,2 g/kg", F.fourchetteProt(1.3)[0][0] >= 1.2);
  vrai("Fourchette protéines : jamais au-dessus de 2,6 g/kg", F.fourchetteProt(2.5)[2][0] <= 2.6);

  /* ------------------------------------------------- reponses de fin de serie (vrai parcours) */
  grp("Réponses de fin de série");
  neuf();
  DB.templates = [{id:"tr", name:"Test RIR", items:[{exId:id("Développé couché"), sets:3, reps:"8-12", rest:120}]}];
  const D = document.getElementById("app").contentDocument;
  let erreur = null;
  F.onerror = m => { erreur = m; };
  const repondre = valeur => {
    DB.active = null;
    F.startWorkout("tr");
    const rows = [...D.querySelectorAll(".set-row")];
    const r = rows[1];                                  /* rows[0] = échauffement */
    const w = r.querySelector("input");
    w.value = 60; w.dispatchEvent(new F.Event("input", {bubbles:true}));
    r.querySelector(".ck").click();
    const ask = D.querySelector(".rir-ask");
    if(!ask) return {ok:false, txt:"la question ne s'affiche pas"};
    erreur = null;
    ask.querySelector('[data-rir="' + valeur + '"]').click();
    /* la réponse se lit sur deux niveaux : un verdict, puis la consigne */
    const rep = D.querySelector(".rir-ask .rir-rep");
    const d = rep && rep.querySelector(".d");
    return {ok: !erreur && !!rep && !!d && !!d.textContent.trim(),
            txt: erreur || (rep? rep.textContent : "aucune réponse"),
            ton: rep ? rep.className.replace("rir-rep ", "").trim() : "",
            verdict: rep && rep.querySelector(".v") ? rep.querySelector(".v").textContent : "",
            detail: d ? d.textContent : ""};
  };
  [["0","Non, 0"],["1","1-2"],["3","3-5+"],["-1","C'était trop lourd"]].forEach(([v,lab])=>{
    const r = repondre(v);
    vrai("« " + lab + " » répond sans planter", r.ok, r.txt);
    vrai("« " + lab + " » annonce un verdict avant la consigne", !!r.verdict, r.txt);
    vrai("« " + lab + " » dit dans quel sens ça va",
      ["juste","monte","baisse"].includes(r.ton), r.ton);
    vrai("« " + lab + " » commence sa consigne par une majuscule",
      /^[A-ZÀÉÈÊ0-9]/.test(r.detail), r.detail);
  });
  eq("« 3-5+ » invite à monter", repondre("3").ton, "monte");
  eq("« Trop lourd » invite à baisser", repondre("-1").ton, "baisse");
  eq("« 1-2 » dit que c'est la bonne zone", repondre("1").ton, "juste");
  vrai("« 3-5+ » monte la charge des séries suivantes", (()=>{ repondre("3"); const s2 = DB.active.entries[0].sets[2]; return s2.w > 60; })());
  vrai("« Trop lourd » baisse la charge des séries suivantes", (()=>{ repondre("-1"); const s2 = DB.active.entries[0].sets[2]; return s2.w < 60; })());
  vrai("« 1-2 » garde la charge des séries suivantes", (()=>{ repondre("1"); const s2 = DB.active.entries[0].sets[2]; return s2.w === 60; })());

  /* ---- dégressif : l'app annonce au lieu de questionner ----
     Un dégressif se fait par construction jusqu'à l'échec : « aurais-tu pu faire plus ? »
     n'a pas de réponse. Ce qui compte est le nombre de reps tenu AVANT la première
     descente, et l'app connaît la fourchette : elle sait juger seule. */
  const degressif = hautR => {
    DB.active = null;
    F.startWorkout("tr");                          /* fourchette 8-12 */
    const en = DB.active.entries[0], i = en.sets.findIndex(s=>!s.warm);
    en.sets[i].w = 60; en.sets[i].r = hautR; en.sets[i].drops = [{w:50,r:2},{w:40,r:2}];
    F.save(); F.renderSurPlace();
    D.querySelector('.set-row[data-si="' + i + '"] .ck').click();
    const ask = D.querySelector(".rir-ask");
    const rep = ask.querySelector(".rir-rep");
    return {ask, bilan: ask.classList.contains("bilan"),
            noir: ask.classList.contains("bn"),
            verdict: rep ? rep.querySelector(".v").textContent : null,
            question: ask.querySelector(".q") ? ask.querySelector(".q").textContent : null,
            boutons: [...ask.querySelectorAll("button")].length,
            suite: en.sets.filter(s=>!s.warm && !s.done)[0]};
  };
  (()=>{ const d = degressif(10);                  /* 10 reps pour une cible de 8-12 */
    eq("Dans la fourchette : l'app annonce, elle ne demande rien", d.question, null);
    eq("…avec un verdict encourageant", d.verdict, "Bien joué");
    eq("…et un seul bouton pour reprendre la main", d.boutons, 1);
    vrai("…la charge ne bouge pas", d.suite.w === 60);
    vrai("Le bilan n'est pas en noir : le noir dit ce qui reste à faire", !d.noir);
  })();
  (()=>{ const d = degressif(14);                  /* au-dessus de la fourchette */
    eq("Au-dessus de la fourchette : trop léger", d.verdict, "Trop léger");
    vrai("…et la charge monte", d.suite.w > 60);
  })();
  (()=>{ const d = degressif(5);                   /* en dessous : le seul cas ambigu */
    vrai("En dessous, l'app demande — elle ne peut pas trancher", !!d.question);
    eq("…en deux boutons seulement", d.boutons, 2);
    vrai("…et rien n'est décidé avant la réponse", !d.bilan);
    d.ask.querySelector("[data-garder]").click();
    vrai("« C'était voulu » garde la charge", DB.active.entries[0].sets[2].w === 60);
  })();
  (()=>{ const d = degressif(5);
    d.ask.querySelector('[data-rir="-1"]').click();
    vrai("« C'était trop lourd » la baisse", DB.active.entries[0].sets[2].w < 60);
  })();
  F.onerror = null;

  /* ---- mise en avant de la série en cours et repli de l exercice ---- */
  DB.active = null;
  F.startWorkout("tr");
  const lignes = () => [...D.querySelectorAll(".set-row")];
  const actives = () => lignes().map(l=>l.classList.contains("actif") ? 1 : 0);
  eq("Une seule série est mise en avant", actives().reduce((a,b)=>a+b,0), 1);
  eq("C'est la première non validée", actives().indexOf(1), 0);
  /* Le cadre noir s'anime en arrivant sur une série, jamais en restant sur la même :
     cette fonction suit le défilement, une ligne réanimée clignoterait à chaque pixel. */
  vrai("Le cadre s'anime en se posant", lignes()[0].classList.contains("pop"));
  (()=>{ const avant = lignes()[0];
    let rejoue = 0, avait = avant.classList.contains("pop");
    const obs = new F.MutationObserver(ms=>ms.forEach(m=>{
      const p = m.target.classList.contains("pop");
      if(p && !avait) rejoue++;
      avait = p;
    }));
    obs.observe(avant, {attributes:true, attributeFilter:["class"]});
    for(let i=0;i<12;i++) F.majSerieActive();      /* comme un défilement sur place */
    obs.disconnect();
    eq("Il ne se rejoue pas tant qu'il ne bouge pas", rejoue, 0);
    vrai("…et il reste bien là", avant.classList.contains("pop") && avant.classList.contains("bn"));
  })();
  (()=>{ const r = lignes()[0]; const [w,q] = r.querySelectorAll("input");
    w.value = 60; w.dispatchEvent(new F.Event("input", {bubbles:true}));
    q.value = 10; q.dispatchEvent(new F.Event("input", {bubbles:true}));
    r.querySelector(".ck").click(); })();
  eq("Elle passe à la suivante une fois validée", actives().indexOf(1), 1);

  /* Le champ des reps est pré-rempli avec un OBJECTIF. S'il n'est pas corrigé avant
     de valider, l'app enregistre l'objectif comme une performance : le tonnage gonfle
     et l'adaptation de charge ne se déclenche jamais. Les boutons − / + servent à
     dire la vérité en deux appuis, sans clavier. */
  (()=>{
    const act = () => D.querySelector(".set-row.actif");
    const champ = () => act().querySelectorAll("input")[1];
    const si = Number(act().dataset.si);
    DB.active.entries[0].sets.forEach(s=>{ if(!s.warm){ s.w = 60; s.r = 12; } });
    F.renderSurPlace();
    vrai("Les boutons n'existent que sur la série en cours",
      D.querySelectorAll(".set-row .rs").length > 0
      && [...D.querySelectorAll(".set-row")].filter(l=>l.classList.contains("actif")).length === 1);
    act().querySelector('[data-rs="-1"]').click();
    act().querySelector('[data-rs="-1"]').click();
    eq("Deux appuis font passer de 12 à 10", champ().value, "10");
    eq("…et c'est bien 10 qui est enregistré", DB.active.entries[0].sets[si].r, 10);
    vrai("…sans toucher aux séries suivantes",
      DB.active.entries[0].sets.slice(si+1).every(s=>s.warm || s.r === 12));
    act().querySelector('[data-rs="1"]').click();
    eq("Le + remonte d'une répétition", DB.active.entries[0].sets[si].r, 11);
    for(let k=0;k<20;k++) act().querySelector('[data-rs="-1"]').click();
    eq("On ne descend jamais sous zéro", DB.active.entries[0].sets[si].r, 0);
  })();
  eq("…et toujours une seule", actives().reduce((a,b)=>a+b,0), 1);
  /* ---- un seul cadre noir dans toute la séance ---- */
  DB.active = null;
  DB.templates.push({id:"tr2", name:"Test deux", items:[
    {exId:id("Développé couché"), sets:3, reps:"8-12", rest:120},
    {exId:id("Rowing barre"), sets:3, reps:"8-12", rest:120}]});
  F.startWorkout("tr2");
  eq("Deux exercices affichés", D.querySelectorAll(".ex-card").length, 2);
  eq("Une seule série mise en avant sur toute la séance", actives().reduce((a,b)=>a+b,0), 1);

  /* ---- la question passe avant la série suivante ---- */
  DB.active = null;
  F.startWorkout("tr");
  /* l'échauffement ne déclenche pas de question : on le valide d'abord */
  (()=>{ const r = lignes()[0]; const [w,q] = r.querySelectorAll("input");
    w.value = 30; w.dispatchEvent(new F.Event("input", {bubbles:true}));
    q.value = 12; q.dispatchEvent(new F.Event("input", {bubbles:true}));
    r.querySelector(".ck").click(); })();
  (()=>{ const r = lignes()[1]; const [w,q] = r.querySelectorAll("input");
    w.value = 60; w.dispatchEvent(new F.Event("input", {bubbles:true}));
    q.value = 10; q.dispatchEvent(new F.Event("input", {bubbles:true}));
    r.querySelector(".ck").click(); })();
  vrai("Une question apparaît après la série", !!D.querySelector(".rir-ask"));
  /* La question REMPLACE la série qu'elle concerne : sans cela le bloc noir affichait
     huit boutons d'un coup — les deux champs, le dégressif, la coche, puis les quatre
     réponses. La série revient dès qu'on a répondu. */
  vrai("La série validée s'efface au profit de la question",
    lignes()[1].classList.contains("en-question"));
  eq("Elle est la seule à s'effacer", D.querySelectorAll(".set-row.en-question").length, 1);
  eq("Plus aucune série n'est mise en avant", actives().reduce((a,b)=>a+b,0), 0);
  vrai("La question porte seule le bloc noir", !!D.querySelector(".rir-ask.bn"));
  eq("…et rien d'autre", D.querySelectorAll(".bn").length, 1);
  lignes()[2].querySelector(".ck").click();
  vrai("La série suivante refuse d'être validée avant la réponse", !DB.active.entries[0].sets[2].done);
  D.querySelector('.rir-ask [data-rir="1"]').click();
  vrai("La série revient dès la réponse", !lignes()[1].classList.contains("en-question"));
  eq("Rien ne s'allume tant que le message de réponse est là", actives().reduce((a,b)=>a+b,0), 0);
  /* le message s'efface au bout de quelques secondes : on simule sa disparition */
  D.querySelector(".rir-ask").remove(); F.retirerBlocNoir(true); F.majSerieActive();
  eq("Puis la série suivante s'allume", actives().indexOf(1), 2);
  eq("Et elle seule", actives().reduce((a,b)=>a+b,0), 1);
  lignes()[2].querySelector(".ck").click();
  vrai("…et devient validable", DB.active.entries[0].sets[2].done);

  DB.active.entries[0].replie = true;
  F.render();
  vrai("Un exercice replié tient sur une ligne", !!D.querySelector(".ex-done") && !D.querySelector(".ex-card"));
  D.querySelector(".ex-done").click();
  vrai("Il se rouvre d'un appui", !!D.querySelector(".ex-card") && !D.querySelector(".ex-done"));
  DB.active = null;
  neuf();

  /* ---------------------------------------------------------- bilan */
  const bilan = document.getElementById("bilan");
  bilan.innerHTML = echecs === 0
    ? `<span class="ok">✔ ${total} tests passés</span>`
    : `<span class="ko">✘ ${echecs} test${echecs>1?"s":""} en échec</span> sur ${total}`;
  window.RESULTS = {total, echecs};
}
</script>
</html>
