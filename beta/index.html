  "Prise de muscle":"Build muscle",
  "Construire du muscle avec un surplus de calories maîtrisé.":"Build muscle on a controlled calorie surplus.",
  "Fabriquer du tissu musculaire demande de l'énergie et des matériaux. Sans excédent, le corps entretient ce qu'il a mais ne construit rien de neuf.":"Building muscle tissue takes energy and raw material. With no surplus, your body maintains what it has but builds nothing new.",
  "8 à 16 % au-dessus de ta dépense selon le rythme choisi. En dessous, la progression cale ; au-dessus, le surplus part en gras sans accélérer le muscle.":"8 to 16% above your burn, depending on the pace you pick. Below that, progress stalls; above it, the surplus turns to fat without building muscle any faster.",
  "1,8 à 2 g par kilo de poids de corps. C'est la brique de base : le surplus calorique fournit l'énergie, les protéines fournissent la matière.":"1.8 to 2 g per kilo of bodyweight. This is the building block: the calorie surplus supplies the energy, protein supplies the material.",
  "6 à 12 répétitions, charges lourdes, 1 min 30 à 3 min de repos, 3 à 4 séances par semaine en Push / Pull / Legs.":"6 to 12 reps, heavy loads, 1.5 to 3 minutes of rest, 3 to 4 sessions a week on a Push / Pull / Legs split.",
  "Tu veux prendre du volume, et ton objectif de poids est au-dessus de ton poids actuel.":"You want to add size, and your target weight is above where you are now.",
  "Au-delà de 0,5 kg par semaine, l'essentiel de la prise est du gras. La lenteur est le prix d'une prise propre.":"Past 0.5 kg a week, most of what you gain is fat. Going slowly is the price of a clean gain.",
  "Perte de poids":"Lose fat",
  "Perdre du gras en préservant un maximum de muscle.":"Lose fat while holding on to as much muscle as possible.",
  "Le corps puise dans ses réserves quand il reçoit moins que ce qu'il dépense. Tout l'enjeu est qu'il pioche dans le gras plutôt que dans le muscle.":"Your body draws on its reserves when it gets less than it spends. The whole game is making it take from fat rather than muscle.",
  "12 à 24 % en dessous de ta dépense. Jamais plus : un déficit brutal fait fondre le muscle, chuter l'énergie et reprendre le poids ensuite.":"12 to 24% below your burn. Never more: a harsh deficit melts muscle, drops your energy, and the weight comes back afterwards.",
  "2,2 g par kilo — le besoin le plus élevé de tous les objectifs. En déficit, ce sont elles qui signalent au corps de garder le muscle.":"2.2 g per kilo — the highest of any goal. In a deficit, protein is what tells your body to keep the muscle.",
  "Continue à soulever lourd : c'est la charge qui préserve le muscle, pas les séries légères. Mêmes fourchettes qu'en prise de masse — 8 à 12 répétitions sur les mouvements lourds, 12 à 15 sur l'isolation — mais une série de moins par exercice, plus 2 à 3 sorties cardio.":"Keep lifting heavy: load is what preserves muscle, not light sets. Same ranges as a bulk — 8 to 12 reps on the big lifts, 12 to 15 on isolation — but one set fewer per exercise, plus 2 or 3 cardio sessions.",
  "Ton objectif de poids est en dessous de ton poids actuel.":"Your target weight is below where you are now.",
  "Si tu perds de la force séance après séance, ton déficit est trop agressif : remonte les calories.":"If you're losing strength session after session, your deficit is too aggressive: put the calories back up.",
  "Recomposition":"Recomposition",
  "Perdre du gras et gagner du muscle à poids stable.":"Lose fat and gain muscle at a steady weight.",
  "Transformer sa composition sans changer de poids : le gras diminue pendant que le muscle augmente. Sur la balance, l'aiguille bouge à peine — c'est normal, c'est même le but.":"Changing your composition without changing your weight: fat goes down while muscle goes up. The scale barely moves — that's normal, that's the point.",
  "À ta maintenance exactement. Le corps prend l'énergie du gras qu'il perd pour construire le muscle qu'il gagne.":"Exactly at your maintenance. Your body takes energy from the fat it loses to build the muscle it gains.",
  "2 g par kilo. Élevées, car il faut construire et protéger en même temps.":"2 g per kilo. High, because you're building and protecting at the same time.",
  "8 à 12 répétitions, intensité soutenue, 3 séances par semaine en Haut / Bas / Full body.":"8 to 12 reps, sustained intensity, 3 sessions a week on an Upper / Lower / Full-body split.",
  "Tu débutes, tu reprends après une pause, ou tu es à peu près à ton poids mais tu veux une meilleure silhouette.":"You're starting out, coming back after a break, or roughly at your weight but want a better shape.",
  "Ce n'est PAS le bon objectif si tu veux perdre plusieurs kilos : ton poids ne bougera quasiment pas. Juge tes progrès au miroir, au tour de taille et aux charges soulevées, jamais à la balance.":"This is NOT the right goal if you want to lose several kilos: your weight will barely move. Judge your progress in the mirror, at the waist and on the bar — never on the scale.",
  "Force":"Strength",
  "Devenir plus fort sur les mouvements de base.":"Get stronger on the main lifts.",
  "Progresser en force tient autant du système nerveux que du muscle : le corps apprend à recruter plus de fibres d'un coup. On cherche la charge, pas la fatigue.":"Strength is as much nervous system as muscle: your body learns to recruit more fibres at once. You're chasing load, not fatigue.",
  "Léger surplus de 4 à 10 %. Assez pour récupérer entre des séances éprouvantes, sans prise de poids notable.":"A small 4 to 10% surplus. Enough to recover between demanding sessions, without noticeable weight gain.",
  "1,8 g par kilo, pour la réparation des tissus et des tendons mis à rude épreuve.":"1.8 g per kilo, to repair tissue and tendons that take a beating.",
  "3 à 6 répétitions, charges très lourdes, 3 à 4 minutes de repos entre les séries. Squat, développé couché, soulevé de terre et développé militaire.":"3 to 6 reps, very heavy loads, 3 to 4 minutes of rest between sets. Squat, bench press, deadlift and overhead press.",
  "Tu veux soulever plus lourd, sans forcément changer de silhouette.":"You want to lift heavier, without necessarily changing your shape.",
  "Les repos longs ne sont pas du temps perdu : c'est ce qui permet à la série suivante d'être aussi lourde que la précédente.":"Long rests aren't wasted time: they're what lets the next set be as heavy as the last.",
  "Entretien":"Maintain",
  "Garder la forme et tes acquis, sans viser de changement.":"Keep your fitness and what you've built, without aiming to change.",
  "Maintenir demande beaucoup moins que construire. Deux séances par semaine suffisent à conserver muscle et force pendant des mois — à condition de garder les mêmes charges : c'est le volume qui peut baisser, pas l'intensité.":"Maintaining takes far less than building. Two sessions a week will hold muscle and strength for months — as long as you keep the same loads: it's the volume that can drop, not the intensity.",
  "À ta maintenance. Ni surplus ni déficit, le poids reste stable.":"At your maintenance. No surplus, no deficit, your weight stays put.",
  "1,6 g par kilo, suffisant pour préserver l'existant.":"1.6 g per kilo, enough to hold on to what you have.",

  "Debout barre au-dessus de la tête, c'est le mouvement le plus exigeant pour l'épaule.":"Standing with a bar overhead is the most demanding movement there is for the shoulder.",
  "Garde les coudes à 45° du buste plutôt qu'écartés à 90°, et ne descends pas la barre trop bas.":"Keep your elbows at 45° from your torso rather than flared to 90°, and don't bring the bar down too low.",

/* Le français aux téléphones francophones, l'anglais à tous les autres.
   L'inverse enverrait du français à un téléphone allemand ou japonais, qui
   comprendra bien mieux l'anglais. On lit la langue du téléphone, pas le pays :
   une app sans serveur ne sait pas où elle a été téléchargée, et un anglophone
   installé en France veut son app en anglais. */
function langueSysteme(){
  try{
    const l = (navigator.languages && navigator.languages[0]) || navigator.language || "fr";
    return String(l).toLowerCase().indexOf("fr") === 0 ? "fr" : "en";
  }catch(e){ return "fr"; }
}
/* Tant que la traduction anglaise n'est pas terminée, "auto" reste en français :
   un téléphone anglais recevrait sinon une app à moitié traduite. On bascule ce
   drapeau à true le jour où le dictionnaire est complet. Le choix manuel
   « English » fonctionne dès maintenant, pour pouvoir avancer et vérifier. */
const EN_PRET = true;   /* traduction terminée le 1er septembre 2026 */

/* "auto" suit la langue du téléphone : c'est ce que la personne parle,
   alors que le pays dit seulement où elle se trouve. */
function langue(){
  /* try/catch : si TR() est appelé au chargement, avant la déclaration de db,
     on rend le français au lieu de tuer l'application. */
  let c;
  try{ c = db && db.settings && db.settings.lang; }catch(e){ return "fr"; }
  if(c === "fr" || c === "en") return c;
  return EN_PRET ? langueSysteme() : "fr";
}
function TR(x){
  if(langue() === "fr") return x;
  const d = TRAD.en;
  return (d && Object.prototype.hasOwnProperty.call(d, x)) ? d[x] : x;
}

/* --- unités : tout est STOCKÉ en kg et en cm, seul l'affichage change --- */
const PAR_LB = 2.2046226218;
function systemeUnites(){
  const c = db && db.settings && db.settings.units;
  if(c === "metrique" || c === "imperial") return c;
  return langue() === "en" ? "imperial" : "metrique";
}
function estImperial(){ return systemeUnites() === "imperial"; }
function uPoids(){ return estImperial() ? "lb" : "kg"; }
/* Les distances sont TOUJOURS stockées en kilomètres. Comme pour les poids,
   seul l'affichage change : miles en impérial. Ne jamais passer une distance
   à fmtKg(), qui la convertirait en livres. */
const PAR_MILE = 1.609344;
function uDist(){ return estImperial() ? "mi" : "km"; }
function affDist(km){
  const v = estImperial() ? Number(km) / PAR_MILE : Number(km);
  return (Math.round(v * 10) / 10).toLocaleString(loc());
}
const dist = km => affDist(km) + " " + uDist();
/* saisie -> kilomètres */
function versKm(v){
  const n = parseFloat(String(v).replace(",", "."));
  if(!isFinite(n)) return NaN;
  return estImperial() ? n * PAR_MILE : n;
}
/* vitesse : km/h ou mph */
function uVitesse(){ return estImperial() ? "mph" : "km/h"; }

/* dates, nombres, mois : tout doit suivre la langue, pas rester en français */
function loc(){ return langue() === "en" ? "en-US" : "fr-FR"; }

/* kg -> valeur affichée. Les charges vont de 1,25 en 1,25 kg, donc on garde
   une décimale utile plutôt que d'arrondir à l'entier. */
function affPoids(kg){
  if(kg === null || kg === undefined || kg === "") return "";
  return fmtKg(kg);
}
/* valeur saisie -> kg */
function versKg(v){
  const n = parseFloat(String(v).replace(",", "."));
  if(!isFinite(n)) return null;
  return estImperial() ? n / PAR_LB : n;
}
/* le pas des boutons +/- : 2,5 kg d'un côté, 5 lb de l'autre */
function pasPoids(){ return estImperial() ? 5 / PAR_LB : 2.5; }
/* Valeur pour un <input type="number"> : jamais de virgule, le navigateur
   la refuse. On convertit, on arrondit au dixième, et c'est tout. */
function saisiePoids(kg){
  if(kg === "" || kg === null || kg === undefined) return "";
  const v = estImperial() ? Number(kg) * PAR_LB : Number(kg);
  return String(Math.round(v * 10) / 10);
}
/* pas du champ : 0,5 kg ou 1 lb */
function stepPoids(){ return estImperial() ? 1 : 0.5; }

/* cm -> "5\'10\"" ou "178 cm" */
function affTaille(cm){
  if(!cm) return "";
  if(!estImperial()) return Math.round(cm) + " cm";
  const p = cm / 2.54;
  let pi = Math.floor(p / 12), po = Math.round(p - pi * 12);
  if(po === 12){ pi += 1; po = 0; }
  return pi + "'" + po + '"';
}

/* ce qu'il te manque pour cet exercice, en toutes lettres */
function manqueTexte(ex){
  const mien = db.materiel || [];
  const noms = materielDe(ex).filter(b=>Array.isArray(b) ? !b.some(x=>mien.includes(x)) : !mien.includes(b))
    .map(b=>{
      const ids = Array.isArray(b) ? b : [b];
      return ids.map(x=>TR(((MATERIELS.find(m=>m.id===x)||{}).nom || x)).toLowerCase()).join(" " + TR("ou") + " ");
    });
  return noms.length ? "il te manque : " + noms.join(", ") : "";
}
function nbExosDispo(mat){ return LIB.filter(e=>exoDispo(e, mat)).length; }
function materielDe(ex){
  if(!ex) return [];
  return MAT_EXOS[nomCanon(ex)] || MAT_PAR_EQUIP[equipCanon(ex)] || [];
}
/* l'exercice est-il réalisable avec ce que l'utilisateur possède ? */
function exoDispo(ex, dispo){
  const mien = dispo || db.materiel;
  if(!mien) return true;                       /* aucun filtre défini : tout est proposé */
  return materielDe(ex).every(besoin =>
    Array.isArray(besoin) ? besoin.some(x=>mien.includes(x)) : mien.includes(besoin));
}

/* exercices où la charge est ton propre corps : le champ kg sert au lest éventuel */
function estPoidsDuCorps(ex){ const e = equipCanon(ex); return !!ex && (e==="Poids du corps" || e==="Barre fixe"); }
function serieEchauffement(exId, reps){
  const ex = getEx(exId);
  const rng = parseReps(reps);
  const cible = rng ? rng.lo : 8;
  if(estPoidsDuCorps(ex)){
    /* impossible d'alléger : on fait moins de répétitions, pas plus */
    return {w:"", r:Math.max(3, Math.round(cible/2)), done:false, warm:true};
  }
  const last = lastPerf(exId);
  const w = last ? Math.max(0, Math.round(Math.max(...last.sets.map(s=>s.w||0))*0.5/2.5)*2.5) : "";
  return {w, r:Math.min(12, cible+4), done:false, warm:true};
}
/* Le nombre pré-rempli dans une case : le milieu de la fourchette, pas son plancher.
   Sur 8-12, viser 10 dit mieux l'intention que 8, qui est le minimum acceptable. */
function repsDepart(rng){ return rng ? Math.floor((rng.lo + rng.hi) / 2) : ""; }
/* Objectif d'un exercice ajouté à la volée : d'après son rôle (isolation ou non)
   et l'objectif du profil. Sans ça l'exercice n'avait aucune cible, donc aucune
   ligne « Objectif », et aucun conseil de charge pour la fois suivante. */
function cibleParDefaut(exId){
  const nom = getEx(exId).name;
  const roles = Object.keys(RESERVOIRS).filter(r => (RESERVOIRS[r] || []).includes(nom));
  const niveau = (roles.length && roles.every(r => ROLES_LEGERS.includes(r))) ? "leger" : "moyen";
  const dose = DOSES[(db.profile && db.profile.aim) || "masse"] || DOSES.masse;
  const d = dose[niveau];
  return {sets:d.s, reps:d.r, rest:d.p};
}
function altsFor(exId){
  const ex = getEx(exId);
  const names = ALTS[nomCanon(ex)] || [];
  const out = [];
  names.forEach(n=>{ const e = allEx().find(x=>x.name===n); if(e) out.push(e); });
  allEx().forEach(e=>{ if(e.muscle===ex.muscle && e.id!==exId && !out.some(o=>o.id===e.id)) out.push(e); });
  return out;
}

const NIVEAU_COULEUR = {3:"var(--bad)", 2:"#e8a33d", 1:"var(--good)"};
const NIVEAU_TEXTE = {3:"forte", 2:"moyenne", 1:"légère"};
function musclesHtml(exName, max){
  const list = MUSCLE_WORK[exName];
  if(!list) return "";
  return `<span class="mw">${list.slice(0, max||4).map(([m,n])=>
    `<span class="mw-item" title="${TR("Sollicitation")} ${TR(NIVEAU_TEXTE[n])}"><i style="background:${NIVEAU_COULEUR[n]};"></i>${esc(TR(m))}</span>`).join("")}</span>`;
}

/* fiche complète d'un exercice : anatomie, exécution, conseil */
function exoBodyHtml(exName, back){
  const cle = back? "back" : "front";
  const niveaux = {};
  (MUSCLE_WORK[exName]||[]).forEach(([m,n])=>{
    const g = groupeDe(m);
    if(g && (!niveaux[g] || n>niveaux[g])) niveaux[g] = n;
  });
  const masques = MASK_OK[cle].filter(m=>niveaux[m])
    .map(m=>masqueHtml(cle, m, {color:NIVEAU_COULEUR[niveaux[m]], op: niveaux[m]===3? 1 : (niveaux[m]===2? 0.75 : 0.5)})).join("");
  if(!masques) return "";
  return `<div class="mp-fig" style="max-width:88px;">
    <img class="mp-base" src="${MASK_DIR}${cle}-base.png" alt="${back?'dos':'face'}" onerror="figKo(this)">
    ${masques}
    <img class="mp-lignes" src="${MASK_DIR}${cle}-ligne.png" alt="" aria-hidden="true" onerror="figKo(this)">
    <div style="text-align:center; font-size:9px; font-weight:800; letter-spacing:.09em; color:var(--ink-mute); margin-top:4px;">${TR(back?"VUE DE DOS":"VUE DE FACE")}</div></div>`;
}

  const ex = getEx(exId);

  const note = injuryNote(nomCanon(ex));
  const muscles = MUSCLE_WORK[nomCanon(ex)] || [];
  const principaux = muscles.filter(([m,n])=>n===3);
  const assistes = muscles.filter(([m,n])=>n<3);
  /* on n'affiche que les vues où l'exercice a réellement des zones */
  const face = exoBodyHtml(nomCanon(ex),false), dos = exoBodyHtml(nomCanon(ex),true);
  openSheet(`
    <div class="exo-h">
      ${exIcon(ex)}
      <div class="grow"><h3>${esc(ex.name)}</h3>
        <div class="sous">${[ex.equip, ex.muscle].filter(Boolean).map(esc).join(" · ")}</div></div>
    </div>
    ${note? `<div class="exo-c" style="border:1.5px solid var(--bad);">
        <div class="exo-t" style="color:var(--bad);">⚠️ ${TR("{} sensible").replace("{}", esc(TR(note.injury)))}</div>
        <div class="exo-txt">${esc(TR(note.tip))}</div></div>`:""}
    ${info? `<div class="exo-c tip">
        <div class="exo-t">${TR("Astuce de Pro ✨")}</div>
        <div class="exo-txt">${esc(info.tip)}</div></div>`:""}
    ${info? `<div class="exo-c">
        <div class="exo-t">${TR("Comment l'exécuter")}</div>
        <div class="exo-etapes">${info.steps.map((t,i)=>
          `<div class="exo-etape"><span class="num">${String(i+1).padStart(2,"0")}</span><span>${esc(t)}</span></div>`).join("")}</div>
      </div>`
      : `<div class="exo-c"><div class="exo-txt">Pas encore de fiche d'exécution pour cet exercice.</div></div>`}
    ${muscles.length? `<div class="exo-c">
        <div class="exo-t">${TR("Muscles sollicités")}</div>
        <div class="exo-mus">
          ${(face||dos)? `<div class="exo-vues">${face}${dos}</div>`:""}
          <div class="exo-leg grow">
            ${principaux.length? `<div class="rol" style="color:var(--bad);"><i style="background:var(--bad);"></i>${TR("PRINCIPAL")}</div>
              <div class="nom">${principaux.map(([m])=>esc(TR(m))).join("<br>")}</div>`:""}
            ${assistes.length? `<div class="rol"><i style="background:var(--ink-mute);"></i>${TR("ASSISTÉS")}</div>
              <div class="aide">${assistes.map(([m,n])=>
                `${esc(TR(m))} <span style="color:${NIVEAU_COULEUR[n]};">●</span>`).join("<br>")}</div>`:""}
          </div>
        </div>
      </div>`:""}
    <div class="exo-c">
      <div class="exo-t">${TR("Mon matériel")}</div>
      ${blocChargeFixe(ex.id, "ei-plafond")}
    </div>
    <button class="btn btn-accent" id="ei-ok" style="width:100%; margin-top:4px;">${TR("Fermer")}</button>`);
  document.getElementById("ei-plafond").onchange = e=>{
    reglerChargeFixe(ex.id, e.target.checked);
    toast(e.target.checked ? "Charge fixe : progression en répétitions ✓" : "Charge libre ✓");
  };
  document.getElementById("ei-ok").onclick = closeSheet;
}

function injuryNote(exName){
  const list = (db.profile && db.profile.injuries) || [];
  for(const id of list){
    const rule = INJURY_RULES[id] && INJURY_RULES[id][exName];
    if(rule){
      const lab = (INJURIES.find(x=>x.id===id)||{}).label || id;
      return {injury:lab, tip:rule.tip, alts:rule.alts};
    }
  }
  return null;
}

/* IMC et seuils de sécurité : on refuse d'accompagner un objectif dangereux */

function alerteObjectif(p){

  if(!(kg>0) || !(cm>0) || !(cible>0)) return null;
  const perte = kg - cible;
  const imcCible = imc(cible, cm), imcActuel = imc(kg, cm);
  const mini = poidsMiniSain(cm);
  if(imcCible < 17){
    return {niveau:"danger", titre:TR("Cet objectif est dangereux pour ta santé"),
      txt:`À ${pds(cible)} pour ${cm} cm, ton IMC serait de ${imcCible.toFixed(1)} — c'est le seuil de la dénutrition. En dessous de <b>${pds(mini)}</b> (IMC 18,5), le corps puise dans le muscle, les os et les hormones. Je ne peux pas te construire un plan pour y aller. Si ce poids te semble nécessaire, parles-en à un médecin ou à un diététicien.`};
  }
  if(imcCible < 18.5){
    return {niveau:"danger", titre:TR("Objectif sous le poids de santé"),
      txt:`À ${pds(cible)}, ton IMC tomberait à ${imcCible.toFixed(1)}, sous le seuil de 18,5 considéré comme le minimum sain pour ${cm} cm. Le plancher raisonnable est <b>${pds(mini)}</b>. Choisis un objectif au-dessus, ou consulte un professionnel de santé avant d'aller plus bas.`};
  }
  if(perte > 0 && perte/kg > 0.20){
    return {niveau:"prudence", titre:TR("C'est beaucoup d'un coup"),
      txt:`${pds(perte)} à perdre, soit ${Math.round(perte/kg*100)} % de ton poids. Une perte de ce genre se conduit par paliers : vise d'abord <b>${pds(Math.round((kg-kg*0.1)*10)/10)}</b> (−10 %), tiens-le un mois, puis on réévalue. Aller plus vite coûte du muscle et se reprend presque toujours.`};
  }

  if(prise > 0.5 && imcCible >= 35){
    return {niveau:"danger", titre:TR("Cet objectif met ta santé en jeu"),
      txt:TR("À {p} pour {cm} cm, ton IMC serait de {imc} — le seuil de l'obésité sévère. Au-delà de 35, le risque de diabète de type 2, d'hypertension, d'apnée du sommeil et de problèmes articulaires augmente nettement, et prendre autant de poids volontairement n'apporte aucun bénéfice musculaire. Je ne peux pas te construire un plan pour y aller. Vise plus bas, et si cette prise de poids est prescrite, parles-en à un médecin ou à un diététicien.")
        .replace("{p}", pds(cible)).replace("{cm}", cm).replace("{imc}", imcCible.toFixed(1))};
  }
  if(prise > 0.5 && imcCible >= 30){
    return {niveau:"prudence", titre:TR("Prise de poids à surveiller"),
      txt:TR("À {p}, ton IMC serait de {imc}, dans la zone d'obésité. En prise de masse, une bonne partie du gain part en gras au-delà d'un certain point : vise plutôt <b>{cible}</b> dans un premier temps, tiens-le, puis on réévalue. Fais surveiller ta tension et ta glycémie si tu montes durablement.")
        .replace("{p}", pds(cible)).replace("{imc}", imcCible.toFixed(1))
        .replace("{cible}", pds(Math.round(24.9*Math.pow(cm/100,2)*10)/10))};
  }
  if(prise > 0.5 && prise/kg > 0.25){
    return {niveau:"prudence", titre:TR("C'est beaucoup d'un coup"),
      txt:`${pds(prise)} à prendre, soit ${Math.round(prise/kg*100)} % de ton poids. Le muscle se construit à 0,25 kg par semaine au mieux : au-delà, tout le surplus part en gras. Vise d'abord <b>${pds(Math.round((kg+kg*0.1)*10)/10)}</b> (+10 %), puis on refait le point.`};

/* construit au chargement : pas de TR() ici, on traduit à l'affichage */
const PACES = [["progressif","Progressif"],["modere","Modéré"],["rapide","Rapide"]];
/* surplus / déficit en % de la dépense estimée : s'adapte à la corpulence de chacun */
const PACE_PCT = {
  masse:     {progressif:0.08,  modere:0.12,  rapide:0.16},
  seche:     {progressif:-0.12, modere:-0.18, rapide:-0.24},
  recomp:    {progressif:0,     modere:0,     rapide:0},
  force:     {progressif:0.04,  modere:0.07,  rapide:0.10},
  entretien: {progressif:0,     modere:0,     rapide:0}
};
const PACE_RATE = {masse:1, seche:1, force:1};   /* objectifs où un rythme se calcule */
function aimOf(id){ return AIMS.find(a=>a.id===id) || AIMS[0]; }
/* Recalage : compare ce que tu as réellement mangé avec l'évolution réelle du poids.
   7 700 kcal ≈ 1 kg. Si le poids ne bouge pas, ta dépense = ce que tu manges. */
function tdeeMesure(){
  const jours = Object.keys(db.habitSel||{}).filter(k=>dayKcal(k) > 800).sort();
  if(jours.length < 10) return null;                       /* pas assez de jours renseignés */
  const debut = jours[0], fin = jours[jours.length-1];
  const nJours = Math.round((new Date(fin) - new Date(debut))/864e5) + 1;
  if(nJours < 14) return null;                             /* il faut au moins deux semaines */
  if(jours.length < nJours*0.6) return null;               /* trop de trous dans le suivi */
  const moyKcal = jours.reduce((a,k)=>a+dayKcal(k),0)/jours.length;
  const pesees = (db.weights||[]).map(w=>({t:new Date(w.date), kg:w.kg}))
                   .filter(w=>w.t >= new Date(debut) && w.t <= new Date(fin+"T23:59:59"))
                   .sort((a,b)=>a.t-b.t);
  if(pesees.length < 2) return null;
  const dKg = pesees[pesees.length-1].kg - pesees[0].kg;
  const dJours = Math.max(7, (pesees[pesees.length-1].t - pesees[0].t)/864e5);
  const tdee = moyKcal - (dKg*7700)/dJours;
  if(!(tdee > 1200) || tdee > 6000) return null;
  return {tdee:Math.round(tdee), jours:jours.length, moyKcal:Math.round(moyKcal), dKg:Math.round(dKg*10)/10, dJours:Math.round(dJours)};
}
function planFor(p){
  if(!p || !(p.weight>0) || !(p.height>0) || !(p.age>0) || !(p.goalWeight>0)) return null;
  const bmr = 10*p.weight + 6.25*p.height - 5*p.age
            + (p.sex==="f" ? -161 : (p.sex==="n" ? -78 : 5));   /* "n" : moyenne des deux */
  let tdee = bmr * (ACTIVITY[p.days]||1.55) * (METAB_ADJ[p.metab]||1);
  /* correction manuelle (réglages) puis mesure réelle : le vécu prime sur la formule */
  const mesure = (typeof tdeeMesure === "function") ? tdeeMesure() : null;
  let tdeeSource = "formule";
  if(p.tdeeManuel > 0){ tdee = p.tdeeManuel; tdeeSource = "manuel"; }
  else if(mesure){ tdee = mesure.tdee; tdeeSource = "mesure"; }
  const diff = p.goalWeight - p.weight;
  const aimId = p.aim || (diff > 1 ? "masse" : (diff < -1 ? "seche" : "recomp"));
  const aim = aimOf(aimId);
  const pace = p.pace || "modere";
  let delta = tdee * (((PACE_PCT[aim.id]||{})[pace]) || 0);
  /* garde-fous : jamais plus de 20 % de surplus ni 25 % de déficit, jamais sous 1,2 × le métabolisme de base */
  delta = Math.max(-tdee*0.25, Math.min(tdee*0.20, delta));
  const kcal = Math.max(tdee + delta, bmr*1.2);
  const deltaReel = kcal - tdee;
  const plafonne = (kcal > tdee + delta + 1);   /* le plancher de sécurité a joué */
  const perKg = p.protPerKg || aim.prot;
  const prot = p.weight * perKg;
  /* rythme déduit de l'écart calorique : ~6500 kcal par kilo pris, ~7700 par kilo perdu */
  const rate = PACE_RATE[aim.id] ? Math.abs(deltaReel)*7/(deltaReel>0 ? 6500 : 7700) : 0;
  const rateAff = Math.round(rate*20)/20;
  const semaines = (rate>0.02 && Math.abs(diff)>=1) ? Math.max(2, Math.round(Math.abs(diff)/rate)) : null;
  const rythme = rate>0.02 ? `${deltaReel<0?"−":"+"}${pds(rateAff)} ${TR("par semaine")}` : "poids stable";
  /* fourchette : ±5 %, la vraie précision de ces formules. Le plancher est l'objectif à viser,
     le plafond la limite au-delà de laquelle on prend surtout du gras (ou on casse le déficit). */
  const kcalMin = Math.round(kcal*0.95/10)*10;
  const kcalMax = Math.round(kcal*1.05/10)*10;
  return {
    bmr: Math.round(bmr), tdee: Math.round(tdee), tdeeSource, mesure,
    kcal: Math.round(kcal/10)*10, kcalMin, kcalMax, prot: Math.round(prot), perKg,
    aim: aim.id, aimLabel: aim.label, pace, rythme, semaines,
    diff: Math.round(diff*10)/10, delta: Math.round(deltaReel), plafonne,
    program: aim.prog, seances: Math.min(5, Math.max(2, p.days))
  };
}

  if(pl.aim==="seche"){
    const vite = pl.pace==="rapide";
    return TR("Pour descendre à {p}{delai}, vise <b>{kcal} kcal</b> et <b>{prot} g de protéines</b> par jour, soit {perKg} g par kilo — les protéines sont ta protection contre la fonte musculaire.")
        .replace("{p}", pds(cible))
        .replace("{delai}", pl.semaines ? TR(" d'ici environ {} semaines").replace("{}", pl.semaines) : "")
        .replace("{kcal}", pl.kcal).replace("{prot}", pl.prot).replace("{perKg}", perKg)
      + (vite ? TR(" Ce rythme est agressif : si tu perds de la force sur tes séances, ralentis.") : "");
  }
  if(pl.aim==="recomp"){
    return `Mange à ta maintenance, <b>${pl.kcal} kcal</b> par jour, avec <b>${pl.prot} g de protéines</b> (${perKg} g par kilo). Le poids bougera peu : juge tes progrès à la glace et aux charges soulevées, pas à la balance.`;
  }
  if(pl.aim==="force"){
    return `Vise <b>${pl.kcal} kcal</b> et <b>${pl.prot} g de protéines</b> par jour (${perKg} g par kilo). Un léger surplus soutient la récupération nerveuse et articulaire, indispensable quand on pousse lourd.`;
  }
  return `Mange à ta maintenance, <b>${pl.kcal} kcal</b> par jour, avec <b>${pl.prot} g de protéines</b> (${perKg} g par kilo) pour conserver ta masse musculaire.`;
}
function proteinTarget(){
  const pl = planFor(db.profile);
  if(pl) return pl.prot;
  return Math.round((currentWeight()||74)*1.9);
}
/* ================= PARCOURS D'ACCUEIL =================
   Plein écran, une question par étape. Rejoué par « Modifier mon profil » :
   dans ce cas une croix permet de sortir sans rien changer. */
let onbEl = null, onbTour = null;
function fermerOnb(){
  if(onbTour){ clearTimeout(onbTour); onbTour = null; }   /* sinon elle continue d'écrire dans la page suivante */
  if(onbEl){ onbEl.remove(); onbEl = null; }
  document.documentElement.removeAttribute("data-onb");
  appliquerTheme();
}
/* petit clic de roulette, sans fichier son */
let onbAudio = null;
function clicRoue(){
  try{
    if(navigator.vibrate) navigator.vibrate(3);
    onbAudio = onbAudio || new (window.AudioContext||window.webkitAudioContext)();
    if(onbAudio.state === "suspended") onbAudio.resume();
    const o = onbAudio.createOscillator(), g = onbAudio.createGain();
    o.frequency.value = 1700; g.gain.value = 0.012;
    o.connect(g); g.connect(onbAudio.destination); o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, onbAudio.currentTime + 0.03);
    o.stop(onbAudio.currentTime + 0.04);
  }catch(e){}
}
const LBS = PAR_LB, POUCE = 0.393701;   /* LBS : ancien nom, même valeur */

function openOnboarding(first, brouillon, depart){
  const base = brouillon || db.profile || {};
  /* profil déjà rempli une première fois : on peut ressortir sans rien casser */
  const dejaRempli = !!(base.weight > 0 && base.height > 0 && base.age > 0);
  const d = {
    name: base.name || db.settings.name || "",
    sex: base.sex || "h",
    age: base.age || 30,
    height: base.height || 172,
    weight: base.weight || currentWeight() || 72,
    goalWeight: base.goalWeight || (db.settings.goal > 0 ? db.settings.goal : 0),
    aim: base.aim || "masse",
    pace: base.pace || "modere",
    protPerKg: base.protPerKg || null,
    metab: base.metab || "normal",
    days: base.days || 4,
    injuries: (base.injuries || []).slice(),
    tdeeManuel: base.tdeeManuel || 0,
    lieu: base.lieu || (db.materiel === null ? "salle" : "maison"),
    materiel: (db.materiel || []).slice()
  };
  /* Les roulettes suivent le réglage global : l'impérial est un système,
     pas un choix champ par champ. Basculer la taille bascule aussi le poids. */
  const majUnites = v => { db.settings.units = v; save(); };
  const demiTour = v => Math.round(v*2)/2;

  /* Le carrousel est toujours la page 0, mais on ne l'impose qu'au premier lancement :
     ensuite il reste atteignable d'un retour depuis la première question. */
  const ETAPES = ["intro"]
    .concat(["nom","sexe","objectif","corps","age","cible","lieu","frequence","projection","fin"]);
  let i = Math.min(depart != null ? depart : (dejaRempli ? 1 : 0), ETAPES.length - 1);

  fermerOnb();
  document.querySelectorAll(".onb").forEach(el=>el.remove());   /* aucun parcours oublié en dessous */
  onbEl = document.createElement("div");
  onbEl.className = "onb";
  document.body.appendChild(onbEl);
  document.documentElement.setAttribute("data-onb", "1");
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute("content", "#EBE8E1");

  const quitter = ()=>{
    if(!dejaRempli) return;
    askConfirm(TR("Quitter sans enregistrer ?"),
      TR("Les réponses de ce parcours seront perdues. Ton profil actuel, lui, est conservé."),
      TR("Quitter"), true, ()=>{ fermerOnb(); render(); });
  };

  function enregistrer(){
    db.profile = {
      name: d.name || TR("Champion"), sex: d.sex, age: d.age, height: d.height,
      weight: d.weight, goalWeight: d.goalWeight || d.weight, aim: d.aim, pace: d.pace,
      protPerKg: d.protPerKg || aimOf(d.aim).prot, metab: d.metab, days: d.days,
      injuries: d.injuries, tdeeManuel: d.tdeeManuel, lieu: d.lieu, avance: true
    };
    /* en salle : aucun filtre. Chez soi : on ne propose que ce qu'il possède. */
    db.materiel = d.lieu === "salle" ? null : d.materiel.slice();
    db.settings.name = db.profile.name;
    db.settings.goal = db.profile.goalWeight;
    const today = dayKey();
    db.weights = db.weights.filter(w => dayKey(w.date) !== today);
    db.weights.push({date:new Date().toISOString(), kg:d.weight});
    coachGoal = null;
    save();
    fermerOnb(); render(); showPlan(true);
  }

  function dessiner(){
    /* on quitte le carrousel : sa minuterie ne doit pas survivre à l'écran suivant */
    if(onbTour){ clearTimeout(onbTour); onbTour = null; }
    onbEl.style.height = "";
    const etape = ETAPES[i];
    const intro = etape === "intro";
    /* sur les deux dernières pages, pas de croix : on part avec un plan ou on choisit « non merci » */
    const derniere = etape === "fin" || etape === "affiner";
    /* la barre ne compte que les questions : le carrousel est à zéro */
    const avancement = Math.round(i / (ETAPES.length - 1) * 100);
    onbEl.innerHTML = `
      ${(intro && !dejaRempli) ? "" : `<div class="onb-top">
        ${i > 0 ? `<button class="onb-back" id="onb-back" aria-label="${TR("Retour")}">‹</button>`
                : `<span style="width:30px; flex:0 0 auto;"></span>`}
        <div class="onb-prog"><i style="width:${avancement}%"></i></div>
        ${(dejaRempli && !derniere) ? `<button class="onb-x" id="onb-x" aria-label="${TR("Quitter")}">✕</button>`
                     : `<span style="width:30px; flex:0 0 auto;"></span>`}
      </div>`}
      <div class="onb-body${intro ? " intro" : ""}" id="onb-body"></div>
      <div class="onb-foot" id="onb-foot"></div>`;
    const corps = onbEl.querySelector("#onb-body"), pied = onbEl.querySelector("#onb-foot");
    const retour = onbEl.querySelector("#onb-back");
    if(retour) retour.onclick = ()=>{ if(i > 0){ i--; dessiner(); } };
    const croix = onbEl.querySelector("#onb-x");
    if(croix) croix.onclick = quitter;

    const suivant = (label, action)=>{
      pied.innerHTML = `<button class="onb-btn" id="onb-next">${label || TR("Suivant")}</button>`;
      onbEl.querySelector("#onb-next").onclick = action || (()=>{ i++; dessiner(); });
    };
    /* liste de choix : apparition bouton par bouton */
    const choix = (items, actif, desc, anime)=>
      `<div class="onb-choix">${items.map(([v,l],n)=>
        `<button class="ch ${actif===v?"on":""} ${anime?"":"fixe"}" data-ch="${v}" ${anime?`style="animation-delay:${n*55}ms"`:""}>${l}</button>` +
        (actif===v && desc && desc(v) ? `<div class="onb-desc">${desc(v)}</div>` : "")).join("")}</div>`;
    const brancher = fn => corps.querySelectorAll("[data-ch]").forEach(b=>b.onclick=()=>{ clicRoue(); fn(b.dataset.ch); });

    /* -------------------------------------------------------- 1. carrousel */
    if(etape === "intro"){
      const vues = [
        {v:"img/demo-seances.mp4",    titre:TR("Des séances sur mesure,<br>prêtes à démarrer")},
        {v:"img/demo-nutrition.mp4",  titre:TR("Suis ton alimentation<br>en quelques clics")},
        {v:"img/demo-charge.mp4",     titre:TR("Adapte la charge<br>à tes capacités")},
        {v:"img/demo-progression.mp4",titre:TR("Suis ta progression<br>et tes points faibles")}
      ];
      corps.innerHTML = `<div class="onb-hero">
        <div class="onb-tel">${vues.map((x,n)=>
          `<video src="${x.v}" class="${n===0?"on":""}" muted playsinline webkit-playsinline autoplay loop
            preload="auto" poster="img/tel1.png" aria-hidden="true"></video>`).join("")}</div>
        <div class="onb-titre" id="onb-titre">${vues[0].titre}</div>
        <div class="onb-dots">${vues.map((x,n)=>`<i class="${n===0?"on":""}"></i>`).join("")}</div>
      </div>`;
      /* Seule la vue affichée tourne. iOS n'accepte la lecture automatique que si
         « muet » est posé en propriété, pas seulement en attribut ; et si la lecture
         est refusée, on force au moins l'affichage de la première image. */
      const films = [...corps.querySelectorAll(".onb-tel video")];
      films.forEach(f=>{
        f.muted = true; f.defaultMuted = true; f.playsInline = true;
        f.addEventListener("loadeddata", ()=>{ if(f.paused) try{ f.currentTime = 0.05; }catch(e){} });
      });
      const jouer = k => films.forEach((f,j)=>{
        if(j !== k){ f.pause(); return; }
        f.muted = true;
        try{ f.currentTime = 0; }catch(e){}
        const pr = f.play();
        if(pr && pr.catch) pr.catch(()=>{ try{ f.currentTime = 0.05; }catch(e){} });
      });
      jouer(0);
      /* Une seule fonction décide de tout ce qui change ensemble : la vidéo, le point
         et le titre. Ils ne peuvent plus se désaccorder. */
      let n = 0;
      const maPage = onbEl;                    /* on ne pilote que SA page, jamais la suivante */
      const montrer = k=>{
        n = k;
        maPage.querySelectorAll(".onb-tel video").forEach((f,j)=>f.classList.toggle("on", j===k));
        jouer(k);
        maPage.querySelectorAll(".onb-dots i").forEach((pt,j)=>pt.classList.toggle("on", j===k));
        const t = maPage.querySelector("#onb-titre");
        if(t) t.innerHTML = vues[k].titre;     /* un seul titre à l'écran, à tout instant */
      };
      /* Chaîne de délais plutôt qu'un intervalle : quand le téléphone met la page en
         veille, un intervalle rattrape ses tours en retard d'un coup et le titre saute
         plusieurs vues. Ici le tour suivant n'est programmé qu'une fois le précédent joué. */
      const suite = ()=>{
        onbTour = null;
        if(!maPage.isConnected) return;
        montrer((n+1) % vues.length);
        onbTour = setTimeout(suite, 5000);
      };
      if(onbTour) clearTimeout(onbTour);
      onbTour = setTimeout(suite, 5000);
      const stop = ()=>{ if(onbTour){ clearTimeout(onbTour); onbTour = null; } };
      pied.innerHTML = `<button class="onb-btn" id="onb-next">${dejaRempli ? TR("Continuer") : TR("Commencer")}</button>
        <button class="onb-lien" id="onb-tard">${dejaRempli
          ? TR("Plus tard, <b>retourner à l'app</b>")
          : TR("Plus tard, <b>je veux d'abord regarder</b>")}</button>`;
      onbEl.querySelector("#onb-next").onclick = ()=>{ stop(); i++; dessiner(); };
      const tard = onbEl.querySelector("#onb-tard");
      if(tard) tard.onclick = ()=>{
        stop();
        /* premier lancement : on note le refus. Profil déjà rempli : on ne touche à rien. */
        if(!dejaRempli){ db.profile = {skipped:true}; save(); }
        fermerOnb(); render();
      };
      return;
    }

    /* -------------------------------------------------------- 2. prénom */
    if(etape === "nom"){
      corps.innerHTML = `<h2>${TR("Comment veux-tu<br>qu'on t'appelle ?")}</h2>
        <div class="sous">${TR("Ton prénom sert seulement à personnaliser l'app. Il ne quitte jamais ton téléphone.")}</div>
        <input class="onb-nom" id="onb-nom" placeholder="${TR("Ton prénom")}" maxlength="20"
          value="${esc(d.name)}" autocomplete="given-name" enterkeyhint="next">`;
      const valider = ()=>{ d.name = onbEl.querySelector("#onb-nom").value.trim(); i++; dessiner(); };
      suivant(TR("Suivant"), valider);
      const inp = onbEl.querySelector("#onb-nom");
      setTimeout(()=>inp.focus(), 250);
      inp.onkeydown = e=>{ if(e.key === "Enter"){ e.preventDefault(); valider(); } };
      return;
    }

    /* -------------------------------------------------------- 3. sexe */
    if(etape === "sexe"){
      const dess = anime=>{
        corps.innerHTML = `<h2>${TR("Tu es…")}</h2>
          <div class="sous">${TR("La dépense au repos n'est pas la même. Sans cette information, l'estimation calorique se trompe d'environ 150 kcal par jour.")}</div>
          ${choix([["h",TR("Un homme")],["f",TR("Une femme")],["n",TR("Je préfère ne pas répondre")]], d.sex,
            v => v==="n" ? TR("On prendra une valeur intermédiaire entre les deux.") : "", anime)}`;
        brancher(v=>{ d.sex = v; dess(false); });
      };
      dess(true); suivant();
      return;
    }

    /* -------------------------------------------------------- 4. objectif */
    if(etape === "objectif"){
      const dess = anime=>{
        corps.innerHTML = `<h2>${TR("Quel est ton objectif ?")}</h2>
          <div class="sous">${TR("Il détermine tes calories, tes protéines et la forme de tes séances.")}</div>
          ${choix(AIMS.map(a=>[a.id, esc(TR(a.label))]), d.aim, v=>esc(TR(aimOf(v).desc)), anime)}
          <button class="onb-lien" id="onb-info" style="margin-top:14px;">ⓘ <b>${TR("Tout savoir sur cet objectif")}</b></button>`;
        brancher(v=>{
          const ancienne = aimOf(d.aim).prot;
          d.aim = v;
          if(d.protPerKg && Math.abs(d.protPerKg - ancienne) < 0.05) d.protPerKg = null;
          dess(false);
        });
        corps.querySelector("#onb-info").onclick = ()=>openAimInfo(d.aim, ()=>{});
      };
      dess(true); suivant();
      return;
    }

    /* -------------------------------------------------------- 5. taille et poids */
    if(etape === "corps"){
      corps.innerHTML = `<h2>${TR("Ta taille et ton poids")}</h2>
        <div class="sous">${TR("Pour calculer ta dépense réelle et calibrer tes charges de départ.")}</div>
        <div class="onb-rou">
          <div class="rou">
            <div class="rou-t">${TR("Taille")}</div>
            <div class="rou-box"><div class="rou-band"></div><div class="rou-scroll" id="rou-h"></div></div>
            <div class="rou-unite">
              <button data-uh="cm" class="${!estImperial()?"on":""}">cm</button>
              <button data-uh="in" class="${estImperial()?"on":""}">in</button>
            </div>
          </div>
          <div class="rou">
            <div class="rou-t">${TR("Poids")}</div>
            <div class="rou-box"><div class="rou-band"></div><div class="rou-scroll" id="rou-w"></div></div>
            <div class="rou-unite">
              <button data-uw="kg" class="${!estImperial()?"on":""}">kg</button>
              <button data-uw="lbs" class="${estImperial()?"on":""}">lb</button>
            </div>
          </div>
        </div>`;
      const cm = !estImperial(), kg = !estImperial();
      roulette(corps.querySelector("#rou-h"),
        cm ? 120 : Math.round(120*POUCE), cm ? 230 : Math.round(230*POUCE),
        cm ? Math.round(d.height) : Math.round(d.height*POUCE), cm ? " cm" : " in",
        v => { d.height = cm ? v : Math.round(v/POUCE); });
      roulette(corps.querySelector("#rou-w"),
        kg ? 30 : Math.round(30*LBS), kg ? 300 : Math.round(300*LBS),
        kg ? Math.round(d.weight) : Math.round(d.weight*LBS), kg ? " kg" : " lb",
        v => { d.weight = kg ? v : Math.round(v/LBS*10)/10; });
      corps.querySelectorAll("[data-uh]").forEach(b=>b.onclick=()=>{ majUnites(b.dataset.uh==="in" ? "imperial" : "metrique"); dessiner(); });
      corps.querySelectorAll("[data-uw]").forEach(b=>b.onclick=()=>{ majUnites(b.dataset.uw==="lbs" ? "imperial" : "metrique"); dessiner(); });
      suivant(TR("Suivant"), ()=>{
        const err = verifieProfil(d, ["height","weight"]);
        if(err){ toast(err); return; }
        if(!(d.goalWeight > 0)) d.goalWeight = d.weight;
        i++; dessiner();
      });
      return;
    }

    /* -------------------------------------------------------- 6. âge */
    if(etape === "age"){
      corps.innerHTML = `<h2>${TR("Quel âge as-tu ?")}</h2>
        <div class="sous">${TR("Le métabolisme baisse d'environ 2 % par décennie : c'est ce qui garde l'estimation juste dans la durée.")}</div>
        <div class="onb-rou"><div class="rou" style="max-width:210px;">
          <div class="rou-t">${TR("Années")}</div>
          <div class="rou-box"><div class="rou-band"></div><div class="rou-scroll" id="rou-a"></div></div>
        </div></div>`;
      roulette(corps.querySelector("#rou-a"), 14, 100, Math.round(d.age), "", v => { d.age = v; });
      suivant(TR("Suivant"), ()=>{
        const err = verifieChamp("age", d.age);
        if(err){ toast(err); return; }
        i++; dessiner();
      });
      return;
    }

    /* -------------------------------------------------------- 7. poids cible */
    if(etape === "cible"){
      d.goalWeight = demiTour(d.goalWeight > 0 ? d.goalWeight : d.weight);
      corps.innerHTML = `<h2>${TR("Quel poids vises-tu ?")}</h2>
        <div class="sous">${TR("Rien n'est figé : tu pourras le changer quand tu veux.")}</div>
        <div class="regle">
          <div class="regle-lab" id="reg-lab"></div>
          <div class="regle-val" id="reg-val"></div>
          <div class="regle-box"><div class="regle-aig"></div><div class="regle-scroll" id="reg"></div></div>
        </div>
        <div id="reg-alerte" style="margin-top:18px;"></div>`;
      const scroll = corps.querySelector("#reg");
      let html = "";
      for(let k = 60; k <= 400; k++){                  /* de 30 à 200 kg, par pas de 500 g */
        const v = k/2, maj = k % 10 === 0;
        html += `<div class="regle-t${maj?" maj":""}" data-v="${v}"><i style="height:${maj?34:19}px"></i></div>`;
      }
      scroll.innerHTML = `<div class="regle-vide"></div>${html}<div class="regle-vide"></div>`;
      const ticks = [...scroll.querySelectorAll(".regle-t")];
      const majAff = ()=>{
        const diff = Math.round((d.goalWeight - d.weight)*10)/10;
        corps.querySelector("#reg-lab").textContent =
          Math.abs(diff) < 0.4 ? TR("Maintenir mon poids")
                               : (diff > 0 ? `Prendre ${pds(diff)}` : `Perdre ${pds(-diff)}`);
        corps.querySelector("#reg-val").textContent = pds(d.goalWeight);
        const a = alerteObjectif(d), w = aimWarning(d.aim, d.weight, d.goalWeight);
        const rouge = a && a.niveau === "danger";
        corps.querySelector("#reg-alerte").innerHTML = a
          ? `<div class="inj-note" style="margin:0; border-color:${rouge?"var(--bad)":"var(--accent)"};">
               <b style="color:${rouge?"var(--bad)":"var(--accent)"};">${rouge?"⛔":"⚠️"} ${esc(a.titre)}</b><br>${a.txt}</div>`
          : (w ? `<div class="inj-note" style="margin:0;">⚠️ ${w}</div>` : "");
      };
      let pose = false;
      /* les graduations suivent un arc de cercle : la règle se lit comme le cadran d'une balance */
      const R = 620;
      const courber = (mid, centre0, large)=>{
        const demi = Math.ceil(scroll.clientWidth/large/2) + 4;
        const idx = Math.round((mid - centre0)/large);
        for(let n = idx - demi; n <= idx + demi; n++){
          const t = ticks[n];
          if(!t) continue;
          const dx = centre0 + n*large - mid;
          if(Math.abs(dx) >= R){ t.style.transform = ""; continue; }
          const bas = R - Math.sqrt(R*R - dx*dx);
          t.style.transform = `translateY(${bas.toFixed(1)}px) rotate(${(Math.asin(dx/R)*180/Math.PI).toFixed(2)}deg)`;
        }
      };
      const auScroll = ()=>{
        if(ticks.length < 2 || !scroll.isConnected || !scroll.clientWidth) return;
        const t0 = ticks[0], large = (ticks[1].offsetLeft - t0.offsetLeft) || 10;
        const centre0 = t0.offsetLeft + t0.offsetWidth/2;
        const mid = scroll.scrollLeft + scroll.clientWidth/2;
        courber(mid, centre0, large);
        const idx = Math.max(0, Math.min(ticks.length-1, Math.round((mid - centre0)/large)));
        const v = parseFloat(ticks[idx].dataset.v);
        if(v !== d.goalWeight){ d.goalWeight = v; if(pose) clicRoue(); majAff(); }
      };
      scroll.addEventListener("scroll", ()=>requestAnimationFrame(auScroll), {passive:true});
      requestAnimationFrame(()=>{
        if(!scroll.isConnected) return;
        const cible = ticks.find(t => parseFloat(t.dataset.v) === d.goalWeight) || ticks[0];
        scroll.scrollLeft = cible.offsetLeft + cible.offsetWidth/2 - scroll.clientWidth/2;
        auScroll();
        majAff();
        setTimeout(()=>{ pose = true; }, 300);
      });
      suivant(TR("Suivant"), ()=>{
        const a = alerteObjectif(d);
        if(a && a.niveau === "danger"){ toast(TR("Choisis un objectif au-dessus du poids de santé")); return; }
        i++; dessiner();
      });
      return;
    }

    /* -------------------------------------------------------- 7 bis. où t'entraînes-tu */
    if(etape === "lieu"){
      const dess = anime=>{
        corps.innerHTML = `<h2>${TR("Où t'entraînes-tu ?")}</h2>
          <div class="sous">${TR("Tes séances ne seront construites qu'avec des exercices que tu peux réellement faire.")}</div>
          ${choix([["salle",TR("En salle de sport")],["maison",TR("Chez moi")]], d.lieu,
            v => v === "salle" ? TR("On considère que tu as accès à tout le matériel habituel.")
                               : TR("On te demandera juste après ce dont tu disposes."), anime)}`;
        brancher(v=>{ d.lieu = v; dess(false); });
      };
      dess(true);
      suivant(TR("Suivant"), ()=>{
        const j = ETAPES.indexOf("materiel");
        if(d.lieu === "salle"){

    /* -------------------------------------------------------- 10. les deux portes */

/* trois doses de protéines autour de la valeur conseillée pour l'objectif */
function fourchetteProt(reco){
  const r = v => Math.round(Math.min(2.6, Math.max(1.2, v))*10)/10;
  return [[r(reco-0.3), "le minimum utile"], [r(reco), "conseillé"], [r(reco+0.3), "confortable"]];
}
/* mois approximatif dans N jours */
function dateDans(jours){
  return new Date(Date.now() + jours*864e5).toLocaleDateString(loc(), {month:"long", year:"numeric"});
}
/* roulette verticale : une valeur par ligne, celle du centre est retenue */
function roulette(box, min, max, valeur, unite, onChange){
  const H = 40;
  let html = `<div class="rou-vide"></div>`;
  for(let v = min; v <= max; v++) html += `<div class="rou-i" data-v="${v}">${v}${unite}</div>`;
  html += `<div class="rou-vide"></div>`;
  box.innerHTML = html;
  const items = [...box.querySelectorAll(".rou-i")];
  let courant = valeur, pose = false;
  const maj = ()=>{
    /* écran déjà remplacé, ou pas encore mesurable : on ne renvoie surtout pas une valeur fausse */
    if(!box.isConnected || !box.clientHeight) return;
    const mid = box.scrollTop + box.clientHeight/2;
    let best = null, bestD = 1e9;
    items.forEach(it=>{
      const dist = Math.abs(it.offsetTop + H/2 - mid);
      if(dist < bestD){ bestD = dist; best = it; }
      /* les valeurs éloignées s'effacent progressivement */
      const k = Math.min(1, dist / (box.clientHeight/2));
      it.style.transform = `scale(${(1 - 0.28*k).toFixed(3)})`;
      it.style.opacity = (1 - 0.7*k).toFixed(2);
      it.classList.toggle("mid", dist < H/2);
    });
    if(best){
      const v = parseFloat(best.dataset.v);
      if(v !== courant){ courant = v; if(pose) clicRoue(); onChange(v); }
    }
  };
  box.addEventListener("scroll", ()=>requestAnimationFrame(maj), {passive:true});
  requestAnimationFrame(()=>{
    if(!box.isConnected) return;
    const cible = items.find(it => parseFloat(it.dataset.v) === valeur) || items[0];
    box.scrollTop = cible.offsetTop + H/2 - box.clientHeight/2;
    maj();
    setTimeout(()=>{ pose = true; }, 300);
  });
}

/* Un exercice indisponible est remplacé par un équivalent du même rôle,
   pris dans les réservoirs de « Propose-moi ». Sinon la ligne saute. */
function remplacantDispo(nom){
  const id = libId(nom);
  if(id && exoDispo(getEx(id))) return nom;
  for(const role of Object.keys(RESERVOIRS)){
    if(!RESERVOIRS[role].includes(nom)) continue;
    const autre = melanger(RESERVOIRS[role]).find(n2=>{
      const i2 = libId(n2);
      return i2 && exoDispo(getEx(i2));
    });
    if(autre) return autre;
  }
  return null;
}
function addCoachProgram(goal){
  COACH_PROGRAMS[goal].templates.forEach(t=>{
    if(db.templates.some(x=>x.name===t.name)) return;
    const items = t.items.map(it=>{
      const nom = remplacantDispo(it[0]);
      if(!nom) return null;
      const exId = libId(nom);
      return exId ? {exId, sets:it[1], reps:it[2], rest:it[3]} : null;
    }).filter(Boolean);
    if(items.length) db.templates.push({id:uid(), name:t.name, items});
  });
  save();
}
function currentWeight(){
  const ws = db.weights.slice().sort((a,b)=>new Date(a.date)-new Date(b.date));
  return ws.length? ws[ws.length-1].kg : null;
}
function coachDesc(goal){
  const cur = currentWeight(), obj = db.settings.goal;
  const delta = (cur!==null && obj>0)? Math.round((obj-cur)*10)/10 : null;
  if(goal==="masse"){
    let p = TR("3 séances en 8 à 12 répétitions sur les gros mouvements — la zone de référence pour prendre du muscle — avec des repos longs, 3 à 4 fois par semaine en alternant. Côté assiette : ~300-500 kcal au-dessus de tes besoins et 1,6-2 g de protéines par kilo.");
    if(delta!==null && delta>0) p = TR("Objectif +{d} ({a} → {b}), soit environ {n} semaines à un rythme propre. ").replace("{d}", pds(delta)).replace("{a}", fmtKg(cur)).replace("{b}", pds(obj)).replace("{n}", Math.max(2,Math.round(delta/0.375)))+p;
    return p;
  }
  if(goal==="seche"){
    let p = TR("2 séances full body (8 à 12 reps sur les gros mouvements, 12 à 15 en isolation) pour garder le muscle + 2-3 sorties cardio par semaine (à enregistrer dans l'onglet Séance). Côté assiette : ~400-500 kcal sous tes besoins.");
    if(delta!==null && delta<0) p = TR("Objectif −{d} ({a} → {b}), soit environ {n} semaines à −0,5 kg/semaine, un rythme sain. ").replace("{d}", pds(-delta)).replace("{a}", fmtKg(cur)).replace("{b}", pds(obj)).replace("{n}", Math.max(1,Math.round(-delta/0.5)))+p;
    return p;
  }
  if(goal==="force"){
    return TR("3 séances organisées autour du squat, du développé couché et du soulevé de terre : peu de répétitions (3 à 6), charges lourdes et repos très longs (3 à 4 min) pour récupérer entre les séries. Progresse en ajoutant du poids, pas des répétitions.");
  }
  if(goal==="entretien"){
    return TR("2 séances full body par semaine suffisent largement à conserver muscle et force. Séries de 8 à 12 répétitions, intensité modérée, sans chercher la performance — l'objectif est la régularité sur le long terme.");
  }
  return TR("3 séances (haut / bas / full body) à intensité moyenne-haute pour construire du muscle tout en perdant du gras. Côté assiette : mange à ta maintenance avec beaucoup de protéines (2 g/kg), et le corps fait l'échange gras → muscle.");

/* --- stockage de secours : IndexedDB (survit quand localStorage est éphémère) --- */
function idbOpen(){
  return new Promise(res=>{
    try{
      const r = indexedDB.open("tonnage_db", 1);
      r.onupgradeneeded = ()=>{ try{ r.result.createObjectStore("kv"); }catch(e){} };
      r.onsuccess = ()=>res(r.result);
      r.onerror = ()=>res(null);
      r.onblocked = ()=>res(null);
    }catch(e){ res(null); }
  });
}
async function idbPut(key, val){
  const d = await idbOpen(); if(!d) return;
  try{ d.transaction("kv","readwrite").objectStore("kv").put(val, key); }catch(e){}
}
async function idbTake(key){
  const d = await idbOpen(); if(!d) return null;
  return new Promise(res=>{
    try{
      const r = d.transaction("kv","readonly").objectStore("kv").get(key);
      r.onsuccess = ()=>res(r.result||null);
      r.onerror = ()=>res(null);
    }catch(e){ res(null); }
  });
}
async function idbDel(key){
  const d = await idbOpen(); if(!d) return;
  try{ d.transaction("kv","readwrite").objectStore("kv").delete(key); }catch(e){}
}
function idbSet(json){ return idbPut(KEY, json); }
function idbGet(){ return idbTake(KEY); }

const AUTOFILE = "tonnage_autofile";
let autoFile = {handle:null, ok:false, to:null, name:""};
function fileApiOk(){ return typeof window.showSaveFilePicker === "function"; }
async function autoFileWrite(){
  if(!autoFile.ok || !autoFile.handle) return;
  try{
    const w = await autoFile.handle.createWritable();
    await w.write(JSON.stringify(db));
    await w.close();
    db.lastBackup = Date.now();
  }catch(e){ autoFile.ok = false; }
}
function autoFileSchedule(){
  if(!autoFile.ok) return;
  if(autoFile.to) clearTimeout(autoFile.to);
  autoFile.to = setTimeout(autoFileWrite, 2000);

async function autoFilePick(){
  try{
    const handle = await window.showSaveFilePicker({
      suggestedName: "tonnage-donnees.json",
      types: [{description:"Sauvegarde Tonnup", accept:{"application/json":[".json"]}}]
    });

async function autoFileResume(){
  if(!autoFile.handle){ autoFilePick(); return; }
  try{
    const p = await autoFile.handle.requestPermission({mode:"readwrite"});
    if(p === "granted"){
      autoFile.ok = true;
      await autoFileWrite(); save();
      toast(TR("Sauvegarde automatique réactivée ✓"));
      openSettings();
    } else toast(TR("Autorisation refusée"));
  }catch(e){ autoFilePick(); }

/* ================= HELPERS ================= */
/* Les poids sont TOUJOURS stockés en kg. fmtKg ne fait que les afficher :
   il convertit en livres si besoin, et pose la bonne virgule décimale. */
const fmtKg = v => {
  const n = estImperial() ? Number(v) * PAR_LB : Number(v);
  return (Math.round(n*10)/10).toLocaleString(langue()==="en" ? "en-US" : loc());
};
/* poids + son unité, en un seul morceau : "80 kg" ou "176,4 lb" */
const pds = v => fmtKg(v) + " " + uPoids();
/* clé d'une journée en heure LOCALE (toISOString donnerait l'heure universelle,
   et ferait basculer le jour avec plusieurs heures d'avance ou de retard) */
function dayKey(d){
  const x = d? new Date(d) : new Date();
  return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}-${String(x.getDate()).padStart(2,"0")}`;
}
function fmtDate(iso){ return new Date(iso).toLocaleDateString(loc(),{weekday:"long", day:"numeric", month:"long"}); }
function fmtDateShort(iso){ return new Date(iso).toLocaleDateString(loc(),{day:"numeric", month:"short"}); }
function fmtDur(ms){ const m=Math.round(ms/60000); return m<60? m+" min" : Math.floor(m/60)+" h "+String(m%60).padStart(2,"0"); }
function mmss(s){ s=Math.max(0,Math.round(s)); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }
/* avec deux haltères, la charge saisie est celle d'UN haltère : le tonnage compte les deux */
/* vrai quand la charge saisie est déjà celle d'un seul côté par nature :
   deux haltères = l'app compte déjà les deux. L'option « un côté à la fois » n'a alors aucun sens. */
function dejaParCote(exId){
  const ex = getEx(exId);
  return !!(ex && equipCanon(ex)==="Haltères" && !/haltère$|nuque/i.test(nomCanon(ex)));
}
function facteurCharge(exId){
  if(dejaParCote(exId)) return 2;
  /* unilatéral : la charge saisie est celle d'un côté, on compte les deux */
  if(db.unilat && db.unilat[exId]) return 2;
  return 1;
}
function sessionVolume(sess){
  let v=0;
  sess.entries.forEach(en=>{
    const f = facteurCharge(en.exId);
    en.sets.forEach(st=>{ if(st.done && !st.warm) v += volSerie(st)*f; });
  });
  return v;
}
function lastPerf(exId){
  for(let i=db.history.length-1;i>=0;i--){
    const en = db.history[i].entries.find(e=>e.exId===exId);
    if(en){
      const sets = en.sets.filter(s=>s.done && !s.warm);
      if(sets.length) return {date:db.history[i].date, sets};
    }
  }
  return null;
}
function workSets(en){ return en.sets.filter(s=>!s.warm); }
/* tonnage d'une série, dégressifs compris : 6 x 12 kg puis 4 x 10 kg = 112 kg soulevés */
function volSerie(s){
  return (s.w||0)*(s.r||0) + ((s.drops||[]).reduce((a,d)=>a+(d.w||0)*(d.r||0),0));
}
function e1rm(w,r){ return r>1 ? w*(1+r/30) : w; }
/* kcal d'une séance de muscu : ~6 MET pendant la durée, ajusté par le volume soulevé */
function liftKcal(durMs, volume, nSeries){
  const kg = currentWeight() || (db.profile && db.profile.weight) || 75;
  const mesuree = Math.max(0, durMs/60000);
  /* si les séries ont été saisies après coup, la durée mesurée est ridicule :
     on retombe alors sur une estimation à partir du nombre de séries (~2,5 min chacune) */
  const estimee = (nSeries||0) * 2.5;
  const min = (estimee > 0 && mesuree < estimee*0.5) ? estimee : mesuree;
  const base = 6 * 3.5 * kg / 200 * min;       /* dépense liée à la durée d'effort */
  const travail = volume * 0.005;              /* travail mécanique du tonnage soulevé */
  return Math.round(base + travail);
}
function nbSeries(s){ return s.entries.reduce((n,en)=>n+en.sets.filter(x=>!x.warm).length,0); }
function parseReps(reps){
  const m = String(reps||"").match(/(\d+)(?:\D+(\d+))?/);
  if(!m) return null;
  const lo = parseInt(m[1]), hi = m[2]? parseInt(m[2]) : parseInt(m[1]);
  return {lo, hi:Math.max(lo,hi)};
}
/* charge bloquée : ni haltères plus lourds, ni lest disponible */
const REPS_PLAFOND = 25;                       /* au-delà, mieux vaut durcir le mouvement */
/* vrai seulement quand il n'y a physiquement rien à retirer : poids du corps sans lest.
   « Je n'ai pas de charge plus lourde » plafonne vers le haut, mais on peut toujours descendre. */
function sansChargeDuTout(exId, poidsSaisi){
  return estPoidsDuCorps(getEx(exId)) && !((poidsSaisi||0) > 0);
}
/* Charge fixe : l'exercice ne montera plus en poids, l'app fera progresser autrement.
   Pour un exercice au poids du corps c'est l'état normal ; le décocher revient à dire
   « je peux le lester », d'où le drapeau « libre: ». */
function reglerChargeFixe(exId, fixe){
  const auto = estPoidsDuCorps(getEx(exId));
  if(fixe){ db.plafond[exId] = true; delete db.plafond["libre:"+exId]; }
  else { delete db.plafond[exId]; if(auto) db.plafond["libre:"+exId] = true; }
  save();
}
/* le bloc de réglage, identique dans le menu de la séance et dans la fiche de l'exercice */
function blocChargeFixe(exId, id){
  return `<label class="row" style="gap:9px; align-items:flex-start; cursor:pointer;">
    <input type="checkbox" id="${id}" ${chargeBloquee(exId)?"checked":""}
      style="width:19px; height:19px; accent-color:var(--accent); flex:0 0 auto; margin-top:1px;">
    <span style="font-size:13.5px; color:var(--ink); line-height:1.45;">${TR("Charge fixe — je n'ai pas plus lourd")}<br>
      <span style="font-size:12px; color:var(--ink-mute);">${TR("Pour un seul haltère ou une seule barre. L'app ne touche plus au poids, ni pour monter ni pour descendre : elle fait progresser en répétitions, puis en séries, puis avec une variante plus dure. Et si une séance est trop dure, c'est la cible en répétitions qui baisse.")}</span></span>
  </label>`;
}
function chargeBloquee(exId){
  const ex = getEx(exId);
  return !!db.plafond[exId] || (estPoidsDuCorps(ex) && !db.plafond["libre:"+exId]);
}
/* une variante plus dure du même mouvement, prise dans la bibliothèque */
function varianteDure(exId){
  const ex = getEx(exId);
  const dures = {
    "Pompes":"Dips", "Dips":"Tractions", "Squat":"Fentes bulgares", "Fentes":"Fentes bulgares",
    "Fentes bulgares":"Hack squat", "Crunch":"Relevés de jambes", "Gainage":"Roulette abdominale",
    "Tractions":TR("Tractions lestées"), "Curl haltères":"Curl incliné haltères", "Mollets debout":TR("Mollets debout une jambe")
  };
  const cible = dures[ex.name];
  if(cible && allEx().some(e=>e.name===cible)) return cible;
  return null;
}
/* que proposer quand la charge ne peut pas monter : reps -> série -> variante */
function progressionSansCharge(exId, repsActuelles, nbSeries){
  const v = varianteDure(exId);
  if(repsActuelles >= REPS_PLAFOND){
    return v ? {mode:"variante", cible:v, text:`Tu plafonnes à ${repsActuelles} reps — passe à « ${v} », plus dur à charge égale.`}
             : {mode:"tempo", text:`Tu plafonnes à ${repsActuelles} reps — ralentis la descente (3 s) et marque 2 s en bas plutôt que d'en rajouter.`};
  }
  if(repsActuelles >= REPS_PLAFOND - 5 && nbSeries < 5){
    return {mode:"serie", text:`Ajoute une série plutôt que des reps : tu es déjà à ${repsActuelles}.`};
  }
  return {mode:"reps", reps: repsActuelles + 2, text:`Vise ${repsActuelles+2} reps — et termine à une rep de l'échec.`};
}
function suggestFor(exId, target){
  const last = lastPerf(exId);
  if(!last || !last.sets.length) return null;
  const rng = parseReps(target && target.reps);
  if(!rng) return null;
  const maxW = Math.max(...last.sets.map(s=>s.w||0));
  const inc = maxW>=20? 2.5 : 1;
  const rirs = last.sets.map(s=>s.rir).filter(r=>r!==undefined && r!==null);
  const avgRir = rirs.length? rirs.reduce((a,b)=>a+b,0)/rirs.length : null;
  const allTop = last.sets.every(s=>(s.r||0)>=rng.hi);
  /* La dernière série est toujours la plus dure : la fatigue accumulée fait tomber les
     répétitions même quand la charge était juste. Une seule série courte ne doit donc pas
     faire baisser la charge — on regarde si la MAJORITÉ des séries est sous la fourchette.
     Trois séries à 10 et une à 8 : la charge était bonne, on la garde. */
  const sousLaCible = last.sets.filter(s=>(s.r||0)<rng.lo).length;
  const majoriteEnDessous = sousLaCible * 2 > last.sets.length;
  /* une série unique reste jugée sur elle-même : il n'y a pas de majorité à chercher */
  const anyBelow = last.sets.length === 1 ? sousLaCible > 0 : majoriteEnDessous;
  /* charge bloquée (poids du corps, ou pas d'haltères plus lourds) : on progresse autrement */
  if(chargeBloquee(exId)){                    /* plafonné : on progresse en reps / séries / variante */
    const maxR = Math.max(...last.sets.map(s=>s.r||0));
    if(allTop || (avgRir!==null && avgRir>=3 && !anyBelow)){
      const pr = progressionSansCharge(exId, maxR, last.sets.length);
      return {mode:pr.mode, w:maxW, text:pr.text};
    }
    if(anyBelow && avgRir!==null && avgRir<0.5){
      /* Charge fixe : la barre ne peut pas s'alléger, donc le seul levier qui reste est la
         cible en répétitions. On prend la MÉDIANE des séries, pas la plus faible : la
         dernière série est toujours la plus basse à cause de la fatigue, et s'aligner
         dessus reviendrait à se saborder — même raison qu'on ne baisse pas la charge sur
         une seule série ratée. */
      const faites = last.sets.map(x=>x.r||0).sort((a,b)=>a-b);
      const m = faites.length >> 1;
      const basse = Math.max(1, faites.length % 2
        ? faites[m]
        : Math.round((faites[m-1] + faites[m]) / 2));
      return {mode:"hold", w:maxW, reps:basse,
        text:`Trop dur la dernière fois, et tu ne peux pas alléger : vise ${basse} reps sur toutes les séries, puis remonte d'une rep à chaque séance.`};
    }
    if(anyBelow)
      return {mode:"hold", w:maxW, reps:rng.lo, text:`Continue à viser ${rng.lo} reps sur toutes les séries avant de charger.`};
    return {mode:"beat", w:0, text:`Essaie de gratter une répétition de plus sur la première série.`};
  }
  if(allTop || (avgRir!==null && avgRir>=3 && !anyBelow))
    return {mode:"up", w:maxW+inc, text: allTop
      ? `Toutes les séries à ${rng.hi} reps ou plus la dernière fois — passe à ${pds(maxW+inc)}.`
      : `Trop facile la dernière fois (3+ reps en réserve) — passe à ${pds(maxW+inc)}.`};
  if(anyBelow && avgRir!==null && avgRir<0.5)
    return {mode:"down", w:Math.max(0,maxW-inc), text:`Trop lourd la dernière fois sur ${sousLaCible} série${sousLaCible>1?"s":""} — repars à ${pds(Math.max(0,maxW-inc))} pour tenir ${rng.lo} reps.`};
  if(anyBelow)
    return {mode:"hold", w:maxW, text:`Reste à ${pds(maxW)} jusqu'à faire ${rng.lo} reps sur toutes les séries.`};
  return {mode:"beat", w:maxW, text:`Garde ${pds(maxW)} et essaie de gratter une rep de plus.`};
}

/* bandeau sombre : l'image fournie en fond, avatar à gauche, réglages à droite */
/* Le disque sombre est dessiné, plus chargé : une image réinsérée à chaque rendu
   scintillait. Le liseré et le trou central sont évidés — la page se voit au travers,
   donc le bandeau s'adapte tout seul au thème. */
/* Cadrage vertical de chaque photo dans le bandeau, en pourcentage :
   0 = on garde le haut de l'image, 50 = le centre, 100 = le bas.
   Les photos étant en portrait dans un cadre horizontal, il y a 865 px de marge. */
const PHOTO_CADRAGE = {push:50, pull:50, jambes:50, abdos:50, cardio:50};
const PHOTO_L = 640, PHOTO_H = 929;    /* format d'origine des photos de séance */
/* Disque et liseré agrandis d'environ 12 % pour que le bandeau descende davantage.
   Le liseré reste à 74,7 % de la hauteur : rien de ce qui s'y aligne n'a bougé.
   Le rond clair du haut garde sa position et sa taille exactes. */
const HERO_H = 1000;
function heroSvg(photo){
  const larg = 1210, haut = Math.round(larg * PHOTO_H / PHOTO_L);
  const pc = (PHOTO_CADRAGE[photo] === undefined) ? 50 : PHOTO_CADRAGE[photo];
  const decal = Math.round(-(haut - HERO_H) * Math.max(0, Math.min(100, pc)) / 100);
  return `<svg class="hero-bg" viewBox="0 0 1210 ${HERO_H}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
    <defs><mask id="hero-m" maskUnits="userSpaceOnUse" x="0" y="0" width="1210" height="${HERO_H}">
      <rect width="1210" height="${HERO_H}" fill="#000"/>
      <path d="M0 0 H1210 V778 A1021 1021 0 0 1 0 778 Z" fill="#fff"/>
      <circle cx="605" cy="-50" r="797" fill="none" stroke="#000" stroke-width="16"/>
      <circle cx="605" cy="-60" r="171" fill="#000"/>
    </mask></defs>
    <g mask="url(#hero-m)">
      <rect width="1210" height="${HERO_H}" fill="var(--hero)"/>
      ${photo ? `<image href="img/${photo}.jpg" x="0" y="${decal}" width="${larg}" height="${haut}"
        preserveAspectRatio="none" opacity=".62"/>
      <rect width="1210" height="${HERO_H}" fill="#0e0e10" opacity=".42"/>` : ""}
    </g>
  </svg>`;
}

/* fermeture au glissement vers le bas (geste attendu sur iPhone) */
(function glisserPourFermer(){
  let y0 = null, dy = 0, glisse = false, dernierY = 0, dernierT = 0, vitesse = 0;
  /* Combien faut-il descendre pour fermer ? Assez pour que ce soit une décision.
     Un glissement lent doit parcourir un quart de la fiche ; un geste vif et net
     ferme plus tôt, parce que la vitesse dit déjà l'intention. */
  const seuilFermeture = ()=> Math.min(220, Math.max(140, Math.round(sheet.clientHeight * 0.25)));
  const zoneDefilante = el => {
    while(el && el !== sheet){
      if(el.scrollHeight > el.clientHeight + 2 && el.scrollTop > 0) return true;
      el = el.parentElement;
    }
    return false;
  };
  sheet.addEventListener("touchstart", e=>{
    if(sheetVerrou){ y0 = null; return; }
    if(e.touches.length !== 1){ y0 = null; return; }
    if(sheet.scrollTop > 0){ y0 = null; return; }
    if(e.target.closest('input[type="range"], select, textarea')){ y0 = null; return; }
    if(zoneDefilante(e.target)){ y0 = null; return; }
    y0 = e.touches[0].clientY; dy = 0; glisse = false;
    dernierY = y0; dernierT = performance.now(); vitesse = 0;
    sheet.style.transition = "none";
  }, {passive:true});
  sheet.addEventListener("touchmove", e=>{
    if(y0 === null) return;
    const y = e.touches[0].clientY, t = performance.now();
    if(t > dernierT) vitesse = (y - dernierY) / (t - dernierT);   /* px par milliseconde */
    dernierY = y; dernierT = t;
    dy = y - y0;
    if(dy <= 0){ if(glisse){ sheet.style.transform = ""; glisse = false; } return; }
    /* on ne suit le doigt qu'à partir d'un vrai mouvement : sinon la fiche tremble
       au moindre appui un peu glissant */
    if(!glisse && dy < 14) return;
    glisse = true;
    sheet.style.transform = `translateY(${dy}px)`;
    e.preventDefault();
  }, {passive:false});
  const fin = ()=>{
    if(y0 === null) return;
    const assez = glisse && (dy > seuilFermeture() || (vitesse > 0.9 && dy > 70));
    sheet.style.transition = "transform .2s ease";
    if(assez){
      sheet.style.transform = "translateY(100%)";
      setTimeout(()=>{ sheet.style.transform = ""; sheet.style.transition = ""; closeSheet(); }, 190);
    } else {
      sheet.style.transform = "";
    }
    y0 = null; dy = 0; glisse = false;
  };
  sheet.addEventListener("touchend", fin);
  sheet.addEventListener("touchcancel", fin);
})();

/* ================= REST TIMER ================= */
let rest = {end:0, total:0, int:null, paused:false, remaining:0, hideTo:null};
let audioCtx = null;
function ensureAudio(){ try{ if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==="suspended") audioCtx.resume(); }catch(e){} }
function beep(){
  if(!audioCtx) return;
  try{
    [0,.25,.5].forEach((t,i)=>{
      const o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.type="sine"; o.frequency.value = i===2? 1320: 880;
      g.gain.setValueAtTime(.001, audioCtx.currentTime+t);
      g.gain.exponentialRampToValueAtTime(.4, audioCtx.currentTime+t+.02);
      g.gain.exponentialRampToValueAtTime(.001, audioCtx.currentTime+t+.2);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(audioCtx.currentTime+t); o.stop(audioCtx.currentTime+t+.22);
    });
  }catch(e){}
}
/* Le son sonne à l'arrivée à zéro, quand l'app est à l'écran. Rien n'est programmé
   d'avance : l'horloge audio se fige avec l'appareil, ce qui décalait la sonnerie au
   réveil. Le bip en arrière-plan reviendra avec les notifications de l'app empaquetée. */
function bipRepos(){
  if(db.settings.son === false) return;
  if(document.visibilityState !== "visible") return;   /* écran éteint : on ne sonne pas dans le vide */
  ensureAudio();
  beep();
}
function majIconeSon(){
  const b = document.getElementById("rest-son");
  if(!b) return;
  const coupe = db.settings.son === false;
  b.innerHTML = coupe ? IC_MUET : IC_SON;
  b.classList.toggle("muet", coupe);
}
const restbar = document.getElementById("restbar");
function startRest(sec){
  if(!sec || sec<=0) return;
  /* remise à zéro complète : rien de la minuterie précédente ne doit survivre */
  if(rest.int) clearInterval(rest.int);
  if(rest.hideTo) clearTimeout(rest.hideTo);
  rest.hideTo = null;
  rest.paused = false;
  rest.remaining = 0;
  rest.total = sec;
  rest.end = Date.now() + sec*1000;
  restbar.classList.add("show");
  restbar.classList.remove("ending", "paused");
  placerRest();
  document.getElementById("rest-lbl").textContent = TR("Repos");
  document.getElementById("rest-picon").textContent = "";
  rest.int = setInterval(tickRest, 250);
  tickRest();
  majIconeSon();
  if(!dejaVu("repos")){
    marquerVu("repos");
    setTimeout(()=>toast(TR("Repos lancé — touche la barre pour la mettre en pause")), 500);
  }
}
function togglePauseRest(){
  if(!restbar.classList.contains("show")) return;
  if(rest.paused){
    rest.end = Date.now() + rest.remaining;
    rest.paused = false;
    restbar.classList.remove("paused");
    document.getElementById("rest-lbl").textContent = TR("Repos");
    document.getElementById("rest-picon").textContent = "";
    if(rest.int) clearInterval(rest.int);
    rest.int = setInterval(tickRest, 250);
    tickRest();
  } else {
    rest.remaining = Math.max(0, rest.end - Date.now());
    rest.paused = true;
    restbar.classList.add("paused");
    document.getElementById("rest-lbl").textContent = TR("En pause");
    document.getElementById("rest-picon").textContent = " ▶";
    if(rest.int) clearInterval(rest.int);
    rest.int = null;
  }
}
function tickRest(){
  const left = (rest.end - Date.now())/1000;
  if(left<=0){
    clearInterval(rest.int); rest.int=null;
    document.getElementById("rest-t").classList.remove("compte-a-rebours");
    document.getElementById("rest-t").textContent="0:00";
    document.getElementById("rest-bar").style.width="0%";
    restbar.classList.add("ending");
    /* on ne sonne que si le zéro vient d'être atteint : au retour d'une veille,
       le repos est fini depuis longtemps et une sonnerie n'aurait plus de sens */
    if(left > -2) bipRepos();
    if(navigator.vibrate) navigator.vibrate([200,100,200]);
    if(rest.hideTo) clearTimeout(rest.hideTo);
    rest.hideTo = setTimeout(()=>{ restbar.classList.remove("show","ending"); rest.hideTo=null; }, 1600);
    return;
  }
  /* Sous quatre secondes : le chiffre seul, en très gros. Aucune couleur ne change —
     du rouge ou un clignotement transformerait une information en pression. */
  const t = document.getElementById("rest-t");
  const s = Math.ceil(left);
  if(s <= 3){
    if(t.textContent !== String(s)){
      t.textContent = s;
      t.classList.remove("compte-a-rebours"); void t.offsetWidth;   /* pour rejouer le battement */
      t.classList.add("compte-a-rebours");
    }
  } else {
    t.classList.remove("compte-a-rebours");
    t.textContent = mmss(left);
  }
  document.getElementById("rest-bar").style.width = (left/rest.total*100)+"%";
}
document.getElementById("rest-skip").onclick=()=>{ if(rest.int) clearInterval(rest.int); rest.int=null; rest.paused=false; restbar.classList.remove("show","paused"); };
document.getElementById("rest-plus").onclick=()=>{ if(rest.paused){ rest.remaining+=15000; rest.total+=15; document.getElementById("rest-t").textContent=mmss(rest.remaining/1000); } else { rest.end+=15000; rest.total+=15; tickRest(); } };
document.getElementById("rest-minus").onclick=()=>{ if(rest.paused){ rest.remaining=Math.max(0,rest.remaining-15000); document.getElementById("rest-t").textContent=mmss(rest.remaining/1000); } else { rest.end-=15000; tickRest(); } };
document.getElementById("rest-son").onclick=e=>{

/* La pause se déclenche sur la pastille blanche, et sur elle seule.
   Auparavant c'était toute la barre : le bouton du son remplaçant son icône au clic,
   l'élément visé disparaissait du document et n'était plus reconnu comme un bouton. */
document.getElementById("rest-pill").addEventListener("click", e=>{
  if(Date.now() - restDrag.tFin < 350) return;    /* on vient de le déplacer, pas de pause */
  togglePauseRest();
});

/* le minuteur se déplace : relâché au-dessus du milieu il se cale en haut, en dessous il revient en bas */
const restDrag = {actif:false, bouge:false, y0:0, top0:0, tFin:0};
function placerRest(){ restbar.classList.toggle("haut", db.settings.restHaut === true); }
function restDragStart(y, cible){
  if(cible.closest("button")) return;
  const r = restbar.getBoundingClientRect();
  restDrag.actif = true; restDrag.bouge = false; restDrag.y0 = y; restDrag.top0 = r.top;
  restbar.classList.add("drag");
}
function restDragMove(y){
  if(!restDrag.actif) return;
  const dy = y - restDrag.y0;
  if(Math.abs(dy) > 4) restDrag.bouge = true;
  if(!restDrag.bouge) return;
  const h = restbar.offsetHeight;
  const top = Math.max(6, Math.min(window.innerHeight - h - 6, restDrag.top0 + dy));
  restbar.style.top = top + "px";
  restbar.style.bottom = "auto";
}
function restDragEnd(){
  if(!restDrag.actif) return;
  restDrag.actif = false;
  restbar.classList.remove("drag");
  if(!restDrag.bouge) return;
  restDrag.tFin = Date.now();
  restDrag.bouge = false;
  const r = restbar.getBoundingClientRect();
  const enHaut = (r.top + r.height/2) < window.innerHeight/2;
  db.settings.restHaut = enHaut;
  save();
  restbar.style.top = ""; restbar.style.bottom = "";
  placerRest();
  if(navigator.vibrate) navigator.vibrate(12);
}
restbar.addEventListener("touchstart", e=>{ restDragStart(e.touches[0].clientY, e.target); }, {passive:true});
restbar.addEventListener("touchmove", e=>{ if(restDrag.actif && restDrag.bouge) e.preventDefault(); restDragMove(e.touches[0].clientY); }, {passive:false});
["touchend","touchcancel"].forEach(ev=>restbar.addEventListener(ev, restDragEnd));
