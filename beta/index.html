    card.querySelector('[data-act="swap"]').onclick=()=>openSwap(ei);
    card.querySelector('[data-act="delex"]').onclick=()=>{
      askConfirm(TR("Retirer l'exercice ?"), ex.name+" "+TR("sera retiré de cette séance (les autres exercices sont conservés)."), TR("Retirer"), true, ()=>{
        a.entries.splice(ei,1); save(); render();
      });
    };
    list.appendChild(card);
  });

  majSerieActive();                            /* état correct dès le premier affichage */
  requestAnimationFrame(majSerieActive);       /* affiné une fois la mise en page mesurée */
  document.getElementById("add-ex").onclick=()=>openPicker(exId=>{
    const last = lastPerf(exId);
    const ls = last? last.sets[0] : null;
    const cible = cibleParDefaut(exId);
    a.entries.push({exId, target:cible,
      sets:[{w: ls? ls.w:"", r: ls? ls.r : repsDepart(parseReps(cible.reps)), done:false}]});
    save(); closeSheet(); render();
  });
  document.getElementById("cancel-w").onclick=()=>askConfirm(TR("Annuler la séance ?"),TR("Tout ce que tu as saisi dans cette séance sera perdu."),TR("Oui, annuler"),true,()=>{ db.active=null; arreterChronos(); save(); render(); });
  document.getElementById("finish-w").onclick=()=>{
    const doneSets = a.entries.reduce((n,en)=>n+en.sets.filter(s=>s.done && !s.warm).length,0);
    if(!doneSets){ askConfirm(TR("Aucune série validée"),TR("Valide au moins une série (bouton ○) avant de terminer, ou annule la séance."),"OK",false,()=>{}); return; }
    const vol = a.entries.reduce((v,en)=>{ const f=facteurCharge(en.exId); return v+en.sets.reduce((x,s)=>x+((s.done&&!s.warm)?volSerie(s)*f:0),0); },0);
    const kcal = liftKcal(dureeSeance2(a), vol, doneSets);
    askConfirm(TR("Terminer la séance ?"), `${doneSets} ${TR(doneSets > 1 ? "séries validées" : "série validée")} · ${pds(vol)} ${TR("soulevés")} · ${TR("environ")} ${kcal} ${TR("kcal brûlées. On enregistre ?")}`, TR("Enregistrer"), false, ()=>{
      /* le récapitulatif se calcule AVANT d'ajouter la séance, sinon elle se compare à elle-même */
      const recap = {
        nom: a.name, series: doneSets, volume: Math.round(vol), kcal,
        duree: dureeSeance2(a), exos: a.entries.length,
        records: nouveauxRecords(a)
      };
      db.history.push({
        id:uid(), date:new Date().toISOString(), name:a.name, templateId:a.templateId,
        start:a.start, end:a.start + dureeSeance2(a),
        entries:a.entries.map(en=>({exId:en.exId, sets:en.sets.filter(s=>s.done).map(s=>({w:s.w||0, r:s.r||0, done:true, warm:!!s.warm, rir:(s.rir===undefined?null:s.rir), drops:(s.drops&&s.drops.length? s.drops.map(d=>({w:d.w||0, r:d.r||0})) : undefined)}))})).filter(en=>en.sets.length)
      });
      db.active=null; arreterChronos(); save(); render();
      setTimeout(()=>openFinSeance(recap), 260);
    });
  };
}
/* records battus pendant la séance : meilleur 1RM estimé face à tout l'historique précédent */
/* Un exercice bat-il son propre record ? Rend la meilleure série et le gain, ou null.
   Le passé est cherché dans l'historique, donc la séance en cours n'est pas comparée à
   elle-même. gain = 0 quand c'est la première fois : ce n'est pas un record, c'est un début. */
function recordExo(en){
  const sets = en.sets.filter(s=>s.done && !s.warm);
  if(!sets.length) return null;
  let best = 0, meilleure = null;
  sets.forEach(st=>{ const v = e1rm(st.w||0, st.r||0); if(v > best){ best = v; meilleure = st; } });
  if(!(best > 0)) return null;
  let avant = 0;
  db.history.forEach(h=>h.entries.forEach(e2=>{
    if(e2.exId !== en.exId) return;
    e2.sets.filter(s=>!s.warm).forEach(st=>{ avant = Math.max(avant, e1rm(st.w||0, st.r||0)); });
  }));
  if(avant === 0) return {gain:0, w:meilleure.w, r:meilleure.r};
  if(best <= avant*1.005) return null;
  return {gain: Math.round((best-avant)*10)/10, w:meilleure.w, r:meilleure.r};
}
function nouveauxRecords(a){
  const out = [];
  a.entries.forEach(en=>{
    const r = recordExo(en);
    if(r) out.push({nom:getEx(en.exId).name, gain:r.gain});
  });
  return out;
}
/* confettis : quelques centaines de rectangles qui retombent, sans bibliothèque */
function confettis(canvas, duree){
  const ctx = canvas.getContext("2d");
  const dpr = Math.min(2, window.devicePixelRatio||1);
  const W = canvas.clientWidth, H = canvas.clientHeight;
  canvas.width = W*dpr; canvas.height = H*dpr; ctx.scale(dpr,dpr);
  const coul = ["#f58220","#4caf50","#3ca0e8","#f2506e","#ffd166","#ffffff"];
  const bouts = [];
  for(let i=0;i<110;i++) bouts.push({
    x: Math.random()*W, y: -20 - Math.random()*H*0.6,
    l: 5+Math.random()*6, h: 8+Math.random()*8,
    vy: 60+Math.random()*90, vx: (Math.random()-0.5)*50,
    rot: Math.random()*Math.PI, vr: (Math.random()-0.5)*6,
    c: coul[(Math.random()*coul.length)|0]
  });
  let t0 = null, stop = false;
  const boucle = t=>{
    if(stop) return;
    if(t0===null) t0 = t;
    const dt = 1/60, ecoule = t - t0;
    ctx.clearRect(0,0,W,H);
    bouts.forEach(b=>{
      b.x += b.vx*dt; b.y += b.vy*dt; b.rot += b.vr*dt; b.vy += 22*dt;
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.rot);
      ctx.fillStyle = b.c; ctx.globalAlpha = Math.max(0, 1 - ecoule/duree);
      ctx.fillRect(-b.l/2, -b.h/2, b.l, b.h); ctx.restore();
    });
    if(ecoule < duree) requestAnimationFrame(boucle);
    else ctx.clearRect(0,0,W,H);
  };
  if(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  requestAnimationFrame(boucle);
}

/* remplacer un exercice pendant la séance (machine prise, matériel manquant, blessure) */
function openSwap(ei, fromInjury){
  const en = db.active.entries[ei];

  let list = altsFor(en.exId);

        <div class="eq">${esc(e.equip||"")}${n2? ` · ⚠️ ${esc(n2.injury)}`:""}</div>${musclesHtml(nomCanon(e),3)}</div>
        <span style="color:var(--accent); font-weight:800;">⇄</span></div>`;
    }).join("")}</div>
    <button class="btn" id="sw-cancel" style="width:100%; margin-top:12px;">${TR("Annuler")}</button>`);
  document.getElementById("sw-cancel").onclick=closeSheet;
  document.querySelectorAll("[data-swap]").forEach(r=>r.onclick=()=>{
    const newId = r.dataset.swap;
    const last = lastPerf(newId);
    en.exId = newId;

      if(s.done) return;
      if(s.warm){
        const e = serieEchauffement(newId, en.target && en.target.reps);
        s.w = e.w; s.r = e.r;

    });
    save(); closeSheet(); render();
    toast("Remplacé par "+getEx(newId).name);
  });
}

    q=(q||"").toLowerCase();

    const sansAccent = t => (t||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");

    /* score : le groupe et le nom priment sur les muscles secondaires */
    const score = e=>{
      if(!qn) return 0;
      if(sansAccent(e.muscle).includes(qn)) return 3;
      if(sansAccent(e.name).includes(qn)) return 2;
      if(sansAccent(e.equip||"").includes(qn)) return 2;

    Object.keys(groups).forEach(m=>groups[m].sort((a,b)=>(exoDispo(a)?0:1) - (exoDispo(b)?0:1)));

          <button class="icon-btn info-btn" data-exinfo="${e.id}" title="${TR("Fiche de l'exercice")}">ⓘ</button>
          ${browse? "" : `<span class="pk-add">＋</span>`}</div>`).join("")
    ).join("") || `<div class="empty">${TR("Aucun résultat.")}</div>`;
    /* on ne ferme pas ici : c'est l'appelant qui décide (rouvrir l'éditeur, ou fermer) */
    if(!browse) listEl.querySelectorAll("[data-pk]").forEach(r=>r.onclick=(e)=>{ if(e.target.closest("[data-exinfo]")) return; cb(r.dataset.pk); });
    listEl.querySelectorAll("[data-exinfo]").forEach(b=>b.onclick=(e)=>{ e.stopPropagation(); openExoInfo(b.dataset.exinfo); });

  draw("");

  document.getElementById("pk-new").onclick=()=>{
    openSheet(`<h3>${TR("Nouvel exercice")}</h3>
      <div class="stack">
        <div><span class="label" style="display:block; margin-bottom:5px;">Nom</span><input id="ne-name" placeholder="${TR("Ex : Curl incliné")}"></div>
        <div><span class="label" style="display:block; margin-bottom:5px;">Groupe musculaire</span>
        <select id="ne-muscle">${["Pectoraux","Dos","Épaules","Biceps","Triceps","Jambes","Abdos","Autres"].map(m=>`<option value="${m}">${TR(m)}</option>`).join("")}</select></div>

function openTplEditor(id){
  let tpl = id ? JSON.parse(JSON.stringify(db.templates.find(t=>t.id===id))) : {id:uid(), name:"", items:[]};
  const draw = ()=>{
    openSheet(`<h3>${id?TR("Modifier la séance"):"Nouvelle séance"}</h3>
      <div class="stack">
        <div><span class="f-lab">${TR("Nom de la séance")}</span>
        <input id="tp-name" placeholder="${TR("Ex : Push, Haut du corps…")}" value="${esc(TR(tpl.name))}"></div>
        <div><span class="f-lab">${TR("Exercices")}</span><div id="tp-items"></div>
        <button class="btn-dash" id="tp-add">＋ ${TR("Ajouter un exercice")}</button></div>
        <div class="row" style="gap:9px;">
          <button class="btn grow" id="tp-cancel" style="background:var(--field);">${TR("Annuler")}</button>
          <button class="btn btn-accent grow" id="tp-save">${TR("Enregistrer")}</button>
        </div>
        ${id? `<button class="btn" id="tp-del" style="background:var(--bad); color:#fff; border-color:var(--bad);">${TR("Supprimer la séance")}</button>`:""}
      </div>`);
    const itemsEl = document.getElementById("tp-items");
    itemsEl.innerHTML = tpl.items.length? "" : `<div class="tpl-vide">${TR("Aucun exercice pour l'instant.")}</div>`;
    tpl.items.forEach((it,i)=>{
      const ex = getEx(it.exId);
      const d = document.createElement("div");
      d.className="tpl-item";
      d.innerHTML = `
        <div class="row" style="align-items:flex-start;">
          <div class="grow" style="font-weight:700; font-size:13.5px; line-height:1.3;">${i+1}. ${esc(ex.name)}</div>
          <div style="display:flex; flex-direction:column; gap:1px;">
            <button class="icon-btn" data-up style="width:24px;height:18px; font-size:11px;">▲</button>
            <button class="icon-btn" data-dn style="width:24px;height:18px; font-size:11px;">▼</button>
          </div>
          <button class="icon-btn" data-rm style="width:26px;height:26px;color:#fff;background:var(--bad);border-radius:7px;font-size:13px;">✕</button>
        </div>
        <div class="cfg">
          <label><span class="label">${TR("Séries")}</span><input type="number" inputmode="numeric" min="1" value="${it.sets}" data-f="sets"></label>
          <label><span class="label">Reps</span><input type="text" placeholder="8-12" value="${esc(String(it.reps||""))}" data-f="reps"></label>
          <label><span class="label">${TR("Repos (sec)")}</span><input type="number" inputmode="numeric" min="0" step="15" value="${it.rest}" data-f="rest"></label>
        </div>`;
      d.querySelector("[data-up]").onclick=()=>{ if(i>0){ tpl.items.splice(i-1,0,tpl.items.splice(i,1)[0]); tpl.name=document.getElementById("tp-name").value; draw(); } };
      d.querySelector("[data-dn]").onclick=()=>{ if(i<tpl.items.length-1){ tpl.items.splice(i+1,0,tpl.items.splice(i,1)[0]); tpl.name=document.getElementById("tp-name").value; draw(); } };
      d.querySelector("[data-rm]").onclick=()=>{ tpl.items.splice(i,1); tpl.name=document.getElementById("tp-name").value; draw(); };
      d.querySelectorAll("[data-f]").forEach(inp=>inp.oninput=()=>{
        const f = inp.dataset.f;
        it[f] = f==="reps"? inp.value : (parseInt(inp.value)||0);
      });
      itemsEl.appendChild(d);
    });
    document.getElementById("tp-add").onclick=()=>{
      tpl.name = document.getElementById("tp-name").value;
      openPicker(exId=>{ tpl.items.push({exId, sets:4, reps:"8-12", rest:db.settings.rest}); draw(); });
    };
    document.getElementById("tp-cancel").onclick=closeSheet;
    const sup = document.getElementById("tp-del");
    if(sup) sup.onclick=()=>{
      const nom = document.getElementById("tp-name").value.trim() || tpl.name || TR("Cette séance");
      askConfirm(TR("Supprimer la séance ?"), `${nom} disparaîtra de ton accueil. Les séances déjà faites restent dans ton historique.`, TR("Supprimer"), true, ()=>{
        db.templates = db.templates.filter(t=>t.id!==tpl.id);
        save(); closeSheet(); render(); toast(TR("Séance supprimée"));
      });
    };
    document.getElementById("tp-save").onclick=()=>{
      tpl.name = document.getElementById("tp-name").value.trim() || TR("Séance sans nom");
      const idx = db.templates.findIndex(t=>t.id===tpl.id);
      if(idx>=0) db.templates[idx]=tpl; else db.templates.push(tpl);
      save(); closeSheet(); render();
    };
  };
  draw();
}

  /* on tourne entre les trois positions, et on redessine tout :
     changer de langue change chaque écran, pas seulement cette ligne. */
  document.getElementById("st-lang").onclick = ()=>{
    const suite = {auto:"fr", fr:"en", en:"auto"};
    db.settings.lang = suite[db.settings.lang] || "fr";
    /* pas de closeSheet() : il passe par history.back(), asynchrone, et fermerait
       la fiche qu'on vient de rouvrir. openSheet() remplace le contenu en place. */
    save(); majTextesFixes(); render(); openSettings();
  };
  document.getElementById("st-units").onclick = ()=>{
    const suite = {auto:"metrique", metrique:"imperial", imperial:"auto"};
    db.settings.units = suite[db.settings.units] || "metrique";
    save(); render(); openSettings();
  };
  document.getElementById("st-legal").onclick = openLegal;
  document.getElementById("st-hints").onclick=()=>{ db.seen = {}; save(); closeSheet(); render(); toast(TR("Les explications réapparaîtront ✓")); };
  /* bloc sauvegarde automatique : seulement là où le navigateur le permet */
  const autoBox = document.getElementById("st-auto");
  if(!fileApiOk()){
    autoBox.innerHTML = `<div style="font-size:12px; color:var(--ink-mute); line-height:1.5; margin-bottom:4px;">La sauvegarde automatique dans un fichier n'est pas disponible sur ce navigateur (Safari/iPhone ne la propose pas). Tes données restent enregistrées dans le téléphone.</div>`;
  } else if(autoFile.ok){
    autoBox.innerHTML = `<div class="card" style="background:var(--surface2); padding:12px; margin-bottom:2px;">
      <div style="font-weight:700; color:var(--good); font-size:13.5px;">✓ Sauvegarde automatique active</div>
      <div style="font-size:12.5px; color:var(--ink-soft); margin:3px 0 10px;">${TR("Chaque modification est écrite dans <b>{}</b>, sans rien te demander.").replace("{}", esc(autoFile.name||TR("ton fichier")))}</div>
      <div class="row"><button class="btn btn-sm grow" id="af-change">${TR("Changer de fichier")}</button>
      <button class="btn btn-sm" id="af-off" style="color:var(--bad);">${TR("Désactiver")}</button></div></div>`;
    document.getElementById("af-change").onclick = autoFilePick;
    document.getElementById("af-off").onclick = autoFileOff;
  } else if(autoFile.handle){
    autoBox.innerHTML = `<div class="card" style="background:var(--surface2); padding:12px; margin-bottom:2px;">
      <div style="font-weight:700; color:var(--accent); font-size:13.5px;">${TR("⏸ Sauvegarde automatique en pause")}</div>
      <div style="font-size:12.5px; color:var(--ink-soft); margin:3px 0 10px;">Le navigateur redemande l'autorisation d'écrire dans ${esc(autoFile.name||TR("ton fichier"))}.</div>
      <button class="btn btn-accent btn-sm" id="af-resume" style="width:100%;">${TR("Réactiver")}</button></div>`;
    document.getElementById("af-resume").onclick = autoFileResume;
  } else {
    autoBox.innerHTML = `<button class="btn btn-accent" id="af-on" style="width:100%;">${TR("⚡ Activer la sauvegarde automatique")}</button>
      <div style="font-size:12px; color:var(--ink-mute); line-height:1.5; margin:6px 0 2px;">${TR("Tu choisis un fichier une seule fois, et l'app y écrit toute seule à chaque modification.")}</div>`;
    document.getElementById("af-on").onclick = autoFilePick;
  }
  const ago = ts => {
    if(!ts) return TR("jamais");
    const m = Math.round((Date.now()-Number(ts))/60000);
    if(m<1) return TR("à l'instant");
    if(m<60) return TR("il y a {} min").replace("{}", m);
    const h = Math.round(m/60);
    return h<24 ? TR("il y a {} h").replace("{}", h)
                : TR("il y a {} j").replace("{}", Math.round(h/24));
  };
  const ico = v => v==="ok" ? '<span style="color:var(--good);">✓</span>' : (v==="?" ? '<span style="color:var(--ink-mute);">…</span>' : '<span style="color:var(--bad);">✕</span>');
  const survived = (diag.lsMark || diag.idbMark) ? true : false;
  /* ce que contient l app, en une phrase : plus parlant qu une liste de diagnostics */
  const resume = document.getElementById("st-resume");
  if(resume){
    const n = (x,un,pl)=>`<b>${x}</b> ${x>1? (pl||un+"s") : un}`;
    resume.innerHTML = `${n(db.history.length,"séance")} enregistrée${db.history.length>1?"s":""}, `
      + `${n(db.weights.length,TR("pesée"))}, ${n((db.templates||[]).length,TR("séance type"),TR("séances types"))}.<br>`
      + TR("Tout est dans ce téléphone. Dernière sauvegarde fichier : {}.").replace("{}", ago(db.lastBackup));
  }
  document.getElementById("st-diag").innerHTML = `
    <div>${ico(diag.ls)} Mémoire principale : ${diag.ls}</div>
    <div>${ico(diag.idb)} Mémoire de secours : ${diag.idb}</div>
    <div>${survived? '<span style="color:var(--good);">✓</span>' : '<span style="color:var(--bad);">✕</span>'} Trace de la session précédente : ${survived? "retrouvée ("+ago(diag.lsMark||diag.idbMark)+")" : "perdue"}</div>
    <div style="color:var(--ink-mute);">${TR("Dernier enregistrement chargé :")} ${diag.loadedSavedAt? ago(diag.loadedSavedAt) : TR("aucun")}</div>
    <div style="color:var(--ink-mute);">${TR("Dernière sauvegarde fichier :")} ${ago(db.lastBackup)}</div>
    <div style="color:var(--ink-mute);">${TR("Écran maintenu allumé :")} ${esc(wakeEtat)}</div>
    <div style="color:var(--ink-mute); margin-top:6px;">Version ${BUILD}</div>
    ${!survived? `<div style="color:var(--bad); margin-top:8px; font-weight:600; line-height:1.5;">${TR("iOS efface la mémoire de l'app entre deux ouvertures. Utilise l'icône 💾 avant de fermer, et 📂 pour restaurer.")}</div>`:""}`;
  document.getElementById("st-file").onclick=async()=>{
    const btn = document.getElementById("st-file");
    const stamp = dayKey();
    try{
      const downloads = await useCap("downloads");
      if(!downloads) throw new Error("unavailable");
      await downloads.save({filename:`tonnage-sauvegarde-${stamp}.json`, data: JSON.stringify(db)});
      db.lastBackup = Date.now(); save();
      btn.textContent = TR("Sauvegarde enregistrée ✓");
    }catch(e){
      if(e && e.code==="declined"){ btn.textContent=TR("Sauvegarde annulée"); return; }
      btn.textContent = TR("Indisponible — utilise « Exporter en texte »");
    }
  };
  document.getElementById("st-restore-in").onchange=(ev)=>{
    const f = ev.target.files && ev.target.files[0];
    if(!f) return;
    const fr = new FileReader();
    fr.onload = ()=>{
      try{
        const d = JSON.parse(String(fr.result));
        if(!d || !Array.isArray(d.history)) throw 0;
        db = d; applyDefaults(); save(); closeSheet(); render();
        toast(TR("Sauvegarde restaurée ✓"));
      }catch(e){ toast("Fichier illisible"); }
    };
    fr.readAsText(f);
  };
  document.getElementById("st-export").onclick=()=>{
    openSheet(`<h3>Exporter</h3><p style="font-size:13.5px; color:var(--ink-soft); margin:0 0 10px;">${TR("Copie ce texte et garde-le quelque part (Notes, mail…). Tu pourras le recoller dans « Importer » pour tout restaurer.")}</p>
      <textarea id="ex-out" rows="8" readonly style="font-size:12px; font-family:ui-monospace,monospace;"></textarea>
      <button class="btn btn-accent" id="ex-copy" style="width:100%; margin-top:12px;">Copier</button>`);
    const ta = document.getElementById("ex-out");
    ta.value = JSON.stringify(db);
    document.getElementById("ex-copy").onclick=()=>{ ta.select(); document.execCommand("copy"); document.getElementById("ex-copy").textContent=TR("Copié ✓"); };
  };
  document.getElementById("st-import").onclick=()=>{
    openSheet(`<h3>Importer</h3><p style="font-size:13.5px; color:var(--ink-soft); margin:0 0 10px;">${TR("Colle ici un export précédent. Attention : cela remplace toutes les données actuelles.")}</p>
      <textarea id="im-in" rows="8" placeholder="Colle ton export ici…" style="font-size:12px; font-family:ui-monospace,monospace;"></textarea>
      <button class="btn btn-accent" id="im-ok" style="width:100%; margin-top:12px;">Importer</button>`);
    document.getElementById("im-ok").onclick=()=>{
      try{
        const d = JSON.parse(document.getElementById("im-in").value);
        if(!d || !Array.isArray(d.history)) throw 0;
        db = d; applyDefaults(); save(); closeSheet(); render(); toast(TR("Données restaurées ✓"));
      }catch(e){
        document.getElementById("im-ok").textContent=TR("Format invalide — vérifie le texte collé");
      }
    };
  };
  document.getElementById("st-reset").onclick=()=>askConfirm(TR("Tout effacer ?"),TR("Programmes, historique et exercices persos seront définitivement supprimés de ce téléphone."),"Tout effacer",true,()=>{
    db = {custom:[], templates:[], history:[], settings:{rest:90, goal:80, name:db.settings.name}, active:null, seq:1, weights:[], cardio:[], habits:["Petit-déj complet","Déjeuner solide","Dîner solide","Shake ou collation en +"], habitLog:{}}; save(); render();
  });
}

/* ================= HISTORIQUE ================= */
function renderHist(app){
  app.innerHTML = `
    ${hero(`<div class="big">${TR("Historique")}</div>`, {fermer:true})}
    <div class="under-hero" style="height:14px;"></div>
    <div class="stack" id="h-list"></div>`;
  wireTopbar();
  const list = document.getElementById("h-list");
  if(!db.history.length){
    list.innerHTML = `<div class="card empty"><div class="big">🕰️</div>${TR("Aucune séance enregistrée pour l'instant.")}<br>${TR("Elles apparaîtront ici une fois terminées.")}</div>`;
    return;
  }
  const hist = db.history.slice().reverse();
  list.innerHTML = hist.map(s=>{
    const vol = sessionVolume(s);
    const nSets = s.entries.reduce((n,e)=>n+e.sets.length,0);
    return `<div class="card" data-h="${s.id}">
      <div class="row" style="align-items:flex-start;">
        <div class="grow">
          <div style="font-weight:700;">${esc(s.name)}</div>
          <div class="t2" style="font-size:12.5px; color:var(--ink-mute); text-transform:capitalize;">${fmtDate(s.date)}</div>
        </div>
        <button class="icon-btn" data-hedit="${s.id}" style="width:32px; height:32px;">✎</button>
        <button class="icon-btn" data-hdel="${s.id}" style="color:var(--bad); width:32px; height:32px;">✕</button>
      </div>
      <div class="row" style="gap:6px; margin-top:8px; flex-wrap:wrap;">
        <span class="pill">${fmtDur(s.end-s.start)}</span>
        <span class="pill">${nSets} ${TR(nSets>1?"séries":"série")}</span>
        <span class="pill" style="color:var(--accent);">${pds(vol)}</span>
        <span class="pill">≈ ${liftKcal(s.end-s.start, vol, nSets)} kcal</span>
      </div>
      <div class="hist-detail">${s.entries.map(en=>`
        <div class="hist-ex"><div class="n">${esc(getEx(en.exId).name)}</div>
        <div class="s">${en.sets.map(st=>`${fmtKg(st.w)}×${st.r}${(st.drops||[]).map(d=>` ↳ ${fmtKg(d.w)}×${d.r}`).join("")}`).join(" · ")}</div></div>`).join("")}
      </div>
    </div>`;
  }).join("");
  list.querySelectorAll("[data-h]").forEach(c=>c.addEventListener("click", e=>{
    if(e.target.closest("[data-hdel]") || e.target.closest("[data-hedit]")) return;
    c.querySelector(".hist-detail").classList.toggle("show");
  }));
  list.querySelectorAll("[data-hedit]").forEach(b=>b.onclick=()=>openHistEdit(b.dataset.hedit));
  list.querySelectorAll("[data-hdel]").forEach(b=>b.onclick=()=>{
    const s = db.history.find(x=>x.id===b.dataset.hdel);
    askConfirm(TR("Supprimer cette séance ?"), `${s.name} du ${fmtDateShort(s.date)} sera retirée de l'historique et des courbes.`, TR("Supprimer"), true, ()=>{
      db.history = db.history.filter(x=>x.id!==s.id); save(); render();
    });
  });
}

/* modifier une séance déjà enregistrée (erreur de saisie, oubli d'une série…) */
function openHistEdit(id){
  const s = db.history.find(x=>x.id===id);
  if(!s) return;
  const corps = s.entries.map((en,ei)=>{
    const ex = getEx(en.exId);
    return `<div class="tpl-item">
      <div class="row" style="margin-bottom:8px;">
        <div class="grow" style="font-weight:700; font-size:14px;">${esc(ex.name)}</div>
        <button class="icon-btn" data-hex-del="${ei}" style="width:30px; height:30px; color:var(--bad);">✕</button>
      </div>
      <div class="set-cols" style="margin-bottom:4px;"><span></span><span>${uPoids()}</span><span>${TR("reps")}</span><span></span><span></span></div>
      ${en.sets.map((st,si)=>`<div class="set-row" style="margin-bottom:6px;">
        <div class="n">${st.warm? TR("Éch.") : si+1}</div>
        <input type="number" inputmode="decimal" step="0.5" min="0" value="${st.w}" data-hw="${ei}.${si}">
        <input type="number" inputmode="numeric" min="0" value="${st.r}" data-hr="${ei}.${si}">
        <span></span>
        <button class="ck" data-hset-del="${ei}.${si}" style="color:var(--bad); font-size:14px;">✕</button>
      </div>
      ${(st.drops||[]).map((d,di)=>`<div class="set-row drop" style="margin-bottom:6px;">
        <div class="n">↳</div>
        <input type="number" inputmode="decimal" step="0.5" min="0" value="${d.w}" data-hdw="${ei}.${si}.${di}">
        <input type="number" inputmode="numeric" min="0" value="${d.r}" data-hdr="${ei}.${si}.${di}">
        <span></span>
        <button class="ck" data-hdrop-del="${ei}.${si}.${di}" style="color:var(--bad); font-size:14px;">✕</button>
      </div>`).join("")}`).join("")}
      <button class="btn btn-sm btn-ghost" data-hset-add="${ei}" style="width:100%; margin-top:4px;">＋ ${TR("série")}</button>
    </div>`;
  }).join("");
  openSheet(`<h3>${TR("Modifier la séance")}</h3>
    <div style="font-size:12.5px; color:var(--ink-mute); margin-bottom:12px; text-transform:capitalize;">${esc(s.name)} · ${fmtDate(s.date)}</div>
    <div style="max-height:56dvh; overflow-y:auto;">${corps || `<div class="empty">${TR("Séance vide.")}</div>`}</div>
    <button class="btn btn-accent" id="he-ok" style="width:100%; margin-top:12px;">${TR("Enregistrer")}</button>
    <button class="btn btn-ghost" id="he-cancel" style="width:100%; margin-top:8px;">${TR("Annuler")}</button>`);

  document.querySelectorAll("[data-hw]").forEach(i=>i.oninput=()=>{
    const [ei,si] = i.dataset.hw.split(".").map(Number);
    s.entries[ei].sets[si].w = parseFloat(i.value)||0;
  });
  document.querySelectorAll("[data-hr]").forEach(i=>i.oninput=()=>{
    const [ei,si] = i.dataset.hr.split(".").map(Number);
    s.entries[ei].sets[si].r = parseInt(i.value)||0;
  });
  document.querySelectorAll("[data-hdw]").forEach(i=>i.oninput=()=>{
    const [ei,si,di] = i.dataset.hdw.split(".").map(Number);
    s.entries[ei].sets[si].drops[di].w = parseFloat(i.value)||0;
  });
  document.querySelectorAll("[data-hdr]").forEach(i=>i.oninput=()=>{
    const [ei,si,di] = i.dataset.hdr.split(".").map(Number);
    s.entries[ei].sets[si].drops[di].r = parseInt(i.value)||0;
  });
  document.querySelectorAll("[data-hdrop-del]").forEach(b=>b.onclick=()=>{
    const [ei,si,di] = b.dataset.hdropDel.split(".").map(Number);
    const st = s.entries[ei].sets[si];
    st.drops.splice(di,1);
    if(!st.drops.length) delete st.drops;
    save(); openHistEdit(id);
  });
  document.querySelectorAll("[data-hset-del]").forEach(b=>b.onclick=()=>{
    const [ei,si] = b.dataset.hsetDel.split(".").map(Number);
    s.entries[ei].sets.splice(si,1);
    if(!s.entries[ei].sets.length) s.entries.splice(ei,1);
    openHistEdit(id);
  });
  document.querySelectorAll("[data-hset-add]").forEach(b=>b.onclick=()=>{
    const ei = parseInt(b.dataset.hsetAdd);
    const prev = s.entries[ei].sets[s.entries[ei].sets.length-1] || {w:0,r:0};
    s.entries[ei].sets.push({w:prev.w, r:prev.r, done:true, warm:false, rir:null});
    openHistEdit(id);
  });
  document.querySelectorAll("[data-hex-del]").forEach(b=>b.onclick=()=>{
    const ei = parseInt(b.dataset.hexDel);
    askConfirm(TR("Retirer cet exercice ?"), `${getEx(s.entries[ei].exId).name} sera retiré de cette séance.`, TR("Retirer"), true, ()=>{
      s.entries.splice(ei,1); save(); openHistEdit(id);
    });
  });
  document.getElementById("he-cancel").onclick=()=>{ closeSheet(); render(); };
  document.getElementById("he-ok").onclick=()=>{
    s.entries = s.entries.filter(en=>en.sets.length);
    if(!s.entries.length) db.history = db.history.filter(x=>x.id!==id);
    save(); closeSheet(); render(); toast(TR("Séance modifiée ✓"));
  };
}

/* ================= PROGRESSION ================= */
let prgEx = null, prgMetric = "max";
/* ce que l'utilisateur a déplié : conservé d'un rendu à l'autre */
const prgPlis = {poids:false, analyse:false};
const CHEV = '<svg viewBox="0 0 20 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l7 5 7-5"/><path d="M3 8.5l7 3 7-3" opacity=".45"/></svg>';
/* une languette centrée qui déplie le bloc « cible » */
function pliBouton(id, ouvert, libelle){
  return `<div class="pli"><button id="${id}" aria-expanded="${ouvert}" aria-label="${esc(libelle)}">${CHEV}</button></div>`;
}
function renderProgress(app){
  const counts = {};
  db.history.forEach(s=>s.entries.forEach(en=>{ counts[en.exId]=(counts[en.exId]||0)+1; }));
  const exIds = Object.keys(counts).sort((a,b)=>counts[b]-counts[a]);

  app.innerHTML = `
    ${hero(`<div class="big">${TR("Progression")}</div>`)}
    <div class="under-hero stack" id="wt-sec"></div>
    <div id="prg-body"></div>`;
  wireTopbar();
  renderWeightSection(document.getElementById("wt-sec"));
  renderProteinSection(document.getElementById("wt-sec"));
  renderMuscleSection(document.getElementById("wt-sec"));
  renderCardioSection(document.getElementById("wt-sec"));
  const body = document.getElementById("prg-body");
  if(!exIds.length){
    body.innerHTML = `<div class="card" style="margin-top:14px;">
      <div class="card-t">${TR("Évolution des charges")}</div>
      <div class="empty" style="padding:20px 10px;">${TR("Tes courbes par exercice apparaîtront ici après tes premières séances.")}</div>
    </div>`;
    return;
  }
  if(!prgEx || !exIds.includes(prgEx)) prgEx = exIds[0];

  body.innerHTML = `
    <div class="card" style="margin-top:14px;">
      <div class="card-t" style="margin-bottom:10px;">${TR("Évolution des charges")}</div>
      <select id="prg-sel" style="margin-bottom:12px;">${exIds.map(id=>`<option value="${id}" ${id===prgEx?"selected":""}>${esc(getEx(id).name)}</option>`).join("")}</select>
      <div class="chips" style="margin-bottom:14px;">
        <button class="chip ${prgMetric==="max"?"on":""}" data-m="max">${TR("Charge max")}</button>
        <button class="chip ${prgMetric==="1rm"?"on":""}" data-m="1rm">${TR("1RM estimé")}</button>
        <button class="chip ${prgMetric==="vol"?"on":""}" data-m="vol">Volume</button>
      </div>
      <div class="tiles" id="prg-tiles"></div>
      <div class="chart-wrap" id="chart-wrap" style="margin-top:12px;"><div class="chart-tip" id="chart-tip"></div></div>
    </div>`;
  /* changer d'exercice ou de mesure ne doit pas renvoyer en haut de page */
  document.getElementById("prg-sel").onchange=e=>{ prgEx=e.target.value; renderSurPlace(); };
  body.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{ prgMetric=b.dataset.m; renderSurPlace(); });

  // series: one point per session containing this exercise
  const pts = [];
  db.history.forEach(s=>{
    const en = s.entries.find(e=>e.exId===prgEx);
    if(!en) return;
    const sets = workSets(en);
    if(!sets.length) return;
    let v;
    if(prgMetric==="max") v = Math.max(...sets.map(st=>st.w||0));
    else if(prgMetric==="1rm") v = Math.max(...sets.map(st=>e1rm(st.w||0, st.r||0)));
    else v = sets.reduce((x,st)=>x+volSerie(st),0)*facteurCharge(prgEx);
    if(estImperial()) v *= PAR_LB;
    pts.push({date:s.date, v:Math.round(v*10)/10});
  });

  const unit = uPoids();
  const record = Math.max(...pts.map(p=>p.v));
  const lastV = pts[pts.length-1].v;
  document.getElementById("prg-tiles").innerHTML = `
    <div class="tile"><div class="v" style="color:var(--accent);">${fmtKg(record)}</div><div class="u">record (${unit})</div></div>
    <div class="tile"><div class="v">${fmtKg(lastV)}</div><div class="u">${TR("dernière")} (${unit})</div></div>
    <div class="tile"><div class="v">${pts.length}</div><div class="u">${TR("séance")}${pts.length>1?TR("s"):""}</div></div>`;

  drawChart(document.getElementById("chart-wrap"), pts, unit);
}

function renderWeightSection(sec){
  const ws = db.weights.slice().sort((a,b)=>new Date(a.date)-new Date(b.date));
  const cur = ws.length? ws[ws.length-1].kg : null;
  const goal = db.settings.goal;
  const delta = (cur!==null && goal>0)? Math.round((goal-cur)*10)/10 : null;
  const first = ws.length? ws[0].kg : null;
  const total = (cur!==null && first!==null)? Math.round((cur-first)*10)/10 : null;
  /* où en est-on entre la première pesée et le poids visé ? */
  const depart = (db.profile && db.profile.weight > 0 && ws.length) ? ws[0].kg : first;
  let pct = null;
  if(cur !== null && goal > 0 && depart !== null && Math.abs(goal - depart) > 0.05)
    pct = Math.max(0, Math.min(100, (cur - depart)/(goal - depart)*100));
  const ouvert = prgPlis.poids;
  sec.innerHTML = `
    <div class="card">
      <div class="row" style="align-items:center; gap:11px;">
        <div class="card-t grow">${TR("Poids")}</div>

/* muscles suivis dans le profil, avec le nom court affiché sur la silhouette */
const MP_MUSCLES = ["Pectoraux","Grand dorsal","Trapèzes","Deltoïdes","Biceps","Triceps","Avant-bras",
                    "Quadriceps","Ischio-jambiers","Fessiers","Mollets","Abdos","Lombaires"];
/* rattache un libellé précis (« Pectoraux (haut) », « Mollets (soléaire) »…) à son groupe suivi */
function groupeDe(nom){
  const base = nom.replace(/\s*\(.*\)$/, "");
  if(MP_MUSCLES.includes(base)) return base;
  if(base==="Obliques") return "Abdos";
  if(base==="Avant-bras") return "Avant-bras";
  if(base==="Brachial") return "Biceps";
  return null;   /* Avant-bras, Adducteurs… : pas de zone sur la silhouette */
}
/* ===== Récupération : ce que tes séances récentes ont laissé comme fatigue ===== */
/* heures de récupération complète après une sollicitation lourde, par groupe */
const RECUP_H = {
  "Pectoraux":48, "Grand dorsal":48, "Trapèzes":36, "Deltoïdes":36,
  "Biceps":36, "Triceps":36, "Avant-bras":24, "Quadriceps":72, "Ischio-jambiers":72,
  "Fessiers":60, "Mollets":36, "Abdos":36, "Lombaires":60
};
/* Coût d'une série : l'échec coûte plus cher, la réserve moins.
   Un dégressif prolonge la série au-delà de l'échec, il ajoute sa part. */
function poidsFatigue(st){
  const r = (st.rir === undefined || st.rir === null) ? 1.5 : st.rir;
  let f = r <= 0 ? 1.35 : (r <= 2 ? 1 : 0.7);
  f += (st.drops || []).length * 0.35;
  return f;
}
/* état de chaque groupe : 100 % = frais, 0 % = à plat */
function recuperation(){
  const now = Date.now();
  const fat = {};
  MP_MUSCLES.forEach(m=>fat[m]=0);
  db.history.forEach(sess=>{
    const t = new Date(sess.date).getTime();
    const heures = (now - t)/36e5;
    if(heures < 0 || heures > 96) return;
    sess.entries.forEach(en=>{
      const ex = getEx(en.exId);
      const series = (en.sets||[]).filter(x=>x.done && !x.warm);
      if(!series.length) return;
      /* une série menée à l'échec fatigue bien plus qu'une série gardée en réserve */
      const cout = series.reduce((a,st)=>a + poidsFatigue(st), 0);
      (MUSCLE_WORK[nomCanon(ex)]||[]).forEach(([mus, niveau])=>{
        const g = groupeDe(mus);
        if(!g) return;
        const plein = RECUP_H[g] || 48;
        if(heures >= plein) return;
        const reste = 1 - heures/plein;              /* la fatigue s'efface avec le temps */
        fat[g] += cout * (niveau/3) * 11 * reste;    /* ~11 points pour 1 série lourde à 1-2 reps de l'échec */
      });
    });
  });
  const muscles = {};
  MP_MUSCLES.forEach(m=>{
    const pct = Math.max(0, Math.min(100, Math.round(100 - fat[m])));
    muscles[m] = {pct, etat: pct>=85? "frais" : (pct>=50? "recup" : "fatigue")};
  });
  const vals = MP_MUSCLES.map(m=>muscles[m].pct);
  const global = Math.round(vals.reduce((a,b)=>a+b,0)/vals.length);
  const n = {frais:0, recup:0, fatigue:0};
  MP_MUSCLES.forEach(m=>n[muscles[m].etat]++);
  return {global, muscles, n};
}
const RECUP_C = {frais:"#4caf50", recup:"#e8a33d", fatigue:"#e0554a"};

  if(g >= 85) return TR("Prêt à t'entraîner");
  if(g >= 65) return TR("Presque remis");
  if(g >= 45) return TR("Récupération en cours");
  return TR("Repos conseillé");
}

function recupPire(r){
  const m = MP_MUSCLES.slice().sort((a,b)=>r.muscles[a].pct - r.muscles[b].pct)[0];
  return {nom:m, pct:r.muscles[m].pct, etat:r.muscles[m].etat};
}

function muscleProfile(){
  const bw = currentWeight() || 75;
  const byEx = {};
  db.history.forEach(s=>s.entries.forEach(en=>{
    const ex = getEx(en.exId);
    const ref = STRENGTH_REF[nomCanon(ex)];
    const sets = workSets(en);
    if(!ref || !sets.length) return;
    /* un exercice fait bras par bras : la charge d'un côté vaut le double en équivalent bilatéral */
    const f = (db.unilat && db.unilat[en.exId] && !dejaParCote(en.exId)) ? 2 : 1;
    const best = Math.max(...sets.map(st=>e1rm((st.w||0)*f, st.r||0)));
    if(best<=0) return;
    (byEx[en.exId] = byEx[en.exId] || {nom:nomCanon(ex), ref, vals:[]}).vals.push(best);
  }));
  const agg = {};
  Object.values(byEx).forEach(o=>{
    const val = Math.max(...o.vals.slice(-3));            /* forme récente */
    const score = val/(o.ref*bw)*100;
    const wgt = Math.min(3, o.vals.length);
    /* l'exercice alimente tous les muscles qu'il sollicite fortement */
    const cibles = (MUSCLE_WORK[o.nom]||[]).filter(([m,n])=>n===3).map(([m])=>groupeDe(m)).filter(Boolean);
    [...new Set(cibles)].forEach(g=>{
      const m = agg[g] = agg[g] || {sum:0, w:0, n:0};
      m.sum += score*wgt; m.w += wgt; m.n += o.vals.length;
    });
  });
  const out = {};
  MP_MUSCLES.forEach(name=>{
    const m = agg[name];
    out[name] = (m && m.n>=2) ? Math.round(m.sum/m.w) : null;
  });
  return out;
}
/* moyenne de tes propres scores : c'est elle qui sert de référence, pas un barème absolu */
function mpMoyenne(prof){
  const vals = MP_MUSCLES.map(m=>prof[m]).filter(v=>v!==null);
  if(vals.length < 3) return null;                 /* trop peu de groupes pour se comparer à soi-même */
  return vals.reduce((a,b)=>a+b,0)/vals.length;
}
/* score : ton niveau sur ce groupe. moy : ta moyenne. On compare l'écart en points de pourcentage. */
function mpStatus(score, moy){
  if(score===null) return {tag:TR("Pas encore assez de données"), color:"#3b352c", op:1, nodata:true};
  if(moy === null || moy <= 0){
    /* pas encore de quoi comparer : on retombe sur le barème absolu */
    if(score>=115) return {tag:TR("Point fort"), color:"var(--good)", op:1};
    if(score>=105) return {tag:TR("Point fort léger"), color:"var(--good)", op:.7};
    if(score>=95)  return {tag:TR("Équilibré"), color:"#b9a97f", op:1};
    if(score>=85)  return {tag:TR("Point faible léger"), color:"var(--bad)", op:.7};
    return {tag:TR("Point faible"), color:"var(--bad)", op:1};
  }
  const ecart = (score - moy) / moy * 100;          /* en % de ta moyenne */
  if(ecart >= 15) return {tag:TR("Point fort"), color:"var(--good)", op:1, ecart};
  if(ecart >= 6)  return {tag:TR("Point fort léger"), color:"var(--good)", op:.7, ecart};
  if(ecart > -6)  return {tag:TR("Équilibré"), color:"#b9a97f", op:1, ecart};
  if(ecart > -15) return {tag:TR("Point faible léger"), color:"var(--bad)", op:.7, ecart};
  return {tag:TR("Point faible"), color:"var(--bad)", op:1, ecart};
}

function lienEntre(m1, m2){
  for(const l of LIENS){
    if((l.a===m1 && l.b.includes(m2)) || (l.a===m2 && l.b.includes(m1))) return TR(l.txt);
  }
  return null;
}
function analyseProfil(prof){
  const connus = MP_MUSCLES.filter(m=>prof[m]!==null);
  const nbSeances = db.history.length;
  if(connus.length < 2){
    return `<div class="analyse">
      <p style="margin:0;">${TR("Avec {} séances enregistrées, il me manque encore de la matière pour te dire quelque chose d'utile.").replace("{}", nbSeances)} ${TR("Il faut deux passages sur un même exercice pour qu'un muscle apparaisse ici. Continue à logger, l'analyse se remplira")} toute seule.</p>
    </div>`;
  }
  const tries = connus.slice().sort((a,b)=>prof[a]-prof[b]);
  const faible = tries[0], fort = tries[tries.length-1];
  const moyenneBrute = connus.reduce((a,m)=>a+prof[m],0)/connus.length;
  const moyenne = Math.round(moyenneBrute);
  /* tout est exprimé en % de ta moyenne, comme les barres juste au-dessus */
  const pc = m => Math.round((prof[m] - moyenneBrute) / moyenneBrute * 100);
  /* le français met une espace avant %, l'anglais n'en met pas */
  const signe = v => (v>=0? "+" : "−") + Math.abs(v) + (langue()==="en" ? "%" : " %");
  const ecart = Math.round((prof[fort] - prof[faible]) / moyenneBrute * 100);

  /* ce que tu fais réellement */
  const freq = {};
  db.history.forEach(s=>s.entries.forEach(en=>{ freq[en.exId] = (freq[en.exId]||0)+1; }));
  const cible = m => allEx().filter(e=>(MUSCLE_WORK[nomCanon(e)]||[]).some(([mm,n])=>n===3 && groupeDe(mm)===m));
  const exFort = cible(fort).filter(e=>freq[e.id]).sort((a,b)=>freq[b.id]-freq[a.id])[0];
  const pourFaible = cible(faible);
  const faits = pourFaible.filter(e=>freq[e.id]).sort((a,b)=>freq[b.id]-freq[a.id]);
  const jamais = pourFaible.filter(e=>!freq[e.id]);
  const dansProgrammes = pourFaible.filter(e=>db.templates.some(t=>t.items.some(i=>i.exId===e.id)));

  /* 1. le constat, avec tes chiffres */
  let constat = TR("Sur tes {n} séances, ton point fort est <b style=\"color:var(--good);\">{m}</b>, à {e} de ta moyenne")
    .replace("{n}", nbSeances).replace("{m}", TR(fort).toLowerCase()).replace("{e}", signe(pc(fort)));
  constat += exFort ? TR(", porté par {n} passages sur {ex}. ").replace("{n}", freq[exFort.id]).replace("{ex}", exFort.name.toLowerCase()) : ". ";
  constat += TR("Ton retard est sur <b style=\"color:var(--bad);\">{m}</b>, à {e}")
    .replace("{m}", TR(faible).toLowerCase()).replace("{e}", signe(pc(faible)));
  if(!faits.length) constat += TR(", et c'est logique : tu n'as encore enregistré aucun exercice qui le cible directement.");
  else if(faits.length && freq[faits[0].id] <= 2) constat += TR(", avec seulement {n} passages sur {ex}.").replace("{n}", freq[faits[0].id]).replace("{ex}", faits[0].name.toLowerCase());
  else constat += TR(", malgré {n} passages sur {ex} — la fréquence est là, c'est donc la charge ou l'intensité qu'il faut monter.").replace("{n}", freq[faits[0].id]).replace("{ex}", faits[0].name.toLowerCase());

  /* 2. l'écart : on n'invoque un risque que si le lien existe */
  const lien = lienEntre(fort, faible);
  let diagnostic;
  if(ecart < 20){
    diagnostic = TR("Seulement {} % séparent tes deux extrêmes : ton développement est <b>remarquablement homogène</b>. À ce stade, inutile de chasser un point faible — continue à charger partout.").replace("{}", ecart);
  } else if(lien){
    diagnostic = TR("{} % d'écart entre les deux.").replace("{}", ecart) + " " + lien;
  } else if(ecart < 45){
    diagnostic = TR("{} % d'écart. Ces deux muscles ne travaillent pas ensemble, il n'y a donc aucun risque à cet écart — c'est simplement là que tu as le plus de marge de progression facile.").replace("{}", ecart);
  } else {
    diagnostic = TR("{} % d'écart. Ces deux muscles sont indépendants, donc pas d'inquiétude côté blessure : c'est un simple retard de travail, et le rattraper est ce qui changera le plus vite ta silhouette.").replace("{}", ecart);
  }

  /* 3. l'action, à partir de tes programmes */
  let action;
  if(ecart < 20){
    const g0 = GAIN_MENSUEL[faible] || {};
    return `<div class="analyse">
      <p style="margin:0 0 8px;">${constat}</p>
      <p style="margin:0 0 8px;">${diagnostic}</p>
      <p style="margin:0 0 8px;">${TR("Le bon réflexe maintenant n'est pas de rattraper quoi que ce soit, mais d'<b>ajouter de la charge partout</b> : 2,5 kg de plus dès que tu tiens le haut de ta fourchette de répétitions. Un physique équilibré progresse en bloc.")}</p>
      <p style="margin:0; font-size:11px; color:var(--ink-mute);">${TR("Écarts calculés par rapport à ta propre moyenne, sur {} groupes suivis. Ces repères supposent assez de protéines et de sommeil, et ralentissent avec l'expérience.").replace("{}", connus.length)}</p>
    </div>`;
  }
  if(dansProgrammes.length){
    action = TR("{} est déjà dans tes séances : place-le <b>en premier exercice</b>, quand tu es frais, plutôt qu'en fin de séance.").replace("{}", dansProgrammes[0].name);
  } else if(jamais.length){
    action = TR("Aucun exercice de {m} n'est dans tes programmes. Ajoute <b>{a}</b>{b} — c'est le geste le plus rentable que tu puisses faire ce mois-ci.")
      .replace("{m}", TR(faible).toLowerCase()).replace("{a}", jamais[0].name.toLowerCase())
      .replace("{b}", jamais[1] ? " " + TR("ou") + " " + jamais[1].name.toLowerCase() : "");
  } else {
    action = TR("Garde {} mais monte les charges : tu es à un niveau où la progression vient de l'intensité, plus de la répétition.").replace("{}", faits[0].name.toLowerCase());
  }

  /* 4. la projection chiffrée */
  const g = GAIN_MENSUEL[faible] || {};
  const projection = (g.min>0)
    ? TR("En le travaillant deux fois par semaine, compte <b>{min} à {max} cm {quoi} par mois</b>. Sur une semaine c'est invisible ; sur six mois, ça se voit sur les photos.")
        .replace("{min}", g.min.toLocaleString(loc())).replace("{max}", g.max.toLocaleString(loc())).replace("{quoi}", TR(g.mesure))
    : TR("Deux passages par semaine suffisent à combler ce retard en quelques semaines.");

  return `<div class="analyse">
    <p style="margin:0 0 8px;">${constat}</p>
    <p style="margin:0 0 8px;">${diagnostic}</p>
    <p style="margin:0 0 8px;">${action} ${projection}</p>
    <p style="margin:0; font-size:11px; color:var(--ink-mute);">${TR("Écarts calculés par rapport à ta propre moyenne, sur {} groupes suivis. Ces repères supposent assez de protéines et de sommeil, et ralentissent avec l'expérience.").replace("{}", connus.length)}</p>
  </div>`;
}

function renderCardioSection(sec){
  if(db.cardio.length < 2) return;
  const weeks = {};
  db.cardio.forEach(c=>{
    const d = new Date(c.date); d.setHours(0,0,0,0);
    d.setDate(d.getDate() - ((d.getDay()+6)%7));
    const k = dayKey(d);
    weeks[k] = (weeks[k]||0) + c.km;

  const keys = Object.keys(weeks).sort();
  if(keys.length < 2) return;
  const pts = keys.map(k=>({date:k, v:Math.round(weeks[k]*10)/10}));

  div.innerHTML = `<div class="card">

function drawChart(wrap, pts, unit, goal){
  const W = Math.max(280, wrap.clientWidth || 300), H = 220;
  const padL = 40, padR = 16, padT = 18, padB = 26;
  let min0 = Math.min(...pts.map(p=>p.v)), max0 = Math.max(...pts.map(p=>p.v));
  const useGoal = goal && Math.abs(goal - pts[pts.length-1].v) <= 12;
  if(useGoal){ min0 = Math.min(min0, goal); max0 = Math.max(max0, goal); }
  const span = (max0-min0)||1;
  const lo = Math.max(0, min0 - span*0.15), hi = max0 + span*0.15;
  const X = i => pts.length===1 ? W/2 : padL + (W-padL-padR) * i/(pts.length-1);
  const Y = v => padT + (H-padT-padB) * (1 - (v-lo)/(hi-lo));

  let grid="", ylab="";
  for(let g=0; g<4; g++){
    const v = lo + (hi-lo)*g/3;
    const y = Y(v);
    grid += `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="var(--border)" stroke-width="1"/>`;
    ylab += `<text x="${padL-7}" y="${y+4}" text-anchor="end" font-size="10.5" fill="var(--ink-mute)" style="font-variant-numeric:tabular-nums;">${(hi-lo)<4? (Math.round(v*10)/10).toLocaleString(loc()) : Math.round(v)}</text>`;
  }
  const path = pts.map((p,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(p.v).toFixed(1)).join(" ");
  const area = pts.length>1 ? path + ` L${X(pts.length-1).toFixed(1)} ${H-padB} L${X(0).toFixed(1)} ${H-padB} Z` : "";
  const dots = pts.map((p,i)=>{
    const lastP = i===pts.length-1;
    return `<circle cx="${X(i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="${lastP?5:3.5}" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>`;
  }).join("");
  const lastLabel = `<text x="${Math.min(X(pts.length-1), W-padR-4).toFixed(1)}" y="${(Y(pts[pts.length-1].v)-11).toFixed(1)}" text-anchor="${pts.length===1?"middle":"end"}" font-size="12" font-weight="700" fill="var(--ink)" style="font-variant-numeric:tabular-nums;">${fmtKg(pts[pts.length-1].v)}</text>`;
  const xl0 = `<text x="${X(0).toFixed(1)}" y="${H-8}" text-anchor="${pts.length===1?"middle":"start"}" font-size="10.5" fill="var(--ink-mute)">${fmtDateShort(pts[0].date)}</text>`;
  const xl1 = pts.length>1? `<text x="${X(pts.length-1).toFixed(1)}" y="${H-8}" text-anchor="end" font-size="10.5" fill="var(--ink-mute)">${fmtDateShort(pts[pts.length-1].date)}</text>`:"";

  wrap.innerHTML = `<div class="chart-tip" id="chart-tip"></div>
    <svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" id="chart-svg" style="display:block; touch-action:pan-y;">
      ${grid}${ylab}
      ${useGoal? `<line x1="${padL}" y1="${Y(goal).toFixed(1)}" x2="${W-padR}" y2="${Y(goal).toFixed(1)}" stroke="var(--good)" stroke-width="1.5" stroke-dasharray="5 4" opacity=".85"/>
        <text x="${W-padR}" y="${(Y(goal)-6).toFixed(1)}" text-anchor="end" font-size="10.5" font-weight="700" fill="var(--good)">objectif ${fmtKg(goal)}</text>`:""}
      ${area?`<path d="${area}" fill="var(--accent)" opacity="0.10"/>`:""}
      ${pts.length>1?`<path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`:""}
      <line id="cross" x1="0" y1="${padT}" x2="0" y2="${H-padB}" stroke="var(--ink-mute)" stroke-width="1" stroke-dasharray="3 3" style="display:none;"/>
      ${dots}${lastLabel}${xl0}${xl1}
    </svg>`;

  const svg = wrap.querySelector("#chart-svg");
  const tip = wrap.querySelector("#chart-tip");
  const cross = wrap.querySelector("#cross");
  const showTip = clientX=>{
    const rect = svg.getBoundingClientRect();
    const sx = (clientX-rect.left) * (W/rect.width);
    let best=0, bd=1e9;
    pts.forEach((p,i)=>{ const d=Math.abs(X(i)-sx); if(d<bd){bd=d; best=i;} });
    const p = pts[best];
    cross.style.display="block";
    cross.setAttribute("x1", X(best)); cross.setAttribute("x2", X(best));
    tip.style.display="block";
    tip.innerHTML = `${fmtDateShort(p.date)} — <b>${fmtKg(p.v)} ${unit}</b>`;
    const tx = Math.min(Math.max(4, X(best)/W*rect.width - 50), rect.width-110);
    tip.style.left = tx+"px";
    tip.style.top = Math.max(0, Y(p.v)/H*220 - 44)+"px";
  };
  const hide = ()=>{ tip.style.display="none"; cross.style.display="none"; };
  svg.addEventListener("pointerdown", e=>showTip(e.clientX));
  svg.addEventListener("pointermove", e=>{ if(e.pressure>0 || e.pointerType==="mouse") showTip(e.clientX); });
  svg.addEventListener("pointerleave", hide);
}

/* ================= WAKE LOCK (écran allumé pendant la séance) ================= */
let wakeLock = null;
let wakeEtat = ("wakeLock" in navigator) ? TR("en attente") : TR("non supporté par ce navigateur");
async function syncWakeLock(){
  const voulu = !!db.active && db.settings.ecranAllume !== false;
  if(!("wakeLock" in navigator)) return;
  try{
    if(voulu){
      if(!wakeLock && !document.hidden){
        wakeLock = await navigator.wakeLock.request("screen");
        wakeEtat = "actif";
        wakeLock.addEventListener("release", ()=>{ wakeLock = null; if(wakeEtat==="actif") wakeEtat = TR("relâché"); });
      }
    } else if(wakeLock){
      await wakeLock.release(); wakeLock = null; wakeEtat = TR("inactif hors séance");
    }
  }catch(e){ wakeEtat = "refusé : " + (e && e.name ? e.name : "erreur"); }
}
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) syncWakeLock(); });
/* certains navigateurs n'accordent le verrou qu'après une interaction : on retente au premier contact */
["pointerdown","touchstart"].forEach(ev=>document.addEventListener(ev, ()=>{ if(db.active && !wakeLock) syncWakeLock(); }, {passive:true}));
const _origRender = render;
render = function(){ _origRender(); syncWakeLock(); };

/* ================= INIT ================= */
appliquerTheme();
majTextesFixes();
render();
if(!db.profile) setTimeout(()=>{ if(!db.profile) openOnboarding(true); }, 400);

/* récupération : si IndexedDB détient une version plus récente (ou que localStorage a été vidé) */
(async ()=>{
  /* marqueur IndexedDB pour le diagnostic */
  try{
    const d = await idbOpen();
    if(!d){ diag.idb = TR("bloqué"); }
    else {
      diag.idbMark = await new Promise(res=>{
        try{ const r=d.transaction("kv","readonly").objectStore("kv").get(MARK); r.onsuccess=()=>res(r.result||null); r.onerror=()=>res(null); }catch(e){ res(null); }
      });
      try{ d.transaction("kv","readwrite").objectStore("kv").put(String(Date.now()), MARK); diag.idb="ok"; }catch(e){ diag.idb=TR("bloqué"); }
    }
  }catch(e){ diag.idb = TR("bloqué"); }

  /* fichier de sauvegarde automatique choisi lors d'une session précédente */
  if(fileApiOk()){
    const h = await idbTake(AUTOFILE);
    if(h){
      autoFile.handle = h; autoFile.name = h.name || "";
      try{ autoFile.ok = (await h.queryPermission({mode:"readwrite"})) === "granted"; }catch(e){ autoFile.ok = false; }
    }
  }

  const raw = await idbGet();
  if(!raw){ if(!isEmptyDb(db)) save(); return; }
  let alt=null;
  try{ alt = JSON.parse(raw); }catch(e){ return; }
  if(!alt) return;
  const mine = db.savedAt||0, theirs = alt.savedAt||0;
  if(theirs>mine || (isEmptyDb(db) && !isEmptyDb(alt))){
    db = alt; applyDefaults(); save(); render();
    if(isEmptyDb(db)===false) toast(TR("Données récupérées ✓"));
  }
})();
</script>
