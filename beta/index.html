<meta charset="utf-8">
<title>Tonnup bêta</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b1b1d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tonnup bêta">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});}</script>
<style>
  :root{
    /* clair : fond crème, bandeau sombre, orange franc — d'après la maquette Figma */
    --bg:#EBE8E1; --surface:#ffffff; --surface2:#f3f0e9; --btn:#EBE8E1; --border:#e0dbd1;
    --ink:#17181a; --ink-soft:#5c5c5e; --ink-mute:#8e8e90;
    --accent:#f58220; --accent-deep:#d96f10; --accent-ink:#ffffff;
    --hero:#1b1b1d; --hero-ink:#ffffff; --hero-soft:#c9c7c3;
    --good:#5cb22e; --bad:#e0554a;
    --barre:rgba(255,255,255,.96);
    --sheet:#f4f1eb; --field:#ffffff;
    --figure:invert(1);
    --radius:16px;
    --matin:#3ca0e8; --midi:#f58220; --collation:#5b5bd6; --soir:#f2506e; --extra:#4caf50;
  }
  :root[data-theme="dark"]{
    --bg:#141416; --surface:#1f1f22; --surface2:#2a2a2e; --btn:#2a2a2e; --border:#333338;
    --ink:#f4f2ef; --ink-soft:#b3b1ad; --ink-mute:#85837f;
    --accent:#f58220; --accent-deep:#c96a12; --accent-ink:#1a1207;
    --hero:#0e0e10; --hero-ink:#ffffff; --hero-soft:#b0aeaa;
    --good:#68c23a; --bad:#e06c5a;
    --barre:rgba(20,20,22,.96);
    --sheet:#1f1f22; --field:#2a2a2e;
    --figure:none;
    --radius:16px;
    --matin:#4aa8ea; --midi:#f58220; --collation:#6f6fe0; --soir:#f2607b; --extra:#5cba60;
  }
  /* Le parcours de profil se lit toujours sur fond clair, même si l'app est en thème sombre :
     ces écrans sont conçus clairs, et on veut la même lecture pour tout le monde. */
  :root[data-onb]{
    --bg:#EBE8E1; --surface:#ffffff; --surface2:#f3f0e9; --btn:#EBE8E1; --border:#e0dbd1;
    --ink:#17181a; --ink-soft:#5c5c5e; --ink-mute:#8e8e90;
    --accent:#f58220; --accent-deep:#d96f10; --accent-ink:#ffffff;
    --hero:#1b1b1d; --hero-ink:#ffffff; --hero-soft:#c9c7c3;
    --good:#5cb22e; --bad:#e0554a;
    --barre:rgba(255,255,255,.96);
    --sheet:#f4f1eb; --field:#ffffff;
    --figure:invert(1);
  }
  :root[data-onb] .onb-prog{background:#d9d4c9;}
  :root[data-onb], :root[data-onb] body{overflow:hidden;}   /* rien ne défile derrière le parcours */
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  /* Aucune règle overflow ici : sur Android, borner la largeur du document
     (hidden comme clip) empêchait tout défilement vertical. */
  /* pas de zoom par double appui ni de loupe intempestive pendant une séance */
  html,body{margin:0; padding:0; touch-action:manipulation;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:16px; line-height:1.45;
    min-height:100dvh;
    -webkit-font-smoothing:antialiased;
    /* pas de rebond latéral, mais le défilement vertical reste intact */
    overscroll-behavior-x:none;
    overscroll-behavior-y:none;
  }
  #app{max-width:560px; margin:0 auto; padding:calc(16px + env(safe-area-inset-top)) 16px 150px;}
  /* les bandeaux qui défilent gardent leur propre rebond, pas celui de la page */
  .car, .hist-strip{overscroll-behavior-x:contain;}
  h1,h2,h3{margin:0; text-wrap:balance;}
  button{font-family:inherit; font-size:16px; border:none; cursor:pointer; color:inherit; background:none; padding:0;}
  input,select,textarea{font-family:inherit; font-size:16px; color:var(--ink); background:var(--field); border:1px solid var(--border); border-radius:10px; padding:11px 12px; outline:none; width:100%;}
  input:focus,select:focus,textarea:focus{border-color:var(--accent-deep);}
  input[type=number]{font-variant-numeric:tabular-nums;}
  ::placeholder{color:var(--ink-mute);}

  .wordmark{font-weight:800; letter-spacing:.14em; font-size:15px; text-transform:uppercase;}
  .wordmark b{color:var(--accent);}
  .topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:4px;}
  .date-line{color:var(--ink-mute); font-size:13px; margin-bottom:18px; text-transform:capitalize;}

  .label{font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-mute);}
  .section-t i{font-style:normal; font-size:13px; margin-right:6px; vertical-align:-1px;}
  .section-t{font-size:12.5px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft); margin:26px 0 10px;}

  .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px;}
  .stack{display:flex; flex-direction:column; gap:10px;}
  .row{display:flex; align-items:center; gap:10px;}
  .grow{flex:1; min-width:0;}

  /* les boutons gris portent exactement le gris du fond ; --surface2 reste la surface  en creux  */
  .btn{display:flex; align-items:center; justify-content:center; gap:8px; font-weight:700; border-radius:12px; padding:13px 16px; background:var(--btn); border:1px solid var(--border);}
  .btn:active{transform:scale(.98);}
  .btn-accent{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
  .btn-ghost{background:none; border:1px dashed var(--border); color:var(--ink-soft); font-weight:600;}
  .btn-danger{color:var(--bad);}
  .btn-sm{padding:8px 12px; font-size:14px; border-radius:10px;}
  .icon-btn{width:38px; height:38px; display:flex; align-items:center; justify-content:center; border-radius:10px; background:var(--btn); border:1px solid var(--border); flex:none; font-size:15px;}

  .pill{font-size:12px; font-weight:600; color:var(--ink-soft); background:var(--surface2); border-radius:99px; padding:3px 9px; white-space:nowrap;}
  .hint-box{display:flex; gap:10px; align-items:flex-start; background:rgba(232,163,61,.10); border:1px solid rgba(232,163,61,.32);
    border-radius:11px; padding:10px 12px; margin-bottom:11px; font-size:12.5px; line-height:1.55; color:var(--ink-soft);}
  .hint-box b{color:var(--ink);}
  .hint-box button{flex:none; font-size:11.5px; font-weight:800; color:var(--accent); padding:2px 4px; align-self:center;}
  .ob-steps{display:flex; gap:5px; margin-bottom:10px;}
  .ob-steps i{flex:1; height:4px; border-radius:2px; background:var(--surface2); transition:background .3s;}
  .ob-steps i.on{background:var(--accent);}
  .start-card{border-color:var(--accent-deep) !important;}
  .start-step{display:flex; gap:10px; align-items:flex-start; margin-bottom:9px; font-size:13.5px; color:var(--ink-soft);}
  .start-step b{color:var(--ink);}
  .start-step .num{flex:none; width:21px; height:21px; border-radius:50%; background:var(--surface2); color:var(--ink-mute);
    font-size:11px; font-weight:800; display:flex; align-items:center; justify-content:center; margin-top:1px;}
  .start-step.done .num{background:var(--good); color:#0d1a12;}
  .start-step.done b{color:var(--ink-mute); text-decoration:line-through;}
  .slider{-webkit-appearance:none; appearance:none; width:100%; height:6px; border-radius:99px; padding:0; border:none;
    background:linear-gradient(90deg, var(--accent-deep), var(--accent)); outline:none;}
  .slider::-webkit-slider-thumb{-webkit-appearance:none; width:26px; height:26px; border-radius:50%; background:var(--accent);
    border:3px solid var(--surface); box-shadow:0 2px 8px rgba(0,0,0,.5); cursor:pointer;}
  .slider::-moz-range-thumb{width:22px; height:22px; border-radius:50%; background:var(--accent); border:3px solid var(--surface); cursor:pointer;}
  .inline-edit{font:inherit; color:inherit; text-align:left; display:inline-flex; align-items:center; gap:6px; border-radius:8px; padding:1px 5px; margin-left:-5px;}
  .inline-edit .pen{font-size:.62em; color:var(--accent); opacity:.75;}
  .inline-edit:active{background:var(--surface2);}
  .tb-save{position:relative; color:var(--ink-soft);}
  .tb-save svg{width:19px; height:19px;}
  .tb-save .tb-dot{position:absolute; top:-2px; right:-2px; width:9px; height:9px; border-radius:50%; background:var(--accent); border:2px solid var(--bg);}

  /* stat tiles */
  .tiles{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
  .tile{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:12px 10px; text-align:left;}
  .tile .v{font-size:22px; font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:-.01em; line-height:1.1;}
  .tile .u{font-size:12px; color:var(--ink-mute); margin-top:2px;}

  /* tab bar */
  /* ---- bandeau sombre incurvé (accueil, alimentation, progression) ---- */
  /* le fond est l'image fournie : forme sombre détourée, transparente ailleurs */
  .hero{position:relative; color:var(--hero-ink);
    margin:calc(-16px - env(safe-area-inset-top)) -16px 0;}
  .hero-bg{display:block; width:100%; height:auto; aspect-ratio:1210/1000;}
  .hero-bg rect{transition:none;}
  .hero-in{position:absolute; inset:0; padding:calc(14px + env(safe-area-inset-top)) 18px 0;
    display:flex; flex-direction:column;}
  /* tout ce qui suit le bandeau se dessine par-dessus lui */
  #app > *{position:relative; z-index:2;}
  #app > .hero{z-index:1;}
  .hero-top{display:flex; align-items:center; justify-content:space-between; position:relative; z-index:2;}
  .hero-ic{width:31px; height:31px; border-radius:50%; background:#fff; color:#1b1b1d;
    display:flex; align-items:center; justify-content:center; flex:0 0 auto;}
  .hero-ic svg{width:19px; height:19px;}
  .hero-h{position:relative; z-index:2; text-align:center; margin-top:11%;}
  .hero-h h1{font-size:34px; font-weight:800; letter-spacing:-.02em; line-height:1.05;}
  .hero-h .sub{font-size:14px; font-weight:600; color:var(--hero-soft); margin-top:8px;}
  .hero-h .big{font-size:27px; font-weight:800; letter-spacing:.04em; text-transform:uppercase;}
  .under-hero{margin-top:-19%; position:relative; z-index:3;}

  /* ---- carte de la semaine ---- */
  .wk-card{background:var(--surface); border-radius:18px; padding:12px 14px 13px;
    box-shadow:0 6px 22px rgba(0,0,0,.14);}
  .wk-top{display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-bottom:8px;}
  .wk-top .t{font-size:10.5px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-mute);}
  /* l'écart avec la semaine passée est collé au nombre qu'il qualifie */
  .wk-nums .ev{font-weight:800; white-space:nowrap;}
  .wk-nums .ev.up{color:var(--good);}
  .wk-nums .ev.down{color:var(--ink-mute);}
  .wk-days{display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-bottom:9px;}
  /* la hauteur de chaque barre porte le volume soulevé ce jour-là */
  .wk-day i{display:flex; align-items:flex-end; height:32px; border-radius:8px;
    background:var(--surface2); border:1.5px solid transparent; overflow:hidden;}
  .wk-day i b{display:block; width:100%; background:var(--accent); border-radius:8px;}
  /* le jour en cours est cerclé de noir : visible même quand la barre est pleine */
  .wk-day.today i{outline:1.8px solid var(--ink); outline-offset:1.5px;}
  .wk-day span{display:block; text-align:center; font-size:10.5px; font-weight:700; color:var(--ink-mute); margin-top:3px;}
  .wk-day.today span{color:var(--ink);}
  .wk-sep{height:1px; background:var(--border); margin:0 -4px 9px;}
  .wk-nums{display:flex; align-items:center; justify-content:space-between; position:relative;}
  .wk-nums .n{flex:1; text-align:center;}
  .wk-nums .v{font-size:21px; font-weight:800; font-variant-numeric:tabular-nums; line-height:1.1;}
  .wk-nums .u{font-size:11px; color:var(--ink-mute);}
  .wk-bilan{position:absolute; left:50%; top:5px; transform:translateX(-50%);
    background:var(--accent); color:var(--accent-ink); font-size:12px; font-weight:800;
    border-radius:99px; padding:3px 12px;}

  /* ---- carrousel de séances ---- */
  .car{--cardw:min(63vw, 320px);
    display:flex; gap:10px; overflow-x:auto; scroll-snap-type:x mandatory;
    margin:0 -16px -14px; padding:16px calc((100% - var(--cardw))/2) 34px; -webkit-overflow-scrolling:touch;}
  .car::-webkit-scrollbar{display:none;}
  .prog-slot{position:relative; flex:0 0 var(--cardw); scroll-snap-align:center; padding-top:13px;
    transform:scale(.86); transform-origin:center 62%; opacity:.72; transition:transform .08s linear, opacity .08s linear;}
  .prog-slot.mid{transform:scale(1); opacity:1;}
  .prog-card{position:relative; width:100%; aspect-ratio:192/279; border-radius:16px;
    overflow:hidden; background:var(--hero); color:#fff; display:block;
    box-shadow:0 7px 12px rgba(0,0,0,.34), 0 16px 30px rgba(0,0,0,.22);}
  .prog-card .ph{position:absolute; inset:0; background-size:cover; background-position:center;}
  .prog-card .ph::after{content:""; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(0,0,0,.15) 0%, rgba(0,0,0,.35) 45%, rgba(0,0,0,.82) 100%);}
  .prog-card .in{position:absolute; inset:0; padding:12px; display:flex; flex-direction:column; justify-content:flex-end;}
  .prog-card .nm{font-size:34px; font-weight:800; letter-spacing:-.02em; line-height:1;}
  .prog-card .ex{font-size:12px; font-weight:600; line-height:1.45; color:rgba(255,255,255,.92); margin-top:6px;}
  .prog-card .dur{position:absolute; top:10px; right:10px; z-index:2; background:rgba(255,255,255,.92);
    color:#1b1b1d; font-size:11px; font-weight:800; border-radius:99px; padding:3px 9px;}
  .prog-card .pen{position:absolute; bottom:10px; right:10px; z-index:2; width:30px; height:30px;
    border-radius:50%; background:rgba(255,255,255,.16); display:flex; align-items:center; justify-content:center; padding:0;}
  .prog-card .pen img{width:17px; height:17px; display:block;}
  .prog-slot .sug{position:absolute; top:0; left:50%; transform:translateX(-50%); z-index:4;
    background:var(--accent); color:var(--accent-ink); font-size:11.5px; font-weight:800;
    border-radius:99px; padding:3px 11px; white-space:nowrap;}
  .car-wrap{position:relative;}

  /* ================= PARCOURS D'ACCUEIL (plein écran) ================= */
  /* Les quatre côtés épinglés : la page occupe exactement la zone visible, sur tous
     les navigateurs, sans aucune unité de hauteur à interpréter. Une hauteur en vh
     débordait sous la barre d'outils de Safari (il fallait défiler pour voir le bouton) ;
     une hauteur en svh laissait à l'inverse une bande en bas, par laquelle on
     apercevait l'application et sa barre d'onglets. */
  .onb{position:fixed; top:0; right:0; bottom:0; left:0; z-index:55;
    background:var(--bg); color:var(--ink);
    display:flex; flex-direction:column; overflow:hidden;}
  .onb-top{display:flex; align-items:center; gap:12px; padding:calc(14px + env(safe-area-inset-top)) 20px 0;
    width:100%; max-width:540px; margin-inline:auto;}
  .onb-back{width:30px; height:30px; flex:0 0 auto; font-size:22px; line-height:1; color:var(--ink);
    display:flex; align-items:center; justify-content:center;}
  .onb-prog{flex:1; height:7px; border-radius:5px; background:#d9d4c9; overflow:hidden;}
  :root[data-theme="dark"] .onb-prog{background:#33322e;}
  .onb-prog i{display:block; height:100%; border-radius:5px; background:var(--ink); transition:width .3s ease;}
  .onb-x{width:30px; height:30px; flex:0 0 auto; font-size:19px; color:var(--ink-mute);
    display:flex; align-items:center; justify-content:center;}
  .onb-body{flex:1; min-height:0; overflow-y:auto; padding:22px 20px 10px; -webkit-overflow-scrolling:touch;
    width:100%; max-width:540px; margin-inline:auto;}
  .onb-foot{padding:10px 20px calc(24px + env(safe-area-inset-bottom)); width:100%; max-width:540px; margin-inline:auto;}
  .onb h2{font-size:29px; font-weight:800; letter-spacing:-.02em; line-height:1.15; margin:0 0 6px;}
  .onb .sous{font-size:13.5px; color:var(--ink-mute); line-height:1.45; margin-bottom:22px;}
  .onb-btn{width:100%; background:var(--hero); color:#fff; border-radius:14px; padding:16px;
    font-size:16.5px; font-weight:800; transition:transform .12s ease;}
  .onb-btn:active{transform:scale(.975);}
  .onb-btn[disabled]{opacity:.35;}
  .onb-back{transition:transform .12s ease;}
  .onb-back:active{transform:scale(.86);}
  .onb-lien{display:block; width:100%; text-align:center; margin-top:12px; font-size:13.5px; color:var(--ink-soft);
    transition:opacity .12s ease;}
  .onb-lien:active{opacity:.55;}
  .onb-lien b{color:var(--ink); text-decoration:underline;}

  /* choix multiples : apparition bouton par bouton */
  .onb-choix{display:flex; flex-direction:column; gap:9px;}
  .onb-choix .ch{background:var(--surface); border-radius:12px; padding:14px; font-size:14.5px; font-weight:700;
    text-align:center; box-shadow:0 1px 3px rgba(0,0,0,.06); opacity:0; transform:translateY(8px);
    animation:chIn .28s ease forwards;}
  .onb-choix .ch{transition:transform .12s ease, background .16s ease, color .16s ease;}
  .onb-choix .ch:active{transform:scale(.975);}
  .onb-choix .ch.on{background:var(--accent); color:#fff;}
  .onb-desc{font-size:12.5px; color:var(--ink-soft); text-align:center; line-height:1.5; margin-top:10px;}
  @keyframes chIn{to{opacity:1; transform:none;}}
  /* redessin apres un choix : les boutons sont deja la, ils ne rejouent pas l'apparition */
  .onb-choix .ch.fixe{animation:none; opacity:1; transform:none;}
  @media (prefers-reduced-motion:reduce){
    .onb-choix .ch{animation:none; opacity:1; transform:none;}
    .onb-btn:active, .onb-choix .ch:active, .onb-back:active{transform:none;}
  }

  /* saisie du prénom */
  .onb-nom{width:100%; border:none; background:none; padding:0; font-size:31px; font-weight:800;
    color:var(--ink); outline:none;}
  .onb-nom::placeholder{color:var(--ink-mute); opacity:.55;}

  /* roulettes de sélection */
  .onb-rou{display:flex; gap:18px; justify-content:center;}
  .rou{flex:1; max-width:190px; text-align:center;}
  .rou-t{font-size:13px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; margin-bottom:6px;}
  .rou-box{position:relative; height:238px; overflow:hidden;
    -webkit-mask-image:linear-gradient(#0000, #000 22%, #000 78%, #0000);
    mask-image:linear-gradient(#0000, #000 22%, #000 78%, #0000);}
  .rou-band{position:absolute; left:0; right:0; top:50%; height:40px; transform:translateY(-50%);
    background:var(--accent); border-radius:10px; pointer-events:none;}
  .rou-scroll{position:relative; height:100%; overflow-y:scroll; scroll-snap-type:y mandatory;
    scrollbar-width:none; -webkit-overflow-scrolling:touch; z-index:2;}
  .rou-scroll::-webkit-scrollbar{display:none;}
  .rou-vide{height:99px;}
  .regle-vide{flex:0 0 50%;}
  .onb-lab{font-size:12px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:3px;}
  .onb-aide{font-size:12.5px; color:var(--ink-mute); line-height:1.5; margin-bottom:9px;}
  .proj-txt{font-size:12.5px; color:var(--ink-mute); text-align:center; line-height:1.55; margin-top:6px;}
  .proj-duo{display:flex; gap:10px; text-align:center;}
  .proj-duo > div{flex:1;}
  .proj-duo b{display:block; font-size:22px; font-weight:800;}
  .proj-duo span{font-size:11.5px; color:var(--ink-mute);}
  .rou-i{height:40px; line-height:40px; scroll-snap-align:center; font-size:21px; font-weight:700;
    color:var(--ink-soft); transition:color .12s;}
  .rou-i.mid{color:#fff; font-weight:800;}
  .rou-unite{display:inline-flex; gap:2px; background:var(--hero); border-radius:99px; padding:3px; margin-top:10px;}
  .rou-unite button{padding:5px 13px; border-radius:99px; font-size:12px; font-weight:800; color:rgba(255,255,255,.6);}
  .rou-unite button.on{background:#fff; color:var(--hero);}

  /* règle graduée du poids cible */
  .regle{position:relative; margin-top:6px;}
  .regle-val{text-align:center; font-size:32px; font-weight:800; letter-spacing:-.01em;}
  .regle-lab{text-align:center; font-size:13px; color:var(--ink-soft); margin-bottom:2px;}
  .regle-box{position:relative; height:98px; overflow:hidden;
    -webkit-mask-image:linear-gradient(90deg, transparent, #000 18%, #000 82%, transparent);
    mask-image:linear-gradient(90deg, transparent, #000 18%, #000 82%, transparent);}
  .regle-scroll{height:100%; overflow-x:scroll; scroll-snap-type:x mandatory; display:flex; align-items:flex-start;
    scrollbar-width:none; padding-top:12px;}
  .regle-scroll::-webkit-scrollbar{display:none;}
  .regle-t{flex:0 0 10px; scroll-snap-align:center; display:flex; justify-content:center;
    transform-origin:top center; will-change:transform;}
  .regle-t i{width:2px; border-radius:2px; background:var(--ink-mute); opacity:.5;}
  .regle-t.maj i{opacity:1; background:var(--ink);}
  .regle-aig{position:absolute; left:50%; top:4px; width:3px; height:46px; border-radius:2px;
    background:var(--accent); transform:translateX(-50%); pointer-events:none;}

  /* carrousel d'introduction */
  .onb-body.intro{overflow:hidden;}      /* le carrousel tient sur l'écran, toujours */
  /* tout est calé en haut, comme sur la maquette : le visuel, puis le titre, puis les points */
  /* Le bloc descend d'environ deux centimètres. La marge est plafonnée et suit la hauteur
     de l'écran ; sur les téléphones courts elle se réduit franchement, sinon le bouton
     serait poussé hors de l'écran. */
  .onb-hero{display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
    height:100%; min-height:0; padding-top:76px;}   /* environ 2 cm, posés depuis le haut */
  /* les ecrans courts n ont pas deux centimetres a donner */
  @media (max-height:760px){ .onb-hero{padding-top:56px;} }
  @media (max-height:700px){ .onb-hero{padding-top:36px;} }
  @media (max-height:620px){ .onb-hero{padding-top:20px;} }
  /* Le visuel prend LA PLACE QUI RESTE, ni plus ni moins : le titre, les points et le
     bouton se servent d'abord, lui se contente du reste. Aucune proportion imposée à la
     boîte, donc rien qui puisse déborder sous le bouton, quel que soit l'écran ; c'est la
     vidéo qui se met à l'échelle dedans (object-fit) en gardant ses proportions. */
  /* Les proportions de la maquette, posées en dur. Les versions qui mesuraient l'écran
     en JavaScript donnaient un visuel juste sur mes essais et minuscule sur son iPhone :
     une des mesures y valait autre chose. Ici, rien n'est mesuré, rien ne peut varier. */
  /* Le visuel est ELASTIQUE avec un plafond : il occupe la place qui reste sous la
     marge haute, sans jamais depasser sa taille de maquette. C'est ce qui garantit que
     le titre, les points et le bouton ne sont plus rognes, quel que soit l'ecran —
     le conteneur est en overflow:hidden, ce qui depasse est perdu, pas defilable. */
  .onb-tel{position:relative; flex:1 1 auto; width:62vw; max-width:300px;
    min-height:110px; max-height:42vh; margin-bottom:16px;}
  .onb-tel video, .onb-tel img{position:absolute; inset:0; width:100%; height:100%; object-fit:contain;
    opacity:0; transition:opacity .55s ease;
    /* calque dédié : évite le clignotement des fondus d'images sur iOS */
    transform:translateZ(0); -webkit-backface-visibility:hidden; backface-visibility:hidden;}
  .onb-tel video.on, .onb-tel img.on{opacity:1;}
  /* place réservée pour trois lignes : un titre plus long ne doit pas décaler le visuel */
  /* seul le visuel se réduit quand l'écran est court : le texte et les points gardent leur taille */
  /* Aucun effet sur le titre, volontairement. Faire varier l'opacité d'un texte qu'on
     réécrit laissait sur iPhone les anciens titres peints à l'écran, jusqu'à trois
     superposés. Le titre change maintenant d'un coup, en même temps que la vidéo —
     et la vidéo, elle, garde son fondu. */
  .onb-titre{flex:0 0 auto; width:100%; display:flex; align-items:center; justify-content:center;
    font-size:clamp(21px, 6.6vw, 27px); font-weight:800; text-align:center;
    line-height:1.2; min-height:3.6em;}  /* trois lignes réservées : un titre long ne décale rien */
  .onb-dots{flex:0 0 auto; display:flex; gap:7px; justify-content:center; margin-top:16px;}
  .onb-dots i{width:7px; height:7px; border-radius:50%; background:var(--ink-mute); opacity:.35;}
  .onb-dots i.on{opacity:1; background:var(--ink);}

  /* projection */
  .proj{background:var(--surface); border-radius:16px; padding:16px 14px;}
  .proj h3{font-size:15px; font-weight:800; margin-bottom:10px;}

  /* ---- jauge de récupération ---- */
  .recup-card{display:flex; align-items:center; gap:11px; width:100%; margin-top:14px;
    background:var(--hero); color:#fff; border-radius:16px; padding:10px 14px 10px 10px;
    box-shadow:0 5px 16px rgba(0,0,0,.18);}
  .recup-card .rc-ring{flex:0 0 auto; display:block; line-height:0;}
  .recup-card .rc-t{display:block; font-size:11px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:rgba(255,255,255,.55);}
  .recup-card .rc-s{display:block; font-size:15px; font-weight:800; margin-top:2px;}
  .recup-card .rc-bar{flex:0 0 64px; height:7px; border-radius:5px; background:rgba(255,255,255,.16); overflow:hidden;}
  .recup-card .rc-bar i{display:block; height:100%; border-radius:5px;}
  .mp-body .mp-fig{max-width:118px;}

  /* ---- bouton + flottant ---- */
  .fab{width:58px; height:58px; border-radius:50%; background:var(--accent); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:31px; font-weight:300;
    box-shadow:0 6px 18px rgba(245,130,32,.42); line-height:1;}
  .fab-row{display:flex; justify-content:flex-end; margin:2px 4px 0;}

  /* ---- bandeau historique ---- */
  .hist-strip{display:flex; gap:8px; overflow-x:auto; margin:0 -16px; padding:2px 16px 14px;}
  .hist-strip::-webkit-scrollbar{display:none;}
  .hist-c{position:relative; flex:0 0 108px; height:112px; border-radius:12px; overflow:hidden;
    background:var(--hero); color:#fff; text-align:left;}
  .hist-c .ph{position:absolute; inset:0; background-size:cover; background-position:center;}
  .hist-c .ph::after{content:""; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(0,0,0,.28) 0%, rgba(0,0,0,.72) 100%);}
  .hist-c .in{position:absolute; inset:0; padding:8px 9px; display:flex; flex-direction:column; justify-content:flex-end;}
  .hist-c .dt{position:absolute; top:7px; left:50%; transform:translateX(-50%); z-index:2;
    background:rgba(255,255,255,.9); color:#1b1b1d; font-size:9.5px; font-weight:800;
    border-radius:99px; padding:2px 7px; white-space:nowrap;}
  .hist-c .nm{font-size:15px; font-weight:800; line-height:1.1;}
  .hist-c .st{font-size:10px; font-weight:600; line-height:1.4; color:rgba(255,255,255,.9); margin-top:3px;}

  /* ---- alimentation : jauges, onglets de repas, pastilles ---- */
  .eat-card{background:var(--surface); border-radius:16px; padding:13px 15px 15px; box-shadow:0 6px 22px rgba(0,0,0,.16);}
  .eat-line{display:flex; align-items:baseline; gap:8px; justify-content:center;}
  .eat-line .v{font-size:29px; font-weight:800; font-variant-numeric:tabular-nums; line-height:1.05;}
  .eat-line .l{font-size:12.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-soft);}
  .eat-bar{height:16px; border-radius:9px; background:var(--surface2); overflow:hidden; margin:6px 0 12px; position:relative;}
  .eat-bar i{display:block; height:100%; border-radius:9px; background:var(--accent);}
  .eat-bar b{position:absolute; right:9px; top:0; line-height:16px; font-size:11px; font-weight:700; color:var(--ink-mute);}
  .eat-side{display:flex; flex-direction:column; gap:9px; justify-content:center;}
  .eat-side button{width:38px; height:38px; border-radius:11px; background:var(--surface); color:var(--ink);
    display:flex; align-items:center; justify-content:center; box-shadow:0 3px 10px rgba(0,0,0,.18);}
  .eat-side svg{width:21px; height:21px;}

  /* les onglets passent DERRIÈRE le panneau blanc : leur bas est masqué, aucun trou possible */
  .meal-tabs{display:flex; gap:5px; margin:18px 0 0; position:relative; z-index:1; align-items:flex-end;}
  /* chaque onglet porte un bloc blanc qui rejoint le panneau : la couleur encadre la page */
  .meal-tab{position:relative; flex:1; border-radius:13px 13px 0 0; background:var(--surface2); color:var(--ink-mute);
    font-size:9.5px; font-weight:800; letter-spacing:.02em; text-transform:uppercase;
    padding:7px 2px 24px; text-align:center; transform:translateY(16px);
    /* les onglets au repos sont ombrés en bas : ils paraissent glissés sous la page */
    box-shadow:inset 0 -13px 11px -10px rgba(0,0,0,.22);
    transition:transform .34s cubic-bezier(.34,1.56,.64,1), background .22s ease, color .22s ease, box-shadow .22s ease;}
  /* le bloc blanc ne se voit que sur l onglet choisi : abaissé, il passe entièrement sous le panneau */
  .meal-tab i{position:absolute; left:5px; right:5px; bottom:0; height:16px; display:block;
    /* pas de fondu : à mi-transition le bloc laissait voir la couleur de l onglet
       et ne paraissait plus tout à fait du même blanc que la page. Il monte, il ne s efface pas. */
    border-radius:8px 8px 0 0; background:var(--surface); opacity:0;}
  .meal-tab.on{transform:translateY(0); color:#fff; box-shadow:none;}
  .meal-tab.on i{opacity:1;}
  @media (prefers-reduced-motion:reduce){
    .meal-tab{transition:background .2s ease, color .2s ease;}
    .fchip:active{transform:none;}
    .tab:active svg{transform:none;}
  }
  @keyframes repasIn{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:none;}}
  .meal-panel.swap{animation:repasIn .3s cubic-bezier(.22,.9,.35,1);}
  @media (prefers-reduced-motion:reduce){ .meal-panel.swap{animation:none;} }
  .meal-panel{background:var(--surface); border-radius:0 0 14px 14px; padding:16px 13px 22px; position:relative; z-index:2;
    /* décalage et retrait choisis pour que le flou ne déborde jamais au-dessus du panneau :
       il grisait le bas du bloc blanc de l onglet, qui ne paraissait plus du même blanc que la page */
    box-shadow:0 14px 22px -6px rgba(0,0,0,.12); min-height:52vh;}
  .meal-h{font-size:10.5px; font-weight:800; letter-spacing:.1em; text-transform:uppercase;
    color:var(--ink-mute); text-align:center; margin:2px 0 9px;}
  .fgrid{display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-bottom:16px;}
  /* enfoncement au doigt : rapide à la descente, plus doux au retour */
  .fchip{display:flex; align-items:center; gap:6px; background:var(--surface); border:1px solid var(--border);
    border-radius:10px; padding:7px 8px; text-align:left; min-width:0;
    transition:transform .22s cubic-bezier(.22,.9,.35,1), background .18s ease, border-color .18s ease;}
  .fchip:active{transform:scale(.955); transition-duration:.06s;}
  .fchip .ic{font-size:14px; flex:0 0 auto;}
  .fchip .tx{flex:1; min-width:0;}
  .fchip .nm{display:block; font-size:11.5px; font-weight:700; line-height:1.2; overflow-wrap:break-word; hyphens:auto;}
  .fchip .q{display:block; font-size:9.5px; line-height:1.3; color:var(--ink-mute); margin-top:1px;}
  .fchip .g{margin-left:auto; font-size:12px; font-weight:800; flex:0 0 auto;}
  .fchip.on{color:#fff; border-color:transparent;}
  .fchip.on .q{color:rgba(255,255,255,.8);}
  .fab-center{display:flex; justify-content:center; margin-top:14px;}

  .tabbar{position:fixed; left:0; right:0; bottom:0; z-index:40; background:var(--barre); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); border-top:1px solid var(--border); padding-bottom:env(safe-area-inset-bottom);}
  .tabbar-in{max-width:560px; margin:0 auto; display:flex;}
  .tab{flex:1; display:flex; flex-direction:column; align-items:center; gap:5px; padding:11px 0 9px; color:var(--ink-mute); font-size:11px; font-weight:700; letter-spacing:.01em;}
  .tab svg{width:22px; height:22px; transition:transform .22s cubic-bezier(.22,.9,.35,1);}
  .tab:active svg{transform:scale(.82); transition-duration:.06s;}
  .tab.on{color:var(--accent);}

  /* rest timer */
  .restbar{position:fixed; left:12px; right:12px; bottom:calc(64px + env(safe-area-inset-bottom)); z-index:45; max-width:536px; margin:0 auto;
    background:var(--accent); color:var(--accent-ink); border-radius:16px; padding:10px 14px;
    display:none; align-items:center; gap:10px; box-shadow:0 8px 30px rgba(0,0,0,.5);
    touch-action:none; transition:top .22s ease, bottom .22s ease;}
  /* posé en haut de l'écran */
  .restbar.haut{bottom:auto; top:calc(10px + env(safe-area-inset-top));}
  .restbar.drag{transition:none; box-shadow:0 14px 40px rgba(0,0,0,.55); cursor:grabbing;}
  .restbar .grip{width:13px; flex:0 0 auto; display:flex; flex-direction:column; gap:3px; opacity:.5; margin-right:2px;}
  .restbar .grip i{display:block; height:2px; border-radius:2px; background:#fff;}
  .restbar.show{display:flex;}
  .restbar .t{font-size:26px; font-weight:800; font-variant-numeric:tabular-nums; min-width:86px;}
  .restbar .lbl{font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; opacity:.75;}
  .restbar button{background:rgba(26,20,8,.14); border-radius:10px; padding:8px 12px; font-weight:800; font-size:14px; color:var(--accent-ink);}
  /* le son : plein et franc quand il est actif, en contour et en retrait quand il est coupé */
  .restbar .rb-ic{background:none !important; padding:2px !important; display:flex; align-items:center; color:#fff;}
  .rb-ic svg{width:23px; height:21px; display:block;}
  .rb-ic.muet{opacity:.55;}
  /* pastilles blanches pleines, symbole dans l'orange de la barre */
  /* préfixé par .restbar : sinon « .restbar button » impose sa couleur blanche
     et le symbole devient invisible sur la pastille blanche */
  .restbar .rb-rond{background:#fff !important; border:none; border-radius:50% !important;
    width:28px; height:28px; padding:0 !important; flex:0 0 auto; color:var(--accent);
    font-size:20px; font-weight:800; line-height:1;
    display:flex; align-items:center; justify-content:center;}
  /* les deux côtés se partagent l'espace à parts égales : la pastille tombe pile au milieu */
  /* Le − est collé à la fin de son groupe, le + au début du sien : ce qui les sépare
     de la pastille est alors le seul écart de la barre, donc rigoureusement le même. */
  .rb-cote{flex:1 1 0; min-width:0; display:flex; align-items:center; gap:7px;}
  .rb-grp{flex:1 1 auto; min-width:0; display:flex; align-items:center; gap:7px;}
  .rb-grp.fin{justify-content:flex-end;}
  .rb-pill{background:#fff; border-radius:15px; padding:4px 14px 5px; text-align:center; cursor:pointer;
    flex:0 1 auto; min-width:96px;}
  /* Couleurs fixes, jamais celles du thème : la barre reste orange et la pastille
     blanche en thème sombre aussi. Avec var(--ink), les chiffres devenaient presque
     blancs sur fond blanc, donc gris pâles. */
  .rb-pill .lbl{font-size:10px; font-weight:700; letter-spacing:.13em; text-transform:uppercase; color:#8e8e90; opacity:1;}
  .rb-pill .t{font-size:25px; font-weight:800; font-variant-numeric:tabular-nums; color:#17181a; min-width:0; line-height:1.1;}
  /* les trois dernières secondes : plus gros, même noir, même place */
  .rb-pill .t #rest-t.compte-a-rebours{display:inline-block; font-size:40px; line-height:1;
    animation:battement .5s ease-out;}
  @keyframes battement{0%{transform:scale(1.28);} 60%{transform:scale(.97);} 100%{transform:scale(1);}}
  @media (prefers-reduced-motion:reduce){ .rb-pill .t #rest-t.compte-a-rebours{animation:none;} }
  /* préfixé par .restbar, sinon « .restbar button » (plus spécifique) impose sa couleur
     de thème et le mot devient noir sur orange en thème sombre */
  .restbar .rb-skip{background:rgba(60,28,0,.42) !important; border-radius:13px !important;
    padding:8px 12px !important; font-size:13px; white-space:nowrap; color:#fff;}
  .restbar .bar{position:absolute; left:14px; right:14px; bottom:5px; height:3px; border-radius:2px; background:rgba(255,255,255,.32); overflow:hidden;}
  .restbar .bar i{display:block; height:100%; background:#fff; border-radius:2px;}
  @keyframes flashEnd{0%,100%{background:var(--accent);}50%{background:#fff;}}
  .restbar.ending{animation:flashEnd .5s 3;}
  .restbar.paused{background:var(--surface2); color:var(--ink);}
  .restbar.paused button{background:var(--surface); color:var(--ink);}
  .restbar.paused .rb-ic, .restbar.paused .rb-rond{color:var(--ink); border-color:var(--ink-soft);}
  .restbar.paused .rb-pill{background:var(--surface);}
  .restbar.paused .rb-skip{background:var(--ink) !important; color:#fff;}
  .restbar.paused .bar{display:none;}

  /* workout */
  .hero-kicker{font-size:12px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:var(--hero-soft);}
  /* deux lignes au maximum : un nom long ne doit pas pousser le chrono hors du bandeau */
  /* deux classes : indispensable pour passer devant .hero-h h1 qui impose 34 px */
  .hero .hero-seance{font-size:var(--t, 29px); font-weight:800; letter-spacing:-.02em; line-height:1.15;
    margin:6px 0 0; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  @media (max-width:360px){ .hero .hero-seance{font-size:calc(var(--t, 29px) * .86);} }
  /* Le liseré blanc du bandeau passe à 74,7 % de sa hauteur (cercle de rayon 711
     centré en y = -45, dans un repère de 892 de haut). On y pose le chrono,
     et le titre remonte juste au-dessus — l'image de fond, elle, ne bouge pas. */
  /* le bloc est calé par le bas sur le liseré ; le chrono, dernier élément,
     descend de la moitié de sa hauteur pour se centrer pile dessus */
  .hero-en-cours .hero-h{position:absolute; left:0; right:0; bottom:25.3%; margin-top:0;}
  /* translateY en % se calcule sur la hauteur de l'élément lui-même, contrairement à top */
  /* Le texte d'accueil est calé par le bas au-dessus du liseré blanc : quelle que soit
     la longueur du sous-titre, il grandit vers le haut et ne déborde jamais sur le clair. */
  /* Le liseré est un arc : il remonte sur les côtés. Le texte est donc borné en largeur
     et calé plus haut, pour que même ses extrémités restent dans le noir. */
  .hero-accueil .hero-h{position:absolute; left:0; right:0; bottom:42%; margin-top:0;
    max-width:66%; margin-inline:auto;}
  .hero-en-cours .chrono{display:block; width:max-content; margin:14px auto 0; transform:translateY(50%);}
  /* le chrono devient une pastille claire posée sur la photo */
  .chrono{font-variant-numeric:tabular-nums; font-weight:800; font-size:20px; color:var(--ink);
    background:var(--surface); border-radius:99px; padding:7px 22px; display:inline-block;
    box-shadow:0 4px 16px rgba(0,0,0,.28);}
  .ex-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px;
    position:relative;}

  /* ---- la série en cours se détache ---- */
  /* le cadre noir déborde de la carte blanche : marge négative compensée par le rembourrage,
  /* ---- le bloc noir : la série en cours, ses dégressifs et sa question ne font qu'un ----
     Aucun agrandissement : chaque ligne mise à l'échelle séparément laissait des coutures.
     Le relief vient du débordement latéral (marge négative + rembourrage égal), qui ne
     touche pas à la boîte de contenu — la grille reste alignée avec l'en-tête. */
  /* préfixées par .ex-card : ces règles sont écrites avant celles de .set-row,
     il leur faut donc une priorité supérieure pour l'emporter */
  .ex-card .bn{background:var(--hero); margin-inline:-20px; padding-inline:20px;
    margin-top:0; margin-bottom:0; border-radius:0; position:relative; z-index:1;}
  .ex-card .set-row.bn{padding-block:9px;}
  .ex-card .set-row.drop.bn{padding-block:3px;}
  .ex-card .set-row.bn .n{color:#fff; font-size:15px;}
  .ex-card .set-row.bn input{font-size:17px; font-weight:700; padding-block:10px;}
  .ex-card .set-row.bn .dg{border-color:rgba(255,255,255,.5); color:#fff;}
  .ex-card .set-row.actif.bn .ck{background:#fff; border-color:#fff; color:var(--hero);}
  .ex-card .bn-debut{border-radius:14px 14px 0 0;}
  .ex-card .bn-fin{border-radius:0 0 14px 14px; margin-bottom:8px; padding-bottom:11px;
    box-shadow:0 9px 24px rgba(0,0,0,.26);}
  .ex-card .bn-debut.bn-fin{border-radius:14px;}
  /* la question fait partie du même bloc : on comprend qu'elle appartient à cette série */
  .ex-card .rir-ask.bn{border:none; padding-top:12px;}
  .rir-ask.bn .rir-intro{color:rgba(255,255,255,.78);}
  .rir-ask.bn .q{color:#fff;}
  .rir-ask.bn .row button{background:#fff; border-color:#fff; color:var(--hero);}
  .rir-ask.bn .rir-lourd{color:#fff; border-color:#fff;}
  .rir-ask.bn .q.ok{color:#ffb15e;}
  /* deux pulsations sur la coche : l'œil trouve quoi faire, rien ne bouge */
  @keyframes pulseCk{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.55);} 50%{box-shadow:0 0 0 8px rgba(255,255,255,0);}}
  .set-row.actif.bn .ck{animation:pulseCk 1.9s ease-out 2;}
  /* la question attend une réponse : on la fait remarquer sans bloquer l'écran */
  @keyframes secousse{0%,100%{transform:translateX(0);} 20%{transform:translateX(-6px);}
    40%{transform:translateX(6px);} 60%{transform:translateX(-4px);} 80%{transform:translateX(4px);}}
  .rir-ask.rappel{animation:secousse .38s ease;}
  .rir-intro{font-size:12px; color:var(--ink-mute); line-height:1.5; margin-bottom:8px;}
  @media (prefers-reduced-motion:reduce){ .rir-ask.rappel{animation:none;} }
  /* refermer un exercice ouvert : chevron discret sous les boutons */
  .ex-plier{width:100%; display:flex; align-items:center; justify-content:center; gap:7px;
    padding:10px 0 0; margin-top:6px; color:var(--ink-mute); font-size:12px; font-weight:700;}
  .ex-plier svg{width:18px; height:12px; transform:rotate(180deg);}
  /* petit enfoncement sur les boutons d'une série */
  .set-row .ck, .set-row .dg{transition:transform .2s cubic-bezier(.22,.9,.35,1);}
  .set-row .ck:active, .set-row .dg:active{transform:scale(.86); transition-duration:.06s;}

  /* ---- exercice terminé : la carte se replie ---- */
  .ex-done{display:flex; align-items:center; gap:11px; background:var(--surface2);
    border:1px solid var(--border); border-radius:var(--radius); padding:12px 13px; width:100%;
    animation:replieIn .32s cubic-bezier(.22,.9,.35,1);}
  .ex-done .vu{width:34px; height:34px; flex:0 0 auto; border-radius:9px; background:var(--good); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:800;}
  .ex-done .nm{flex:1; min-width:0; text-align:left; font-size:16px; font-weight:700; color:var(--ink-mute);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .ex-done .nm em{display:block; font-style:normal; font-size:12.5px; font-weight:700;
    color:var(--accent-deep); margin-top:1px;}
  .ex-done .nm em b{color:var(--good);}
  .ex-done .dep{flex:0 0 auto; color:var(--ink-soft); display:flex;}
  .ex-done .dep svg{width:20px; height:13px;}
  @keyframes replieIn{from{opacity:0; transform:translateY(-8px);} to{opacity:1; transform:none;}}

  /* ---- « exercice terminé », le temps d'un souffle ---- */
  .ex-fini{position:absolute; inset:0; z-index:5; border-radius:var(--radius); background:var(--surface);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:11px;
    animation:finiIn .28s ease;}
  .ex-fini .rond{width:60px; height:60px; border-radius:50%; background:var(--good); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:32px;
    animation:finiPop .5s cubic-bezier(.34,1.56,.64,1);}
  .ex-fini .txt{font-size:16.5px; font-weight:800; text-align:center; padding:0 18px;}
  @keyframes finiIn{from{opacity:0;} to{opacity:1;}}
  @keyframes finiPop{from{transform:scale(.3); opacity:0;} to{transform:scale(1); opacity:1;}}
  @media (prefers-reduced-motion:reduce){
    .set-row.actif.bn .ck{animation:none;}
    .ex-done, .ex-fini, .ex-fini .rond{animation:none;}
    .set-row .ck:active, .set-row .dg:active{transform:none;}
  }
  .ex-head{display:flex; align-items:baseline; gap:8px; margin-bottom:2px;}
  .ex-name{font-size:17px; font-weight:700;}
  .hint{font-size:12.5px; color:var(--ink-mute); margin-bottom:10px;}
  .set-row{display:grid; grid-template-columns:26px 1fr 1fr 34px 44px; gap:8px; align-items:center; margin-bottom:8px;}
  .set-row .dg{width:34px; height:42px; border-radius:10px; border:1px dashed var(--border); background:none;
    color:var(--accent); font-size:16px; font-weight:700; display:flex; align-items:center; justify-content:center;}
  .set-row.done .dg{opacity:.55;}
  .set-row .n{font-size:13px; font-weight:700; color:var(--ink-mute); font-variant-numeric:tabular-nums;}
  .set-row input{text-align:center; padding:9px 6px;}
  .set-row .ck{width:44px; height:42px; border-radius:10px; border:1px solid var(--border); background:var(--surface2); display:flex; align-items:center; justify-content:center; font-size:17px; color:var(--ink-mute);}
  .set-row.done input{background:var(--surface); color:var(--ink-soft); border-color:transparent;}
  .set-row.warm .n{font-size:10px; letter-spacing:.02em; color:var(--accent); font-weight:800;}
  .set-row.warm input{border-style:dashed;}
  .inj-note{background:rgba(224,108,90,.12); border:1px solid rgba(224,108,90,.35); border-radius:10px; padding:9px 11px; margin-bottom:10px; font-size:12.5px; line-height:1.5; color:var(--ink-soft);}
  .inj-note b{color:var(--bad);}
  .inj-swap{color:var(--accent); font-weight:700; text-decoration:underline; font-size:12.5px;}
  .set-row.done .ck{background:var(--good); border-color:var(--good); color:#fff; border-radius:11px;}
  .set-row .ck svg{width:23px; height:23px; display:block;}
  /* la coche arrive comme un appui : elle enfonce puis rebondit */
  @keyframes cochePop{0%{transform:scale(.45); opacity:0;} 55%{transform:scale(1.18); opacity:1;}
    75%{transform:scale(.94);} 100%{transform:scale(1);}}
  .set-row .ck.pop svg{animation:cochePop .42s cubic-bezier(.3,1.4,.5,1);}
  @media (prefers-reduced-motion:reduce){ .set-row .ck.pop svg{animation:none;} }
  .rir-ask{background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:10px 12px; margin:2px 0 10px;}
  .rir-ask .q{font-size:13.5px; font-weight:600; margin-bottom:8px; color:var(--ink-soft);}
  .rir-ask .q.ok{margin:0; color:var(--accent);}
  .rir-ask .row button{flex:1; background:var(--surface); border:1px solid var(--border); border-radius:9px; padding:9px 0; font-weight:700; font-size:14px;}
  .icon-btn.inj-btn{color:var(--bad); font-size:15px;}
  .icon-btn svg{width:17px; height:17px;}
  .chrono.pause{opacity:.5;}
  .chrono::after{content:"";}
  .hist-ex-line{font-size:13.5px; color:var(--ink-soft); line-height:1.6;}
  .rir-lourd{display:block; width:100%; margin-top:7px; padding:9px; border-radius:10px;
    border:1px dashed var(--border); background:none; color:var(--ink-mute); font-size:12.5px; font-weight:700;}
  .set-row.drop{margin-top:-3px;}
  .set-row.drop .n{font-size:14px; color:var(--accent); text-align:right;}
  .set-row.drop input{padding:6px 6px; font-size:13.5px; background:var(--surface2);}
  .set-row.drop .ck{width:44px; height:34px; font-size:14px; color:var(--bad); background:none; border-style:dashed;}
  .set-cols{display:grid; grid-template-columns:26px 1fr 1fr 34px 44px; gap:8px; margin-bottom:6px;}
  .set-cols span{font-size:10.5px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-mute); text-align:center;}

  /* list rows */
  .lrow{display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:13px 14px;}
  .lrow .t1{font-weight:700;}
  .lrow .t2{font-size:12.5px; color:var(--ink-mute);}

  /* chips */
  .chips{display:flex; gap:6px; flex-wrap:wrap;}
  .chip{padding:7px 13px; border-radius:99px; font-size:13.5px; font-weight:600; background:var(--surface); border:1px solid var(--border); color:var(--ink-soft);}
  .chip.on{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}

  /* chart */
  .chart-wrap{position:relative; margin-top:6px;}
  .chart-tip{position:absolute; pointer-events:none; background:var(--surface2); border:1px solid var(--border); border-radius:9px; padding:6px 9px; font-size:12.5px; display:none; white-space:nowrap; box-shadow:0 4px 16px rgba(0,0,0,.4); z-index:5;}
  .chart-tip b{font-variant-numeric:tabular-nums;}

  /* modal */
  .overlay{position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:60; display:none; align-items:flex-end; justify-content:center;}
  .overlay.show{display:flex;}
  .sheet{background:var(--surface); border-radius:20px 20px 0 0; width:100%; max-width:560px; max-height:88dvh; overflow-y:auto; padding:18px 16px calc(24px + env(safe-area-inset-bottom)); border-top:1px solid var(--border);}
  .sheet h3{font-size:18px; margin-bottom:14px; text-align:center; padding:0 34px;}
  /* croix de fermeture, présente sur toutes les fiches */
  .sheet-x{position:absolute; top:10px; right:12px; z-index:5; width:32px; height:32px; border-radius:50%;
    background:var(--surface2); color:var(--ink-soft); display:flex; align-items:center; justify-content:center;
    font-size:17px; line-height:1;}
  .sheet{position:relative;}
  .sheet{background:var(--sheet);}
  /* ---- fiche « nouvelle séance » ---- */
  .f-lab{font-size:10.5px; font-weight:800; letter-spacing:.11em; text-transform:uppercase; color:var(--ink-mute); display:block; margin-bottom:6px;}
  .tpl-item{background:var(--field); border:1px solid var(--border); border-radius:12px; padding:10px 11px; margin-bottom:8px;}
  .tpl-item .cfg{display:grid; grid-template-columns:1fr 1fr 1fr; gap:7px; margin-top:8px;}
  .tpl-item .cfg .label{font-size:9px; letter-spacing:.08em; text-align:center; display:block; margin-bottom:3px;}
  .tpl-item .cfg input{text-align:center; padding:7px 4px; font-size:14px; background:var(--sheet);}
  .tpl-vide{text-align:center; font-size:13.5px; color:var(--ink-mute); padding:12px 0 14px;}
  .btn-dash{border:1px dashed var(--border); background:none; color:var(--ink-soft); font-weight:700;
    border-radius:12px; padding:12px; width:100%;}
  /* ---- fiche « choisir un exercice » ---- */
  .pk-h{font-size:11px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--accent); margin:14px 0 7px;}
  .pk-row{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--border);}
  .pk-row .th{width:44px; height:44px; border-radius:9px; background:var(--surface2); flex:0 0 auto;
    display:flex; align-items:center; justify-content:center;}
  .pk-row .nm{font-size:14px; font-weight:700; line-height:1.25;}
  .pk-row .eq{font-size:11.5px; color:var(--ink-mute);}
  .pk-add{width:26px; height:26px; border-radius:50%; background:var(--accent); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:17px; font-weight:600; flex:0 0 auto;}
  .grab{width:44px; height:5px; border-radius:3px; background:var(--ink-mute); opacity:.55; margin:0 auto 6px;}
  .grab::after{content:""; display:block; height:14px;}   /* zone de préhension plus large au doigt */
  .sheet{touch-action:pan-y;}

  .hb-row{display:flex; align-items:center; gap:10px; background:var(--surface2); border:1px solid var(--border); border-radius:11px; padding:11px 12px; font-weight:600; font-size:14.5px;}
  .hb-row .hb-ck{width:24px; height:24px; flex:none; border-radius:8px; border:1.5px solid var(--border); background:var(--surface); display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:800;}
  .hb-row.on{border-color:var(--accent-deep);}
  .hb-row.on .hb-ck{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
  .hb-row.on .hb-lbl{color:var(--ink-soft); text-decoration:line-through; text-decoration-color:var(--ink-mute);}
  .hb-row{width:100%;}
  .hb-lbl{font:inherit; font-weight:600; padding:2px 0;}
  .hb-caret{flex:none; width:26px; color:var(--ink-mute); font-size:13px;}
  .hb-sub{padding:9px 4px 4px 12px; display:flex; flex-direction:column; gap:9px;}
  .chip-sm{padding:6px 10px; font-size:12.5px;}
  .chip-sm i{font-style:normal; font-size:10.5px; color:var(--ink-mute); margin-left:4px; font-weight:700;}
  .chip-sm.on i{color:var(--accent-ink); opacity:.7;}
  .pr-plot{position:relative; display:flex; gap:5px; align-items:flex-end; height:132px; padding-left:32px;}
  .pr-target{position:absolute; left:32px; right:0; border-top:1.5px dashed var(--ink-mute); opacity:.7; z-index:2;}
  .pr-target i{position:absolute; left:-32px; top:-8px; font-style:normal; font-size:10.5px; font-weight:700; color:var(--ink-mute); background:var(--surface); padding:0 2px;}
  .pr-col{flex:1; display:flex; flex-direction:column; justify-content:flex-end; height:100%; padding:0; background:none; border:none; min-width:0;}
  .pr-col .pr-val{height:17px; line-height:17px; font-size:11px; font-weight:800; font-variant-numeric:tabular-nums; text-align:center;}
  .pr-col .pr-barwrap{flex:1; display:flex; align-items:flex-end; width:100%;}
  .pr-col .pr-b{width:100%; border-radius:4px 4px 2px 2px; display:block;}
  .pr-col:active .pr-b{opacity:.6;}
  .pr-labels{display:flex; gap:5px; margin-top:5px; padding-left:32px;}
  .pr-labels span{flex:1; text-align:center; font-size:11px; font-weight:700; color:var(--ink-mute);}
  .week-dots{display:flex; gap:8px; margin:12px 0 14px;}
  .wd{flex:1; text-align:center;}
  .wd i{display:block; height:26px; border-radius:9px; background:var(--surface2); border:1px solid var(--border); margin-bottom:4px;}
  .wd.on i{background:var(--accent); border-color:var(--accent);}
  .wd.today i{border-color:var(--accent-deep); border-width:2px;}
  .wd span{font-size:10px; font-weight:700; color:var(--ink-mute); letter-spacing:.05em;}
  .wd.today span{color:var(--accent);}
  .wk-stats{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; border-top:1px solid var(--border); padding-top:12px;}
  .wk-stats .v{font-weight:800; font-size:15.5px; font-variant-numeric:tabular-nums;}
  .wk-stats .u{font-size:11px; color:var(--ink-mute);}
  .hscroll{display:flex; gap:10px; overflow-x:auto; scroll-snap-type:x mandatory; margin:0 -16px; padding:0 16px 6px; scrollbar-width:none;}
  .hscroll::-webkit-scrollbar{display:none;}
  .sess-card{flex:0 0 76%; max-width:260px; scroll-snap-align:start; background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:14px;}
  .sugg-badge{display:inline-block; font-size:10.5px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--accent-ink); background:var(--accent); border-radius:99px; padding:3px 9px; margin-bottom:8px;}
  /* ---- écran Progression ---- */
  .card-t{font-size:21px; font-weight:800; letter-spacing:-.01em; line-height:1.15;}
  .card-sub{font-size:13px; color:var(--ink-soft); margin-top:1px;}
  .card-i{width:20px; height:20px; flex:0 0 auto; border-radius:50%; border:1.5px solid var(--accent);
    color:var(--accent); font-size:12px; font-weight:800; line-height:1;
    display:inline-flex; align-items:center; justify-content:center; vertical-align:2px;}
  /* jauge de progression vers le poids visé */
  .jauge{height:15px; border-radius:99px; background:var(--surface2); border:1px solid var(--border);
    overflow:hidden; margin-top:12px;}
  .jauge i{display:block; height:100%; border-radius:99px; background:var(--accent); transition:width .35s ease;}
  .jauge-txt{text-align:center; font-size:12.5px; color:var(--ink-mute); margin-top:7px;}
  /* languette qui déplie un graphique, à cheval sur le bas de la carte */
  .pli{display:flex; justify-content:center; margin-top:-12px; position:relative; z-index:4;}
  .pli button{display:flex; align-items:center; justify-content:center; gap:6px;
    background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:6px 20px;
    box-shadow:0 3px 10px rgba(0,0,0,.08); color:var(--ink-soft);}
  .pli svg{width:17px; height:11px; transition:transform .25s ease;}
  .pli button[aria-expanded="true"] svg{transform:rotate(180deg);}
  /* bloc d'analyse repliable */
  .depli{border:1.5px dashed var(--border); border-radius:12px; margin-top:14px; overflow:hidden;}
  .depli-h{width:100%; display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:12px 14px; font-size:15px; font-weight:800; color:var(--ink);}
  .depli-h svg{width:17px; height:11px; flex:0 0 auto; color:var(--ink-soft); transition:transform .25s ease;}
  .depli-h[aria-expanded="true"] svg{transform:rotate(180deg);}
  .depli-c{padding:0 14px 13px;}
  .depli-c .analyse{margin-top:0; background:none; border:none; padding:0;}
  .analyse{background:var(--surface2); border:1px solid var(--border); border-radius:12px; padding:12px 13px; margin-top:14px; font-size:13px; line-height:1.6; color:var(--ink-soft);}
  .analyse b{color:var(--ink);}
  .mp-row{margin-bottom:13px;}
  .mp-head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:4px; gap:8px;}
  .mp-name{font-weight:700; font-size:15px;}
  .mp-tag{font-size:12.5px; font-weight:600; white-space:nowrap;}
  .mp-bar{position:relative; height:22px; border-radius:7px; background:var(--surface2);}
  .mp-fill{height:100%; border-radius:7px; min-width:10px;}
  /* le pourcentage est posé par-dessus : dedans si la barre est assez large, juste à côté sinon */
  .mp-val{position:absolute; top:0; line-height:22px; font-size:12.5px; font-weight:800; white-space:nowrap;}
  .mp-val.dedans{color:rgba(0,0,0,.6); transform:translateX(-100%); padding-right:8px;}
  .mp-val.dehors{color:var(--ink-soft); padding-left:8px;}
  .mp-nodata{font-size:12px; color:var(--ink-mute); padding:0 9px; line-height:22px;}
  .mp-bodies{display:flex; justify-content:center; gap:14px; margin:10px 0 16px; border-radius:12px;}
  
  .mp-fig{position:relative; width:46%; max-width:160px;}
  /* base blanche > muscles colorés > lignes : la base reste blanche dans les deux thèmes */
  .mp-fig .mp-base{width:100%; display:block;}
  /* les calques suivent le format de la silhouette (658 × 1200), jamais la hauteur du cadre :
     une légende sous l'image étirait les muscles vers le bas. */
  .mp-fig .mp-lignes{position:absolute; top:0; left:0; width:100%; aspect-ratio:658/1200; height:auto;
    display:block; pointer-events:none;}
  .mp-fig svg{position:absolute; inset:0; width:100%; height:100%;}
  /* silhouette absente : on n'affiche ni couleurs ni tracé, juste un mot d'explication */
  .mp-fig.ko{min-height:60px; display:flex; align-items:center; justify-content:center;}
  .mp-fig.ko .mp-mask, .mp-fig.ko .mp-lignes, .mp-fig.ko .mp-base{display:none;}
  .mp-fig.ko::after{content:"Silhouette indisponible"; font-size:11.5px; color:var(--ink-mute); text-align:center;}
  .mp-mask{position:absolute; top:0; left:0; width:100%; aspect-ratio:658/1200; height:auto;
    display:block; pointer-events:none;
    -webkit-mask-size:100% 100%; mask-size:100% 100%;
    -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat;
    -webkit-mask-position:center; mask-position:center;}
  .toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(78px + env(safe-area-inset-bottom)); z-index:80;
    background:var(--good); color:#0d1a12; font-weight:700; font-size:14px; padding:11px 18px; border-radius:12px;
    box-shadow:0 8px 26px rgba(0,0,0,.5); transition:opacity .4s; max-width:88%; text-align:center;}
  .empty{text-align:center; color:var(--ink-mute); padding:34px 18px; font-size:14.5px;}
  .empty .big{font-size:34px; margin-bottom:8px;}

  .hist-detail{margin-top:10px; border-top:1px solid var(--border); padding-top:10px; display:none;}
  .hist-detail.show{display:block;}
  .hist-ex{margin-bottom:8px;}
  .hist-ex .n{font-weight:700; font-size:14px;}
  .hist-ex .s{font-size:13px; color:var(--ink-soft); font-variant-numeric:tabular-nums;}

  .muscle-h{font-size:11px; font-weight:700; letter-spacing:.11em; text-transform:uppercase; color:var(--accent); margin:14px 0 6px;}
  .pick-row{display:flex; align-items:center; gap:11px; padding:8px 4px; border-bottom:1px solid var(--border); font-weight:600;}
  .pick-row:active{background:var(--surface2);}
  /* exercice hors de ton matériel : proposé en dernier, en retrait, mais choisissable */
  .pk-row.absent{opacity:.45;}
  .pk-row.absent .eq{color:var(--bad);}
  .pick-row .eq{font-size:12px; color:var(--ink-mute); font-weight:500;}
  .info-btn{width:30px; height:30px; flex:none; font-size:15px; color:var(--accent); background:none; border:none;}
  /* ---- liste d'aliments cherchable ---- */
  .al-liste{max-height:34dvh; overflow-y:auto; -webkit-overflow-scrolling:touch;
    background:var(--surface); border-radius:12px; padding:2px 11px 9px;}
  .al-h{font-size:10.5px; font-weight:800; letter-spacing:.1em; text-transform:uppercase;
    color:var(--accent); margin:11px 0 4px;}
  .al-row{display:flex; align-items:baseline; gap:10px; width:100%; text-align:left;
    background:none; border:0; border-top:1px solid var(--border); padding:9px 0; color:var(--ink);}
  .al-h + .al-row{border-top:0;}
  .al-row .nm{flex:1; min-width:0; font-size:14px; font-weight:700; line-height:1.25;}
  .al-row .vl{flex:0 0 auto; font-size:11.5px; font-weight:700; color:var(--ink-mute); white-space:nowrap;}
  .al-row .vl em{font-style:normal; font-weight:400; opacity:.7;}
  .al-row.on{background:var(--surface2); border-radius:10px; border-top-color:transparent;
    padding-inline:9px; margin-inline:-9px;}
  .al-row.on .nm{color:var(--accent-deep);}
  .al-note{font-size:11.5px; color:var(--ink-mute); line-height:1.45; margin:-1px 0 6px;}
  .al-vide{font-size:13px; color:var(--ink-mute); padding:14px 0; text-align:center; line-height:1.5;}

  /* ---- récapitulatif des repas : ce qui a été mangé, d'un coup d'œil ---- */
  .eat-repas{display:flex; gap:5px; margin-top:9px;}
  .eat-repas .er{flex:1; min-width:0; background:var(--surface2); border-radius:9px; padding:5px 2px 6px;
    font-size:10px; font-weight:700; color:var(--ink-mute); line-height:1.25; text-align:center;}
  .eat-repas .er b{display:block; font-size:12px; font-weight:800; color:var(--ink-mute);}

  "Seulement {} % séparent tes deux extrêmes : ton développement est <b>remarquablement homogène</b>. À ce stade, inutile de chasser un point faible — continue à charger partout.":"Only {}% separates your two extremes: your development is <b>remarkably even</b>. At this stage there's no weak point to chase — keep adding load everywhere.",

  "Garde {} mais monte les charges : tu es à un niveau où la progression vient de l'intensité, plus de la répétition.":"Keep {} but add load: you're at a level where progress comes from intensity, not from more reps.",
  "En le travaillant deux fois par semaine, compte <b>{min} à {max} cm {quoi} par mois</b>. Sur une semaine c'est invisible ; sur six mois, ça se voit sur les photos.":"Working it twice a week, expect <b>{min} to {max} cm {quoi} a month</b>. Over a week it's invisible; over six months, it shows in photos.",
  "Deux passages par semaine suffisent à combler ce retard en quelques semaines.":"Two sessions a week is enough to close this gap in a few weeks.",
  "Le bon réflexe maintenant n'est pas de rattraper quoi que ce soit, mais d'<b>ajouter de la charge partout</b> : 2,5 kg de plus dès que tu tiens le haut de ta fourchette de répétitions. Un physique équilibré progresse en bloc.":"The right move now isn't to catch anything up, but to <b>add load everywhere</b>: 2.5 kg more as soon as you hit the top of your rep range. A balanced physique progresses as a block.",

  "Ton corps brûle environ <b>{tdee} kcal</b> par jour au repos et en activité (calcul à partir de ta taille, ton poids, ton âge, tes {n} séances par semaine et ton métabolisme). Pour {but}, on {sens} <b>{delta} kcal</b>.":"Your body burns about <b>{tdee} kcal</b> a day at rest and in activity (worked out from your height, weight, age, your {n} sessions a week and your metabolism). To {but}, we {sens} <b>{delta} kcal</b>.",
  "progresser":"make progress",
  "ajoute":"add",
  "retire":"take off",
  "Aucune formule ne tombe juste au gramme près : la marge réelle est de ±5 %. Vise <b>au moins {min} kcal</b> — c'est le seuil qui compte, celui en dessous duquel tu ne prends rien. Au-delà de <b>{max} kcal</b>, le surplus part surtout en gras plutôt qu'en muscle : inutile de forcer plus haut.":"No formula lands exactly right: the real margin is ±5%. Aim for <b>at least {min} kcal</b> — that's the threshold that matters, the one below which you gain nothing. Above <b>{max} kcal</b>, the surplus mostly goes to fat rather than muscle: no point pushing higher.",
  "Aucune formule ne tombe juste au gramme près : la marge réelle est de ±5 %. Le chiffre qui compte est le plafond : <b>pas plus de {max} kcal</b>. Mais ne descends pas non plus sous <b>{min} kcal</b> — un déficit trop violent te fait perdre du muscle et ne tient pas deux semaines.":"No formula lands exactly right: the real margin is ±5%. The number that matters is the ceiling: <b>no more than {max} kcal</b>. But don't drop below <b>{min} kcal</b> either — too harsh a deficit costs you muscle and won't last two weeks.",
  "Tu as indiqué toi-même une dépense de <b>{} kcal</b> : c'est elle qui sert de base, pas la formule.":"You entered a burn of <b>{} kcal</b> yourself: that's what we use as the baseline, not the formula.",
  "Ta dépense a été recalculée d'après tes {j} jours de suivi et l'évolution de ton poids : <b>{k} kcal</b> au lieu du chiffre théorique.":"Your burn has been recalculated from your {j} days of tracking and how your weight moved: <b>{k} kcal</b> instead of the theoretical figure.",
  "Il vient uniquement des aliments que tu coches. Si tu manges quelque chose qui n'est pas dans la liste, passe par « Autre » — sinon le total sera sous-estimé. Tu peux aussi corriger une journée à la main depuis Progression.":"It comes only from the foods you tick. If you eat something that isn't in the list, use \u201cOther\u201d — otherwise the total will be under-counted. You can also correct a day by hand from Progress.",
  "Elles ne se soustraient pas ici : tes séances sont déjà comptées dans ta dépense quotidienne. Les kcal affichées après une séance sont là pour l'info, pas pour t'autoriser à manger plus.":"They don't get subtracted here: your workouts are already counted in your daily burn. The kcal shown after a session are there for information, not as permission to eat more.",
  "C'est la balance, pas l'appli. Pèse-toi une fois par semaine, au même moment : si le poids ne bouge pas dans le sens voulu au bout de 2 à 3 semaines, ajuste de 200 kcal.":"It's the scale, not the app. Weigh yourself once a week, at the same time: if the weight isn't moving the way you want after 2 or 3 weeks, adjust by 200 kcal.",

  "Les formules utilisées sont établies pour des adultes. L'application est réservée aux <b>{} ans et plus</b>.":"The formulas used are established for adults. The app is for <b>{} and over</b>.",
  "exerçant sous le nom":"trading as",

  "Détail dans les mentions légales.":"Full details in the legal notice.",
  "L'application est réservée aux personnes de <b>{} ans ou plus</b>. Les formules de besoins caloriques sont établies pour des adultes, et le suivi du poids ne convient pas à un public plus jeune.":"The app is for people aged <b>{} or over</b>. The calorie formulas are established for adults, and weight tracking isn't suitable for a younger audience.",
  "Certaines fonctions pourront être proposées par abonnement. Le cas échéant : le prix, la durée et le renouvellement sont affichés avant tout paiement ; <b>l'achat se fait auprès de Google</b>, qui est le vendeur, encaisse le paiement et gère la TVA ; l'abonnement se résilie à tout moment depuis le Play Store (Abonnements), et reste actif jusqu'à la fin de la période payée. Les demandes de remboursement relèvent de Google. Tant qu'aucun abonnement n'est proposé, cette clause reste sans objet.":"Some features may be offered by subscription. In that case: the price, the term and the renewal are shown before any payment; <b>the purchase is made through Google</b>, which is the seller, takes the payment and handles VAT; the subscription can be cancelled at any time from the Play Store (Subscriptions), and stays active until the end of the paid period. Refund requests are handled by Google. As long as no subscription is offered, this clause has no effect.",
  "Pour toute question :":"For any question:",
  /* --- écrans légaux --- */
  "C'est une application de suivi sportif. Les calories, protéines, charges et estimations de récupération qu'elle affiche sont des <b>ordres de grandeur</b>, pas des prescriptions.":"It's a training tracker. The calories, protein, loads and recovery estimates it shows are <b>ballpark figures</b>, not prescriptions.",
  "Les chiffres sont des estimations":"The numbers are estimates",
  "Ta dépense énergétique est calculée par une formule statistique : elle peut se tromper de 300 à 500 kcal sur une personne donnée. La seule mesure fiable reste l'évolution de ton poids sur plusieurs semaines.":"Your energy burn is worked out with a statistical formula: it can be 300 to 500 kcal off for any given person. The only reliable measure is how your weight moves over several weeks.",
  "Demande un avis médical":"Ask a doctor",
  "Avant de suivre les recommandations de l'app en cas de maladie chronique, de blessure, de trouble du comportement alimentaire, de grossesse, ou si tu prends un traitement. En cas de douleur pendant un exercice, arrête-toi.":"Before following the app's advice if you have a chronic illness, an injury, an eating disorder, are pregnant, or are on medication. If an exercise hurts, stop.",
  "Ce que l'app refuse de faire":"What the app won't do",
  "Elle ne construit pas de plan pour descendre sous un IMC de 18,5, et déconseille les pertes de poids supérieures à 20 % du poids de corps sans passer par des paliers. Ces garde-fous ne remplacent pas un suivi professionnel.":"It won't build a plan that takes you below a BMI of 18.5, and it advises against losing more than 20% of your bodyweight without going in stages. These guardrails are not a substitute for professional supervision.",
  "Réservée aux adultes":"For adults only",
  "Tout ce que tu saisis reste dans la mémoire de ton téléphone : aucun serveur ne reçoit tes séances, ton poids ni tes repas.":"Everything you enter stays in your phone's memory: no server receives your workouts, your weight or your meals.",
  "Pas de compte, pas de pub":"No account, no ads",
  "Aucune adresse e-mail demandée, aucune publicité, aucun traceur, aucune mesure d'audience. L'application ne contient aucun outil d'analyse d'un autre éditeur.":"No email address asked for, no advertising, no trackers, no analytics. The app contains no third-party analysis tool of any kind.",
  "Les autorisations demandées":"The permissions asked for",
  "Uniquement ce dont l'app se sert : <b>les notifications</b>, pour te prévenir de la fin d'un temps de repos ; <b>garder l'écran allumé</b> pendant une séance ; <b>le retour vibrant</b>. Rien d'autre : ni position, ni contacts, ni micro, ni appareil photo, ni accès à tes fichiers.":"Only what the app actually uses: <b>notifications</b>, to tell you a rest period is over; <b>keeping the screen on</b> during a workout; <b>vibration</b>. Nothing else: no location, no contacts, no microphone, no camera, no access to your files.",
  "Réseau":"Network",
  "L'application installée depuis le Play Store contient tous ses fichiers : elle fonctionne entièrement hors ligne et ne contacte aucun serveur. La version ouverte dans un navigateur va chercher ses mises à jour chez son hébergeur, sans jamais envoyer la moindre donnée personnelle.":"Installed from the Play Store, the app contains all its files: it works entirely offline and contacts no server. Opened in a browser, it fetches its updates from its host, without ever sending a single piece of personal data.",
  "Ce que Google sait, lui":"What Google knows",
  "Si tu as installé l'app depuis le Play Store, Google enregistre de son côté l'installation et, le cas échéant, l'achat d'un abonnement. Ces données relèvent de la politique de confidentialité de Google, pas de la nôtre : l'éditeur n'y a pas accès, hormis des statistiques anonymes de téléchargement.":"If you installed the app from the Play Store, Google records the installation on its side and, where applicable, any subscription purchase. That data falls under Google's privacy policy, not ours: the publisher has no access to it, beyond anonymous download statistics.",
  "Ce que ça implique":"What that means for you",
  "Si tu désinstalles l'app, effaces les données du navigateur ou changes de téléphone, tout disparaît. Pense à enregistrer un fichier de sauvegarde depuis les réglages.":"If you uninstall the app, clear your browser data or change phone, everything goes. Remember to save a backup file from the settings.",
  "Réglages → Détails de sauvegarde → Tout effacer. La suppression est immédiate et définitive.":"Settings → Backup details → Erase everything. Deletion is immediate and permanent.",
