/* ================= ALIMENTATION ================= */
function renderEat(app){
  const k = dayKey();
  if(!mealCur) mealCur = mealParHeure();
  const sel = db.habitSel[k] || {};
  const plan = planFor(db.profile);
  const protTarget = proteinTarget();
  const protNow = dayProt(k), kcalNow = dayKcal(k);
  const kMin = plan? plan.kcalMin : 0, kMax = plan? plan.kcalMax : 0;
  const enHausse = !plan || plan.delta >= 0;
  const kRef = enHausse? kMin : kMax;
  const coul = MEAL_C[mealCur];

  app.innerHTML = `
    ${hero(`<div class="big">${TR("Aujourd'hui")}</div>`)}
    <div class="under-hero" style="display:flex; gap:9px; align-items:stretch;">
      <div class="eat-card" style="flex:1; min-width:0;">
        <div class="eat-line"><span class="v">${protNow} <span style="font-size:14px;">g</span></span><span class="l">${TR("Protéines")}</span></div>
        <div class="eat-bar"><i style="width:${Math.min(100, protTarget? protNow/protTarget*100 : 0)}%; background:${protNow>=protTarget?'var(--good)':'var(--accent)'};"></i><b>${protTarget} g</b></div>
        <div class="eat-line"><span class="v">${kcalNow}</span><span class="l">${TR("Kcal")}</span>
          <button class="icon-btn info-btn" id="eat-kinfo" style="margin-left:2px;" title="${TR("Comment sont calculées mes calories ?")}">ⓘ</button></div>
        <div class="eat-bar"><i style="width:${Math.min(100, kRef? kcalNow/kRef*100 : 0)}%; background:${
          !kRef? 'var(--accent)' : (kcalNow>kMax? 'var(--bad)' : (kcalNow>=kMin? 'var(--good)' : 'var(--accent)'))};"></i><b>${kRef? kRef+" kcal" : "—"}</b></div>
        <div class="eat-repas">${MEALS.map(([id,lab])=>{
          const g = mealProt(k, id);
          return `<button class="er ${g? "on":""}${mealCur===id? " ici":""}" data-goto="${id}">
            ${esc(TR(lab))} <b>${g? g+" g" : "—"}</b></button>`;
        }).join("")}</div>
      </div>
      <div class="eat-side">
        <button id="eat-plan" title="${TR("Mon plan")}" aria-label="${TR("Mon plan")}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6.5 9 4l6 2.5L21 4v13.5L15 20l-6-2.5L3 20z"/><path d="M9 4v13.5M15 6.5V20"/></svg></button>
        <button id="eat-tips" title="${TR("Idées d'aliments")}" aria-label="${TR("Idées d'aliments")}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 18h5M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.45 1 1.15 1 1.9v.2h5v-.2c0-.75.4-1.45 1-1.9A6 6 0 0 0 12 3z"/></svg></button>
      </div>
    </div>
    <div class="meal-tabs">${MEALS.map(([id,lab])=>`
      <button class="meal-tab ${mealCur===id?'on':''}" data-meal="${id}"
        style="${mealCur===id? `background:${MEAL_C[id]};`:""}"><span>${TR(lab)}${(sel[id]||[]).length? " ·"+(sel[id]||[]).length : ""}</span><i></i></button>`).join("")}</div>
    <div class="meal-panel" id="meal-panel"></div>`;
  wireTopbar();
  document.getElementById("eat-kinfo").onclick = ()=>openKcalInfo(plan);
  document.getElementById("eat-plan").onclick  = ()=>showPlan(false);
  document.getElementById("eat-tips").onclick  = ()=>openKcalTips(enHausse? "up":"down", plan);
  /* le récapitulatif sert aussi de raccourci vers le repas */
  document.querySelectorAll("[data-goto]").forEach(b=>b.onclick=()=>{
    if(b.dataset.goto === mealCur) return;
    mealCur = b.dataset.goto; renderSurPlace();
  });
  /* changer de repas ne redessine que le panneau : l'onglet peut alors s'animer */
  document.querySelectorAll("[data-meal]").forEach(b=>b.onclick=()=>{
    if(b.dataset.meal === mealCur) return;
    mealCur = b.dataset.meal;
    document.querySelectorAll("[data-meal]").forEach(x=>{
      const actif = x.dataset.meal === mealCur;
      x.classList.toggle("on", actif);
      x.style.background = actif ? MEAL_C[mealCur] : "";
    });
    const pan = document.getElementById("meal-panel");
    pan.classList.remove("swap"); void pan.offsetWidth; pan.classList.add("swap");
    dessineRepas(pan);
  });

  dessineRepas(document.getElementById("meal-panel"));
}
/* ---- pastilles d'aliments du repas courant ---- */
function dessineRepas(panel){
  const k = dayKey();
  const sel = db.habitSel[k] || {};
  const coul = MEAL_C[mealCur];
  const mySel = sel[mealCur] || [];
  let groups = habitOpts(mealCur);
  const connus = groups.reduce((a,g)=>a.concat(g[2].map(x=>x[0])), []);
  /* tes habitudes de ce repas passent devant, et ne sont plus répétées dessous */
  const hab = habitudesDuRepas(mealCur);
  if(hab.length >= 3){
    const pris = hab.map(x=>x[0]);
    groups = [[TR("Tes habitudes"), "hab", hab]]
      .concat(groups.map(([t,c,items])=>[t, c, items.filter(x=>!pris.includes(x[0]))])
                    .filter(g=>g[2].length));
  }
  const libres = mySel.filter(l=>!connus.includes(l));
  const pastille = (label, prot, on) => {
    /* on traduit avant de découper : le nom ET la portion ressortent en anglais.
       data-opt garde le libellé français, qui est la clé enregistrée. */
    const pa = partsAliment(TR(label), prot);
    return `<button class="fchip ${on?'on':''}" data-opt="${esc(label)}" style="${on? `background:${coul};`:""}">
      <span class="ic">${foodIcon(label)}</span>
      <span class="tx"><span class="nm">${esc(pa.nom)}</span>${pa.qCourt? `<span class="q">${esc(pa.qCourt)}</span>`:""}</span>
      <span class="g">${pa.prot}<span style="font-size:9px;">g</span></span>
    </button>`;
  };
  panel.innerHTML = groups.map(([titre,cle,items])=>`
    <div class="meal-h">${esc(TR(titre))}</div>
    <div class="fgrid">${items.map(([l,pr])=>pastille(l, pr, mySel.includes(l))).join("")}</div>`).join("")
    + (libres.length? `<div class="meal-h">${TR("Ajoutés aujourd'hui")}</div>
      <div class="fgrid">${libres.map(l=>pastille(l, protOf(l), true)).join("")}</div>`:"")
    + `<div class="fab-center"><button class="fab" id="eat-add" style="background:${coul}; box-shadow:0 6px 18px rgba(0,0,0,.2);" aria-label="Ajouter un aliment">＋</button></div>`;

  document.getElementById("eat-add").onclick = ()=>openAjoutAliment(mealCur);

  let lpT = null, lpFired = false;
  panel.querySelectorAll("[data-opt]").forEach(b=>{
    const label = b.dataset.opt;
    const deb = ()=>{ lpFired=false; clearTimeout(lpT);
      lpT = setTimeout(()=>{ lpFired=true; if(navigator.vibrate) navigator.vibrate(18); openModifAliment(mealCur, label); }, 340); };
    const fin = ()=>clearTimeout(lpT);
    b.addEventListener("touchstart", deb, {passive:true});
    ["touchend","touchmove","touchcancel"].forEach(e=>b.addEventListener(e, fin));
    b.addEventListener("mousedown", deb); b.addEventListener("mouseup", fin); b.addEventListener("mouseleave", fin);
    b.oncontextmenu = e=>{ e.preventDefault(); openModifAliment(mealCur, label); };
    b.onclick = ()=>{
      if(lpFired){ lpFired=false; return; }
      basculerAliment(mealCur, label);
    };
  });
}
function basculerAliment(meal, label){
  const k = dayKey();
  if(!db.habitSel[k]) db.habitSel[k] = {};
  const arr = db.habitSel[k][meal] || [];
  db.habitSel[k][meal] = arr.includes(label)? arr.filter(x=>x!==label) : arr.concat(label);
  if(db.dayFix[k]) delete db.dayFix[k];      /* la saisie manuelle reprend la main */
  save(); renderSurPlace();
}

/* fiche « Ajouter un aliment » : liste d'aliments, quantité, garder dans les propositions */
function openAjoutAliment(meal){
  openSheet(`<h3 style="text-align:center;">${TR("Ajouter un aliment")}</h3>
    <div class="stack">
      <div><span class="label" style="display:block; margin-bottom:5px;">Aliment</span>
      <input id="ot-q" placeholder="${TR("Aliment, ou famille : poisson, viande, légume…")}" autocomplete="off"
        enterkeyhint="search" style="margin-bottom:7px;">
      <div class="al-liste" id="ot-liste"></div>
      <!-- la liste déroulante reste, cachée : c'est elle qui porte le choix -->
      <select id="ot-food" style="display:none;">${FOOD_100G.map(([grp,items])=>
        `<optgroup label="${TR(grp)}">${items.map(([n,pr,kc,u],i)=>`<option value="${grp}|${i}">${TR(n)}</option>`).join("")}</optgroup>`).join("")}
        <option value="manuel">${TR("Autre — je saisis les valeurs")}</option>
      </select></div>
      <div id="ot-gwrap"><span class="label" style="display:block; margin-bottom:5px;" id="ot-glabel">${TR("Quantité mangée (g)")}</span>
      <input type="number" inputmode="decimal" step="10" min="0" id="ot-g" placeholder="150"></div>
      <div id="ot-mwrap" style="display:none;">
        <span class="label" style="display:block; margin-bottom:5px;">Nom</span>
        <input id="ot-name" placeholder="${TR("Ex : plat du resto")}" style="margin-bottom:9px;">
        <span class="label" style="display:block; margin-bottom:5px;">${TR("Poids de la portion (g, facultatif)")}</span>
        <input type="number" inputmode="numeric" step="10" min="0" id="ot-gram" placeholder="250" style="margin-bottom:9px;">
        <span class="label" style="display:block; margin-bottom:5px;">${TR("Protéines (g)")}</span>
        <input type="number" inputmode="decimal" step="1" min="0" id="ot-prot" placeholder="25" style="margin-bottom:9px;">
        <span class="label" style="display:block; margin-bottom:5px;">Calories (facultatif)</span>
        <input type="number" inputmode="numeric" step="10" min="0" id="ot-kcal" placeholder="400">
        <p style="margin:7px 0 0; font-size:11.5px; color:var(--ink-mute); line-height:1.5;">${TR("Le poids est facultatif, mais si tu le donnes tu pourras ensuite ajuster la portion au gramme près.")}</p>
      </div>
      <div id="ot-live" style="font-size:14.5px; font-weight:700; color:var(--accent); min-height:20px;"></div>
      <label class="row" style="gap:9px; align-items:center; cursor:pointer;">
        <input type="checkbox" id="ot-save" style="width:19px; height:19px; accent-color:var(--accent); flex:0 0 auto;">
        <span style="font-size:13.5px; color:var(--ink-soft);">${TR("Garder dans mes propositions")}</span>
      </label>
      <button class="btn btn-accent" id="ot-ok">${TR("Enregistrer")}</button>
      ${nbMasques()? `<button class="btn btn-ghost btn-sm" id="ot-restore">${nbMasques()>1? `Restaurer les ${nbMasques()} propositions retirées` : TR("Restaurer la proposition retirée")}</button>`:""}
      <p style="margin:-2px 0 0; font-size:11.5px; color:var(--ink-mute); text-align:center;">${TR("Astuce : appui long sur une proposition pour la modifier.")}</p>
    </div>`);
  const foodEl = document.getElementById("ot-food"), gEl = document.getElementById("ot-g"), liveEl = document.getElementById("ot-live");
  const trouver = val => {
    const [grp, idx] = val.split("|");
    const g = FOOD_100G.find(x=>x[0]===grp);
    return g ? g[1][parseInt(idx)] : null;
  };
  const calc = ()=>{
    const manual = foodEl.value==="manuel";
    document.getElementById("ot-gwrap").style.display = manual? "none":"block";
    document.getElementById("ot-mwrap").style.display = manual? "block":"none";
    if(manual){ liveEl.textContent = ""; return null; }
    const f = trouver(foodEl.value);
    if(!f) return null;
    const [nom, prot100, kcal100, unite] = f;
    /* trois façons de compter : au poids, au volume (valeurs pour 100 ml), à la pièce */
    const liquide = unite === "cl";
    const piece = unite !== "100g" && !liquide;
    document.getElementById("ot-glabel").textContent = piece
      ? `Nombre (${unite}${unite.endsWith("s")?"":"s"})`
      : (liquide ? TR("Quantité bue (cl)") : "Quantité mangée (g)");
    gEl.step = piece ? 1 : (liquide ? 5 : 10);
    gEl.placeholder = piece ? "2" : (liquide ? "20" : "150");
    const q = parseFloat(gEl.value);
    if(!q || q<=0){ liveEl.textContent = ""; return null; }
    const part = piece ? q : (liquide ? q/10 : q/100);   /* combien de fois la valeur de référence */
    const prot = Math.round(prot100*part);
    const kcal = Math.round(kcal100*part);
    /* le nom traduit, sans sa parenthèse de portion */
    const court = TR(nom).replace(/\s*\(.*?\)/,"");
    const uni = TR(unite);
    liveEl.textContent = piece
      ? `${q} ${uni}${q>1?"s":""} ≈ ${prot} ${TR("g de protéines")} · ${kcal} kcal`
      : `${q} ${liquide?"cl":"g"} ${TR("de")} ${court.toLowerCase()} ≈ ${prot} ${TR("g de protéines")} · ${kcal} kcal`;
    return {label: piece
      ? `${court} ×${q} (~${prot} ${TR("g prot.")} · ${kcal} kcal)`
      : `${court} ${q} ${liquide?"cl":"g"} (~${prot} ${TR("g prot.")} · ${kcal} kcal)`, prot, kcal};
  };
  foodEl.onchange = calc; gEl.oninput = calc;

  /* la recherche : sans accent et sans casse, « pates » trouve « Pâtes cuites » */
  const qEl = document.getElementById("ot-q"), listeEl = document.getElementById("ot-liste");
  const dessinerListe = ()=>{
    let trouves = 0, html = "";
    chercherAliments(qEl.value).forEach(([grp, gardes])=>{
      trouves += gardes.length;
      html += `<div class="al-h">${esc(TR(grp))}</div>`
        + (FOOD_NOTE[grp] ? `<div class="al-note">${esc(TR(FOOD_NOTE[grp]))}</div>` : "")
        + gardes.map(([it,i])=>{
        const v = grp + "|" + i;
        const par = it[3] === "100g" ? "/ 100 g" : (it[3] === "cl" ? "/ 100 ml" : "/ " + TR(it[3]));
        return `<button class="al-row ${foodEl.value===v? "on":""}" data-food="${esc(v)}">
          <span class="nm">${esc(TR(it[0]))}</span>
          <span class="vl">${it[1]} g · ${it[2]} kcal <em>${esc(par)}</em></span></button>`;
      }).join("");
    });
    if(!trouves) html = `<div class="al-vide">${TR("Aucun aliment ne correspond. Passe par « je saisis les valeurs ».")}</div>`;
    html += `<div class="al-h">${TR("Autre")}</div>
      <button class="al-row ${foodEl.value==="manuel"? "on":""}" data-food="manuel">
        <span class="nm">${TR("Je saisis les valeurs moi-même")}</span></button>`;
    listeEl.innerHTML = html;
    listeEl.querySelectorAll("[data-food]").forEach(b=>b.onclick=()=>{
      foodEl.value = b.dataset.food;
      dessinerListe();
      calc();
      /* choisi : on enchaîne directement sur la quantité */
      if(b.dataset.food !== "manuel") setTimeout(()=>gEl.focus(), 30);
    });
  };
  qEl.oninput = dessinerListe;
  qEl.onkeydown = e=>{ if(e.key === "Enter") e.preventDefault(); };
  dessinerListe();
  const resto = document.getElementById("ot-restore");
  if(resto) resto.onclick = ()=>{ db.hbMasque = {}; save(); closeSheet(); render(); };
  document.getElementById("ot-ok").onclick = ()=>{
    let label, prot = 0, kcal = 0;
    if(foodEl.value==="manuel"){
      const pr = parseFloat(document.getElementById("ot-prot").value);
      if(isNaN(pr)||pr<0) return;
      const kc = parseFloat(document.getElementById("ot-kcal").value);
      const nom = document.getElementById("ot-name").value.trim()||"Autre";
      const gr = parseFloat(document.getElementById("ot-gram").value);
      const tete = (gr > 0) ? `${nom} ${Math.round(gr)} g` : nom;   /* le poids rend la portion réglable */
      prot = pr; kcal = isNaN(kc)? 0 : Math.round(kc);
      label = isNaN(kc) ? `${tete} (~${pr} ${TR("g prot.")})` : `${tete} (~${pr} ${TR("g prot.")} · ${kcal} kcal)`;
    } else {
      const r = calc();
      if(!r) return;
      label = r.label; prot = r.prot; kcal = r.kcal;
    }
    if(document.getElementById("ot-save").checked){
      const ty = habitType(meal);
      const liste = db.hbPerso[ty] || (db.hbPerso[ty] = []);
      if(!liste.some(x=>x[0]===label)) liste.push([label, prot, kcal]);
    }
    const k = dayKey();
    if(!db.habitSel[k]) db.habitSel[k] = {};
    db.habitSel[k][meal] = (db.habitSel[k][meal]||[]).concat(label);
    if(db.dayFix[k]) delete db.dayFix[k];
    save(); closeSheet(); render();
  };
}

/* appui long sur une pastille : changer la quantité, ou la retirer des propositions */
function openModifAliment(meal, label){
  const k = dayKey();
  const prot = protOf(label), kcal = kcalOf(label);
  const pa = partsAliment(TR(label), prot);
  const grp = trouverGroupe(label);
  /* la portion contient-elle un poids (« 150 g cuit », « 300 ml ») ? alors on peut la régler au gramme */
  const mg = (pa.q || "").match(/([\d.,]+)\s*(g|ml)\b/i);
  const gBase = mg ? parseFloat(mg[1].replace(",", ".")) : 0;
  const unite = mg ? mg[2].toLowerCase() : "";
  const auPoids = gBase > 0;

  openSheet(`<h3 style="text-align:center; text-transform:uppercase;">${esc(TR(pa.nom))}</h3>
    <div class="row" style="justify-content:center; gap:34px; margin-bottom:14px;">
      <div style="text-align:center;"><div id="ma-prot" style="font-size:29px; font-weight:800; line-height:1.05;">${prot}<span style="font-size:16px;"> g</span></div>
        <div style="font-size:12.5px; color:var(--ink-soft);">${TR("Protéines")}</div></div>
      <div style="text-align:center;"><div id="ma-kcal" style="font-size:29px; font-weight:800; line-height:1.05;">${kcal||"—"}</div>
        <div style="font-size:12.5px; color:var(--ink-soft);">${TR("Kilocalories")}</div></div>
    </div>
    <div class="stack">
      ${auPoids? `<div class="chips" style="gap:6px; justify-content:center;">
        <button class="chip chip-sm on" data-mamode="poids">${TR("Au poids")}</button>
        <button class="chip chip-sm" data-mamode="portion">${TR("En portions")}</button>
      </div>`:""}
      <div>
        <span class="label" style="display:block; margin-bottom:5px;" id="ma-lab">${auPoids? TR("Quantité ({})").replace("{}", TR(unite)) : TR("Nombre de portions")}</span>
        <input type="number" inputmode="decimal" step="${auPoids?10:0.5}" min="0" id="ma-n" value="${auPoids? gBase : 1}">
      </div>
      <div id="ma-live" style="font-size:13.5px; font-weight:700; color:var(--accent);"></div>
      <button class="btn btn-accent" id="ma-ok">${(db.habitSel[k] && (db.habitSel[k][meal]||[]).includes(label))? TR("Mettre à jour") : TR("Ajouter à ce repas")}</button>
      <button class="btn" id="ma-del" style="background:var(--hero); color:#fff; border-color:var(--hero);">${TR(grp? "Retirer des propositions" : "Supprimer")}</button>
      <button class="btn btn-ghost" id="ma-cancel">${TR("Annuler")}</button>
    </div>`);

  let mode = auPoids ? "poids" : "portion";
  const nEl = document.getElementById("ma-n"), live = document.getElementById("ma-live");
  /* facteur appliqué à la portion de référence */
  const facteur = ()=>{
    const v = parseFloat(nEl.value) || 0;
    if(v <= 0) return 0;
    return mode === "poids" ? v/gBase : v;
  };
  const maj = ()=>{
    const f = facteur();
    document.getElementById("ma-prot").innerHTML = `${Math.round(prot*f)}<span style="font-size:16px;"> g</span>`;
    document.getElementById("ma-kcal").textContent = kcal? Math.round(kcal*f) : "—";
    if(!f){ live.textContent = ""; return; }
    live.textContent = mode === "poids"
      ? TR("{q} {u} — {p} g de protéines").replace("{q}", Math.round(gBase*f)).replace("{u}", TR(unite)).replace("{p}", Math.round(prot*f)) + (kcal? ` · ${Math.round(kcal*f)} kcal`:"")
      : TR(f > 1 ? "{n} portions — {p} g de protéines" : "{n} portion — {p} g de protéines")
          .replace("{n}", (f).toLocaleString(loc())).replace("{p}", Math.round(prot*f)) + (kcal? ` · ${Math.round(kcal*f)} kcal`:"");
  };
  nEl.oninput = maj; maj();
  document.querySelectorAll("[data-mamode]").forEach(b=>b.onclick=()=>{
    mode = b.dataset.mamode;
    document.querySelectorAll("[data-mamode]").forEach(x=>x.classList.toggle("on", x.dataset.mamode===mode));
    document.getElementById("ma-lab").textContent = mode==="poids" ? `Quantité (${unite})` : TR("Nombre de portions");
    nEl.step = mode==="poids" ? 10 : 0.5;
    nEl.value = mode==="poids" ? gBase : 1;
    maj();
  });
  document.getElementById("ma-cancel").onclick = closeSheet;
  document.getElementById("ma-ok").onclick = ()=>{
    const f = facteur();
    if(!f) return;
    if(!db.habitSel[k]) db.habitSel[k] = {};
    let arr = (db.habitSel[k][meal]||[]).filter(x=>x!==label);
    let neuf;
    if(Math.abs(f-1) < 0.001) neuf = label;
    else if(mode === "poids")
      neuf = `${pa.nom} ${Math.round(gBase*f)} ${unite} (~${Math.round(prot*f)} ${TR("g prot.")}${kcal? ` · ${Math.round(kcal*f)} kcal`:""})`;
    else
      neuf = `${pa.nom} ×${f.toLocaleString(loc())} (~${Math.round(prot*f)} ${TR("g prot.")}${kcal? ` · ${Math.round(kcal*f)} kcal`:""})`;
    db.habitSel[k][meal] = arr.concat(neuf);
    if(db.dayFix[k]) delete db.dayFix[k];
    save(); closeSheet(); render();
  };
  document.getElementById("ma-del").onclick = ()=>{
    if(grp){ demanderRetrait(label, grp); return; }
    if(db.habitSel[k]) db.habitSel[k][meal] = (db.habitSel[k][meal]||[]).filter(x=>x!==label);
    save(); closeSheet(); render();
  };
}
/* à quel groupe de propositions appartient cet aliment (null s'il est libre) */
function trouverGroupe(label){
  let cle = null;
  Object.keys(HB_OPTS).forEach(k=>{ if(HB_OPTS[k].some(x=>x[0]===label)) cle = cle || k; });
  if(cle) return cle;
  Object.keys(db.hbPerso||{}).forEach(ty=>{ if((db.hbPerso[ty]||[]).some(x=>x[0]===label)) cle = cle || "perso:"+ty; });
  return cle;
}

/* ================= CARDIO ================= */
function cardioKcal(km, min, pente, kg, courir){
  if(!km || !min || !kg) return 0;
  const vkmh = km/(min/60);
  const v = vkmh*1000/60;               /* m/min */
  const g = Math.max(0,(pente||0))/100;
  const run = (courir === undefined) ? vkmh >= 7 : !!courir;
  const vo2 = run ? 0.2*v + 0.9*v*g + 3.5 : 0.1*v + 1.8*v*g + 3.5;  /* ACSM, ml/kg/min */
  return vo2 * kg / 1000 * 5 * min;
}
/* Machines et activités. MET = coût énergétique (léger / modéré / intense), valeurs du Compendium. */
const MACHINES = [
  ["course",     "Marche / course", "🏃", null],
  ["velo",       TR("Vélo"),            "🚴", [4.0, 6.8, 10.0]],
  ["rameur",     "Rameur",          "🚣", [4.8, 7.0, 10.0]],
  ["elliptique", "Elliptique",      "⚡", [4.6, 5.5, 8.0]],
  ["stepper",    "Stepper",         "🪜", [5.0, 7.0, 9.0]],
  ["corde",      TR("Corde à sauter"),  "🪢", [8.8, 11.8, 12.3]],
  ["natation",   "Natation",        "🏊", [5.3, 7.0, 9.8]],
  ["autre",      "Autre",           "💪", [4.0, 6.0, 8.0]]
];
const INTENSITES = [["leger",TR("Léger")],["modere",TR("Modéré")],["intense","Intense"]];
function machineOf(c){ return MACHINES.find(m=>m[0]===(c && c.machine)) || MACHINES[0]; }
function machineNom(c){ const m = machineOf(c); return m[2]+" "+m[1]; }
/* kcal d'une machine : MET × 3,5 × poids / 200 × minutes */
function metKcal(c, kg){
  const m = machineOf(c);
  if(!m[3] || !c.min) return 0;
  const i = Math.max(0, INTENSITES.findIndex(x=>x[0]===(c.intensite||"modere")));
  return m[3][i] * 3.5 * kg / 200 * c.min;
}
/* marche, course ou mixte : le choix de l'utilisateur prime, sinon on devine d'après l'allure */
function cardioType(c){
  if(c && c.type) return c.type;
  return (c && c.km/(c.min/60) >= 7) ? "course" : "marche";
}
const CARDIO_VERBE = {marche:TR("marché"), course:"couru", mixte:TR("marché et couru")};
const CARDIO_NOM   = {marche:"Marche", course:"Course", mixte:"Marche + course"};
/* kcal d'une sortie. Ordre de fiabilité : la montre, puis la fréquence cardiaque,
   puis le modèle ACSM — en séparant la part courue de la part marchée si la sortie est mixte. */
function sortieKcal(c, kg){
  if(c.kcalM > 0) return c.kcalM;
  if(c.hr > 0 && c.min > 0){
    /* La FC dit l'effort réel, quelle que soit l'alternance marche / course.
       FC max théorique (Tanaka) → % de VO2max → consommation d'oxygène → kcal. */
    const p = db.profile || {};
    const age = p.age || 30;
    const fcMax = 208 - 0.7*age;
    const pctVO2 = (c.hr/fcMax - 0.37) / 0.64;
    if(pctVO2 > 0.15){
      let vo2max = (p.sex === "f" ? 38 : 45) - Math.max(0, age-25)*0.25 + ((p.days||3) >= 4 ? 3 : 0);
      vo2max = Math.min(60, Math.max(25, vo2max));
      const vo2 = Math.min(1, pctVO2) * vo2max;          /* ml/kg/min */
      return vo2 * kg / 1000 * 5 * c.min;
    }
  }
  if(c.machine && c.machine !== "course") return metKcal(c, kg);
  const t = cardioType(c);
  if(t === "mixte" && c.runMin > 0 && c.runMin < c.min){
    /* on ne connaît que le temps couru : la distance se répartit au prorata des allures
       (on court environ 1,8 fois plus vite qu'on marche) */
    const tr = c.runMin, tw = c.min - tr;
    const kmRun = c.km * (1.8*tr) / (1.8*tr + tw);
    return cardioKcal(kmRun, tr, c.pente, kg, true) + cardioKcal(c.km-kmRun, tw, c.pente, kg, false);
  }
  return cardioKcal(c.km, c.min, c.pente, kg, t === "course");
}
/* d'où vient le chiffre affiché, pour être franc sur la précision */
function sourceKcal(c){
  if(c.kcalM > 0) return TR("d'après ta montre");
  if(c.hr > 0) return TR("d'après ta FC moyenne");
  if(c.machine && c.machine !== "course"){
    const lab = (INTENSITES.find(x=>x[0]===(c.intensite||"modere"))||INTENSITES[1])[1].toLowerCase();
    return `effort ${lab}`;
  }
  return cardioType(c) === "mixte" ? TR("en séparant marche et course") : "";
}
function weekStartDate(){
  const d = new Date(); d.setHours(0,0,0,0);
  d.setDate(d.getDate() - ((d.getDay()+6)%7));
  return d;
}
function cardioWeekStats(){
  const w0 = weekStartDate();
  const kg = currentWeight() || 75;
  const wk = db.cardio.filter(c=>new Date(c.date)>=w0);
  const km = wk.reduce((a,c)=>a+c.km,0);
  const kcal = wk.reduce((a,c)=>a+sortieKcal(c,kg),0);
  const types = wk.map(c=>cardioType(c));
  const ran = types.some(t=>t==="course"||t==="mixte");
  const walked = types.some(t=>t==="marche"||t==="mixte");
  const verb = ran && walked ? TR("marché / couru") : (ran ? "couru" : TR("marché"));
  return {n:wk.length, km:Math.round(km*10)/10, kcal:Math.round(kcal), verb};
}
function motivPhrase(km){
  if(km<=0) return TR("Aucune sortie cette semaine — même 20 minutes de marche comptent. On enfile les baskets ? 👟");
  if(km<5)  return TR("C'est parti, chaque kilomètre compte ! 👏");
  if(km<15) return TR("Belle régularité, continue sur cette lancée 🔥");
  if(km<30) return TR("Grosse semaine — tes jambes te disent merci 💪");
  return TR("Machine ! Pense aussi à bien récupérer 😴");
}
function kcalEquiv(kcal){
  if(kcal<150) return "";
  const n = Math.round(kcal/270);
  return n>=1 ? ` — l'équivalent de ${n} pain${n>1?"s":""} au chocolat 🥐` : "";
}

function partsAliment(label, prot){
  const net = (label||"").replace(/\s*\(~[^)]*\)\s*$/,"").trim();
  let nom = net, q = "";
  let m = net.match(/^(.*?)\s*\(([^()]+)\)\s*(?:×\s*([\d.,]+))?$/);
  if(m){ nom = m[1]; q = m[2]; if(m[3]) q += " ×"+m[3]; }
  else if((m = net.match(/^(.*?)\s*×\s*([\d.,]+)$/))){ nom = m[1]; q = "×"+m[2]; }
  else if((m = net.match(/^(.*?)\s+([\d.,]+\s*(?:g|kg|ml|cl|l))$/i))){ nom = m[1]; q = m[2]; }
  /* « 150 g cuit » -> « 150 g » : la mention crue/cuite reste dans la fiche détaillée */
  const court = q.replace(/\s*(cuit(?:e|s|es)?|cru(?:e|s|es)?|égoutté(?:e|s|es)?|cooked|raw|drained)(?=\s|$)/gi,"")
                 .split(",")[0].replace(/\s+/g," ").trim();
  return {nom:nom.trim(), q:q.trim(), qCourt:court, prot:Math.round(prot)};
}

  const ws = db.weights.slice().sort((a,b)=>new Date(a.date)-new Date(b.date));
  if(ws.length<2) return {txt:TR("Note ton poids une fois par semaine — c'est la balance qui dira si tu manges assez."), tone:"mute"};
  const last = ws[ws.length-1];
  let refIdx = -1, refGap = Infinity;
  for(let i=ws.length-2;i>=0;i--){
    const days = (new Date(last.date)-new Date(ws[i].date))/864e5;
    if(days>=5 && Math.abs(days-7)<refGap){ refGap=Math.abs(days-7); refIdx=i; }
  }
  if(refIdx<0) return {txt:TR("Encore une pesée espacée d'une semaine et je pourrai juger ta progression."), tone:"mute"};
  const ref = ws[refIdx];
  const days = (new Date(last.date)-new Date(ref.date))/864e5;
  const rate = (last.kg-ref.kg)/days*7;
  const bulk = db.settings.goal >= last.kg;
  const r = Math.round(rate*100)/100;
  /* le rythme est en kg/semaine : on le convertit comme un poids */
  const rAff = Math.round((estImperial()? r*PAR_LB : r)*100)/100;
  const rTxt = (r>0?"+":"")+rAff.toLocaleString(loc())+" "+uPoids()+TR("/sem");
  if(bulk){
    if(rate>=0.35) return {txt:rTxt+" "+TR("— ça monte vite, une partie sera du gras. Lève un peu le pied sur les extras."), tone:"warn"};
    if(rate>=0.05) return {txt:rTxt+" "+TR("— c'est exactement le bon rythme, continue comme ça 💪"), tone:"good"};
    if(rate>-0.05) return {txt:TR("Poids stable — ajoute une collation ou un shake chaque jour cette semaine."), tone:"warn"};
    return {txt:rTxt+" "+TR("— tu perds du poids, il faut manger nettement plus. Coche toutes les cases !"), tone:"bad"};
  }
  if(rate<=-0.05 && rate>-0.8) return {txt:rTxt+" "+TR("— bon rythme de perte, continue."), tone:"good"};
  if(rate<=-0.8) return {txt:rTxt+" "+TR("— trop rapide, tu vas perdre du muscle. Mange un peu plus."), tone:"warn"};

}
/* ===== Bilan hebdomadaire : analyse + conseils priorisés ===== */
/* Le lien entre protéines et tonnage, en une phrase — et seulement si les données la
   portent : huit semaines regardées, six exploitables, deux au moins dans chaque cas.
   En dessous de 5 % d'écart, l'app se tait plutôt que d'inventer une conclusion. */
function lienProtTonnage(){
  const cible = proteinTarget();
  if(!cible) return null;
  const lundiDe = d => { const x = new Date(d); x.setHours(0,0,0,0);
    x.setDate(x.getDate() - ((x.getDay()+6)%7)); return x.getTime(); };
  const semaines = {};
  const base = lundiDe(new Date());
  for(let k = 1; k <= 8; k++) semaines[base - k*7*864e5] = {vol:0, prot:0, jours:0};
  db.history.forEach(sess=>{
    const t = lundiDe(sess.date);
    if(semaines[t]) semaines[t].vol += sessionVolume(sess);
  });
  Object.keys(db.habitSel).forEach(jour=>{
    const d = new Date(jour);
    if(isNaN(d.getTime())) return;
    const t = lundiDe(d);
    if(!semaines[t]) return;
    const p = dayProt(jour);
    if(p > 0){ semaines[t].prot += p; semaines[t].jours++; }
  });
  /* une semaine ne compte que si elle a été mangée ET entraînée, et presque tout notée */
  const utiles = Object.values(semaines).filter(x => x.jours >= 6 && x.vol > 0);
  if(utiles.length < 6) return null;
  const tenues = utiles.filter(x => x.prot/7 >= cible*0.9);
  const ratees = utiles.filter(x => x.prot/7 < cible*0.9);
  if(tenues.length < 2 || ratees.length < 2) return null;
  const moyenne = l => l.reduce((a,x)=>a+x.vol, 0) / l.length;
  const mt = moyenne(tenues), mr = moyenne(ratees);
  if(!(mr > 0)) return null;
  const ecart = Math.round((mt - mr)/mr*100);
  if(Math.abs(ecart) < 5) return null;
  return ecart > 0
    ? `Sur ${utiles.length} semaines, celles où tu as tenu tes protéines (${tenues.length}) affichent un tonnage supérieur de ${ecart} % aux autres.`
    : `Sur ${utiles.length} semaines, ton tonnage n'a pas suivi tes protéines : les semaines au quota sont ${Math.abs(ecart)} % en dessous. Regarde plutôt ton sommeil et ta récupération.`;
}
function computeBilan(){

  const cur = db.history.filter(s=>new Date(s.date).getTime()>=d7);
  const prev = db.history.filter(s=>{const t=new Date(s.date).getTime(); return t>=d14 && t<d7;});
  const volCur = cur.reduce((a,s)=>a+sessionVolume(s),0);

  const ups=[], downs=[];
  const curBest={};
  cur.forEach(s=>s.entries.forEach(en=>{
    const sets = workSets(en);
    if(!sets.length) return;
    const b = Math.max(...sets.map(st=>e1rm(st.w||0,st.r||0)));
    if(b>(curBest[en.exId]||0)) curBest[en.exId]=b;
  }));
  Object.keys(curBest).forEach(exId=>{
    let pb=0;
    db.history.forEach(s=>{
      const t=new Date(s.date).getTime();
      if(t<d28||t>=d7) return;
      const en=s.entries.find(e=>e.exId===exId);
      if(en && workSets(en).length) pb=Math.max(pb, ...workSets(en).map(st=>e1rm(st.w||0,st.r||0)));
    });
    if(pb>0){
      const pct=(curBest[exId]-pb)/pb*100;
      if(pct>=2) ups.push(getEx(exId).name);
      else if(pct<=-3) downs.push(getEx(exId).name);
    }
  });
  const wv = weightVerdict();
  const kg = currentWeight()||74;
  const kmCur = db.cardio.filter(c=>new Date(c.date).getTime()>=d7).reduce((a,c)=>a+c.km,0);
  /* habitudes & protéines sur 7 j */
  /* un repas compte s'il contient au moins un aliment : l'ancien système de cases a disparu */
  let hbRemplis=0, protDays=0, protSum=0;
  for(let i=0;i<7;i++){
    const k=dayKey(now-i*864e5);
    const sel = db.habitSel[k] || {};
    hbRemplis += MEALS.filter(([id])=>(sel[id]||[]).length).length;
    if(Object.values(sel).some(a=>a && a.length)){ protDays++; protSum += dayProt(k); }
  }
  const hbPct = Math.round(hbRemplis/(7*MEALS.length)*100);
  const protAvg = protDays? Math.round(protSum/protDays) : null;
  const protTarget = Math.round(kg*1.9);
  const bulk = db.settings.goal >= kg;

  const prios=[], wins=[];
  if(wv.tone==="bad") prios.push([TR("Mange plus, c'est LA priorité"), wv.txt + " " + TR("Ajoute un shake (whey + lait + avoine + banane ≈ 600 kcal) chaque jour, sans exception.")]);
  else if(wv.tone==="warn") prios.push([TR(wv.txt.includes("vite")?"Lève un peu le pied sur les extras":(bulk?"Augmente un peu les apports":"Ajuste les apports")), wv.txt]);
  else if(wv.tone==="good") wins.push(TR("Poids :") + " " + wv.txt);
  if(cur.length<3) prios.push([TR("Remets de la régularité"), TR("{} séances de muscu sur 7 jours — vise 3 à 4. C'est le volume d'entraînement qui déclenche la prise de muscle.").replace("{}", cur.length)]);
  else wins.push(TR("{} séances cette semaine — la régularité est là.").replace("{}", cur.length));
  if(downs.length>=2) prios.push([TR("Charges en baisse : récupère"), TR("Tu as baissé sur {}. Souvent un signe de fatigue : vérifie ton sommeil, respecte les repos longs, et si ça persiste une semaine de charges légères relance la machine.").replace("{}", downs.slice(0,3).join(", "))]);
  else if(downs.length===1) prios.push([TR("Un exercice en baisse"), TR("{} a reculé — regarde si c'est la fatigue ou la technique.").replace("{}", downs[0])]);
  if(ups.length) wins.push(TR("Tu as progressé sur {} 💪").replace("{}", ups.slice(0,3).join(", ") + (ups.length>3?"…":"")));
  if(hbPct<60) prios.push([TR("Coche tes repas"), TR("{} % de tes repas renseignés cette semaine. Même sans compter les calories, la checklist te tient — remplis-la chaque jour.").replace("{}", hbPct)]);
  else if(hbPct>=80) wins.push(TR("Alimentation suivie à {} % — solide.").replace("{}", hbPct));
  if(protAvg!==null && protAvg < protTarget*0.7) prios.push([TR("Monte les protéines"), TR("≈ {moy} g/jour en moyenne, l'objectif est {cible} g. Le plus simple : whey + lait à la collation, et une vraie portion de viande/poisson à chaque repas.").replace("{moy}", protAvg).replace("{cible}", protTarget)]);
  else if(protAvg!==null && protAvg>=protTarget*0.9) wins.push(TR("Protéines ≈ {} g/j en moyenne — dans la cible.").replace("{}", protAvg));
  if(bulk && kmCur>25) prios.push([TR("Cardio généreux pour une prise de masse"), TR("{} cette semaine : c'est très bien pour le cœur, mais ça creuse ton déficit. Compense par une collation de plus les jours de sortie.").replace("{}", dist(kmCur))]);
  else if(kmCur>0) wins.push(TR("{} de cardio — le cœur suit.").replace("{}", dist(kmCur)));
  if(volCur && volPrev) {
    const dv = Math.round((volCur-volPrev)/volPrev*100);
    if(dv<=-20) prios.push([TR("Volume en baisse"), TR("{pct} % de tonnage en moins que la semaine passée ({avant} vs {apres}).").replace("{pct}", Math.abs(dv)).replace("{avant}", pds(volCur)).replace("{apres}", pds(volPrev))]);
    else if(dv>=10) wins.push(TR("Volume en hausse de {pct} % ({vol} soulevés).").replace("{pct}", dv).replace("{vol}", pds(volCur)));
  }
  if(!prios.length) prios.push([TR("Continue exactement comme ça"), TR("Aucun point faible détecté cette semaine. Le seul conseil : ne change rien, la constance fait le reste.")]);
  return {cur:cur.length, volCur, volPrev, kmCur, wv, prios:prios.slice(0,3), wins:wins.slice(0,4)};
}

function suggestedTemplate(){
  if(!db.templates.length) return null;
  let best=null, bestDate=Infinity;
  db.templates.forEach(t=>{
    const last = db.history.slice().reverse().find(h=>h.templateId===t.id || h.name===t.name);
    const d = last? new Date(last.date).getTime() : -1;
    if(d < bestDate){ bestDate=d; best=t; }
  });
  return best;
}

const PHOTOS = ["push","pull","jambes","abdos","cardio"];
/* la photo suit d'abord les exercices choisis, le nom ne sert que de repli */
function photoSeance(t){
  if(t && t.photo && PHOTOS.includes(t.photo)) return t.photo;
  const score = {push:0, pull:0, jambes:0, abdos:0};
  ((t && t.items) || []).forEach(it=>{
    const ex = getEx(it.exId);
    const m = (ex.muscle || "").toLowerCase();
    if(/pector|épaul|epaul|triceps/.test(m)) score.push++;
    /* « abdos » contient « dos » : ce test doit passer AVANT celui du dos, sinon
       toute séance d abdominaux est prise pour une séance de tirage */
    else if(/abdo|gainage|oblique/.test(m)) score.abdos++;
    else if(/dos|dorsal|biceps/.test(m)) score.pull++;
    else if(/jambe|fessier|mollet/.test(m)) score.jambes++;
  });
  const total = score.push + score.pull + score.jambes + score.abdos;
  if(total){
    const best = Object.keys(score).sort((a,b)=>score[b]-score[a])[0];
    /* une majorité nette (au moins 40 % des exercices) suffit à choisir la photo */
    if(score[best] / total >= 0.4) return best;
  }
  const n = ((t && t.name) || "").toLowerCase();
  if(/abdo|gainage|core|ceinture/.test(n)) return "abdos";   /* avant « dos », même piège */
  if(/push|poussée|pousse|pec|torse/.test(n)) return "push";
  if(/pull|tirage|dos/.test(n)) return "pull";
  if(/jambe|leg|cuisse|fessier|squat/.test(n)) return "jambes";
  if(/cardio|course|run|hiit|marche/.test(n)) return "cardio";
  return "push";
}

/* ================= « PROPOSE-MOI » : génération de séances =================
   Un moule décrit les rôles d'une séance (pectoraux lourd, dos horizontal…).
   Chaque rôle a plusieurs exercices interchangeables : on en tire un au sort en
   évitant ceux déjà faits cette semaine, pour que deux propositions ne se ressemblent pas. */
const RESERVOIRS = {
  pecLourd:  ["Développé couché","Développé incliné barre","Développé couché haltères","Développé incliné haltères","Développé machine","Développé couché à la Smith","Pompes","Pompes inclinées","Développé couché élastique"],
  pecComp:   ["Écartés poulie","Butterfly (pec deck)","Écartés haltères","Écartés poulie haute","Dips","Pompes","Pompes déclinées","Écartés élastique"],
  epaule:    ["Développé militaire","Développé militaire haltères","Arnold press","Développé machine épaules","Pompes piquées","Pompes piquées surélevées","Développé militaire élastique"],
  epauleIso: ["Élévations latérales","Élévations latérales poulie","Élévations frontales","Élévations latérales élastique"],

  quadLourd: ["Squat","Front squat","Goblet squat","Hack squat","Presse à cuisses","Squat au poids du corps","Squat élastique","Chaise contre le mur"],
  posterieur:["Soulevé de terre roumain","Soulevé de terre","Good morning","Hip thrust","Soulevé de terre sumo","Pont fessier","Soulevé de terre élastique"],
  uniJambe:  ["Fentes","Fentes bulgares","Montées sur banc","Presse à cuisses","Leg extension","Fentes avant","Fentes latérales","Squat bulgare au poids du corps","Montées sur step"],
  ischio:    ["Leg curl","Kickback fessier poulie","Abducteurs machine","Adducteurs machine","Pont fessier une jambe","Abduction hanche élastique"],

};
/* rôles à faible charge : plus de répétitions, moins de repos */
const ROLES_LEGERS = ["epauleIso","arriere","mollets","abdos","dosComp","triceps","biceps","ischio"];
const MOULES = {
  push:   {nom:"Push",           sous:"Pectoraux, épaules, triceps", roles:["pecLourd","pecComp","epaule","epauleIso","triceps"]},
  pull:   {nom:"Pull",           sous:"Dos et biceps",               roles:["dosVert","dosHoriz","dosComp","arriere","biceps"]},
  jambes: {nom:"Jambes",         sous:"Cuisses, fessiers, mollets",  roles:["quadLourd","posterieur","uniJambe","ischio","mollets","abdos"]},
  haut:   {nom:"Haut du corps",  sous:"Tout le buste en une fois",   roles:["pecLourd","dosHoriz","epaule","dosVert","biceps","triceps"]},
  bas:    {nom:"Bas du corps",   sous:"Jambes, fessiers et gainage", roles:["quadLourd","posterieur","uniJambe","mollets","abdos"]},
  full:   {nom:"Full body",      sous:"Tout le corps en une séance", roles:["quadLourd","pecLourd","dosHoriz","epauleIso","abdos"]}
};
const MUSCLES_TYPE = {
  push:["Pectoraux","Épaules","Triceps"], pull:["Dos","Biceps"], jambes:["Jambes"],
  haut:["Pectoraux","Dos","Épaules"], bas:["Jambes"], full:["Jambes","Pectoraux","Dos"]
};
/* Séries, répétitions et repos selon l'objectif.
   Deux principes tiennent toute la table :
   1. La CHARGE est ce qui construit et ce qui protège le muscle. On ne l'échange jamais
      contre des répétitions — surtout pas en déficit calorique, où c'est elle qui empêche
      de fondre. Ce qu'on ajuste selon l'objectif, c'est le VOLUME (le nombre de séries).
   2. Un repos trop court coûte des répétitions à la série suivante, donc du travail utile.
      En dessous de 2 minutes sur un mouvement lourd, on perd de l'hypertrophie ET de la
      force par rapport à 3 minutes. Les repos courts n'ont d'intérêt qu'en circuit. */
const DOSES = {
  masse:     {lourd:{s:4, r:"8-12", p:150}, moyen:{s:3, r:"8-12", p:120}, leger:{s:3, r:"12-15", p:90}},
  /* sèche : mêmes charges et mêmes fourchettes qu'en prise de masse, une série de moins.
     Baisser la charge en montant les reps est l'erreur classique du « sécher », et c'est
     précisément ce qui fait perdre du muscle avec le gras. */
  seche:     {lourd:{s:3, r:"8-12", p:150}, moyen:{s:3, r:"8-12", p:120}, leger:{s:3, r:"12-15", p:75}},
  force:     {lourd:{s:5, r:"4-6",  p:210}, moyen:{s:4, r:"6-8",  p:150}, leger:{s:3, r:"8-12",  p:90}},
  recomp:    {lourd:{s:4, r:"8-12", p:150}, moyen:{s:3, r:"8-12", p:120}, leger:{s:3, r:"12-15", p:90}},
  /* entretien : la charge se maintient, c'est le volume qui tombe. Deux séances par
     semaine à intensité conservée suffisent à garder muscle et force des mois durant. */
  entretien: {lourd:{s:3, r:"8-12", p:150}, moyen:{s:3, r:"8-12", p:105}, leger:{s:3, r:"12-15", p:75}}
};
/* les types de séance qui ont du sens pour ce nombre de séances par semaine */
/* combien de rôles de ce moule peuvent être remplis avec le matériel disponible */
function rolesRemplissables(type){
  const moule = MOULES[type];
  if(!moule) return 0;
  return moule.roles.filter(role => (RESERVOIRS[role]||[]).some(nom=>{
    const id = libId(nom);
    return id && exoDispo(getEx(id));
  })).length;
}
function typesProposables(){
  const j = (db.profile && db.profile.days) || 3;
  const base = j <= 2 ? ["full","haut","bas"]
    : j === 3 ? ["full","haut","bas","push","pull","jambes"]
    : j === 4 ? ["haut","bas","push","pull","jambes","full"]
    : ["push","pull","jambes","haut","bas","full"];
  /* une séance d'un ou deux exercices n'a pas d'intérêt : on ne la propose pas */
  const tenables = base.filter(t=>rolesRemplissables(t) >= 3);
  return tenables.length ? tenables : ["full"];
}
/* exercices déjà faits ces derniers jours : on préfère en proposer d'autres */
function exercicesRecents(jours){
  const limite = Date.now() - (jours||7)*864e5;
  const noms = new Set();
  (db.history||[]).forEach(h=>{
    if(new Date(h.date).getTime() < limite) return;
    (h.entries||[]).forEach(en=>{ const ex = getEx(en.exId); if(ex && ex.name) noms.add(ex.name); });
  });
  return noms;
}
/* dernière fois que ce type de séance a été travaillé, en jours (null = jamais) */
function joursDepuisType(type){
  const cibles = MUSCLES_TYPE[type] || [];
  let recent = null;
  (db.history||[]).forEach(h=>{
    const touche = (h.entries||[]).some(en=>cibles.includes((getEx(en.exId)||{}).muscle));
    if(!touche) return;
    const t = new Date(h.date).getTime();
    if(recent === null || t > recent) recent = t;
  });
  return recent === null ? null : Math.floor((Date.now() - recent)/864e5);
}
/* le type le plus en retard parmi ceux qui conviennent au profil */
function typeQuiManque(){
  const types = typesProposables();
  let meilleur = types[0], score = -1;
  types.forEach(t=>{
    const j = joursDepuisType(t);
    const v = (j === null) ? 999 : j;
    if(v > score){ score = v; meilleur = t; }
  });
  return {type:meilleur, jours:joursDepuisType(meilleur)};
}
function melanger(arr){
  const a = arr.slice();
  for(let i=a.length-1; i>0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; }
  return a;
}
/* génère une séance : un exercice par rôle, sans doublon, en évitant le récent et le risqué */
function genererSeance(type, evites){
  const moule = MOULES[type] || MOULES.full;
  const recents = exercicesRecents(6);
  const bannis = new Set(evites || []);
  const dose = DOSES[(db.profile && db.profile.aim) || "masse"] || DOSES.masse;
  const items = [];
  moule.roles.forEach((role, n)=>{
    const pool = melanger(RESERVOIRS[role] || [])
      .filter(nom=>libId(nom) && !items.some(it=>it.nom===nom) && exoDispo(getEx(libId(nom))));
    if(!pool.length) return;
    /* 1er choix : ni banni, ni récent, ni déconseillé par une blessure. Puis on relâche. */
    const sain = nom => !injuryNote(nom);
    const choisi = pool.find(n2=>!bannis.has(n2) && !recents.has(n2) && sain(n2))
                || pool.find(n2=>!bannis.has(n2) && sain(n2))
                || pool.find(n2=>!recents.has(n2))
                || pool[0];
    const niveau = ROLES_LEGERS.includes(role) ? "leger" : (n === 0 ? "lourd" : "moyen");
    const d = dose[niveau];
    /* Au poids du corps, on ne peut pas alléger la barre : demander 12 a 15 tractions
       n est pas un objectif, c est un mur. On rabaisse la fourchette pour ces exercices,
       et plus encore a la barre fixe, ou meme 8 repetitions propres sont deja beaucoup. */
    let reps = d.r;
    const exChoisi = getEx(libId(choisi));
    const bas = parseReps(reps);
    if(exChoisi && estPoidsDuCorps(exChoisi) && bas && bas.lo > 8)
      reps = equipCanon(exChoisi) === "Barre fixe" ? "6-12" : "8-12";
    items.push({nom:choisi, sets:d.s, reps, rest:d.p, role});
  });
  return {type, nom:moule.nom, sous:moule.sous, items};
}
/* nom unique, pour ne pas écraser une séance existante */
function nomLibre(base){
  if(!db.templates.some(t=>t.name === base)) return base;
  for(let n=2; n<40; n++){ const c = `${base} ${n}`; if(!db.templates.some(t=>t.name === c)) return c; }
  return `${base} ${Date.now().toString(36)}`;
}
function enregistrerProposition(prop){
  const tpl = {
    id: uid(),
    name: nomLibre(`${prop.nom} · ${aimOf((db.profile&&db.profile.aim)||"masse").label}`),
    items: prop.items.map(it=>({exId:libId(it.nom), sets:it.sets, reps:it.reps, rest:it.rest})).filter(it=>it.exId)
  };
  db.templates.push(tpl);
  save();
  return tpl;
}

function startWorkout(tplId){
  const tpl = tplId ? db.templates.find(t=>t.id===tplId) : null;
  const entries = tpl ? tpl.items.map(it=>{
    const last = lastPerf(it.exId);
    const sug = suggestFor(it.exId, it);
    const rng = parseReps(it.reps);
    const sets = [];
    for(let i=0;i<it.sets;i++){
      const ls = last && last.sets[Math.min(i,last.sets.length-1)];
      const w = sug && (sug.mode==="up"||sug.mode==="down") ? sug.w : (ls? ls.w:"");
      /* un conseil qui fixe une cible en répétitions l'emporte sur la dernière performance */
      let r;
      if(sug && sug.reps) r = sug.reps;
      else if(sug && (sug.mode==="up" || sug.mode==="down")) r = repsDepart(rng);
      else if(sug && sug.mode==="beat" && ls && ls.r)
        /* « gratte une rep de plus » : on la pré-remplit vraiment, sinon le conseil
           reste lettre morte et la charge ne monte jamais. Plafonné au haut de la
           fourchette : au-delà, c'est la charge qui doit augmenter, pas les reps. */
        r = rng ? Math.min(ls.r + 1, rng.hi) : ls.r + 1;
      else r = ls ? ls.r : repsDepart(rng);
      sets.push({w, r, done:false});
    }
    return {exId:it.exId, target:it, sets};
  }) : [];
  /* série d'échauffement sur le premier exercice */
  if(entries.length){
    entries[0].sets.unshift(serieEchauffement(entries[0].exId, entries[0].target && entries[0].target.reps));
  }
  db.active = {name: tpl? tpl.name : TR("Séance libre"), templateId:tplId, start:Date.now(), entries};
  save(); render();
}

/* durée réellement écoulée, pauses déduites */
function dureeSeance2(a){
  const fin = a.pauseAt || Date.now();
  return Math.max(0, fin - a.start - (a.pauseTotal||0));
}
function basculerChrono(a){
  if(a.pauseAt){
    a.pauseTotal = (a.pauseTotal||0) + (Date.now() - a.pauseAt);
    a.pauseAt = null;
    toast(TR("Chrono relancé"));
  } else {
    a.pauseAt = Date.now();
    toast(TR("Chrono en pause"));
  }
  save();
}
/* toute validation de série relance le chrono : on n'oublie pas de le remettre en marche */
function reprendreChrono(a){
  if(a && a.pauseAt){
    a.pauseTotal = (a.pauseTotal||0) + (Date.now() - a.pauseAt);
    a.pauseAt = null;
    save();
  }
}
/* ce qu'il faut savoir avant d'attaquer l'exercice : la dernière fois, l'objectif, la charge du jour */

  const last = lastPerf(en.exId);
  const sug = suggestFor(en.exId, en.target);

        <span class="label" style="display:block; margin-bottom:4px;">${TR("Objectif du jour")}</span>

        <span class="label" style="display:block; margin-bottom:4px;">${TR("À faire maintenant")}</span>
        <div class="hist-ex-line" style="color:var(--accent); font-weight:700; font-size:15px;">${
          prochain && prochain.w ? `${pds(prochain.w)}${prochain.r? ` × ${prochain.r} reps`:""}` : "À toi de choisir la charge"}</div>
        ${sug? `<div class="hist-ex-line" style="margin-top:4px;">${esc(sug.text)}</div>`:""}
      </div>
      <div><span class="label" style="display:block; margin-bottom:6px;">Mon matériel</span>
        ${blocChargeFixe(en.exId, "hx-plafond")}</div>
      ${dejaParCote(en.exId)
        ? `<div style="font-size:11.5px; color:var(--ink-mute); line-height:1.45; padding-left:2px;">
             ${TR("Deux haltères : tu saisis la charge <b>d'un seul haltère</b>, l'app compte déjà les deux côtés.")}</div>`
        : `<label class="row" style="gap:9px; align-items:center; cursor:pointer;">
             <input type="checkbox" id="hx-unilat" ${db.unilat[en.exId]?"checked":""} style="width:19px; height:19px; accent-color:var(--accent); flex:0 0 auto;">
             <span style="font-size:13px; color:var(--ink-soft); line-height:1.4;">${TR("Je le fais un bras (ou une jambe) à la fois")}<br>
               <span style="font-size:11.5px; color:var(--ink-mute);">${TR("Tu saisis la charge d'un seul côté : l'app compte les deux dans ton tonnage et ton profil.")}</span></span>
           </label>`}
      <button class="btn btn-accent" id="hx-ok">${TR("Compris")}</button>
    </div>`);
  document.getElementById("hx-plafond").onchange = e=>{
    reglerChargeFixe(en.exId, e.target.checked);
    renderSurPlace();                       /* le conseil de charge change tout de suite */
  };
  const uni = document.getElementById("hx-unilat");
  if(uni) uni.onchange = e=>{
    if(e.target.checked) db.unilat[en.exId] = true; else delete db.unilat[en.exId];
    save();
  };
  document.getElementById("hx-ok").onclick = ()=>{ closeSheet(); renderSurPlace(); };
}
/* le conseil de prudence, et le remplacement en un geste */
function openBlessureExo(ei){
  const a = db.active; if(!a) return;
  const en = a.entries[ei], ex = getEx(en.exId);
  const note = injuryNote(nomCanon(ex));
  if(!note) return;
  openSheet(`<h3>${esc(ex.name)}</h3>
    <div class="inj-note" style="margin:0 0 14px;">
      <b style="color:var(--bad);">⚠️ ${TR("{} sensible").replace("{}", esc(TR(note.injury)))}</b><br>${esc(TR(note.tip))}</div>
    <div class="stack">
      ${note.alts.length? `<button class="btn btn-accent" id="bl-swap">${TR("Remplacer par un autre exercice")}</button>`:""}
      <button class="btn btn-ghost" id="bl-ok">${TR("Je continue avec celui-ci")}</button>
    </div>`);
  const sw = document.getElementById("bl-swap");
  if(sw) sw.onclick = ()=>openSwap(ei, true);
  document.getElementById("bl-ok").onclick = closeSheet;
}
/* Le bloc noir est une suite d'éléments contigus : la ligne de série, ses dégressifs,
   et éventuellement la question. Seuls le premier et le dernier sont arrondis. */
function poserBlocNoir(elements, question){
  elements.forEach((el,i)=>{
    el.classList.add("bn");
    if(question) el.classList.add("bnq");     /* bloc d'une question : le défilement n'y touche pas */
    el.classList.toggle("bn-debut", i === 0);
    el.classList.toggle("bn-fin", i === elements.length-1);
  });
}
function retirerBlocNoir(avecQuestion){
  document.querySelectorAll(".bn").forEach(el=>{
    if(!avecQuestion && el.classList.contains("bnq")) return;
    el.classList.remove("bn", "bn-debut", "bn-fin", "bnq");
  });
}
/* la ligne d'une série et tous ses dégressifs, dans l'ordre */
function suiteDeLigne(ligne){
  const out = [ligne];
  let n = ligne.nextElementSibling;
  while(n && n.classList.contains("drop")){ out.push(n); n = n.nextElementSibling; }
  return out;
}
/* Une seule série est mise en avant dans toute la séance : celle de l'exercice
   que tu as sous les yeux. Trop de cadres noirs à la fois, ça ne guide plus rien. */
function majSerieActive(){
  const a = db.active;
  if(!a) return;
  const cartes = [...document.querySelectorAll(".ex-card[data-ei]")];
  const milieu = window.innerHeight / 2;
  let choisie = null, meilleur = Infinity;
  cartes.forEach(c=>{
    const en = a.entries[parseInt(c.dataset.ei)];
    if(!en || !en.sets.some(x=>!x.done)) return;                  /* plus rien à y faire */
    const r = c.getBoundingClientRect();
    if(r.bottom < 0 || r.top > window.innerHeight) return;        /* hors de l'écran */
    /* la carte qui contient le milieu de l'écran gagne ; sinon la plus proche */
    const d = (r.top <= milieu && r.bottom >= milieu) ? 0 : Math.min(Math.abs(r.top - milieu), Math.abs(r.bottom - milieu));
    if(d < meilleur){ meilleur = d; choisie = c; }
  });
  /* la série qui porte une question garde sa mise en avant : elle fait corps avec le bloc */
  document.querySelectorAll(".set-row.actif").forEach(l=>{
    if(!l.classList.contains("bnq")) l.classList.remove("actif");
  });
  retirerBlocNoir(false);                 /* on ne défait pas le bloc d'une question en cours */
  if(!choisie) return;
  /* une question attend sur la carte qu'on regarde : rien d'autre ne doit attirer l'œil */
  if(choisie.querySelector(".rir-ask:not(.repondu)")) return;
  const en = a.entries[parseInt(choisie.dataset.ei)];
  const ligne = choisie.querySelector('.set-row[data-si="' + en.sets.findIndex(x=>!x.done) + '"]');
  if(!ligne) return;
  ligne.classList.add("actif");
  poserBlocNoir(suiteDeLigne(ligne), false);
}
/* le cadre suit le défilement : il reste sur l'exercice qu'on regarde */
let majSerieTimer = null;
window.addEventListener("scroll", ()=>{
  if(!db.active || majSerieTimer) return;
  majSerieTimer = requestAnimationFrame(()=>{ majSerieTimer = null; majSerieActive(); });
}, {passive:true});
/* le nom de l'exercice s'affiche un instant, puis la carte se replie */
function exerciceFini(card, nom, apres){
  const v = document.createElement("div");
  v.className = "ex-fini";
  v.innerHTML = `<div class="rond">✓</div><div class="txt">${esc(nom)}, terminé</div>`;
  card.appendChild(v);
  if(navigator.vibrate) try{ navigator.vibrate([12, 60, 18]); }catch(e){}
  setTimeout(()=>{ if(typeof apres === "function") apres(); }, 1250);
}
function renderActive(app){
  const a = db.active;
  /* la photo du bandeau suit les exercices de la séance, comme sur la carte du programme */
  const tpl = a.templateId ? db.templates.find(t=>t.id===a.templateId) : null;
  const photo = photoSeance({photo: tpl && tpl.photo, name: a.name, items: a.entries.map(e=>({exId:e.exId}))});
  /* un nom long tient sur deux lignes plutôt que d'être coupé : on réduit un peu le corps */
  const nbCar = (a.name || "").length;
  const tailleTitre = nbCar <= 18 ? 29 : (nbCar <= 26 ? 25 : (nbCar <= 36 ? 22 : 19));
  app.innerHTML = `
    ${hero(`<div class="hero-kicker">${TR("Séance en cours")}</div>
      <h1 class="hero-seance" style="--t:${tailleTitre}px">${esc(a.name)}</h1>
      <button class="chrono" id="chrono" aria-label="${TR("Mettre le chrono en pause")}"></button>`,
      {photo, icones:false, classe:"hero-en-cours"})}
    <div style="height:10px;"></div>
    <div class="stack" id="ex-list"></div>
    <button class="btn" id="add-ex" style="width:100%; margin-top:12px; background:var(--surface); color:var(--ink);">＋ ${TR("Ajouter un exercice")}</button>
    <div class="row" style="margin-top:20px;">
      <button class="btn" id="cancel-w" style="flex:0 0 auto; padding-inline:18px; background:var(--hero); color:#fff; border-color:var(--hero);">${TR("Annuler")}</button>
      <button class="btn grow" id="finish-w" style="background:var(--good); color:#fff; border-color:var(--good);">${TR("Terminer la séance")}</button>
    </div>`;

  /* le chrono se met en pause d'un appui ; cocher une série le relance */
  const tick=()=>{
    const el=document.getElementById("chrono"); if(!el) return;
    el.textContent = mmss(dureeSeance2(a)/1000);
    el.classList.toggle("pause", !!a.pauseAt);
  };
  tick(); chronoInt = setInterval(tick, 1000);
  const chr = document.getElementById("chrono");
  if(chr) chr.onclick = ()=>{ basculerChrono(a); tick(); };

  const list = document.getElementById("ex-list");
  list.innerHTML = a.entries.length ? "" : `<div class="card empty">${TR("Ajoute un premier exercice pour commencer.")}</div>`;
  /* les explications ne s affichent qu une fois, sur le premier exercice concerne */
  const iEch = a.entries.findIndex(e=>e.sets.some(x=>x.warm));
  a.entries.forEach((en,ei)=>{
    const ex = getEx(en.exId);
    const last = lastPerf(en.exId);
    const lastTxt = last ? `Dernière fois (${fmtDateShort(last.date)}) : ${last.sets.map(s=>`${fmtKg(s.w)}×${s.r}`).join(" · ")}` : TR("Premier passage sur cet exercice");
    const target = en.target && en.target.reps ? ` · Objectif ${en.target.sets} × ${esc(String(en.target.reps))}` : "";
    const sug = suggestFor(en.exId, en.target);

    /* exercice terminé et replié : une simple ligne, qu'on rouvre d'un appui */
    if(en.replie){
      const plie = document.createElement("button");
      plie.className = "ex-done";
      /* le record est dit ici, une fois l'exercice fini : assez près de l'effort pour
         compter, assez rare pour rester un événement */
      const rec = recordExo(en);
      plie.innerHTML = `<span class="vu">✓</span><span class="nm">${esc(ex.name)}${
        (rec && rec.gain > 0)
          ? `<em>🏆 Record — ${pds(rec.w)} × ${rec.r} <b>+${pds(rec.gain)}</b></em>` : ""
      }</span><span class="dep">${CHEV}</span>`;
      plie.onclick = ()=>{ delete en.replie; save(); renderSurPlace(); };
      list.appendChild(plie);
      return;
    }

    const note = injuryNote(nomCanon(ex));
    const card = document.createElement("div");
    card.className="ex-card";
    card.dataset.ei = ei;
    card.innerHTML = `
      <div class="ex-head" style="align-items:center; gap:10px; margin-bottom:6px;">${exIcon(ex,true)}
        <div class="grow"><div class="ex-name">${esc(ex.name)}</div></div>
        <button class="icon-btn info-btn" data-hist-ex="${ei}" title="${TR("Dernière fois et charge du jour")}">${IC_LISTE}</button>
        ${note? `<button class="icon-btn inj-btn" data-injinfo="${ei}" title="${esc(note.injury)} sensible">⚠️</button>`:""}
        <button class="icon-btn info-btn" data-exinfo="${en.exId}" title="${TR("Fiche de l'exercice")}">ⓘ</button></div>
      <div style="margin-bottom:10px;">${musclesHtml(nomCanon(ex))}</div>
      ${ei === iEch ? hintBox("echauffement", TR("La ligne <b>Éch.</b> est une série d'échauffement, pré-remplie à la moitié de ta charge de travail. Elle ne compte ni dans ton tonnage, ni dans tes records, ni dans ton profil musculaire.")) : ""}
      <div class="set-cols"><span></span><span>${estPoidsDuCorps(ex)? TR("lest")+" ("+uPoids()+")"
        : (dejaParCote(en.exId)? uPoids()+" / "+TR("haltère") : (db.unilat[en.exId]? uPoids()+" / "+TR("bras") : uPoids()))}</span><span>reps</span><span>${TR("dég.")}</span><span>✓</span></div>
      <div class="sets"></div>
      ${ei === 0 ? hintBox("degressif", TR("<b>Dégressif ?</b> Le bouton <b>↓</b> d'une série ajoute une ligne à charge réduite (6 × 12 kg puis 4 × 10 kg). Ça reste une seule série, mais tout le tonnage est compté. Appui long sur la ligne pour supprimer la série.")) : ""}
      <div class="row" style="flex-wrap:wrap;">
        <button class="btn btn-sm btn-ghost grow" data-act="addset" style="white-space:nowrap; min-width:96px;">＋ ${TR("série")}</button>
        ${en.sets.filter(x=>!x.warm).length > 1
          ? `<button class="btn btn-sm btn-ghost" data-act="delset" title="${TR("Supprimer la dernière série")}" aria-label="Supprimer la dernière série" style="color:var(--bad); flex:0 0 auto; padding-inline:14px;">✕</button>`
          : ""}
        <button class="btn btn-sm btn-ghost" data-act="swap" style="white-space:nowrap;">⇄ ${TR("Remplacer")}</button>
        <button class="btn btn-sm btn-ghost" data-act="delex" style="color:var(--bad); border-color:var(--border); white-space:nowrap;">${TR("Retirer")}</button>
      </div>
      <button class="ex-plier" data-act="plier" aria-label="${TR("Replier cet exercice")}">${TR("Replier")} ${CHEV}</button>`;
    const setsDiv = card.querySelector(".sets");
    /* posé après la construction des lignes, plus bas */
    en.sets.forEach((st,si)=>{
      const row = document.createElement("div");
      row.className = "set-row"+(st.done?" done":"")+(st.warm?" warm":"");
      row.dataset.si = si;                     /* repère fiable : les dégressifs décalent les index DOM */
      const num = st.warm ? TR("Éch.") : String(en.sets.slice(0,si).filter(s=>!s.warm).length+1);
      row.innerHTML = `<div class="n">${num}</div>
        <input type="number" inputmode="decimal" step="${stepPoids()}" min="0" placeholder="${estPoidsDuCorps(ex)? "0" : uPoids()}" value="${saisiePoids(st.w)}">
        <input type="number" inputmode="numeric" min="0" placeholder="reps" value="${st.r!==""?st.r:""}">
        ${st.warm? "<span></span>" : `<button class="dg" title="${TR("Ajouter un dégressif")}">↓</button>`}
        <button class="ck">${st.done? IC_COCHE : "○"}</button>`;
      const [wIn, rIn] = row.querySelectorAll("input");
      /* ce que tu saisis se reporte sur les séries suivantes non validées, jamais sur les précédentes */
      const ligneDe = j => setsDiv.querySelector('.set-row[data-si="'+j+'"]');
      const propager = (champ, valeur)=>{
        for(let j=si+1; j<en.sets.length; j++){
          const s2 = en.sets[j];
          if(s2.done || s2.warm) continue;
          s2[champ] = valeur;
          const l = ligneDe(j);
          const inp = l && l.querySelectorAll("input")[champ==="w"?0:1];
          if(inp && document.activeElement !== inp) inp.value = (champ==="w" ? saisiePoids(valeur) : (valeur===""? "" : valeur));
        }
      };
      /* la charge se reporte (on la garde d'une série à l'autre) ; les répétitions non :
         faire 5 reps au lieu de 12 est un accident de parcours, pas une nouvelle consigne */
      wIn.oninput=()=>{ st.w = wIn.value===""?"":versKg(wIn.value); if(!st.warm) propager("w", st.w); save(); };
      rIn.oninput=()=>{ st.r = rIn.value===""?"":parseInt(rIn.value); save(); };
      row.querySelector(".ck").onclick=()=>{
        /* une question attend sa réponse : on ne passe pas à la série suivante avant */
        const enAttente = card.querySelector(".rir-ask:not(.repondu)");
        if(enAttente && !st.done){
          enAttente.classList.remove("rappel");
          void enAttente.offsetWidth;
          enAttente.classList.add("rappel");
          enAttente.scrollIntoView({block:"nearest", behavior:"smooth"});
          if(navigator.vibrate) try{ navigator.vibrate(14); }catch(e){}
          return;
        }
        ensureAudio();
        reprendreChrono(a);
        st.w = versKg(wIn.value)||0; st.r = parseInt(rIn.value)||0;
        st.done = !st.done;
        if(!st.done) delete st.rir;
        save();
        row.classList.toggle("done", st.done);
        const ck = row.querySelector(".ck");
        ck.innerHTML = st.done ? IC_COCHE : "○";
        ck.classList.remove("pop");
        if(st.done){ void ck.offsetWidth; ck.classList.add("pop"); }
        if(!st.done) majSerieActive();      /* décochage : la série redevient à faire */
        const oldAsk = card.querySelector(".rir-ask");
        if(oldAsk){ oldAsk.remove(); retirerBlocNoir(true); majSerieActive(); }
        if(st.done && st.warm){
          majSerieActive();
          startRest(60);
          return;
        }
        if(st.done){
          /* plus rien à faire après ? inutile de lancer un repos */
          const resteDuTravail = a.entries.some(e2=>e2.sets.some(s2=>!s2.done && !s2.warm));
          const rs = (en.target && en.target.rest) || db.settings.rest;
          if(resteDuTravail) startRest(rs);
          else { restbar.classList.remove("show"); if(rest.int){ clearInterval(rest.int); rest.int=null; } }
          const ask = document.createElement("div");
          ask.className = "rir-ask";
          ask.innerHTML = `${dejaVu("rir")? "" : `<div class="rir-intro">${TR("Ta réponse ajuste tout de suite la charge de la série suivante, et celle de ta prochaine séance. Réponds honnêtement, même les mauvais jours.")}</div>`}
            <div class="q">${TR("Aurais-tu pu faire plus de reps ?")}</div>
            <div class="row">
              <button data-rir="0">${TR("Non, 0")}</button>
              <button data-rir="1">1-2</button>
              <button data-rir="3">3-5+</button>
            </div>
            <button class="rir-lourd" data-rir="-1">${TR("C'était trop lourd —")} ${
              TR(chargeBloquee(en.exId) || sansChargeDuTout(en.exId, st.w)
                ? "baisse les répétitions" : "baisse la charge")}</button>`;
          /* la question se place sous la série, dégressifs compris */
          let ancre = row, nx = row.nextElementSibling;
          while(nx && nx.classList.contains("drop")){ ancre = nx; nx = nx.nextElementSibling; }
          ancre.after(ask);
          /* la question ferme le bloc noir de sa série : on voit qu'elle en fait partie */
          retirerBlocNoir(true);
          poserBlocNoir(suiteDeLigne(row).concat(ask), true);
          ask.querySelectorAll("[data-rir]").forEach(b=>b.onclick=()=>{
            const rir = parseInt(b.dataset.rir);
            st.rir = rir < 0 ? 0 : rir;        /* « trop lourd » = tu étais à bout : 0 rep en réserve */
            if(!dejaVu("rir")) marquerVu("rir");
            const rng = parseReps(en.target && en.target.reps) || {lo:8, hi:12};
            const next = en.sets.find(s=>!s.done && !s.warm);   /* jamais l'échauffement */
            const inc = (st.w||0)>=20? 2.5 : 1;
            /* applique une valeur à toutes les séries restantes, pas seulement à la suivante */
            const appliquerSuite = (champ, valeur)=>{
              en.sets.forEach((s2,j)=>{
                if(s2.done || s2.warm) return;
                s2[champ] = valeur;
                const l = setsDiv.querySelector('.set-row[data-si="'+j+'"]');
                const inp = l && l.querySelectorAll("input")[champ==="w"?0:1];
                /* la charge est stockée en kg : elle doit repasser par saisiePoids(),
                   sinon le champ affiche le kilo brut au lieu de la valeur saisie. */
                if(inp) inp.value = (champ==="w" ? saisiePoids(valeur) : (valeur===""? "" : valeur));
              });
              save();
            };
            const plafonne = chargeBloquee(en.exId);          /* ne peut pas monter en charge */
            const rienARetirer = sansChargeDuTout(en.exId, st.w); /* ne peut pas descendre non plus */
            let msg;
            if(rir === -1){
              /* Trop lourd : normalement on descend la charge en gardant les répétitions.
                 Mais quand il n'y a qu'une charge disponible — poids du corps, ou « charge
                 fixe » cochée — la barre ne peut pas s'alléger : c'est la cible en
                 répétitions qui baisse, sur les séries suivantes. */
              if(rienARetirer || plafonne){
                const nr = Math.max(1, Math.round((st.r||0)*0.8));
                msg = TR("Trop lourd — vise {} reps sur les séries suivantes, la qualité prime.").replace("{}", nr);
                if(next) appliquerSuite("r", nr);
              } else {
                const bas = Math.max(0, Math.round(((st.w||0) - Math.max(inc, (st.w||0)*0.08))*2)/2);
                const cible = Math.max(st.r||0, rng.lo);
                msg = next ? TR("Trop lourd — séries suivantes à {c}, on garde {r} reps.").replace("{c}", pds(bas)).replace("{r}", cible)
                            : TR("Trop lourd — repars de {} à la prochaine séance.").replace("{}", pds(bas));
                if(next){ appliquerSuite("w", bas); appliquerSuite("r", cible); }
              }
            } else if(rir>=3){
              if(plafonne){
                const pr = progressionSansCharge(en.exId, st.r||0, en.sets.filter(x=>!x.warm).length);
                msg = TR("Trop léger —") + " " + pr.text.charAt(0).toLowerCase() + pr.text.slice(1);
                if(next && pr.mode==="reps") appliquerSuite("r", pr.reps);
              } else {
                const nw = (st.w||0)+inc;
                msg = next ? TR("Trop léger — séries suivantes à {}.").replace("{}", pds(nw))
                            : TR("Trop léger — passe à {} à la prochaine séance.").replace("{}", pds(nw));
                if(next) appliquerSuite("w", nw);
              }
            } else if(rir===0 && (st.r||0) < rng.lo){
              if(rienARetirer){
                const nr = Math.max(1,(st.r||0)-1);
                msg = next ? `Trop dur — vise ${nr} reps sur les séries suivantes, la qualité prime.`
                            : `Trop dur — reste sur ce nombre de reps jusqu'à ce que ça passe proprement.`;
                if(next) appliquerSuite("r", nr);
              } else {
                const nw = Math.max(0,(st.w||0)-inc);
                if(next) appliquerSuite("r", Math.max(st.r||0, rng.lo));
                msg = next ? `Trop lourd — séries suivantes à ${pds(nw)}.`
                            : `Trop lourd — garde cette charge la prochaine fois, elle viendra.`;
                if(next) appliquerSuite("w", nw);
              }
            } else if(rir===0){
              /* à la limite : on garde exactement ce que tu viens de faire */
              if(next && !rienARetirer) appliquerSuite("w", st.w);
              msg = rienARetirer ? TR("À la limite — c'est exactement là qu'il faut être.")
                                : (next ? `À la limite — on reste à ${pds(st.w||0)} sur les séries suivantes.`
                                        : TR("À la limite — garde cette charge, c'est du bon travail."));
            } else {
              /* zone idéale : les séries suivantes reprennent la charge qui vient de fonctionner */
              if(next && !rienARetirer) appliquerSuite("w", st.w);
              msg = next ? `Parfait — on reste à ${pds(st.w||0)}, pile la bonne zone.`
                          : TR("Parfait — c'est noté pour ta prochaine séance.");
            }
            save();
            ask.classList.add("repondu");
            ask.innerHTML = `<div class="q ok">${esc(msg)}</div>`;
            majSerieActive();                 /* maintenant seulement, la suivante s'allume */
            const reste = en.sets.some(s2=>!s2.done);
            setTimeout(()=>{ ask.remove(); retirerBlocNoir(true); majSerieActive(); }, reste ? 2600 : 1200);
            /* plus rien à faire sur cet exercice : on félicite, puis on replie */
            if(!reste) setTimeout(()=>{
              if(!document.body.contains(card)) return;
              exerciceFini(card, ex.name, ()=>{ en.replie = true; save(); renderSurPlace(); });
            }, 1300);
          });
        }
      };
      /* ajouter une ligne à charge réduite : bouton ↓ ou menu d'appui long */
      const ajouterDrop = ()=>{
        const inc = (st.w||0)>=20? 2.5 : 1;
        const dernier = (st.drops && st.drops.length)? st.drops[st.drops.length-1] : st;
        if(!st.drops) st.drops = [];
        st.drops.push({w: Math.max(0, (dernier.w||0)-inc), r: ""});
        save(); renderSurPlace();
      };
      const dgBtn = row.querySelector(".dg");
      if(dgBtn) dgBtn.onclick = ajouterDrop;
      /* appui long sur la ligne : menu de la série (dégressif, suppression) */
      let sTimer = null, sLong = false;
      const ouvrirMenu = ()=>{
        sLong = true;
        if(navigator.vibrate) navigator.vibrate(18);
        openSheet(`<h3>${st.warm? TR("Série d'échauffement") : "Série "+num}</h3>
          <div class="stack">
            <button class="btn btn-accent" id="ms-drop">${TR("＋ Ajouter un dégressif")}</button>
            <div style="font-size:12.5px; color:var(--ink-mute); line-height:1.55;">${TR("Tu as baissé la charge pour finir la série ? Ajoute une ligne : <b>6 × 12 kg puis 4 × 10 kg</b> compte comme une seule série, et les 112 kg soulevés partent bien dans ton tonnage.")}</div>
            ${en.sets.length>1? `<button class="btn btn-ghost" id="ms-del" style="color:var(--bad);">${TR("Supprimer cette série")}</button>`:""}
          </div>`);
        document.getElementById("ms-drop").onclick = ()=>{ closeSheet(); ajouterDrop(); };
        const sup = document.getElementById("ms-del");
        if(sup) sup.onclick = ()=>{ en.sets.splice(si,1); save(); closeSheet(); renderSurPlace(); };
      };
      const lgStart = e=>{
        if(e.target.closest("input") || e.target.closest("button")) return;
        sLong = false; clearTimeout(sTimer);
        sTimer = setTimeout(ouvrirMenu, 550);
      };
      const lgStop = ()=>clearTimeout(sTimer);
      row.addEventListener("touchstart", lgStart, {passive:true});
      ["touchend","touchmove","touchcancel"].forEach(ev=>row.addEventListener(ev, lgStop));
      row.addEventListener("mousedown", lgStart); row.addEventListener("mouseup", lgStop); row.addEventListener("mouseleave", lgStop);
      row.oncontextmenu = e=>{ e.preventDefault(); if(!e.target.closest("input")) ouvrirMenu(); };
      setsDiv.appendChild(row);
      /* lignes dégressives : même série, charge plus basse */
      (st.drops||[]).forEach((d,di)=>{
        const dr = document.createElement("div");
        dr.className = "set-row drop"+(st.done?" done":"");
        dr.innerHTML = `<div class="n">↳</div>
          <input type="number" inputmode="decimal" step="${stepPoids()}" min="0" placeholder="${uPoids()}" value="${saisiePoids(d.w)}">
          <input type="number" inputmode="numeric" min="0" placeholder="reps" value="${d.r!==""&&d.r!=null?d.r:""}">
          <span></span>
          <button class="ck" title="${TR("Retirer ce dégressif")}">✕</button>`;
        const [dw, dq] = dr.querySelectorAll("input");
        dw.oninput = ()=>{ d.w = dw.value===""?"":versKg(dw.value); save(); };
        dq.oninput = ()=>{ d.r = dq.value===""?"":parseInt(dq.value); save(); };
        dr.querySelector(".ck").onclick = ()=>{
          st.drops.splice(di,1);
          if(!st.drops.length) delete st.drops;
          save(); renderSurPlace();
        };
        setsDiv.appendChild(dr);
      });
    });

    card.querySelector('[data-act="plier"]').onclick=()=>{ en.replie = true; save(); renderSurPlace(); };
    card.querySelector('[data-act="addset"]').onclick=()=>{
      const prev = en.sets[en.sets.length-1];
      en.sets.push({w: prev? prev.w:"", r: prev? prev.r:"", done:false});
      save(); renderSurPlace();
    };
    const delSet = card.querySelector('[data-act="delset"]');
    if(delSet) delSet.onclick=()=>{
      /* on retire la dernière série de travail ; l'échauffement n'est jamais concerné */
      let i = -1;
      for(let j=en.sets.length-1; j>=0; j--){ if(!en.sets[j].warm){ i = j; break; } }
      if(i < 0 || en.sets.filter(x=>!x.warm).length <= 1) return;
      const st = en.sets[i];
      const retirer = ()=>{ en.sets.splice(i,1); save(); renderSurPlace(); };
      if(st.done) askConfirm(TR("Supprimer la dernière série ?"),
        `${pds(st.w||0)} × ${st.r||0} reps sera retirée de cette séance.`, TR("Supprimer"), true, retirer);
      else retirer();
    };
    wireHints(card);
    card.querySelectorAll("[data-exinfo]").forEach(b=>b.onclick=(e)=>{ e.stopPropagation(); openExoInfo(b.dataset.exinfo); });
    const hx = card.querySelector("[data-hist-ex]");
    if(hx) hx.onclick = (e)=>{ e.stopPropagation(); openHistoExo(parseInt(hx.dataset.histEx)); };
    const bl = card.querySelector("[data-injinfo]");
